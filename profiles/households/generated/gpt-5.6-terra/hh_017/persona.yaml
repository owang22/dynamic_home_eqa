household_id: hh_017
household_type: working_couple_no_children
residents:
  - id: resident_1
    name: Elena Marlow
    age: 41
    occupation: municipal procurement analyst
    personality: methodical, quietly sentimental, and prone to making small piles
      before putting things away
    habits:
      - Carries her laptop and charger between the dining table and the small desk
        in the second bedroom, usually leaving the charger plugged in at the desk.
      - Sets her phone face-down beside her mug while reading or working, then sometimes
        forgets it on the dining table.
      - Uses a ruled notebook for shopping lists and meeting notes and keeps a pen
        clipped inside its cover.
      - Refills the same water bottle before leaving home and brings it back to
        the kitchen counter rather than washing it immediately.
      - Leaves her jacket over the back of a dining chair until Elena or Marcus
        does a weekend reset.
      - Keeps her glasses on the bedside table with the book she is currently reading.
      - Prepares leftovers in a lunchbox and places it near Marcus's lunchbox in
        the refrigerator so neither is missed.
      - Takes responsibility for the houseplants and returns the watering can to
        the laundry closet after use.
  - id: resident_2
    name: Marcus Vale
    age: 44
    occupation: commercial building maintenance technician
    personality: practical, energetic, and casually untidy until a task has a clear
      storage spot
    habits:
      - Empties his pockets onto the entry console, where his keys, wallet, and
        phone form a reliable end-of-day cluster.
      - Uses a backpack for work gear and lunch, placing it on the floor beside
        the entry bench rather than hanging it up.
      - Brings a large water bottle to job sites and leaves it by the kitchen sink
        when he returns.
      - Keeps one jacket in active rotation, usually draped over the entry chair
        or hooked on the bedroom door.
      - Makes coffee in the same oversized mug and leaves it near the remote after
        sitting in the living room.
      - Charges his phone beside the bed but occasionally moves the charger to the
        sofa when watching videos with headphones.
      - Does most of the cooking with the shared pots and pans, while Elena handles
        the grocery list and leftovers.
      - Runs the vacuum when he notices grit near the entry, but returns it only
        after finishing the whole apartment.
relationships: >-
  Elena and Marcus have been married for nine years and rent a compact two-bedroom
  apartment together. Elena manages lists, bills, plant care, and most of the laundry
  sorting; Marcus cooks more often and handles minor repairs and floor cleaning.
  Their recurring friction is Marcus's entryway pile and Elena's tendency to spread
  work materials across the dining table, so they coordinate a weekly reset of those
  shared surfaces.
home_layout_notes: >-
  They share the larger bedroom, where Elena's book, glasses, and phone tend to
  stay on her side of the bed while Marcus's charging cable and jacket migrate between
  his side and the door. The second bedroom is a hybrid office and storage room,
  with Elena's laptop setup on a desk and the suitcase, laundry basket, and vacuum
  kept along one wall. The kitchen, dining table, entry console, and living-room
  sofa are the most heavily shared spaces.
