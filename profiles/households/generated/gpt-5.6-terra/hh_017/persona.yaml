daily_life_summary: >-
  Both leave for fixed daytime jobs, though Marcus often returns carrying a backpack
  and work-worn jacket while Elena brings home her laptop or notebook when she has
  unfinished paperwork. Their days overlap most around shared meals, preparing lunchboxes,
  and settling into the living room with a book or a show. The apartment accumulates
  small object clusters during the workweek, especially at the entry and dining
  table, then gets restored during their coordinated reset. On quieter days, Elena
  tends the plants while Marcus cooks something that uses several shared pans.
quirks: >-
  They do not own a television; the living-room remote controls a compact media
  projector. Although they have no children, they keep a small basket of board-game-like
  entertainment items out of sight rather than displaying décor.
