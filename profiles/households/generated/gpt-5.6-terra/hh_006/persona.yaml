household_id: hh_006
household_type: working_professional_solo__irregular_gig
residents:
  - id: resident_1
    name: Marie Calder
    age: 30
    occupation: mobile bicycle-repair technician
    personality: Resourceful, mildly untidy when focused, and protective of her
      well-used tools and electronics.
    habits:
      - Drops her phone and keys together in a ceramic bowl by the entry after returning
        from a service call.
      - Keeps her laptop open on the dining table while confirming repair requests
        and often leaves its charger plugged in there.
      - Refills the same insulated water bottle before leaving and sets it beside
        the sofa or bed when she gets home.
      - Uses a backpack as her portable work bag and repacks it on the floor near
        the entry rather than putting it away immediately.
      - Leaves a jacket over the back of a dining chair when the weather is uncertain.
      - Makes tea in a favorite mug and carries it between the kitchen counter and
        sofa while reading repair manuals or novels.
      - Collects used towels and work clothes in the laundry basket only when the
        bathroom hook becomes crowded.
      - Rolls out her yoga mat in the living room, then leaves it out for a day
        or two if she expects to use it again.
relationships: >-
  Marie lives alone and makes all decisions about the apartment, though she coordinates
  occasional key handoffs with a neighboring friend when a repair booking runs late.
  She keeps the kitchen and bathroom reasonably reset for herself, but the dining
  table and entry become temporary staging areas for gig work. Her recurring friction
  is between wanting a calm, uncluttered home and needing visible reminders of jobs,
  chargers, and items to take out again.
home_layout_notes: >-
  The apartment has one bedroom, a combined living-dining room, a compact kitchen,
  and a small bathroom; Marie sleeps alone in the bedroom. The dining table functions
  as her booking desk and repair-planning surface, while the entry floor and chair
  nearest the door collect her backpack, jacket, and outgoing items. The sofa area
  is shared only with her own reading, stretching, and entertainment belongings,
  and the bathroom hook and counter are her main grooming and laundry overflow points.
object_inventory:
  - id: phone_marie
    class: phone
    owner: resident_1
    role: Marie uses it for gig bookings, customer messages, navigation, and payment
      confirmations; it tends to be left in the entry bowl, on the dining table,
      or beside the bed, and travels in her jacket pocket or backpack when she leaves.
  - id: keys_marie
    class: keys
    owner: resident_1
    role: Her apartment, building, and bike-lock keys are used for access and securing
      equipment; they tend to be left in the entry bowl, and travel clipped inside
      her backpack or in a jacket pocket.
  - id: wallet_marie
    class: wallet
    owner: resident_1
    role: Marie uses it for identification, transit fare, and backup payment; it
      tends to be left in the backpack’s inner pocket or on the dining table, and
      travels inside her backpack or jacket pocket.
  - id: laptop_marie
    class: laptop
    owner: resident_1
    role: Used to manage repair bookings, invoices, and reference manuals; it usually
      stays open on the dining table or rests on the sofa, and travels in the padded
      sleeve of her backpack for longer work sessions away from home.
  - id: charger_marie
    class: charger
    owner: resident_1
    role: Charges Marie’s phone and laptop; it tends to remain plugged in at the
      dining table or beside the bed, and travels coiled in her backpack when a
      job may run long.
  - id: backpack_marie
    class: backpack
    owner: resident_1
    role: Marie’s mobile work and daily-carry bag holds her phone, wallet, keys,
      charger, water bottle, and job paperwork; it tends to be left on the entry
      floor or beside the dining chair, and travels on her back for every service
      call.
  - id: jacket_marie
    class: jacket
    owner: resident_1
    role: A weatherproof layer used for travel between repair calls; it tends to
      be draped over the dining chair or hung by the door, and travels worn or folded
      into her backpack.
  - id: water_bottle_marie
    class: water_bottle
    owner: resident_1
    role: Marie uses it to stay hydrated during mobile repair jobs and at home;
      it tends to be left beside the sofa, bed, or kitchen sink, and travels upright
      in the side pocket of her backpack.
  - id: mug_marie
    class: mug
    owner: resident_1
    role: Her preferred tea mug is used during booking admin and reading; it tends
      to be left on the kitchen counter, dining table, or sofa-side surface, and
      normally stays home rather than traveling.
  - id: bowl_marie
    class: bowl
    owner: resident_1
    role: A small bowl used as the entry catchall for keys, loose coins, and receipts;
      it tends to stay on the entry shelf and does not leave the apartment.
  - id: plate_marie
    class: plate
    owner: resident_1
    role: Marie uses this everyday plate for quick meals between bookings; it tends
      to be left on the kitchen counter or dining table before washing, and stays
      at home.
  - id: pot_shared_1
    class: pot
    owner: shared
    role: A medium pot for simple soups, pasta, and reheated meals; it tends to
      be left drying beside the kitchen sink and stays home.
  - id: pan_shared_1
    class: pan
    owner: shared
    role: A skillet used for fast one-pan meals; it tends to be left on the stovetop
      or drying beside the sink and stays home.
  - id: book_marie
    class: book
    owner: resident_1
    role: A mix of repair reference reading and fiction that Marie reads on the
      sofa or in bed; it tends to be left face-down on the sofa arm or bedside surface,
      and occasionally travels in her backpack for transit waits.
  - id: notebook_marie
    class: notebook
    owner: resident_1
    role: Used for job measurements, customer notes, and loose planning lists; it
      tends to be left on the dining table or tucked into the backpack, and travels
      in the backpack to service calls.
  - id: pen_marie
    class: pen
    owner: resident_1
    role: Used to write repair notes and labels in Marie’s notebook; it tends to
      be clipped to the notebook or left on the dining table, and travels inside
      the backpack.
  - id: headphones_marie
    class: headphones
    owner: resident_1
    role: Marie uses them for podcasts while doing admin, cleaning, or traveling;
      they tend to be left beside the laptop or inside the backpack, and travel
      in the backpack or jacket pocket.
  - id: remote_shared_1
    class: remote
    owner: shared
    role: Controls the living-room television and is used during decompression at
      the sofa; it tends to be left between sofa cushions or on the coffee table
      and stays home.
  - id: blanket_marie
    class: blanket
    owner: resident_1
    role: A soft throw Marie uses while reading or watching television; it tends
      to be bunched on the sofa and stays home.
  - id: yoga_mat_marie
    class: yoga_mat
    owner: resident_1
    role: Used for short stretches after travel-heavy workdays; it tends to be rolled
      beside the sofa or left open in the living room, and rarely travels except
      when Marie takes an outdoor class.
  - id: towel_marie
    class: towel
    owner: resident_1
    role: Marie’s bath towel is used after showers and tends to hang on the bathroom
      hook until it is moved to the laundry basket; it stays home.
  - id: laundry_basket_marie
    class: laundry_basket
    owner: resident_1
    role: Collects work clothes, towels, and casual laundry; it tends to sit in
      the bedroom corner or bathroom doorway and stays home.
  - id: hairbrush_marie
    class: hairbrush
    owner: resident_1
    role: Used for quick grooming before appointments and after helmet use; it tends
      to be left on the bathroom counter or bedroom dresser, and occasionally travels
      in her backpack for a long workday.
  - id: umbrella_marie
    class: umbrella
    owner: resident_1
    role: Used for rainy trips between service calls; it tends to lean by the entry
      door while drying, and travels strapped to the outside of her backpack or
      carried by hand.
  - id: suitcase_marie
    class: suitcase
    owner: resident_1
    role: Used for infrequent visits and short trips; it tends to be stored in the
      bedroom closet and travels rolled behind Marie when she leaves town.
daily_life_summary: >-
  Marie’s repair bookings shift from day to day, so some stretches find her working
  from the dining table and others have her leaving with a packed backpack for calls
  across town. Between jobs she returns briefly to charge devices, make tea, change
  layers, and check messages before heading out again. On quieter days, the apartment
  stays more contained around the sofa and kitchen; after a run of bookings, the
  entry and table show the evidence of several quick departures. She usually restores
  the space in batches rather than immediately after each use.
quirks: >-
  Although she works in a hands-on trade, Marie does not keep a workshop-like apartment;
  she deliberately limits visible work gear to what fits in her backpack. She uses
  the dining table as a dispatch station but refuses to eat there when it is covered
  with job notes.
