household_id: hh_012
household_type: researcher_household
residents:
  - id: resident_1
    name: Dr. Leena Voss
    age: 35
    occupation: computational ecology research fellow
    personality: methodical, quietly sentimental, and prone to setting down work
      materials wherever an idea occurs
    habits:
      - Carries her laptop between the desk, kitchen table, and sofa, often leaving
        its charger plugged in near the last workspace.
      - Keeps a field notebook open beside her mug while reading papers and adds
        loose observations with the same black pen.
      - Refills a stainless water bottle before leaving for campus or field sites
        and usually returns it to the kitchen counter to wash.
      - Drops keys and wallet into a shallow bowl by the entry when she remembers,
        but leaves them in her jacket pocket after rushed departures.
      - Uses her backpack as a mobile office, packing headphones, notebook, laptop,
        charger, and lunchbox for campus days.
      - Makes one-pot meals in the evening and leaves the pot soaking in the sink
        while she reviews data on the sofa.
      - Uses a yoga mat for short stretches between writing sessions, then rolls
        it loosely beside the bookshelf.
      - Waters her few indoor plants with a small watering can and leaves it on
        the kitchen windowsill to dry.
relationships: >-
  Leena lives alone and manages the household around the shifting demands of her
  research, field visits, and collaborative campus work. She keeps shared areas
  usable for herself by assigning informal landing spots for essentials, though
  her active projects regularly spread from the desk onto the dining table. Her
  main friction is with her own tendency to postpone washing cookware when absorbed
  in analysis.
home_layout_notes: >-
  The compact apartment has a combined living and dining area, a galley kitchen,
  one bedroom, one bathroom, and a small entry nook. Leena uses the bedroom desk
  for focused writing, the dining table for maps and notebooks, and the sofa for
  reading with her laptop; the kitchen counter is her usual drop zone for the water
  bottle and watering can. The bedroom and all storage are private, while the living
  area functions as both work and relaxation space.
object_inventory:
