    class: laptop
    owner: resident_1
    role: Primary device for coding, manuscript writing, and video calls; it moves
      in Leena's backpack to campus and field meetings, then tends to be left on
      her desk, dining table, or sofa.
  - id: phone_leena
    class: phone
    owner: resident_1
    role: Used for messages, maps, authentication, and field photos; it travels
      in Leena's jacket pocket or backpack side pocket and is usually left on the
      bedside table or kitchen counter.
  - id: keys_leena
    class: keys
    owner: resident_1
    role: Apartment, office, and bicycle keys; they travel in her jacket pocket
      or backpack and tend to be left in the entry bowl or still inside the jacket
      pocket.
  - id: wallet_leena
    class: wallet
    owner: resident_1
    role: Used for identification, transit card, and payment; it travels in her
      backpack's inner pocket or jacket pocket and is usually left in the entry
      bowl or desk drawer.
  - id: backpack_leena
    class: backpack
    owner: resident_1
    role: Mobile research bag for the laptop, notebook, charger, headphones, lunchbox,
