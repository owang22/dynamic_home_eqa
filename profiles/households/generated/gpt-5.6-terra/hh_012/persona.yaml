daily_life_summary: >-
  Leena's research work shifts between concentrated work at home, campus meetings,
  and occasional outdoor data collection, so her belongings are repeatedly packed
  and unpacked. On home-focused days, the laptop, notebook, mug, and headphones
  migrate among the desk, table, and sofa. When she returns from campus or a field
  outing, her backpack and jacket often collect near the entry before she cooks
  something simple. She resets the apartment in small bursts, especially before
  beginning a new writing task.
quirks: >-
  Despite working in ecology, Leena keeps only a few hardy plants because she dislikes
  owning more living things than she can reliably monitor. She labels neither shelves
  nor containers, relying instead on a strong memory for where each current project
  has spread.
