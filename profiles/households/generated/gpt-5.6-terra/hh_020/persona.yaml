household_id: hh_020
household_type: working_professional_solo__night_shift
residents:
  - id: resident_1
    name: Marie Calder
    age: 43
    occupation: Emergency department charge nurse
    personality: Methodical, private, and gently sentimental; she resets work gear
      immediately but lets comfort items accumulate around her recovery spaces.
    habits:
      - She empties her backpack onto the kitchen counter after a shift, then repacks
        it before leaving again.
      - She carries her phone in a jacket pocket outside the home and leaves it
        face-up on the bedside table while sleeping.
      - She rinses her insulated water bottle as soon as she gets home but often
        leaves it drying beside the sink.
      - She makes simple one-pot meals and leaves a used mug or bowl on the coffee
        table while reading.
      - She keeps her keys clipped inside her backpack when commuting, but puts
        them in a small dish by the entry on days off.
      - She drapes a blanket over the sofa after watching a show and folds it only
        when expecting a visitor.
      - She keeps a notebook and pen beside the bed for grocery lists, dreams, and
        reminders from work.
      - She starts laundry in small loads and sometimes leaves the laundry basket
        near the bedroom doorway until the next day off.
relationships: >-
  Marie lives alone and is her own organizer, cleaner, and cook. She keeps clinical
  work belongings separate from her rest spaces, but her preference for immediate
  decompression can leave the kitchen counter crowded with recently used gear. There
  are no shared belongings beyond items she treats as household-use objects.
home_layout_notes: >-
  The apartment has one bedroom, a compact bathroom, an open kitchen-living room,
  and a small entry alcove. Marie uses the bedroom primarily for protected sleep
  and keeps the living-room sofa, coffee table, and television area for quiet wakeful
  hours. The kitchen counter near the entry becomes a temporary landing area for
  her backpack, lunchbox, and water bottle, while the dining surface is used for
  meal prep and paperwork.
