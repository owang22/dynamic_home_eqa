daily_life_summary: >-
  Marie works a fixed night shift in an emergency department, so much of her home
  life happens while nearby households are quieter. She returns needing a short,
  predictable reset: work items are unloaded, food is warmed or prepared, and she
  settles into reading or television before sleeping. On days away from work, she
  catches up on laundry, cooking, plant care, and errands, often keeping the apartment
  dim and calm. Her work and rest patterns mean she has little spontaneous overlap
  with neighbors, so she relies on orderly object locations to make departures easy.
quirks: >-
  Marie keeps a deliberately sparse bedroom but maintains a surprisingly well-used
  collection of library books and handwritten notebooks. Rather than relying on
  takeout after demanding shifts, she batch-cooks soups and grain bowls in labeled
  mental rotation.
