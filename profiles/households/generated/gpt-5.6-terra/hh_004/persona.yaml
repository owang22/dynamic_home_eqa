daily_life_summary: >-
  Marie leaves for her daytime office work as Imani is often returning from the
  hospital or preparing to rest, so they keep departures and arrivals quiet. They
  coordinate food through packed lunches, labeled leftovers, and a short shared
  meal when their off-duty periods meet. Marie does household tasks that can be
  done quietly while Imani sleeps, while Imani resets laundry and kitchen items
  around her shifts. On shared days off, the dining table becomes both Marie's planning
  station and their place for longer meals.
quirks: >-
  They do not own a television; the remote controls a compact streaming speaker
  and lamp system. Despite their opposing schedules, they keep a single shared handwritten
  notebook for household handoffs rather than relying only on phone messages.
