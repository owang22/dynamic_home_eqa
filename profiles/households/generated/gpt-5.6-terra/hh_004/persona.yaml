household_id: hh_004
household_type: working_couple_no_children__night_shift
residents:
  - id: resident_1
    name: Marie Calder
    age: 31
    occupation: municipal procurement analyst
    personality: methodical, considerate, mildly clutter-prone when absorbed in
      paperwork
    habits:
      - Sets her work laptop and charger on the dining table after commuting, then
        clears them before shared meals.
      - Keeps her phone face-down beside the bed so notifications do not disturb
        Imani's sleep.
      - Carries a packed lunchbox to the office and usually rinses it immediately
        when she returns.
      - Leaves her keys in the ceramic entry bowl area, though the bowl itself is
        not always used consistently.
      - Uses a notebook for grocery lists and leaves it open on the kitchen counter
        until the next shopping trip.
      - Folds clean towels promptly but tends to leave her jacket over the back
        of a dining chair.
      - Refills her water bottle before leaving home and brings it back in her backpack.
      - Checks whether the bedroom door is shut before using the vacuum cleaner
        or playing audio through headphones.
  - id: resident_2
    name: Imani Okafor
    age: 36
    occupation: emergency department registered nurse
    personality: calm under pressure, practical, protective of quiet and clean surfaces
    habits:
      - Empties her work backpack near the entry after a shift, separating her lunchbox
        and water bottle before going to sleep.
      - Keeps her phone on a low-volume setting and charges it on her side of the
        bed.
      - Leaves her hospital keys and wallet in the zip pocket of her backpack rather
        than on the counter.
      - Uses the blackout blanket arrangement on the bed and asks Marie not to move
        it during sleep stretches.
      - Washes her travel mug and lunchbox in batches, so they may sit on the drying
        area briefly.
      - Keeps a medication bottle in the bathroom cabinet and returns it there after
        use.
      - Uses headphones with her tablet when unwinding so Marie can work or sleep
        nearby.
      - Places worn scrubs in the laundry basket immediately, but her jacket sometimes
        stays draped over the entry bench.
relationships: >-
  Marie and Imani are married and have learned to treat quiet as a shared resource
  because their fixed schedules overlap only in fragments. Marie handles most planning,
  grocery lists, and routine paperwork, while Imani takes charge of laundry hygiene
  and keeping the kitchen reset after her work meals. Their recurring friction is
  Marie's dining-table work spread versus Imani's need for clear, calm surfaces
  before sleeping, so they use the counter and entry area as deliberate handoff
  zones.
home_layout_notes: >-
  They live in a one-bedroom apartment with an open kitchen-dining area, a small
  living room, one bathroom, and a bedroom fitted with blackout curtains. The bedroom
  is shared, but Imani's bedside surface is kept especially spare for sleep; Marie
  primarily uses the dining table for laptop work and the living-room chair for
  reading. The kitchen counter, entry shelf, bathroom cabinet, and laundry corner
  are shared high-turnover spaces.
