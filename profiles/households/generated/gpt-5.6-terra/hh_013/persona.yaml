daily_life_summary: >-
  Their days overlap around meals, household errands, reading, and small apartment
  projects, though each often settles into a separate room with a different task.
  Marian moves between the table, balcony, and sofa with notes or a book, while
  Theo cycles through the kitchen, his armchair, and occasional local outings. They
  tend to reunite over food and television, when the remote, mugs, and blankets
  migrate into the living room. Both make frequent small trips out, carrying their
  own essentials and returning them imperfectly to the entry or kitchen.
quirks: >-
  They keep a handwritten index of local recipes and neighborhood memories in Marian's
  notebooks rather than relying on digital files. Theo still treats ordinary weeknight
  meals as informal cooking lessons, so the kitchen often looks more active than
  expected for a two-person retired household.
