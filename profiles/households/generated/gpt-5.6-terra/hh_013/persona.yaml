household_id: hh_013
household_type: retired_couple
residents:
  - id: resident_1
    name: Marian Voss
    age: 77
    occupation: Retired municipal archives technician
    personality: methodical, sentimental, quietly stubborn
    habits:
      - Keeps her reading glasses and a sharpened pen together on the dining table
        after working through old neighborhood notes.
      - Carries her phone in a jacket pocket on walks and returns it to its charger
        on the kitchen counter.
      - Leaves her gardening water bottle beside the balcony door after tending
        the planters.
      - Stacks library books in a deliberate short pile on her side of the living-room
        sofa.
      - Uses a small notebook for grocery additions and tucks it under the shared
        fruit-bowl area on the table.
      - Places her keys in the same ceramic catchall by the entry, then becomes
        annoyed when Theo borrows the spot for receipts.
      - Folds her blanket over the sofa arm each time she gets up, even if Theo
        is still using the sofa.
      - Sets her medication bottle beside her mug during breakfast and returns it
        to the kitchen cabinet afterward.
  - id: resident_2
    name: Theo Voss
    age: 78
    occupation: Retired community-college culinary arts instructor
    personality: warm, improvisational, mildly absent-minded
    habits:
      - Uses the kitchen counter as a staging area for pots, pans, and recipe books
        while cooking, then clears it only after eating.
      - Carries his phone and wallet in his jacket pockets for errands and often
        leaves both on the hall bench when he returns.
      - Leaves his reading glasses on top of whichever book he was last reading,
        usually beside his armchair.
      - Fills a water bottle before going out and brings it home in his backpack
        rather than washing it immediately.
      - Keeps the television remote tucked into the arm of his chair, which Marian
        regularly has to retrieve.
      - Rinses and reuses the same large mug through the day, leaving it near the
        sink between refills.
      - Takes the shared laundry basket from the bedroom to the laundry area when
        it is full, but forgets to bring it back promptly.
      - Uses a notebook for cooking adjustments and leaves it open on the kitchen
        table until Marian moves it aside for meals.
relationships: >-
  Marian and Theo have been married for more than five decades and share a compact
  apartment that they have gradually filled with books, practical kitchen gear,
  and balcony plants. Theo handles most cooking and the heavier laundry tasks, while
  Marian tracks supplies, manages correspondence, and tends the plants; they coordinate
  grocery lists on the dining table. Their recurring friction is Theo's tendency
  to spread cooking and reading materials across shared surfaces, while Marian prefers
  every portable item to have a predictable resting place.
home_layout_notes: >-
  They share one bedroom, where Marian's side holds her medication and a folded
  blanket, while Theo's side is more likely to collect a book and glasses. The kitchen
  and adjoining dining table are the main shared work surfaces, with Theo dominating
  the counter and Marian using one end of the table for notes. The living room has
  separate favored seats, and the balcony door area serves as Marian's gardening
  station and the landing place for the watering can and outdoor bottle.
