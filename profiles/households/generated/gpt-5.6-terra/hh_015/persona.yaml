household_id: hh_015
household_type: single_parent_teens
residents:
  - id: resident_1
    name: Marisol Vega
    age: 50
    occupation: outpatient infusion nurse
    personality: methodical, warm, and lightly controlling about shared surfaces
    habits:
      - Sets her phone and keys in the ceramic bowl by the entry as soon as she
        comes home.
      - Carries a large water bottle between the kitchen counter, bedroom nightstand,
        and work bag.
      - Leaves her scrub jacket over the back of her bedroom chair until laundry
        day.
      - Uses the kitchen table to sort school papers with both teens and gathers
        stray pens into one mug.
      - Keeps a paperback tucked beside her bed and reads a few pages before sleep.
      - Starts laundry in the shared basket, but asks the teens to bring their own
        clothes out of their rooms.
      - Wipes the kitchen counter after cooking and relocates abandoned dishes to
        the sink rather than washing every one immediately.
  - id: resident_2
    name: Nia Vega
    age: 14
    occupation: middle school student
    personality: creative, absent-minded, and protective of her private things
    habits:
      - Drops her backpack beside the dining chair she claims for homework instead
        of hanging it up.
      - Moves her sketch notebook and pens from the table to her bedroom floor when
        asked to clear space.
      - Refills her water bottle but often leaves it on the bathroom counter after
        brushing her teeth.
      - Uses headphones with her tablet and coils the cable loosely around the charger.
      - Leaves a blanket bundled on the living-room sofa after watching videos with
        her sister.
      - Packs and unpacks her lunchbox herself, though it sometimes remains open
        on the kitchen counter.
      - Borrows Marisol's hairbrush after showering and returns it to the bathroom
        drawer only when reminded.
  - id: resident_3
    name: Tessa Vega
    age: 15
    occupation: high school student
    personality: practical, sociable, and casually untidy
    habits:
      - Keeps her phone, wallet, and keys together in the front pocket of her backpack
        when going out.
      - Spreads textbooks, laptop, and a charger across the kitchen table for homework,
        then stacks them before meals.
      - Brings her reusable water bottle to school and leaves it near the sink to
        be washed.
      - Uses the living-room gaming controller with friends and leaves it beside
        the remote.
      - Hangs her jacket on the entry hook more reliably than either of the others.
      - Takes long showers and leaves her towel over the bathroom door until Marisol
        asks her to move it.
      - Coordinates with Nia to share a bedroom mirror, but complains when Nia's
        pens cover the dresser.
relationships: >-
  Marisol is the girls' mother; Nia and Tessa are sisters who share a bedroom and
  alternate between close collaboration and small territorial disputes. Marisol
  handles most cooking, bills, and deeper cleaning, while the girls are expected
  to manage dishes, laundry collection, and their school gear. The recurring friction
  is the kitchen table: it is Marisol's meal-prep and paper-sorting surface, but
  both teens treat it as a homework station.
home_layout_notes: >-
  The home is a modest two-bedroom apartment: Marisol has the smaller bedroom, while
  Nia and Tessa share the larger bedroom with separate sides of a dresser and desk
  area. The kitchen table, living-room sofa, entry hooks, and single bathroom are
  heavily shared zones. Marisol uses the kitchen counters and her bedside table
  most, while the teens' backpacks and chargers regularly migrate between their
  bedroom, the table, and the sofa.
object_inventory:
  - id: phone_marisol
    class: phone
    owner: resident_1
    role: Marisol uses it for family coordination and work-related messages; it
      tends to rest in the entry bowl or on her bedside table, and travels in her
      scrub-jacket pocket or handbag when she leaves home.
  - id: keys_marisol
    class: keys
    owner: resident_1
    role: Marisol's house and car keys are kept in the entry bowl; they travel clipped
      inside her handbag whenever she leaves.
  - id: wallet_marisol
    class: wallet
    owner: resident_1
    role: Marisol uses this for cards and identification; it usually stays in her
      handbag on the bedroom chair and travels inside that handbag outside the home.
  - id: laptop_marisol
    class: laptop
    owner: resident_1
    role: Marisol uses it for household paperwork and occasional training modules;
      it sits on her bedroom desk or kitchen table and travels in a padded sleeve
      inside her handbag only when needed.
  - id: mug_marisol
    class: mug
    owner: resident_1
    role: Marisol's tea mug is used at the kitchen table and is usually left beside
      the sink after use; it does not normally leave the home.
  - id: water_bottle_marisol
    class: water_bottle
    owner: resident_1
    role: Marisol uses it for hydration at work and at home; it moves between the
      kitchen counter, bedside table, and her work bag, traveling upright in the
      bag when she leaves.
  - id: jacket_marisol
    class: jacket
    owner: resident_1
    role: Marisol's scrub jacket is worn for her commute and layered at work; it
      tends to hang over her bedroom chair and travels worn or folded in her work
      bag.
  - id: book_marisol
    class: book
    owner: resident_1
    role: Marisol reads this paperback in bed; it usually remains on her nightstand
      and occasionally travels in her handbag for waiting rooms.
  - id: glasses_marisol
    class: glasses
    owner: resident_1
    role: Marisol uses reading glasses for paperwork and books; they tend to sit
      on her nightstand or kitchen table and travel in a hard case in her handbag.
  - id: medication_bottle_marisol
    class: medication_bottle
    owner: resident_1
    role: Marisol keeps her daily medication in the bathroom cabinet and uses it
      with water; it remains at home except on trips, when it travels in her toiletry
      pouch.
  - id: hairbrush_marisol
    class: hairbrush
    owner: resident_1
    role: Marisol's hairbrush is used in the shared bathroom and usually returns
      to the drawer, though Nia sometimes leaves it on the counter; it travels in
      Marisol's toiletry bag for overnight trips.
  - id: yoga_mat_marisol
    class: yoga_mat
    owner: resident_1
    role: Marisol uses this for brief stretches in her bedroom or living room; it
      is rolled beside her closet and only travels when she takes it to a class.
  - id: phone_nia
    class: phone
    owner: resident_2
    role: Nia uses it for family messages, music, and school coordination; it is
      usually on her dresser or under the sofa blanket, and travels in her backpack
      or jacket pocket outside.
  - id: backpack_nia
    class: backpack
    owner: resident_2
    role: Nia carries school books, her lunchbox, and art supplies; it tends to
      land beside her dining chair and travels on her back for school and outings.
  - id: tablet_nia
    class: tablet
    owner: resident_2
    role: Nia uses it for assignments, drawing, and videos; it moves between the
      kitchen table, sofa, and shared bedroom, traveling in a padded backpack sleeve
