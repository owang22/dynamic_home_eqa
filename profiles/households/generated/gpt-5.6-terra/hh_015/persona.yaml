  - id: notebook_nia
    class: notebook
    owner: resident_2
    role: Nia's sketch notebook is used for drawings and notes; it is often left
      on the kitchen table or her bedroom floor and travels inside her backpack.
  - id: headphones_nia
    class: headphones
    owner: resident_2
    role: Nia uses these with her tablet and phone; they tend to be coiled beside
      her charger or on the sofa arm, and travel in her backpack pocket.
  - id: water_bottle_nia
    class: water_bottle
    owner: resident_2
    role: Nia uses this at school and during homework; it is usually on the bathroom
