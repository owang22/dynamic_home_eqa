  - id: lunchbox_nia
    class: lunchbox
    owner: resident_2
    role: Nia packs snacks and lunch in it; it is filled on the kitchen counter,
      sometimes left open there after school, and travels inside her backpack.
  - id: blanket_nia
    class: blanket
    owner: resident_2
    role: Nia uses this on the living-room sofa while drawing or watching videos;
      it is usually bunched on the sofa and stays at home.
  - id: phone_tessa
    class: phone
    owner: resident_3
    role: Tessa uses it for messages, school updates, and music; it tends to charge
      on the kitchen table or sit in her backpack, and travels in her jacket pocket
      or backpack.
  - id: keys_tessa
    class: keys
    owner: resident_3
    role: Tessa's house key and bike key are kept in her backpack front pocket;
      they travel in that pocket whenever she goes out independently.
  - id: wallet_tessa
    class: wallet
    owner: resident_3
    role: Tessa uses this for transit fare, school ID, and small cash; it stays
      in her backpack front pocket and travels there outside the home.
  - id: backpack_tessa
    class: backpack
    owner: resident_3
    role: Tessa carries her laptop, books, keys, wallet, and lunch; it rests by
      the kitchen table or bedroom desk and travels on her back to school and activities.
  - id: laptop_tessa
    class: laptop
    owner: resident_3
    role: Tessa uses it for high-school assignments and group projects; it spreads
      across the kitchen table during homework and travels in her backpack's laptop
      sleeve.
  - id: charger_tessa
    class: charger
    owner: resident_3
    role: Tessa uses this for her phone and laptop; it is commonly plugged in at
      the kitchen table and travels loosely coiled in her backpack when required.
  - id: water_bottle_tessa
    class: water_bottle
    owner: resident_3
    role: Tessa brings this to school and sports activities; it is usually left
      near the kitchen sink after use and travels in her backpack side pocket.
  - id: jacket_tessa
    class: jacket
    owner: resident_3
    role: Tessa wears this for school and outings; it normally hangs on the entry
      hook and travels worn or folded into her backpack.
  - id: towel_tessa
    class: towel
    owner: resident_3
    role: Tessa uses this after showering; it tends to hang over the bathroom door
      before being moved to laundry, and it only travels in a suitcase for trips.
  - id: makeup_kit_tessa
    class: makeup_kit
    owner: resident_3
    role: Tessa uses this at the shared bedroom dresser before social plans; it
      stays in her drawer or on the dresser and travels in her backpack or suitcase
      for outings and trips.
  - id: remote_1
    class: remote
    owner: shared
    role: The household uses this for the living-room television; it tends to sit
      beside the gaming controller on the sofa or coffee table and stays at home.
  - id: gaming_controller_1
    class: gaming_controller
    owner: shared
    role: The sisters use this with the living-room console, especially when friends
      visit; it is usually left on the sofa arm or beside the remote and stays at
      home.
  - id: laundry_basket_1
    class: laundry_basket
    owner: shared
    role: This shared basket collects towels, scrub clothes, and the teens' laundry;
      it moves between the bathroom, hallway, and laundry area but does not leave
      the home.
  - id: vacuum_cleaner_1
    class: vacuum_cleaner
    owner: shared
    role: Marisol uses this for the living room and bedrooms, sometimes assigning
      a teen a turn; it is stored in the hall closet and stays at home.
  - id: pot_1
    class: pot
    owner: shared
    role: The household uses this for soups, pasta, and batch meals; it is used
      on the stove, often left to cool by the sink, and stays at home.
  - id: pan_1
    class: pan
    owner: shared
    role: The household uses this for quick dinners and eggs; it moves between the
      stove and sink and stays at home.
  - id: umbrella_1
    class: umbrella
    owner: shared
    role: This shared umbrella is kept by the entry and borrowed during wet weather;
      it travels carried by whichever resident takes it and is supposed to return
      to the entry to dry.
daily_life_summary: >-
  Marisol's fixed daytime nursing work means the teens often arrive home and begin
  schoolwork before she returns. When they overlap, the kitchen becomes the main
  coordination point for food, permission slips, lunch packing, and reminders about
  chores. Nia tends to settle into quiet tablet or drawing time, while Tessa shifts
  between homework, messages, and the living-room console. Evenings are when misplaced
  dishes, towels, chargers, and school bags get redistributed to their intended
  places.
quirks: >-
  Although they are a busy teen household, Marisol has made the entry bowl and jacket
  hooks into a surprisingly consistent landing system. The sisters share a room
  but deliberately maintain a joint "supply mug" of pens at the kitchen table rather
  than fighting over every writing tool.
