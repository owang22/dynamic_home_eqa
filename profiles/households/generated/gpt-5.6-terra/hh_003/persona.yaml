household_id: hh_003
household_type: single_parent_teens__rotating_shift
residents:
  - id: resident_1
    name: Marisol Vega
    age: 51
    occupation: Emergency department charge nurse
    personality: practical, observant, and selectively tidy; she resets shared spaces
      after stressful shifts but leaves personal reading piles intact.
    habits:
      - Drops her keys and wallet into a bowl on the entry console as soon as she
        comes in.
      - Carries a large water bottle between the kitchen counter, bedroom nightstand,
        and work bag.
      - Leaves her nursing shoes off-limits by the door and keeps her jacket on
        a hook rather than on furniture.
      - Makes one-pot meals in the shared pot and labels leftovers mentally by where
        she places them in the refrigerator.
      - Keeps a paperback and glasses on her bedside table, often falling asleep
        with the book open.
      - Checks that both teens have packed lunchboxes and chargers before she leaves
        for a shift.
      - Runs the vacuum cleaner through the living room when she needs to decompress,
        even if the rest of the apartment is not being cleaned.
      - Collects abandoned mugs from the teens' rooms during her own laundry rounds.
  - id: resident_2
    name: Talia Vega
    age: 16
    occupation: High school student
    personality: methodical, private, and quietly artistic; she keeps school materials
      organized but lets comfort items accumulate near her bed.
    habits:
      - Packs her laptop, notebook, pens, and charger into the same backpack pocket
        after homework.
      - Leaves her water bottle beside the sofa when she studies in the living room.
      - Uses one favorite mug for tea and rinses it promptly, then leaves it on
        the drying rack.
      - Keeps headphones looped around her bedpost or tucked into her jacket pocket.
      - Sets her phone face-down on the kitchen table during family meals when Marisol
        asks.
      - Borrows Marisol's glasses-cleaning cloth but returns it to the bathroom
        counter instead of the drawer.
      - Folds clean laundry onto her bed before putting it away, sometimes leaving
        the stack there overnight.
      - Coordinates with Nico over the gaming controller by placing it on the television
        stand when she is finished.
  - id: resident_3
    name: Nicolás "Nico" Vega
    age: 16
    occupation: High school student
    personality: sociable, improvisational, and good-natured; he shares easily but
      tends to leave the last-used object wherever he stopped using it.
    habits:
      - Drops his backpack near the dining chair rather than carrying it to his
        room.
      - Charges his phone in the kitchen because he forgets where he last used his
        bedroom charger.
      - Uses the shared gaming controller in the living room and leaves it under
        the blanket or beside the remote.
      - Refills the shared water bottle before sports practice, then forgets it
        on the counter afterward.
      - Keeps his jacket draped over the back of the sofa despite repeated reminders.
      - Makes late snacks in a bowl and usually carries the bowl only as far as
        his desk.
      - Takes the dog leash from the entry hook for walks and returns it inconsistently,
        sometimes looping it around the chair.
      - Brings Marisol's laundry basket back from the hallway after using it, but
        rarely sorts his clothes before adding them.
relationships: >-
  Marisol is the single parent of twins Talia and Nico; the siblings are close but
  compete over the living-room television and who last used shared items. Talia
  handles more of the school-paperwork and kitchen reset tasks, while Nico is expected
  to manage dog walks, trash, and vacuuming when Marisol's rotating hospital shifts
  disrupt the usual rhythm. Their recurring friction is Nico's trail of gear in
  common spaces versus Talia's preference for clear surfaces, though both reliably
  check in on meals and rides when Marisol is working.
home_layout_notes: >-
  The apartment has Marisol's small bedroom, separate bedrooms for Talia and Nico,
  one bathroom, a combined kitchen-dining area, and a living room with the television.
  Talia uses her desk and the dining table for schoolwork, while Nico spreads between
  his bedroom desk and the sofa; Marisol most often uses the kitchen counter, entry
  console, and her bedside table. The living room, bathroom, kitchen, entry, and
  laundry area are shared, with the television stand acting as the household's informal
  drop zone for remotes, controllers, and chargers.
