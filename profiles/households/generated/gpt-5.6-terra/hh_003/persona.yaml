daily_life_summary: >-
  Marisol's rotating emergency-department shifts mean that her time at home sometimes
  overlaps fully with the teens' school routines and sometimes barely intersects
  with them. Talia usually settles into homework and tea in the shared area, while
  Nico moves between schoolwork, dog walks, snacks, and games. The twins often manage
  dinner or reheating food on their own when Marisol is away, then leave notes or
  send messages about what has been used up. When all three are home, they tend
  to gather in the living room briefly before retreating to separate rooms with
  their own devices.
quirks: >-
  Although they are a shift-work household, they keep a surprisingly formal shared
  charging spot in the kitchen so nobody's phone dies during a handoff. Marisol's
  emergency-nursing habit has made the teens unusually competent at locating medication,
  water, and clean towels for one another.
