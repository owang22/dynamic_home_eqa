daily_life_summary: >-
  Marco and Priya generally leave the home for their fixed daytime work, while Sofia
  and Leo take school gear out and return with backpacks, bottles, and papers. Elena
  is home for much of the day and quietly consolidates objects left in shared spaces.
  The household reconnects around meals, homework, television, and kitchen cleanup,
  with everyone’s belongings tending to collect at the dining table and entry. Sofia
  often retreats upstairs for privacy while Leo continues moving toys and screens
  through the common rooms.
quirks: >-
  Although Elena is retired, she is the household’s informal inventory manager and
  can usually locate a misplaced charger, notebook, or pair of glasses. Priya’s
  bakery work means the family is unusually disciplined about packing lunchboxes
  and keeping food containers in rotation.
