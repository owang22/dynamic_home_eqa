household_id: hh_002
household_type: multigenerational_family
residents:
  - id: resident_1
    name: Elena Vargas
    age: 78
    occupation: Retired municipal library circulation supervisor
    personality: methodical, quietly generous, and protective of well-kept belongings
    habits:
      - Keeps her reading glasses and current book together on the living-room side
        table.
      - Carries a ceramic mug from the kitchen to her armchair and rinses it immediately
        after use.
      - Leaves a folded blanket over the arm of her chair rather than putting it
        in a closet.
      - Sorts medication bottles into a small group on the kitchen counter before
        returning them to a cabinet.
      - Uses a notebook to list groceries and tucks it beside the family phone charger.
      - Waters the porch and kitchen plants, leaving the watering can by the back
        door afterward.
      - Collects stray school pens from the dining table and returns them to the
        children’s backpacks.
  - id: resident_2
    name: Marco Vargas
    age: 42
    occupation: Commercial building maintenance technician
    personality: practical, tidy in work gear, and absent-minded with personal items
    habits:
      - Packs his phone, wallet, keys, and lunchbox into the same backpack before
        leaving for work.
      - Drops his keys into a bowl near the entry when he remembers, but otherwise
        leaves them on the kitchen counter.
      - Hangs his work jacket over the back of a dining chair to air out before
        putting it away.
      - Keeps a water bottle in his backpack and refills it at the kitchen sink.
      - Uses the shared vacuum cleaner for quick cleanup after the children have
        tracked debris through the hall.
      - Leaves his charger plugged in beside the living-room sofa when he is using
        his phone there.
      - Sets a pan on the stove after making simple family dinners and relies on
        Elena to remind him to wash it promptly.
  - id: resident_3
    name: Priya Vargas
    age: 42
    occupation: Bakery counter associate
    personality: warm, efficient, and prone to making small piles while multitasking
    habits:
      - Carries her phone, keys, wallet, and lunchbox in her backpack for her daytime
        shift.
      - Leaves her bakery jacket on a hook by the entry and checks its pockets before
        washing it.
      - Brings home a water bottle from work and sets it beside the sink to refill.
      - Keeps a makeup kit and hairbrush on her bedroom dresser, though they sometimes
        migrate to the bathroom counter.
      - Uses a notebook for household lists and leaves it on the dining table during
        meal planning.
      - Packs lunchboxes with Marco and checks that both children’s water bottles
        are filled.
      - Uses the shared pot for soups and leaves leftovers cooling on the counter
        until someone transfers them.
  - id: resident_4
    name: Sofia Vargas
    age: 14
    occupation: Secondary school student
    personality: creative, private, and selectively organized
    habits:
      - Keeps her laptop, headphones, and notebook in a loose cluster on her bedroom
        desk.
      - Carries her phone, keys, water bottle, and school materials in her backpack
        when she leaves the house.
      - Leaves a jacket draped over her desk chair instead of hanging it up.
      - Charges her phone beside her bed and occasionally borrows the living-room
        charger.
      - Uses a gaming controller in the living room, then tucks it under a sofa
        cushion to keep it away from her brother.
      - Reads with a blanket on the sofa and often leaves the book marking her place
        there.
      - Puts clean laundry in her basket until Elena prompts her to fold it.
  - id: resident_5
    name: Leo Vargas
    age: 8
    occupation: Primary school student
    personality: energetic, affectionate, and careless about putting things back
    habits:
      - Carries his school backpack, lunchbox, water bottle, and child-safe house
        keys when he goes out with family or to school.
      - Empties toy cars and figures onto the living-room rug, then stores only
        some of them when asked.
      - Leaves his jacket near the entry or on the bottom stair after coming inside.
      - Brings a tablet between the kitchen table and sofa, usually with sticky
        fingerprints on its case.
      - Uses the family remote and gaming controller while sitting close to the
        television, then leaves them on the floor.
      - Takes a favorite blanket to his bed and back to the sofa when he wants to
        read.
      - Leaves pencils and notebooks spread across the dining table after homework,
        where Elena gathers them into his backpack.
relationships: >-
  Elena is Marco’s mother, and Marco and Priya are married parents to Sofia and
  Leo. Marco handles repairs and heavier cleaning, Priya coordinates food, school
  supplies, and most laundry, while Elena covers small household resets and helps
  the children keep track of their things. The family shares the kitchen and living
  room closely; tension arises when Sofia wants a clear, quiet work area while Leo
  spreads toys and takes over the television controls.
home_layout_notes: >-
  Elena has the ground-floor bedroom near the living room, while Marco and Priya
  share the main bedroom and Sofia and Leo have separate small bedrooms upstairs.
  The dining table doubles as Priya’s planning surface and the children’s homework
  station; the living room is Elena’s reading space and the children’s screen-and-toy
  area. A small entry area holds the household’s bags, jackets, keys, and umbrellas,
  making it a frequent clutter point.
