household_id: hh_005
household_type: working_couple_no_children__opposite_schedules
residents:
  - id: resident_1
    name: Mara Velez
    age: 31
    occupation: municipal procurement analyst
    personality: methodical, lightly sentimental, and prone to making small reset
      piles before putting things fully away
    habits:
      - Keeps her work laptop and notebook together on the dining table while reviewing
        contracts, then moves both to a shelf before bed.
      - Carries her phone, keys, wallet, and transit lunchbox in the same backpack
        whenever she leaves for work.
      - Leaves a half-filled water bottle beside the sofa after stretching on her
        yoga mat.
      - Uses one favorite mug for tea and rinses it promptly, but often leaves it
        upside down on a dish towel rather than returning it to the cupboard.
      - Places jackets over the back of the entry chair for a day or two before
        hanging them up.
      - Charges her phone beside the shared bed and coils the charger loosely when
        she needs it in her backpack.
      - Keeps a library book and glasses on her side of the bed, marking her place
        with a receipt or notebook slip.
  - id: resident_2
    name: Darren Cho
    age: 40
    occupation: overnight building maintenance electrician
    personality: practical, quiet, and exacting about tools and work gear but relaxed
      about household clutter
    habits:
      - Empties his pockets onto a shallow entry shelf, usually leaving keys and
        wallet in the same corner.
      - Takes his phone, keys, wallet, water bottle, lunchbox, and headphones to
        every shift in his backpack.
      - Leaves his work jacket draped over the laundry basket until Mara reminds
        him to hang it up.
      - Uses the kitchen counter for a quick meal before leaving and leaves one
        bowl or plate there for Mara to find later.
      - Keeps a paperback and a pair of glasses on the living-room side table for
        winding down without waking Mara.
      - Plugs his phone into the living-room charger rather than the bedroom charger
        when Mara is asleep.
      - Uses the vacuum cleaner on the entry rug after particularly dusty shifts,
        then parks it in the hall closet without rewinding the cord.
      - Sets his gaming controller beside the sofa blanket after playing quietly
        during their limited shared downtime.
relationships: >-
  Mara and Darren are married and have learned to communicate through short notes
  in Mara's notebook and a shared expectation that the kitchen is reset after use.
  Mara handles most meal planning and paperwork, while Darren takes responsibility
  for entryway cleaning, laundry loads, and small household repairs. Their recurring
  friction is sound and light: Darren's late returns can leave work gear on shared
  surfaces, while Mara's preference for an orderly morning kitchen makes those leftovers
  feel larger than they are.
home_layout_notes: >-
  They share one bedroom, but Mara uses the bedroom more for sleep and reading while
  Darren often winds down in the living room to avoid disturbing her. The dining
  table doubles as Mara's document station, and the kitchen counter is Darren's
  main pre-shift staging surface. The entry chair and shelf are shared drop zones,
  while each partner has a distinct side of the bed and a separate charger location.
object_inventory:
  - id: laptop_mara
    class: laptop
    owner: resident_1
    role: Mara uses it for procurement reports and occasional remote work; it usually
      sits on the dining table or its shelf, and travels in backpack_mara when she
      takes it out.
  - id: phone_mara
    class: phone
    owner: resident_1
    role: Mara uses it for calls, transit, messages, and work authentication; it
      is usually on her bedside table or dining table, and travels in her jacket
      pocket or backpack_mara.
  - id: keys_mara
    class: keys
    owner: resident_1
    role: Mara uses them for the apartment and bike storage; they tend to rest on
      the entry shelf, and travel clipped inside backpack_mara or in her jacket
      pocket.
  - id: wallet_mara
    class: wallet
    owner: resident_1
    role: Mara uses it for identification, cards, and transit fare; it is usually
      in backpack_mara, and travels inside that backpack whenever she leaves.
  - id: backpack_mara
    class: backpack
    owner: resident_1
    role: Mara's work carryall holds her laptop, wallet, keys, lunchbox, and charger;
      it waits by the entry chair and travels on her back for commuting and errands.
  - id: lunchbox_mara
    class: lunchbox
    owner: resident_1
    role: Mara packs leftovers or prepared lunches in it; it is usually on the kitchen
      counter or in backpack_mara, and travels inside her backpack to the office.
  - id: water_bottle_mara
    class: water_bottle
    owner: resident_1
    role: Mara uses it at her desk and during yoga; it tends to be beside the sofa
      or drying by the sink, and travels in the side pocket of backpack_mara.
  - id: mug_mara
    class: mug
    owner: resident_1
    role: Mara's preferred tea mug is used at the dining table or sofa; it tends
      to be upside down on a kitchen towel and does not normally leave the home.
  - id: notebook_mara
    class: notebook
    owner: resident_1
    role: Mara uses it for shopping lists, chore notes, and messages for Darren;
      it usually lies on the dining table and travels in backpack_mara for planning
      on the go.
  - id: pen_mara
    class: pen
    owner: resident_1
    role: Mara uses it with notebook_mara for lists and notes; it tends to be tucked
      into the notebook binding and travels inside backpack_mara when needed.
  - id: book_mara
    class: book
    owner: resident_1
    role: Mara's current library book is for bedtime reading; it usually rests on
      her side of the bed and travels in backpack_mara when she reads during a commute
      or break.
  - id: glasses_mara
    class: glasses
    owner: resident_1
    role: Mara uses them for screen work and reading; they tend to be on the dining
      table or bedside table, and travel in a small compartment of backpack_mara.
  - id: charger_mara
    class: charger
    owner: resident_1
    role: Mara uses it to charge phone_mara and sometimes laptop_mara; it usually
      stays beside her side of the bed and travels coiled inside backpack_mara when
      needed.
  - id: jacket_mara
    class: jacket
    owner: resident_1
    role: Mara wears it for commuting and errands; it often hangs over the entry
