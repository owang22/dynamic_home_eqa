daily_life_summary: >-
  Mara leaves for her daytime office work as Darren is generally protecting his
  sleep or preparing for his overnight work. Their most reliable overlap is around
  meals, quick check-ins, and household handoffs rather than long stretches of leisure.
  Mara tends to restore common surfaces before starting her workday, while Darren
  uses the quieter parts of the home for reading, gaming, and preparing his shift
  bag. On days off, they catch up on laundry, cooking, and errands together, with
  Darren handling practical fixes and Mara keeping lists and supplies organized.
quirks: >-
  They do not own a television; the living-room remote controls a compact speaker
  system used at low volume. Despite their opposite schedules, they keep a single
  shared handwritten household notebook instead of using a digital chore app.
