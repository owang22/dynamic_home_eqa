household_id: hh_019
household_type: working_professional_solo
residents:
  - id: resident_1
    name: Leena Park
    age: 29
    occupation: corporate records coordinator
    personality: Methodical, quietly sociable, and mildly sentimental about everyday
      possessions.
    habits:
      - Places her phone and keys together in a shallow bowl by the entry after
        returning home.
      - Carries her laptop in the same backpack for the office and usually leaves
        the backpack beside the dining table rather than putting it away.
      - Makes tea in one preferred mug and rinses it immediately, then leaves it
        upside down on the drying towel.
      - Uses a notebook for meeting notes and personal lists, often leaving it open
        beside the laptop overnight.
      - Prepares leftovers or a grain bowl in her lunchbox and places it at the
        front of the refrigerator for the next workday.
      - Keeps her water bottle on the desk while working at home and moves it to
        the bedside when reading.
      - Rolls out her yoga mat in the living room, then sometimes leaves it unrolled
        until the following day.
      - Sets her jacket over the back of a chair during the week and returns it
        to the closet only when doing laundry.
relationships: >-
  Leena lives alone and has full control of the apartment’s shared-use objects,
  though she informally treats the dining table as a work surface and the living
  room as a recovery space. Her main point of friction is with herself: work materials
  can spread from the table into the living room, so she periodically resets the
  space before having friends visit.
home_layout_notes: >-
  The apartment has one bedroom, a combined living-dining room, a compact kitchen,
  and a small entry area. Leena uses the dining table for laptop work and planning,
  the sofa area for reading and yoga, and the kitchen counter for packing meals.
  The bedroom holds her personal reading items and laundry basket, while the entry
  bowl acts as the landing place for commuting essentials.
