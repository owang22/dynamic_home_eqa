daily_life_summary: >-
  Leena leaves home for a fixed daytime office schedule and brings her backpack,
  phone, keys, wallet, water bottle, and often a packed lunch. After work she alternates
  between simple cooking, reading, light yoga, and occasional laptop catch-up at
  the dining table. Her home is usually orderly at the edges but accumulates a small
  cluster of active items around the table and sofa before she resets it. Weekends
  are when she launders, waters plants, vacuums, and packs the suitcase if visiting
  family.
quirks: >-
  Leena owns fewer decorative items than most peers because she prefers useful objects
  that can be put away. She keeps a paper notebook despite working in records coordination
  and relies on it more than digital task apps.
