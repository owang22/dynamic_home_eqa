household_id: hh_010
household_type: family_teen_and_child
residents:
  - id: resident_1
    name: Nikhil Rao
    age: 47
    occupation: municipal procurement analyst
    personality: methodical, frugal, quietly particular about shared surfaces
    habits:
      - Sets his travel mug beside the kitchen sink after emptying it and rinses
        it before leaving it to dry.
      - Keeps his laptop and charger together on the small desk in the living-room
        alcove, except when he carries both to the office in his backpack.
      - Drops his keys and wallet into the shallow entryway tray as soon as he comes
        home.
      - Uses a notebook for grocery lists and meeting notes, often leaving it open
        on the dining table until someone needs the space.
      - Loads the dishwasher-equivalent kitchen cleanup by gathering plates and
        bowls from the living room, but complains when cups are left upstairs.
      - Takes responsibility for the vacuum cleaner and parks it in the hall closet
        after doing the rugs.
      - Checks that the children's water bottles and lunchboxes are near the door
        before school days.
  - id: resident_2
    name: Marisol Rao
    age: 44
    occupation: middle-school library media specialist
    personality: warm, organized in systems, prone to carrying several projects
      at once
    habits:
      - Brings her work laptop home in her backpack and usually sets the backpack
        beside the dining chair rather than putting it away immediately.
      - Keeps a book and reading glasses on her bedside table, moving them to the
        sofa when she reads with the children.
      - Refills her water bottle in the kitchen and often leaves it on the counter
        while sorting school papers in her notebook.
      - Uses labeled laundry baskets in the bedrooms and asks each child to bring
        down their own clothes.
      - Leaves her umbrella hanging by the front door after wet commutes so it can
        dry.
      - Keeps a makeup kit and hairbrush in the bathroom drawer but spreads them
        across the counter when getting ready.
      - Coordinates with Nikhil over a shared notebook list for household supplies
        and school needs.
  - id: resident_3
    name: Tessa Rao
    age: 15
    occupation: high school student
    personality: independent, creative, selectively tidy
    habits:
      - Carries her phone, keys, water bottle, headphones, and school materials
        in her backpack whenever she goes out.
      - Leaves her backpack on the floor beside her bedroom door until reminded
        to hang it up.
      - Uses her laptop at the dining table for assignments, then retreats to her
        room with headphones and often forgets the charger behind.
      - Keeps a rotating stack of library books and notebooks on her desk, with
        pens tucked into the notebook spiral.
      - Takes a bowl of snacks to the sofa while gaming and returns it only after
        being prompted.
      - Shares the bathroom hairbrush with her sibling only reluctantly and keeps
        her own jacket draped over her desk chair.
      - Borrows Marisol's book recommendations and returns books to the living-room
        shelf in uneven piles.
  - id: resident_4
    name: Owen Rao
    age: 8
    occupation: elementary school student
    personality: energetic, imaginative, easily distracted by play
    habits:
      - Packs his lunchbox and water bottle into his backpack with adult reminders,
        then leaves the backpack near the entryway.
      - Builds small toy scenes on the living-room rug and resists putting the toys
        back into his bedroom basket.
      - Uses the family tablet at the kitchen table and leaves it there with smudged
        fingerprints.
      - Carries his favorite blanket between his bed and the sofa, especially during
        reading or screen time.
      - Leaves his jacket in a heap on the entry bench after coming in.
      - Uses colored pens and a notebook at the dining table, scattering them when
        he switches to another activity.
      - Brings a gaming controller to the sofa and asks Tessa to help him find its
        charger.
relationships: >-
  Nikhil and Marisol are married and parent Tessa and Owen. Nikhil handles most
  entryway clutter, vacuuming, and practical repairs-by-proxy, while Marisol runs
  the laundry system and keeps school materials moving; both expect the children
  to clear their own dishes and bags. Tessa wants her bedroom to be private, while
  Owen treats the living room as an extension of his play space, which causes recurring
  negotiations over toys, controllers, and the dining table.
home_layout_notes: >-
  The home has three bedrooms: Nikhil and Marisol share the main bedroom, Tessa
  has a compact room with a desk, and Owen has a child-sized room with toy storage.
  The dining table serves as the shared homework and paperwork surface, while the
  living-room sofa and rug are the main family recreation area. Nikhil's work alcove
  is off the living room, and the entryway is the common landing zone for bags,
  jackets, keys, and umbrellas.
