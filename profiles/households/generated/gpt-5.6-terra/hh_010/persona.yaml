daily_life_summary: >-
  Nikhil and Marisol leave for their fixed daytime jobs while Tessa and Owen attend
  their respective schools, so the home is usually quiet during the shared daytime
  stretch. Their returns converge around the kitchen, entryway, and dining table,
  bringing backpacks, lunchboxes, water bottles, and work materials into the same
  small set of surfaces. Tessa often works independently with headphones, while
  Owen seeks company for games or reading. The adults reset the kitchen and school
  items together, though the children need repeated reminders to retrieve their
  belongings from shared rooms.
quirks: >-
  Marisol's library work means the family has an unusually active rotation of borrowed
  books rather than a large permanent collection. Nikhil keeps a shared household
  notebook more faithfully than a digital app, and even the children add requests
  to it.
