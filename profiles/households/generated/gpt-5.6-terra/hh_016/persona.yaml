daily_life_summary: >-
  Marie spends much of her time reading, maintaining her plants, preparing simple
  meals, and keeping in touch with family on her tablet. She makes occasional independent
  outings with her phone, wallet, keys, and a small backpack, then returns to settle
  into the living-room reading corner. Visitors tend to overlap with her in the
  dining and living areas, where she offers tea and pulls out books or photographs
  to discuss. Her belongings move in small, repeatable loops between the entry,
  kitchen, armchair, bedroom, and balcony.
quirks: >-
  Marie still organizes her personal reading list with the precision of a library
  worker, using handwritten notes rather than an app. She keeps a gaming controller
  for cooperative games with her grandchildren, despite rarely playing alone.
