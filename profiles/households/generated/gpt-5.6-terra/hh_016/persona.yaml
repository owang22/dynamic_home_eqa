household_id: hh_016
household_type: single_senior_solo
residents:
  - id: resident_1
    name: Marie Calder
    age: 82
    occupation: Retired public-library circulation supervisor
    personality: Methodical, quietly sociable, and protective of familiar belongings.
    habits:
      - Sets her reading glasses, current book, and a mug together on the end table
        beside her armchair.
      - Carries her phone in a jacket pocket when she goes out and plugs it into
        the kitchen charger after returning.
      - Keeps her keys on a hook by the entry but sometimes leaves them in the pocket
        of the jacket she last wore.
      - Refills a water bottle before tending the balcony plants and often leaves
        the watering can by the patio door afterward.
      - Sorts medication bottles into a small group on the kitchen counter before
        putting them back in a cabinet.
      - Uses a notebook for grocery lists, library recommendations, and reminders,
        leaving it open beside the phone.
      - Folds laundry from the basket directly onto the bed and may leave the basket
        there until the next load.
      - Uses the tablet for video calls with relatives and rests it on the dining
        table between calls.
relationships: >-
  Marie lives alone and manages her own household, though relatives and former library
  colleagues visit or call regularly. She keeps shared areas orderly for visitors,
  but her armchair corner and the kitchen counter collect the objects she is actively
  using. Her main point of friction is with herself: she dislikes clutter yet resists
  putting away a book, medication, or note until she feels fully finished with it.
home_layout_notes: >-
  Marie occupies a one-bedroom apartment with a combined living and dining room,
  a compact kitchen, bathroom, and a small plant-filled balcony. The living-room
  armchair, end table, dining table, and kitchen counter are her most-used surfaces;
  the bedroom is private and also serves as the place where she folds laundry and
  stores travel items. The balcony door area is shared only with visiting family
  and is often crowded with the watering can, jacket, and a folded umbrella.
