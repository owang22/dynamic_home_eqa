household_id: hh_008
household_type: college_roommates__irregular_gig
residents:
  - id: resident_1
    name: Nia Calder
    age: 19
    occupation: first-year environmental studies student
    personality: Methodical, quietly sociable, and protective of her study materials.
    habits:
      - Keeps her laptop, notebook, and pens lined up on the dining table while
        studying, then moves them back to her bedroom when the table is needed.
      - Refills the same water bottle and leaves it beside the kitchen sink or on
        her desk.
      - Carries her backpack to campus and hangs it from the back of her bedroom
        chair when she returns.
      - Rinses her mug immediately but sometimes leaves it upside down on a dish
        towel instead of putting it away.
      - Uses the living-room blanket while reading and folds it over one arm of
        the sofa afterward.
      - Leaves her keys in a small bowl by the entry and reminds the others to put
        shared deliveries there.
      - Borrows Priya's pan only after texting and washes it before Priya gets back.
  - id: resident_2
    name: Mateo Velez
    age: 21
    occupation: third-year graphic design student
    personality: Expressive, absent-minded, and generous with shared supplies.
    habits:
      - Works from his laptop in the living room and leaves its charger threaded
        behind the sofa cushion.
      - Carries headphones in his backpack and often drops the backpack just inside
        his bedroom doorway.
      - Uses a sketch notebook and loose pens at the coffee table, gathering them
        into a stack when someone wants the space.
      - Keeps a half-finished mug of tea near whichever surface he is using, usually
        the desk or coffee table.
      - Takes his gaming controller to the living room and leaves it on the sofa
        arm after playing.
      - Hangs his jacket over a dining chair rather than using the coat hooks.
      - Shares his remote and streaming setup but asks roommates not to move the
        controller cables.
  - id: resident_3
    name: Priya Nanduri
    age: 21
    occupation: part-time bicycle courier
    personality: Practical, energetic, and particular about kitchen cleanup.
    habits:
      - Keeps her phone charged near the entry so she can respond quickly to delivery
        offers.
      - Takes her keys, wallet, phone, water bottle, and backpack on courier runs,
        then empties them onto her bedroom desk afterward.
      - Leaves her jacket draped over the entry chair to air out between gigs.
      - Batch-cooks in the shared pot and pan, labeling leftovers mentally by shelf
        rather than with containers.
      - Washes cooking tools promptly but gets irritated when others leave plates
        in the sink.
      - Uses her yoga mat in the living room and rolls it behind the sofa after
        stretching.
      - Keeps an umbrella by the door and lends it out only if it is returned to
        the same spot.
      - Puts clean towels over the bathroom rail and collects abandoned laundry
        into the shared basket.
relationships: >-
  Nia, Mateo, and Priya met through campus housing and renewed their lease after
  discovering that they tolerate one another's uneven schedules better than most
  roommates. Nia handles shared-list planning, Priya takes the lead on kitchen and
  bathroom resets, and Mateo usually manages entertainment equipment and takes out
  recycling when reminded. Their recurring friction is Mateo's sprawl across common
  surfaces and Priya's dislike of sink dishes, while Nia often coordinates a quick
  reset before anyone hosts a friend.
home_layout_notes: >-
  The apartment has three small bedrooms off a shared living room, with a compact
  kitchen and one bathroom; each resident has a separate bedroom. Nia uses the dining
  table and her desk for coursework, Mateo claims one end of the sofa and coffee
  table for design work, and Priya relies on the entry area, kitchen counter, and
  her bedroom desk to stage gig gear. The kitchen, bathroom, entry chair, dining
  table, and living-room sofa are the main shared spaces.
