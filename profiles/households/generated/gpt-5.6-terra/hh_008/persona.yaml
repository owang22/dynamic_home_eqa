daily_life_summary: >-
  Nia and Mateo spend much of their home time studying, though they shift between
  their rooms and the common areas depending on deadlines. Priya's courier work
  can pull her in and out unpredictably, so she sometimes overlaps with the others
  only during quick kitchen stops or while charging devices at the entry. The roommates
  tend to communicate through short messages about dishes, borrowed cookware, and
  whether the living room is free for work or stretching. Shared cleanup happens
  in small bursts rather than as a formal routine.
quirks: >-
  Despite being students, they keep the dining table unusually clear because Nia
  treats it as a rotating study-and-meal station. Priya's courier habits make the
  entry function more like a tiny dispatch area than a typical student apartment.
