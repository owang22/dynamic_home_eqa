household_id: hh_011
household_type: remote_worker_couple
residents:
  - id: resident_1
    name: Mara Iqbal
    age: 41
    occupation: Accessibility-focused front-end engineer
    personality: Methodical, quietly sentimental, and prone to making small systems
      for shared items.
    habits:
      - Starts work with her laptop, headphones, water bottle, and a notebook arranged
        in the same order on her desk.
      - Carries her phone from room to room but often leaves it face-down beside
        the kitchen mug while making tea.
      - Returns shared chargers to a basket-like spot on the living-room shelf,
        then gets irritated when Leon borrows one without saying so.
      - Keeps her keys and wallet together in the pocket of her everyday jacket
        after returning home.
      - Uses a yoga mat for short stretch breaks and rolls it loosely against the
        office wall rather than putting it away fully.
      - Reads paper books in bed and leaves the current one tucked under her side
        of the blanket.
      - Brings the laundry basket into the bedroom, sorts clothing immediately,
        and expects Leon to carry his own towels to it.
  - id: resident_2
    name: Leon Varga
    age: 42
    occupation: Brand identity art director
    personality: Visually exacting, sociable, and distractibly optimistic about
      tidying later.
    habits:
      - Moves his laptop between the dining table and his studio corner depending
        on whether he needs more space for notes.
      - Uses a tablet for sketch reviews and commonly leaves it on the sofa under
        a blanket after a break.
      - Drinks water from the same bottle through long work sessions and refills
        it before carrying it back to his desk.
      - Leaves pens, an open notebook, and headphones on the dining table after
        client calls, despite Mara's preference for a clear surface.
      - Takes his phone, keys, wallet, and backpack together when leaving for errands,
        with the phone in a jacket pocket and the rest in the backpack.
      - Uses the shared watering can for the window plants and sometimes forgets
        it beside the sink afterward.
      - Plays games with a controller in the living room and returns the remote
        to the sofa arm rather than the media shelf.
relationships: >-
  Mara and Leon are married and have learned to treat their separate work areas
  as quiet zones during the workday. Mara handles most laundry sorting and household
  supply routines, while Leon usually cooks and waters the plants; they coordinate
  around the dining table because Leon sometimes turns it into a temporary design
  workspace. Their recurring friction is clutter: Mara wants shared surfaces reset
  promptly, while Leon sees an active project as evidence that the room is being
  used well.
home_layout_notes: >-
  They live in a two-bedroom apartment: Mara uses the smaller bedroom as a dedicated
  office, while Leon works from a studio corner in the larger living-dining room.
  They share the main bedroom, kitchen, bathroom, sofa, and dining table, though
  the table is periodically claimed by Leon's tablet, notebooks, and laptop. A narrow
  entry area holds their jackets, keys, backpacks, and umbrellas, while plants cluster
  along the living-room window.
