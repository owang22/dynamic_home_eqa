daily_life_summary: >-
  Both residents work fixed daytime schedules from home, so the apartment is usually
  occupied by two people using separate screens and headphones. They overlap for
  coffee, quick kitchen breaks, and meals, but Mara tends to retreat to her office
  while Leon works more visibly in the shared room. After work, Leon often shifts
  the living room toward games or sketching, while Mara reads, stretches, or restores
  objects to their usual places. Errands and occasional outings pull their personal
  carry items from the entry area and return them there in uneven degrees of order.
quirks: >-
  They avoid owning a television setup; the living-room remote is for a compact
  streaming device rather than a TV. Leon's design work is mostly digital, but he
  still relies on paper notebooks and pens for early concepts.
