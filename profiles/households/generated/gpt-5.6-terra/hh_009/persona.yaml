household_id: hh_009
household_type: couple_with_toddler
residents:
  - id: resident_1
    name: Elias Moreno
    age: 34
    occupation: Frontend accessibility engineer
    personality: methodical, quietly playful, and prone to making small systems
      for shared items
    habits:
      - Puts his phone and keys in the same shallow entryway tray when he comes
        home.
      - Carries his laptop between the dining table and a bedroom desk, then coils
        its charger beside it.
      - Uses one large mug repeatedly for coffee and rinses it rather than loading
        it immediately.
      - Leaves a notebook and pen open beside his laptop when he is working through
        a problem.
      - Keeps a water bottle within reach and refills it before leaving the home.
      - Builds short toy “parking lots” along the living-room rug with Noa, then
        usually helps return them to the basket.
      - Hangs his jacket over the back of a dining chair if he expects to wear it
        again soon.
  - id: resident_2
    name: Priya Shah
    age: 29
    occupation: Outpatient physical therapy assistant
    personality: warm, practical, and more tolerant of visible clutter than Elias
    habits:
      - Packs her lunchbox and water bottle together, usually leaving both on the
        kitchen counter until she departs.
      - Drops her keys and wallet into her backpack rather than using the entryway
        tray.
      - Brings her phone into the bathroom and leaves it on the sink while getting
        ready.
      - Keeps a lightweight jacket folded over the stroller-area hook by the door.
      - Sets her mug on the kitchen windowsill while she tidies after meals.
      - Uses the living-room floor for quick stretches and rolls up her yoga mat
        only after Noa has moved on to another activity.
      - Rotates Noa's books from the bedroom shelf to the living room and often
        leaves the current favorite beside the sofa.
  - id: resident_3
    name: Noa Moreno-Shah
    age: 2
    occupation: Preschool child
    personality: curious, determined, and possessive of favorite comfort objects
    habits:
      - Carries a soft blanket between the bedroom and living room and abandons
        it near the sofa or crib.
      - Tips toys out onto the living-room rug, then chooses one or two to carry
        into other rooms.
      - Insists on drinking from the same small water bottle and leaves it on low
        tables.
      - Pulls board books from the lower shelf and stacks them beside a parent during
        reading.
      - Places toy animals in bowls, shoes, and the empty laundry basket during
        pretend play.
      - Hands a parent a hairbrush and asks for their hair to be brushed after bath
        time.
      - Tries to put a parent’s keys into the backpack during departure routines.
relationships: >-
  Elias and Priya are partners and Noa's parents. Elias handles most device-related
  clutter and vacuuming, while Priya generally manages packed food, towels, and
  the rotation of Noa's clothes and books; both reset toys together when the living
  room becomes unusable. Their recurring friction is Elias wanting clear counters
  and Priya needing a visible staging area for childcare and work items, so the
  entryway tray and one section of counter are designated drop zones.
home_layout_notes: >-
  The household lives in a compact two-bedroom apartment: Elias and Priya share
  the larger bedroom, and Noa has a nearby small bedroom with a low book shelf and
  toy basket. The dining table doubles as Elias's work surface, while the living-room
  rug is Noa's main play area and Priya's stretching spot. Kitchen counters, the
  entryway hook area, and the sofa side table are shared high-traffic surfaces.
