daily_life_summary: >-
  Elias leaves for his fixed daytime tech job and returns with a laptop, phone,
  and keys that need to be reset at the entry. Priya's part-time fixed daytime healthcare
  shifts overlap with some of his workdays, so Noa's preschool handoffs require
  a packed backpack, lunchbox, and comfort blanket. When the adults are both home,
  meals, play, and tidying concentrate in the kitchen and living room. Noa's toys
  and books migrate through the apartment faster than either parent can fully put
  them away.
quirks: >-
  They keep a deliberately empty strip of living-room rug as a “road” for Noa's
  toys, even though Elias otherwise prefers orderly floors. Priya and Elias use
  a shared paper notebook for preschool notes and household handoffs rather than
  an app.
