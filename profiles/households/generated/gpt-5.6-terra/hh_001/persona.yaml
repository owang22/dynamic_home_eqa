household_id: hh_001
household_type: working_professional_solo
residents:
  - id: resident_1
    name: Mara Iqbal
    age: 35
    occupation: Corporate records compliance coordinator
    personality: Methodical, quietly sentimental, and prone to leaving active projects
      visible until they are finished.
    habits:
      - Keeps her work laptop and notebook open on the dining table through the
        workweek, then packs them into her backpack before leaving home.
      - Places her keys and wallet together in a shallow bowl near the entry, except
        when she has used the jacket pocket on a rainy day.
      - Refills the same water bottle repeatedly and leaves it beside the laptop,
        yoga mat, or bedside table depending on what she was doing last.
      - Uses a mug for tea while reading and often carries it from the kitchen to
        the sofa before rinsing it later.
      - Sets out a lunchbox on the kitchen counter after cleaning it so she remembers
        to pack it for the next workday.
      - Leaves a book face-down on the sofa arm or bed when she is midway through
        a chapter.
      - Rolls out her yoga mat in the living room and usually leaves it there until
        she has used it several times.
      - Sorts laundry promptly but lets clean towels sit in the laundry basket until
        she needs them.
relationships: >-
  Mara lives alone and makes all decisions about the apartment, though she maintains
  informal boundaries between work surfaces and rest spaces. She is generally orderly
  with essential items, but her tendency to keep current reading, exercise, and
  work materials in view creates small clusters of belongings around the dining
  table and sofa. Her main point of friction is with herself: she dislikes visual
  clutter but resists putting away anything she expects to use again soon.
home_layout_notes: >-
  The apartment has an entry nook, combined living-dining room, galley kitchen,
  one bedroom, and one bathroom. Mara uses the dining table as her primary work
  surface, the sofa and nearby side table for reading, and the living-room floor
  for yoga. Her bedroom is private and contains the bed, a bedside surface, and
  a laundry basket; the kitchen counter and entry bowl are the main shared-style
  drop zones despite her living alone.
object_inventory:
  - id: laptop_mara
    class: laptop
    owner: resident_1
    role: Used for office documents, personal administration, and occasional streaming;
      it usually sits on the dining table and travels inside backpack_mara when
      Mara takes it to the office.
  - id: phone_mara
    class: phone
    owner: resident_1
    role: Used for calls, transit information, messages, and alarms; it tends to
      be on the dining table, sofa side table, or bedside surface and travels in
      Mara's jacket pocket, hand, or backpack_mara.
  - id: keys_mara
    class: keys
    owner: resident_1
    role: Used for the apartment, building entry, and mailbox; they usually rest
      in bowl_shared_1 near the entry and travel on a keyring in Mara's hand, jacket
      pocket, or backpack_mara.
  - id: wallet_mara
    class: wallet
    owner: resident_1
    role: Used for identification, payment cards, and transit card; it is usually
      kept beside keys_mara in bowl_shared_1 and travels in Mara's jacket pocket
      or backpack_mara.
  - id: backpack_mara
    class: backpack
    owner: resident_1
    role: Used to carry Mara's laptop, charger, notebook, lunchbox, water bottle,
      and occasional jacket; it hangs by the entry when home and travels on her
      back to and from work.
  - id: jacket_mara
    class: jacket
    owner: resident_1
    role: Used as an outer layer for commuting and errands; it usually hangs on
      an entry hook or over a dining chair and travels worn by Mara or folded into
      backpack_mara.
  - id: headphones_mara
    class: headphones
    owner: resident_1
    role: Used for focused office work, podcasts, and calls; they tend to be coiled
      beside laptop_mara or in backpack_mara and travel inside the backpack or around
      Mara's neck.
  - id: glasses_mara
    class: glasses
    owner: resident_1
    role: Used for screen work and reading; they are usually on the dining table,
      bedside surface, or in a jacket pocket and travel in Mara's backpack or worn
      on her face.
  - id: charger_mara
    class: charger
    owner: resident_1
    role: Used to charge phone_mara and laptop_mara; it is usually plugged in at
      the dining table or packed into backpack_mara and travels coiled in the backpack.
  - id: notebook_mara
    class: notebook
    owner: resident_1
    role: Used for meeting notes, grocery lists, and personal planning; it tends
      to remain beside laptop_mara on the dining table and travels tucked inside
      backpack_mara.
  - id: pen_mara
    class: pen
    owner: resident_1
    role: Used for handwritten work notes and lists; it is usually clipped to notebook_mara
      or loose on the dining table and travels inside notebook_mara or backpack_mara.
  - id: lunchbox_mara
    class: lunchbox
    owner: resident_1
    role: Used to carry packed weekday meals; it is usually drying on the kitchen
      counter or stored in the refrigerator after packing and travels inside backpack_mara
      or carried by its handle.
  - id: water_bottle_mara
    class: water_bottle
    owner: resident_1
    role: Used for water at work, during yoga, and around the apartment; it tends
      to be beside laptop_mara, on the kitchen counter, or next to yoga_mat_mara
      and travels in backpack_mara or in Mara's hand.
  - id: umbrella_mara
    class: umbrella
    owner: resident_1
    role: Used for rainy commutes and errands; it usually stands by the entry or
      dries in the bathroom and travels in Mara's hand or side pocket of backpack_mara.
  - id: mug_mara
    class: mug
    owner: resident_1
    role: Used for tea and coffee; it tends to move between the kitchen counter,
      dining table, and sofa side table and stays at home rather than traveling
      out with Mara.
  - id: mug_shared_1
    class: mug
    owner: shared
    role: A spare mug used for tea, coffee, or visiting guests; it is usually in
      a kitchen cabinet or left near the sink and remains in the apartment.
  - id: bowl_shared_1
    class: bowl
    owner: shared
    role: Used as an entry catchall for keys_mara and wallet_mara, and occasionally
      for snacks; it stays on the entry console and does not leave the home.
  - id: bowl_shared_2
    class: bowl
    owner: shared
    role: Used for breakfast and simple meals; it usually moves between the kitchen
      cabinet, dining table, and sink and remains at home.
  - id: plate_shared_1
    class: plate
    owner: shared
    role: Used for meals at the dining table or sofa; it tends to be in the kitchen
      cabinet, beside the sink, or on the dining table and remains at home.
  - id: plate_shared_2
    class: plate
    owner: shared
    role: A second everyday plate used for meals and food preparation; it moves
      between the kitchen cabinet, counter, and sink and remains at home.
  - id: book_mara
    class: book
    owner: resident_1
    role: A current paperback novel used for evening reading; it tends to be face-down
      on the sofa arm, bedside surface, or in backpack_mara and travels in the backpack
      when Mara expects waiting time.
  - id: tablet_mara
    class: tablet
    owner: resident_1
    role: Used for recipes, video calls, and reading articles; it usually rests
      on the sofa side table or kitchen counter and travels padded inside backpack_mara
      on occasional trips.
  - id: remote_shared_1
    class: remote
    owner: shared
    role: Used to control the living-room television; it tends to be on the sofa
      cushion, coffee table, or under blanket_mara and remains in the apartment.
  - id: blanket_mara
    class: blanket
    owner: resident_1
    role: Used while reading or watching television on the sofa; it is usually draped
      over the sofa arm or folded at the foot of the bed and remains at home.
  - id: yoga_mat_mara
    class: yoga_mat
    owner: resident_1
    role: Used for stretching and yoga in the living room; it is usually rolled
      beside the sofa or left open on the living-room floor and travels rolled under
      Mara's arm only for an occasional class.
  - id: towel_mara
    class: towel
    owner: resident_1
    role: Used after showers and occasionally after home exercise; it tends to hang
      in the bathroom before moving to laundry_basket_mara and remains at home.
  - id: laundry_basket_mara
    class: laundry_basket
    owner: resident_1
    role: Used to collect worn clothes and temporarily hold clean towels; it stays
      in the bedroom or near the bathroom and is carried by hand to the laundry
      area within the building.
  - id: vacuum_cleaner_shared_1
    class: vacuum_cleaner
    owner: shared
    role: Used for quick cleaning of the living room, bedroom, and entry; it is
      stored in a hall closet and travels by being pushed or carried between rooms,
      not outside the apartment.
  - id: pot_shared_1
    class: pot
    owner: shared
    role: Used for soups, pasta, and batch cooking; it is stored in a lower kitchen
      cabinet, used on the stove, and remains at home.
  - id: pan_shared_1
    class: pan
    owner: shared
    role: Used for eggs, vegetables, and reheating meals; it is usually on the stove
      or in a lower kitchen cabinet and remains at home.
  - id: hairbrush_mara
    class: hairbrush
    owner: resident_1
    role: Used for daily grooming; it tends to be on the bathroom counter or bedroom
      dresser and travels in suitcase_mara for overnight trips.
  - id: makeup_kit_mara
    class: makeup_kit
    owner: resident_1
    role: Used for work-ready grooming and special occasions; it is usually kept
      in the bathroom cabinet and travels inside suitcase_mara or backpack_mara
      when Mara needs it away from home.
  - id: medication_bottle_mara
    class: medication_bottle
    owner: resident_1
    role: Used to store Mara's daily allergy medication; it stays in the bathroom
      cabinet or beside a glass in the kitchen and travels inside backpack_mara
      for longer days away from home.
  - id: suitcase_mara
    class: suitcase
    owner: resident_1
    role: Used for work trips and visits to family; it is stored in the bedroom
      closet and travels rolling behind Mara when packed.
  - id: watering_can_mara
    class: watering_can
    owner: resident_1
    role: Used to water Mara's small indoor plants; it is stored under the kitchen
      sink or beside the living-room plants and moves by hand between the sink and
      plant surfaces.
daily_life_summary: >-
  Mara's fixed daytime office work keeps her out of the apartment for much of the
  workday, so the home is quiet except for items she sets out before leaving. On
  workdays she carries her phone, keys, wallet, backpack, lunchbox, water bottle,
  and often headphones with her, while the dining table retains a small work setup.
  When she returns, she tends to transition between the kitchen, sofa, and yoga
  area without fully resetting each space. On non-work days, she catches up on reading,
  laundry, light cleaning, and packing for the coming workweek.
quirks: >-
  Although she works in an office, Mara prefers paper notes to digital task apps
  and keeps several handwritten notebooks in rotation. She owns very little decorative
  clutter, but treats practical objects such as mugs, pens, and blankets as comfort
  items.
