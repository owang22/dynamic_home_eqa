household_id: hh_007
household_type: college_roommates
residents:
  - id: resident_1
    name: Mara Iqbal
    age: 22
    occupation: Master's student in urban planning
    personality: methodical, considerate, mildly territorial about clean work surfaces
    habits:
      - Keeps her laptop, planning notebook, and two pens lined up on the dining
        table while working.
      - Makes tea in the same blue mug and rinses it immediately after use.
      - Leaves her backpack on the chair nearest the apartment door, with her keys
        clipped inside its front pocket.
      - Refills her water bottle before campus trips and brings it back to the kitchen
        counter.
      - Folds the living-room blanket after using it, even when the others leave
        it rumpled.
      - Claims the first turn in the shared laundry basket when it is full and carries
        it to the laundry room.
      - Writes grocery needs in her notebook after noticing an empty shared pot
        or missing dish soap.
      - Moves Leo's stray gaming controller from the dining table to the media shelf
        rather than putting it away for him.
  - id: resident_2
    name: Leo Park
    age: 21
    occupation: Undergraduate student in sound design
    personality: easygoing, inventive, absent-minded with small belongings
    habits:
      - Edits audio on his laptop at the living-room coffee table with headphones
        and a charger spread nearby.
      - Leaves one mug or bowl near his work area until Mara reminds him to bring
        it to the sink.
      - Keeps his gaming controller beside the remote on the media shelf after late
        play sessions.
      - Carries his backpack between campus and the apartment but often drops it
        by the sofa instead of in his bedroom.
      - Uses the shared pan for quick meals and leaves it soaking when he is rushing
        to class.
      - Misplaces his keys in jacket pockets, backpack compartments, or under the
        entryway mail.
      - Borrows Mara's pens but returns them to her notebook once she asks.
      - Uses a blanket on the sofa while listening to mixes and usually leaves his
        headphones looped over the sofa arm.
  - id: resident_3
    name: Sofia Mendes
    age: 19
    occupation: Undergraduate student and bakery counter associate
    personality: energetic, practical, protective of her personal supplies
    habits:
      - Packs her lunchbox and water bottle for campus and her bakery-counter shift,
        then leaves them on the kitchen counter to be washed afterward.
      - Stores her phone charger beside her bed and carries a compact backup charger
        in her backpack.
      - Hangs her jacket on the entry hooks after work, often with her keys still
        in its pocket.
      - Uses her hairbrush and makeup kit at the bathroom counter, then gathers
        them into a small bedroom tote area rather than leaving them shared.
      - Brings home unsold bakery items in a paper bag but transfers them to a shared
        plate or bowl before eating.
      - Keeps a medication bottle in her bedside drawer and takes it with a glass
        of water rather than leaving it in the kitchen.
      - Starts laundry in the shared basket but sometimes forgets to return for
        it until Mara checks in.
      - Coordinates with Leo about quiet use of the living room when she needs to
        study before an evening shift.
relationships: >-
  Mara, Leo, and Sofia became roommates through a campus housing group and have
  grown into friendly, candid housemates rather than close-knit best friends. Mara
  manages the shared grocery list and notices cleaning gaps, Leo handles most media
  and Wi-Fi troubleshooting, and Sofia often brings home bakery leftovers that become
  communal snacks. Their recurring friction is clutter: Mara dislikes Leo's dishes
  and cables on shared surfaces, while Sofia asks both roommates to keep the bathroom
  counter clear for her work preparation.
home_layout_notes: >-
  They share a three-bedroom apartment with a compact kitchen, one bathroom, a dining
  nook, and a living room. Mara uses the dining table as her main study surface,
  Leo works and relaxes at the living-room coffee table and media shelf, and Sofia
  uses her bedroom desk plus a defined section of the bathroom counter. Bedrooms
  are private; the kitchen, bathroom, entry hooks, dining table, and living room
  are shared spaces.
