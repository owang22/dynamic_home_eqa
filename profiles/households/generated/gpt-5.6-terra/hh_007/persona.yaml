daily_life_summary: >-
  Mara and Leo spend much of their non-class time studying or working on projects
  in the apartment, with Mara favoring the dining nook and Leo gravitating toward
  the living room. Sofia's classwork overlaps with theirs, but her fixed evening
  bakery shifts mean she often leaves as the other two are settling into shared
  meals or media. They coordinate around the single bathroom, communal cookware,
  and the laundry basket, then reconnect over leftover food or short conversations
  in the kitchen. The apartment tends to alternate between carefully reset surfaces
  and clusters of study gear, dishes, and bags near the door.
quirks: >-
  Despite being student roommates, they use a handwritten shared grocery notebook
  rather than a group app. Sofia's bakery leftovers make the apartment unusually
  well supplied with bread and pastries, while Mara insists they are plated rather
  than eaten from bags.
