household_id: hh_018
household_type: working_couple_no_children
residents:
  - id: resident_1
    name: Mara Iqbal
    age: 27
    occupation: Payroll coordinator
    personality: methodical, quietly sentimental, and prone to making small piles
      before putting things away
    habits:
      - Sets her phone and wallet together on the entry shelf after returning home.
      - Carries her laptop in her backpack between home and the office, then often
        leaves the backpack beside the dining chair.
      - Makes tea in the same mug and rinses it promptly, but leaves it on the drying
        towel overnight.
      - Keeps a running household list in her notebook on the kitchen counter.
      - Places her keys in a ceramic-style catchall area by the door, while Theo
        sometimes moves them when clearing the surface.
      - Folds clean towels soon after laundry but leaves the laundry basket in the
        bedroom until the next load.
      - Uses her yoga mat in the living room and rolls it up against the media console
        afterward.
  - id: resident_2
    name: Theo Mercer
    age: 27
    occupation: Bicycle repair technician
    personality: hands-on, sociable, and casually untidy with items he expects to
      use again
    habits:
      - Empties his pockets onto the entry shelf, sometimes leaving his keys mixed
        with loose work items.
      - Takes his water bottle and lunchbox to the repair shop each workday and
        leaves both by the sink when he gets home.
      - Hangs his work jacket over the back of a dining chair until Mara asks him
        to use the coat hooks.
      - Uses headphones for repair videos and games, leaving them beside the sofa
        or on the coffee table.
      - Keeps a paperback in his backpack and reads a few pages during breaks or
        before sleep.
      - Loads the dishwasher-equivalent washing area after dinner but tends to leave
        pots soaking in the sink.
      - Uses the vacuum cleaner for quick spot cleaning, then parks it in the hall
        closet without winding the cord neatly.
relationships: >-
  Mara and Theo have been partners since university and rent the apartment together.
  Mara manages bills, lists, and most laundry folding, while Theo handles routine
  cooking cleanup, vacuuming, and practical fixes. Their recurring friction is Theo's
  chair-back jacket and entryway pocket dump, though they coordinate departures
  by keeping shared essentials near the front door.
home_layout_notes: >-
  They share one bedroom, where Mara keeps the laundry basket and bedside book while
  Theo's backpack usually rests near his side of the bed. The open kitchen-dining
  area is Mara's planning and tea space, while the living room is Theo's gaming
  and video-viewing area and Mara's yoga space. The entry shelf, kitchen counter,
  sofa table, and dining chairs collect the most frequently moved shared objects.
