daily_life_summary: >-
  Both leave for fixed daytime work, so the entry area becomes busy with bags, keys,
  lunch items, and jackets before they head out. Mara's office materials travel
  back and forth more regularly, while Theo returns with his water bottle, lunchbox,
  and work jacket needing attention. They overlap most around dinner, cleanup, and
  relaxing in the living room, where small object piles build up before either of
  them resets the space. On days off, they tackle laundry, cooking, and apartment
  maintenance together, usually with Mara directing the list and Theo doing the
  hands-on tasks.
quirks: >-
  Despite being a young working couple, they own no television; the laptop and tablet
  handle shared viewing. Theo is the more reliable vacuum user, while Mara is the
  one who notices clutter first.
