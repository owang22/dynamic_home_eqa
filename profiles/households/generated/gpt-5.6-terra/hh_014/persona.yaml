  - id: book_mara
    class: book
    owner: resident_1
    role: Current library novel; usually rests on the sofa arm or bedside table,
      and occasionally travels in backpack_mara for reading away from home.
  - id: jacket_mara
    class: jacket
    owner: resident_1
    role: Everyday outer layer; hangs on the entry hook and travels worn by Mara
