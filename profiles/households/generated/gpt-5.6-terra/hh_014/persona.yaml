  - id: bowl_shared_1
    class: bowl
    owner: shared
    role: Everyday bowl for breakfast, soup, and leftovers; moves between kitchen
      cupboard, dining table, desk, and sink and does not leave home.
  - id: mug_shared_1
    class: mug
    owner: shared
    role: Spare mug for guests or a second drink; usually sits in the kitchen cupboard
      or drying area and does not leave home.
  - id: pot_shared_1
    class: pot
    owner: shared
    role: Medium pot for pasta, soups, and batch cooking; stored in a lower kitchen
      cabinet and moves between stove, counter, and sink.
  - id: pan_shared_1
    class: pan
    owner: shared
    role: Skillet for quick meals; normally hangs near the stove or sits on the
