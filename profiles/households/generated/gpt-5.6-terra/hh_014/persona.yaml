daily_life_summary: >-
  Mara works a fixed daytime remote schedule from her office, occasionally relocating
  to the dining table when she needs a reset. Her breaks tend to overlap with simple
  cooking, refilling tea or water, quick laundry tasks, and short stretches on the
  living-room mat. After work, the office is often left mostly intact while she
  shifts toward reading, games, or a show in the living room. Trips outside are
  purposeful—errands, exercise, or visiting friends—and require her backpack, keys,
  phone, wallet, and often a jacket or umbrella.
quirks: >-
  Although she works in tech, Mara prefers paper notes for planning and keeps only
  one work laptop rather than a collection of devices. She owns a suitcase that
  is usually ready for short rail trips to see friends, not for frequent business
  travel.
