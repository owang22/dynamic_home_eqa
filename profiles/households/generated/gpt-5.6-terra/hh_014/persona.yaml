household_id: hh_014
household_type: single_adult_wfh
residents:
  - id: resident_1
    name: Mara Ilyan
    age: 30
    occupation: Accessibility-focused front-end software engineer
    personality: methodical, quietly sentimental, and prone to leaving active projects
      visible
    habits:
      - Carries her laptop between the desk and dining table when she wants a change
        of scene, then plugs it into whichever charger is closest.
      - Keeps a water bottle beside her current work surface and refills it before
        settling into a long task.
      - Uses one favorite mug for tea and often leaves it on the desk until she
        takes a kitchen break.
      - Writes debugging notes and grocery reminders in the same notebook, usually
        leaving it open beside the laptop.
      - Puts her phone face-down near the keyboard during focused work, but takes
        it in her jacket pocket or backpack when she leaves home.
      - Hangs keys on a hook by the entry after returning, though her wallet sometimes
        remains in the backpack.
      - Rolls out the yoga mat in the living room and usually leaves it there until
        the next day.
      - Waters her plants in batches and leaves the watering can by the kitchen
        sink to refill.
relationships: >-
  Mara lives alone and treats the apartment as both a private home and a working
  studio. She has no roommate to redistribute chores with, so dishes and laundry
  are handled in small bursts between work tasks; the main friction is that her
  visible work materials gradually spread from the desk onto the dining table. Her
  belongings are personal, while cookware, cleaning equipment, and living-room items
  function as her shared-with-guests household items.
home_layout_notes: >-
  The bedroom contains Mara's bed, laundry basket, hairbrush, and a small reading
  stack, while the second room is set up as a dedicated office with a desk for her
  laptop, notebook, headphones, and chargers. The kitchen-dining area is her alternate
  work surface and holds most mugs, plates, bowls, pots, and pans. The living room
  is shared space for visitors but is usually occupied by a blanket, remote, book,
  yoga mat, and gaming controller.
object_inventory:
  - id: laptop_mara
    class: laptop
    owner: resident_1
    role: Primary work computer; used at the office desk and sometimes the dining
      table, and travels inside backpack_mara for trips or coworking visits.
  - id: phone_mara
    class: phone
    owner: resident_1
    role: Personal communication, authentication, and transit device; usually rests
      face-down beside laptop_mara or on the entry shelf, and travels in Mara's
      jacket pocket, hand, or backpack_mara.
  - id: keys_mara
    class: keys
    owner: resident_1
    role: Apartment, building, and bicycle keys; normally hang by the entry door,
      and travel in Mara's jacket pocket or backpack_mara.
  - id: wallet_mara
    class: wallet
    owner: resident_1
    role: Cards, identification, and cash; tends to stay in backpack_mara or on
      the entry shelf, and travels inside backpack_mara or a jacket pocket.
  - id: backpack_mara
    class: backpack
    owner: resident_1
    role: Carries laptop_mara, wallet_mara, charger_mara, water_bottle_mara, and
      occasional lunchbox_mara; usually leans beside the office desk or entry bench
      and travels on Mara's back.
  - id: charger_mara
    class: charger
    owner: resident_1
    role: Laptop and phone charging cable; usually remains plugged in at the office
      desk or is coiled into backpack_mara, traveling inside the backpack when needed.
  - id: headphones_mara
    class: headphones
    owner: resident_1
    role: Used for video calls, focused coding, and music; usually hang from the
      desk monitor stand and travel in backpack_mara for work away from home.
  - id: notebook_mara
    class: notebook
    owner: resident_1
    role: Paper work notes, sketches, and household lists; stays open beside laptop_mara
      or on the dining table, and travels flat inside backpack_mara.
  - id: pen_mara
    class: pen
    owner: resident_1
    role: Used with notebook_mara for notes and lists; often lies across the notebook
      or in a desk drawer, and travels clipped to or inside backpack_mara.
  - id: mug_mara
    class: mug
    owner: resident_1
    role: Favorite tea mug; moves between the kitchen counter, office desk, and
      dining table but does not leave the apartment.
  - id: water_bottle_mara
    class: water_bottle
    owner: resident_1
    role: Refillable bottle for desk work, yoga, and errands; usually sits beside
      laptop_mara or by the sink, and travels in backpack_mara or Mara's hand.
  - id: glasses_mara
    class: glasses
    owner: resident_1
    role: Blue-light and distance glasses used for screen work and going out; rest
      beside laptop_mara or on the bedside table, and travel in a jacket pocket
