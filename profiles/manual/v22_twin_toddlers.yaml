# v22_twin_toddlers -- VERSION22 confirmatory household (pair F with
# v22_elder_care: both home-centered care routines that RELOCATE the same shared
#   classes -- remote/cushion/tablet -- but for opposite reasons).
# Persona: parent home with 2-year-old twins; nap-time enforced 13:00-15:00,
#   floor-cushion play fort every morning, playground trip after nap.
# IDIOSYNCRATIC-BUT-REALISTIC: the TV REMOTE is kept in the kitchen CUPBOARD out
#   of toddler reach (only comes down after bedtime); sofa CUSHIONS spend the
#   morning on the playmat as a fort; the TABLET is a nap-time white-noise
#   machine on the nursery dresser.
# DIAGNOSTIC: sippy_cup, diaper_caddy, board_book, stroller_clip.
# DEPENDENT targets: remote (cupboard_k1 at 10:00, coffee table 21:00),
#   cushion (playmat_n1 at 10:00), tablet (nursery dresser at 14:00).
# STATIC DISTRACTORS: dining_chair, bed_pillow, wall_clock, floor_lamp, doormat,
#   waste_bin, picture_frame, bath_mat.
household: v22_twin_toddlers
status: DRAFT  # version22 authoring 2026-07-22 — needs human anchor verification
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,          room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1,   room: bedroom,  aliases: []}
  - {id: crib_n1,         room: nursery,  aliases: []}
  - {id: dresser_n1,      room: nursery,  aliases: [nursery_dresser]}
  - {id: playmat_n1,      room: nursery,  aliases: [play_mat]}
  - {id: sofa_l1,         room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living,   aliases: []}
  - {id: toy_bin_l1,      room: living,   aliases: [toy_basket]}
  - {id: counter_k1,      room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,     room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,         room: kitchen,  aliases: []}
  - {id: table_d1,        room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1,   room: entryway, aliases: [key_hook]}
  - {id: stroller_spot_e1, room: entryway, aliases: [stroller_corner]}
  - {id: bathroom_c1,     room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: parent of 2-year-old twins; naps 13-15, morning play fort, remote kept out of reach
    schedule:
      - {activity: sleep,           days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "21:45", end: "06:00"}
      - {activity: twins_breakfast, days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "06:30", end: "07:15"}
      - {activity: fort_building,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "09:00", end: "11:30"}
      - {activity: twins_lunch,     days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "11:45", end: "12:30"}
      - {activity: nap_time,        days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "13:00", end: "15:00"}
      - {activity: playground_trip, days: [Mo,We,Fr,Sa],          start: "15:30", end: "17:00"}
      - {activity: twins_dinner,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "17:45", end: "18:30"}
      - {activity: twins_bedtime,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:00", end: "19:45"}
      - {activity: parent_tv,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "20:15", end: "21:30"}
activities:
  twins_breakfast:
    jitter_min: 10
    objects: [sippy_cup, bowl, plate]
    during: {sippy_cup: table_d1, bowl: table_d1, plate: table_d1}
    after:
      sippy_cup: {dest: sink_k1, p: 0.8, else: table_d1}
      bowl:      {dest: sink_k1, p: 0.85, else: table_d1}
      plate:     {dest: sink_k1, p: 0.8, else: table_d1}
  fort_building:
    jitter_min: 20
    objects: [cushion, board_book, sippy_cup, phone]
    during: {cushion: playmat_n1, board_book: playmat_n1, sippy_cup: playmat_n1,
             phone: counter_k1}
    after:
      cushion:    {dest: playmat_n1, p: 0.6, else: sofa_l1}   # fort often survives to lunch
      board_book: {dest: toy_bin_l1, p: 0.7, else: playmat_n1}
      sippy_cup:  {dest: sink_k1, p: 0.7, else: playmat_n1}
      phone:      {dest: counter_k1, p: 0.8, else: sofa_l1}
  twins_lunch:
    jitter_min: 10
    objects: [sippy_cup, plate, fork]
    during: {sippy_cup: table_d1, plate: table_d1, fork: table_d1}
    after:
      sippy_cup: {dest: sink_k1, p: 0.8, else: table_d1}
      plate:     {dest: sink_k1, p: 0.85, else: table_d1}
      fork:      {dest: sink_k1, p: 0.85, else: table_d1}
  nap_time:
    jitter_min: 15
    objects: [tablet, cushion, diaper_caddy]
    during: {tablet: dresser_n1, cushion: sofa_l1, diaper_caddy: dresser_n1}
    after:
      tablet:       {dest: dresser_n1, p: 0.8, else: counter_k1}  # white-noise stays in nursery
      cushion:      {dest: sofa_l1, p: 0.85, else: playmat_n1}
      diaper_caddy: {dest: dresser_n1, p: 0.9}
  playground_trip:
    jitter_min: 20
    objects: [stroller_clip, diaper_caddy, keys, phone, sippy_cup]
    during: {stroller_clip: stroller_spot_e1, diaper_caddy: stroller_spot_e1,
             keys: entry_hook_e1, phone: counter_k1, sippy_cup: stroller_spot_e1}
    after:
      stroller_clip: {dest: null, p: 0.9, else: stroller_spot_e1}
      diaper_caddy:  {dest: null, p: 0.85, else: stroller_spot_e1}
      keys:          {dest: null, p: 0.95}
      phone:         {dest: null, p: 0.95}
      sippy_cup:     {dest: null, p: 0.85, else: stroller_spot_e1}
  twins_dinner:
    jitter_min: 10
    objects: [sippy_cup, plate, fork, keys, phone, diaper_caddy, stroller_clip]
    during: {sippy_cup: table_d1, plate: table_d1, fork: table_d1,
             keys: entry_hook_e1, phone: counter_k1, diaper_caddy: dresser_n1,
             stroller_clip: stroller_spot_e1}
    after:
      sippy_cup:     {dest: sink_k1, p: 0.8, else: table_d1}
      plate:         {dest: sink_k1, p: 0.85, else: table_d1}
      fork:          {dest: sink_k1, p: 0.85, else: table_d1}
      keys:          {dest: entry_hook_e1, p: 0.9}
      phone:         {dest: counter_k1, p: 0.7, else: sofa_l1}
      diaper_caddy:  {dest: dresser_n1, p: 0.9}
      stroller_clip: {dest: stroller_spot_e1, p: 0.9}
  twins_bedtime:
    jitter_min: 15
    objects: [board_book, sippy_cup, tablet]
    during: {board_book: crib_n1, sippy_cup: crib_n1, tablet: dresser_n1}
    after:
      board_book: {dest: toy_bin_l1, p: 0.6, else: crib_n1}
      sippy_cup:  {dest: sink_k1, p: 0.7, else: crib_n1}
      tablet:     {dest: dresser_n1, p: 0.9}
  parent_tv:
    jitter_min: 15
    objects: [remote, phone, cushion]
    during: {remote: sofa_l1, phone: sofa_l1, cushion: sofa_l1}
    after:
      remote:  {dest: cupboard_k1, p: 0.85, else: coffee_table_l1}  # back OUT OF REACH
      phone:   {dest: nightstand_r1, p: 0.85, else: sofa_l1}
      cushion: {dest: sofa_l1, p: 0.9}
placements:
  # DIAGNOSTIC
  sippy_cup:     {home: cupboard_k1, volatility_class_hint: high}
  diaper_caddy:  {home: dresser_n1, volatility_class_hint: high}
