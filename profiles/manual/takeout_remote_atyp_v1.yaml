# takeout_remote_atyp_v1 -- ATYPICAL base (atypicality by DELETION of dynamics)
#
# METHODOLOGY DEPARTURE (see studio_convert_atyp_v1 header for the full note):
# hand-authored atypical (model DRAFT by Claude, outside the evaluated set),
# NOT a transforms.py output, status DRAFT until human-verified. The timing-
# only registered transforms cannot express this profile because the
# manipulation is the ABSENCE of whole object cycles, not their retiming.
#
# Story: Dev, a fully-remote software engineer who is car-free and orders
# takeout every night. The atypicality is structural absence -- the household
# is defined by the dynamics that DON'T happen:
#   * NO COMMUTE: the laptop never leaves desk_o1; there is no leave_work /
#     return_home cycle at all; keys barely move (car-free) -- keys cycle only
#     on the one weekly grocery walk, otherwise a near-zero misplace rate.
#   * NO COOKING: pan / cutting_board / knife / toaster / kettle exist but are
#     STATIC -- declared, never bound to any activity, so they never move. The
#     nightly dish cycle is reduced to a takeout container and a single fork.
# This is the cleanest test of the phantom-movement harm you are trying to
# measure: a model that has learned "kitchens are busy" and "workers commute"
# will predict a cook cycle and a keys/backpack commute that here NEVER occur.
# The correct prediction is mostly STILLNESS around a tight desk-centric core
# (mug/phone/water-bottle micro-trips), which class priors alone won't give.
#
# Provenance key: [ATUS] [BEHAV] [HOMER] [HKEEP] [DESIGN]. The deliberate
# deletions/atypical homes are [DESIGN].

household: takeout_remote_atyp_v1
status: VERIFIED  # verified by researcher (Oliver, 2026-07-21)
derived_from: null
transformation: null

receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: desk_o1,       room: office,   aliases: [desk]}
  - {id: bookshelf_o1,  room: office,   aliases: []}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: stove_k1,      room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}

residents:
  - id: R1
    description: fully-remote software engineer, car-free, orders takeout nightly
    schedule:
      - {activity: sleep,         days: [Mo,Tu,We,Th,Fr], start: "01:00", end: "08:30"}  # [ATUS]
      - {activity: morning_prep,  days: [Mo,Tu,We,Th,Fr], start: "08:30", end: "09:00"}  # [ATUS]
      - {activity: desk_work_am,  days: [Mo,Tu,We,Th,Fr], start: "09:00", end: "12:30"}  # [DESIGN] never leaves home
      - {activity: lunch_reheat,  days: [Mo,Tu,We,Th,Fr], start: "12:30", end: "13:00"}  # [DESIGN] leftovers, no cooking
      - {activity: desk_work_pm,  days: [Mo,Tu,We,Th,Fr], start: "13:30", end: "17:30"}  # [DESIGN]
      - {activity: takeout_dinner,days: [Mo,Tu,We,Th,Fr], start: "19:00", end: "19:30"}  # [DESIGN] delivery, eats on couch
      - {activity: tv_evening,    days: [Mo,Tu,We,Th,Fr], start: "20:30", end: "23:30"}  # [ATUS]
      - {activity: sleep,         days: [Sa,Su],          start: "02:00", end: "09:30"}  # [ATUS] weekend
      - {activity: grocery_walk,  days: [Sa],             start: "11:00", end: "12:00"}  # [DESIGN] the ONE keys trip
      - {activity: return_grocery,days: [Sa],             start: "12:00", end: "12:15"}  # [DESIGN]
      - {activity: laptop_couch,  days: [Sa,Su],          start: "13:00", end: "15:30"}  # [DESIGN] rare desk-exit
      - {activity: takeout_dinner,days: [Sa,Su],          start: "19:00", end: "19:30"}  # [DESIGN]
      - {activity: tv_evening,    days: [Sa,Su],          start: "20:30", end: "23:30"}  # [ATUS]

activities:
  morning_prep:
    jitter_min: 12                                   # [HOMER]
    objects: [phone, water_bottle]
    during: {phone: nightstand_r1, water_bottle: nightstand_r1}
    after:
      phone:        {dest: desk_o1, p: 0.85, else: counter_k1}   # [DESIGN] phone goes to the desk, not the kitchen
      water_bottle: {dest: desk_o1, p: 0.8,  else: counter_k1}
  desk_work_am:
    jitter_min: 20                                   # [DESIGN]
    objects: [laptop, mug, phone, headphones, water_bottle]
    during: {laptop: desk_o1, mug: desk_o1, phone: desk_o1, headphones: desk_o1, water_bottle: desk_o1}
    after:
      laptop:       {dest: desk_o1, p: 1.0}                      # [DESIGN] laptop NEVER leaves the desk
      mug:          {dest: sink_k1, p: 0.6, else: desk_o1}
      phone:        {dest: desk_o1, p: 0.7, else: sofa_l1}
      headphones:   {dest: desk_o1, p: 0.9, else: bookshelf_o1}
      water_bottle: {dest: desk_o1, p: 0.7, else: counter_k1}
  lunch_reheat:
    jitter_min: 15
    objects: [plate, fork]
    during: {plate: counter_k1, fork: counter_k1}    # [DESIGN] reheat at the counter, no stove/pan
    after:
      plate: {dest: sink_k1, p: 0.9, else: counter_k1}
      fork:  {dest: sink_k1, p: 0.9, else: counter_k1}
  desk_work_pm:
    jitter_min: 20
    objects: [laptop, mug, phone, water_bottle]
    during: {laptop: desk_o1, mug: desk_o1, phone: desk_o1, water_bottle: desk_o1}
    after:
      laptop:       {dest: desk_o1, p: 1.0}                      # [DESIGN] still never leaves
      mug:          {dest: sink_k1, p: 0.6, else: desk_o1}
      phone:        {dest: sofa_l1, p: 0.5, else: desk_o1}
      water_bottle: {dest: sink_k1, p: 0.4, else: desk_o1}
  takeout_dinner:
    jitter_min: 20                                   # [DESIGN]
    objects: [takeout_container, fork]
    during: {takeout_container: coffee_table_l1, fork: coffee_table_l1}   # eats on the couch, TV on
    after:
      takeout_container: {dest: null, p: 0.7, else: fridge_k1}  # [DESIGN] trash (leaves set) or leftovers to fridge
      fork:              {dest: sink_k1, p: 0.8, else: coffee_table_l1}
  tv_evening:
    jitter_min: 20
    objects: [remote_control, phone]
    during: {remote_control: sofa_l1, phone: sofa_l1}
    after:
      remote_control: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:          {dest: nightstand_r1, p: 0.9, else: sofa_l1}
  grocery_walk:
    jitter_min: 20                                   # [DESIGN] the only time keys leave the bowl all week
    objects: [keys, tote, phone]
    after:
      keys:  {dest: null, p: 1.0}
      tote:  {dest: null, p: 1.0}
      phone: {dest: null, p: 1.0}
  return_grocery:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, tote, phone]
    after:
      keys:  {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      tote:  {dest: counter_k1, p: 0.6, else: entry_hook_e1}
      phone: {dest: desk_o1, p: 0.4, else: sofa_l1}
  laptop_couch:
    jitter_min: 30
    objects: [laptop, mug]
    during: {laptop: sofa_l1, mug: coffee_table_l1}  # [DESIGN] the rare weekend desk-exit
    after:
      laptop: {dest: desk_o1, p: 0.7, else: sofa_l1} # usually goes back to the desk
      mug:    {dest: sink_k1, p: 0.5, else: coffee_table_l1}

placements:
  phone:          {home: nightstand_r1, volatility_class_hint: high}
  water_bottle:   {home: desk_o1, volatility_class_hint: high}          # [DESIGN] desk-centric
  laptop:         {home: desk_o1}                                       # [DESIGN] effectively static-at-desk
  headphones:     {home: desk_o1}
  mug:            {home: cupboard_k1}
  plate:          {home: cupboard_k1}
  fork:           {home: cupboard_k1}
  takeout_container: {home: fridge_k1}                                  # [DESIGN] leftovers live in the fridge
  # keys almost never move -- car-free; tiny misplace, no activity cycle except the grocery walk
  keys:           {home: entry_hook_e1, p_misplace: 0.03, misplace_set: [counter_k1, desk_o1]}   # [DESIGN]
  tote:           {home: entry_hook_e1, p_misplace: 0.05, misplace_set: [sofa_l1, counter_k1]}
  remote_control: {home: tv_stand_l1}
  # STATIC tercile -- the DELETED cook cycle: present in the home, never bound
  # to any activity, so the generator never moves them. A model that predicts
  # a dinner cook cycle is producing phantom movement against this ground truth.
  pan:            {home: cupboard_k1,  volatility_class_hint: static}   # [DESIGN] never used
  cutting_board:  {home: counter_k1,   volatility_class_hint: static}   # [DESIGN] never used
  knife:          {home: cupboard_k1,  volatility_class_hint: static}   # [DESIGN] never used
  toaster:        {home: counter_k1,   volatility_class_hint: static}
  kettle:         {home: counter_k1,   volatility_class_hint: static}
  microwave:      {home: counter_k1,   volatility_class_hint: static}
  router:         {home: bookshelf_o1, volatility_class_hint: static}
  first_aid_kit:  {home: bathroom_c1,  volatility_class_hint: static}

# Dish-cycle rule (generator-level, all profiles): objects on sink_k1 at 21:30
# return home at 21:45 with p=0.9. Here it only ever touches the reheat plate/
# fork and the coffee mug -- the cookware never reaches the sink. [DESIGN]
