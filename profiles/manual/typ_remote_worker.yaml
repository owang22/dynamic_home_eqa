# typ_remote_worker -- TYPICAL household (P1 contrast class for answer-or-resense).
# Conventional persona, conventional placements: mug in the cupboard, towel in
# the bathroom, keys on the hook, laptop on the desk, phone on the nightstand.
# A naive prior should be RIGHT here (reverse of the v22 atypical design).
household: typ_remote_worker
status: DRAFT  # typical-bank authoring 2026-07-26 — needs human verification
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,          room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1,   room: bedroom,  aliases: []}
  - {id: sofa_l1,         room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living,   aliases: []}
  - {id: desk_o1,         room: office,   aliases: [work_desk]}
  - {id: counter_k1,      room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,     room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,         room: kitchen,  aliases: []}
  - {id: table_d1,        room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1,   room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,     room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: remote worker at a home desk, ordinary hours
    schedule:
      - {activity: sleep,      days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "23:15", end: "07:00"}
      - {activity: breakfast,  days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:15", end: "07:50"}
      - {activity: desk_work,  days: [Mo,Tu,We,Th,Fr],       start: "09:00", end: "12:15"}
      - {activity: desk_work,  days: [Mo,Tu,We,Th,Fr],       start: "13:15", end: "17:00"}
      - {activity: dinner,     days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "18:30", end: "19:10"}
      - {activity: tv_evening, days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:45", end: "22:45"}
activities:
  breakfast:
    jitter_min: 10
    objects: [bowl, coffee_mug]
    during: {bowl: table_d1, coffee_mug: table_d1}
    after:
      bowl:       {dest: sink_k1, p: 0.85, else: table_d1}
      coffee_mug: {dest: sink_k1, p: 0.7, else: table_d1}
  dinner:
    jitter_min: 15
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone, blanket]
    during: {remote: sofa_l1, phone: sofa_l1, blanket: sofa_l1}
    after:
      remote:  {dest: coffee_table_l1, p: 0.7, else: sofa_l1}
      phone:   {dest: nightstand_r1, p: 0.85, else: sofa_l1}
      blanket: {dest: sofa_l1, p: 0.9}
  desk_work:
    jitter_min: 15
    objects: [laptop, phone, coffee_mug, notebook]
    during: {laptop: desk_o1, phone: desk_o1, coffee_mug: desk_o1, notebook: desk_o1}
    after:
      laptop:     {dest: desk_o1, p: 0.9}
      phone:      {dest: desk_o1, p: 0.6, else: sofa_l1}
      coffee_mug: {dest: sink_k1, p: 0.7, else: desk_o1}
      notebook:   {dest: desk_o1, p: 0.9}
placements:
  coffee_mug: {home: cupboard_k1, volatility_class_hint: high}
  towel:      {home: bathroom_c1}
  keys:       {home: entry_hook_e1, p_misplace: 0.06, misplace_set: [counter_k1, coffee_table_l1], volatility_class_hint: high}
  phone:      {home: nightstand_r1, volatility_class_hint: high}
  laptop:     {home: desk_o1, volatility_class_hint: high}
  remote:     {home: coffee_table_l1}
  blanket:    {home: sofa_l1}
  water_bottle: {home: cupboard_k1}
  notebook:   {home: desk_o1}
  scissors:   {home: cupboard_k1}
  tablet:     {home: coffee_table_l1}
  cushion:    {home: sofa_l1}
  bowl:  {home: cupboard_k1}
  plate: {home: cupboard_k1}
  fork:  {home: cupboard_k1}
  dining_chair:  {home: table_d1,        volatility_class_hint: static}
  bed_pillow:    {home: bed_r1,          volatility_class_hint: static}
  wall_clock:    {home: counter_k1,      volatility_class_hint: static}
  floor_lamp:    {home: sofa_l1,         volatility_class_hint: static}
  doormat:       {home: entry_hook_e1,   volatility_class_hint: static}
  waste_bin:     {home: counter_k1,      volatility_class_hint: static}
  picture_frame: {home: coffee_table_l1, volatility_class_hint: static}
  bath_mat:      {home: bathroom_c1,     volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9.
