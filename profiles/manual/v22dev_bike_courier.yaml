# v22dev_bike_courier -- VERSION22 DEV household (alpha-sweep bank).
# Persona: bicycle courier, on the road 10:00-18:00 Mo-Fr; evening bike
#   maintenance in the hallway; Sa group ride.
# IDIOSYNCRATIC-BUT-REALISTIC: KEYS clip to the pannier carabiner in the hallway
#   (not a key hook); the WATER_BOTTLE lives in the bike's bottle cage by the
#   door; the phone charges on the hallway shelf next to the helmet overnight.
# DIAGNOSTIC: helmet, bike_pump, pannier, hex_wrench_set.
# DEPENDENT targets: keys (pannier clip; away 12:00), water_bottle (bike cage
#   by the door), phone (hallway shelf 21:00).
household: v22dev_bike_courier
status: DRAFT  # version22 authoring 2026-07-22 — needs human anchor verification
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,          room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1,   room: bedroom,  aliases: []}
  - {id: sofa_l1,         room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living,   aliases: []}
  - {id: bike_rack_h1,    room: hallway,  aliases: [bike_stand]}
  - {id: hall_shelf_h1,   room: hallway,  aliases: [helmet_shelf]}
  - {id: counter_k1,      room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,     room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,         room: kitchen,  aliases: []}
  - {id: table_d1,        room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1,   room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,     room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: bicycle courier; Mo-Fr road shifts, evening wrenching, Sa group ride
    schedule:
      - {activity: sleep,           days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "23:00", end: "07:30"}
      - {activity: breakfast,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:45", end: "08:20"}
      - {activity: ride_prep,       days: [Mo,Tu,We,Th,Fr],       start: "09:30", end: "09:55"}
      - {activity: leave_shift,     days: [Mo,Tu,We,Th,Fr],       start: "09:55", end: "10:05"}
      - {activity: away_shift,      days: [Mo,Tu,We,Th,Fr],       start: "10:05", end: "18:00"}
      - {activity: return_shift,    days: [Mo,Tu,We,Th,Fr],       start: "18:00", end: "18:25"}
      - {activity: ride_prep,       days: [Sa],                   start: "08:40", end: "09:00"}
      - {activity: leave_groupride, days: [Sa],                   start: "09:00", end: "09:10"}
      - {activity: away_groupride,  days: [Sa],                   start: "09:10", end: "13:00"}
      - {activity: return_groupride, days: [Sa],                  start: "13:00", end: "13:20"}
      - {activity: bike_maintenance, days: [Tu,Th],               start: "19:45", end: "20:45"}
      - {activity: bike_maintenance, days: [Su],                  start: "16:00", end: "17:00"}
      - {activity: dinner,          days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "18:45", end: "19:25"}
      - {activity: tv_evening,      days: [Mo,We,Fr,Sa,Su],       start: "20:00", end: "22:30"}
activities:
  breakfast:
    jitter_min: 10
    objects: [bowl, coffee_mug]
    during: {bowl: table_d1, coffee_mug: table_d1}
    after:
      bowl:       {dest: sink_k1, p: 0.85, else: table_d1}
      coffee_mug: {dest: sink_k1, p: 0.7, else: table_d1}
  ride_prep:
    jitter_min: 10
    objects: [helmet, pannier, water_bottle, keys, phone]
    during: {helmet: hall_shelf_h1, pannier: bike_rack_h1, water_bottle: bike_rack_h1,
             keys: bike_rack_h1, phone: hall_shelf_h1}
    after:
      helmet:       {dest: hall_shelf_h1, p: 0.9}
      pannier:      {dest: bike_rack_h1, p: 0.95}
      water_bottle: {dest: bike_rack_h1, p: 0.9}      # in the bottle cage
      keys:         {dest: bike_rack_h1, p: 0.9}      # clipped to the pannier
      phone:        {dest: hall_shelf_h1, p: 0.85}
  leave_shift:
    jitter_min: 5
    objects: [helmet, pannier, water_bottle, keys, phone]
    after:
      helmet:       {dest: null, p: 1.0}
      pannier:      {dest: null, p: 1.0}
      water_bottle: {dest: null, p: 1.0}
      keys:         {dest: null, p: 1.0}
      phone:        {dest: null, p: 1.0}
  return_shift:
    jitter_min: 25
    objects: [helmet, pannier, water_bottle, keys, phone]
    after:
      helmet:       {dest: hall_shelf_h1, p: 0.9, else: sofa_l1}
      pannier:      {dest: bike_rack_h1, p: 0.9, else: hall_shelf_h1}
      water_bottle: {dest: sink_k1, p: 0.6, else: bike_rack_h1}
      keys:         {dest: bike_rack_h1, p: 0.8, else: counter_k1}
      phone:        {dest: sofa_l1, p: 0.6, else: hall_shelf_h1}
  leave_groupride:
    jitter_min: 5
    objects: [helmet, water_bottle, keys, phone]
    after:
      helmet:       {dest: null, p: 1.0}
      water_bottle: {dest: null, p: 1.0}
      keys:         {dest: null, p: 1.0}
      phone:        {dest: null, p: 1.0}
  return_groupride:
    jitter_min: 20
    objects: [helmet, water_bottle, keys, phone]
    after:
      helmet:       {dest: hall_shelf_h1, p: 0.9, else: sofa_l1}
      water_bottle: {dest: sink_k1, p: 0.6, else: bike_rack_h1}
      keys:         {dest: bike_rack_h1, p: 0.8, else: counter_k1}
      phone:        {dest: sofa_l1, p: 0.6, else: hall_shelf_h1}
  bike_maintenance:
    jitter_min: 15
    objects: [bike_pump, hex_wrench_set, water_bottle]
    during: {bike_pump: bike_rack_h1, hex_wrench_set: bike_rack_h1,
             water_bottle: bike_rack_h1}
    after:
      bike_pump:      {dest: hall_shelf_h1, p: 0.8, else: bike_rack_h1}
      hex_wrench_set: {dest: hall_shelf_h1, p: 0.8, else: bike_rack_h1}
      water_bottle:   {dest: bike_rack_h1, p: 0.9}
  dinner:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
      phone:  {dest: hall_shelf_h1, p: 0.8, else: sofa_l1}   # charges by the helmet
