# regime_pet_heavy_v1 -- CONFIRMATORY pair (unseen during design)
# Persona: a household with several dogs; objects migrate to the pet bed.
# Confusable with regime_toddler_home_v1 (both: small soft objects in a low
# living-room activity area). DIAGNOSTIC (SEMANTICS-necessary): dog_leash,
# food_bowl, litter_scoop, chew_toy -- you must know these mean "pets" to place
# the shared objects on the pet bed; anonymized, indistinguishable from a
# toddler household. PRE-REGISTER named >> anon.
# DEPENDENT (shared): cushion, blanket, ball -> on the PET BED. Query targets.
household: regime_pet_heavy_v1
status: VERIFIED  # confirmatory (Oliver, 2026-07-21)
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: pet_bed_l1,    room: living,   aliases: [dog_bed]}
  - {id: toy_basket_l1, room: living,   aliases: []}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: feed_station_k1, room: kitchen, aliases: [feeding_station]}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: remote worker with several dogs; walks and feeds them daily
    schedule:
      - {activity: sleep,        days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "23:00", end: "06:45"}  # [ATUS]
      - {activity: morning_walk, days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:00", end: "07:45"}  # [DESIGN] leash, out
      - {activity: feed_pets,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "08:00", end: "08:30"}  # [DESIGN] food bowls
      - {activity: breakfast,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "08:30", end: "09:00"}  # [ATUS]
      - {activity: home_day,     days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "09:30", end: "12:30"}  # [DESIGN] pets on pet bed
      - {activity: lunch,        days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "12:30", end: "13:15"}  # [ATUS]
      - {activity: play_pets,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "15:00", end: "16:30"}  # [DESIGN] chew toy, ball
      - {activity: evening_walk, days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "17:00", end: "17:45"}  # [DESIGN]
      - {activity: dinner,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "18:30", end: "19:15"}  # [ATUS]
      - {activity: tv_evening,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "20:00", end: "22:30"}  # [ATUS]
activities:
  morning_walk:
    jitter_min: 15                                   # [DESIGN]
    objects: [dog_leash, phone, keys]
    during: {dog_leash: entry_hook_e1, phone: entry_hook_e1, keys: entry_hook_e1}
    after:
      dog_leash: {dest: entry_hook_e1, p: 0.85, else: sofa_l1}
      phone:     {dest: counter_k1, p: 0.5, else: sofa_l1}
      keys:      {dest: entry_hook_e1, p: 0.8, else: counter_k1}
  feed_pets:
    jitter_min: 10                                   # [DESIGN]
    objects: [food_bowl, litter_scoop]
    during: {food_bowl: feed_station_k1, litter_scoop: feed_station_k1}
    after:
      food_bowl:    {dest: feed_station_k1, p: 0.85, else: sink_k1}
      litter_scoop: {dest: feed_station_k1, p: 0.9, else: bathroom_c1}
  breakfast:
    jitter_min: 10
    objects: [coffee_mug, bowl]
    during: {coffee_mug: counter_k1, bowl: table_d1}
    after:
      coffee_mug: {dest: sink_k1, p: 0.6, else: counter_k1}
      bowl:       {dest: sink_k1, p: 0.8, else: table_d1}
  home_day:
    jitter_min: 25                                   # [DESIGN] the dogs nest; soft objects end up on the pet bed
    objects: [cushion, blanket, chew_toy]
    during: {cushion: pet_bed_l1, blanket: pet_bed_l1, chew_toy: pet_bed_l1}
    after:
      cushion:  {dest: pet_bed_l1, p: 0.6, else: sofa_l1}   # [DESIGN]
      blanket:  {dest: pet_bed_l1, p: 0.6, else: sofa_l1}   # [DESIGN]
      chew_toy: {dest: pet_bed_l1, p: 0.5, else: toy_basket_l1}
  lunch:
    jitter_min: 15
    objects: [plate, fork, coffee_mug]
    during: {plate: table_d1, fork: table_d1, coffee_mug: counter_k1}
    after:
      plate:      {dest: sink_k1, p: 0.85, else: table_d1}
      fork:       {dest: sink_k1, p: 0.85, else: table_d1}
      coffee_mug: {dest: sink_k1, p: 0.6, else: counter_k1}
  play_pets:
    jitter_min: 20                                   # [DESIGN]
    objects: [ball, chew_toy, cushion]
    during: {ball: pet_bed_l1, chew_toy: pet_bed_l1, cushion: pet_bed_l1}
    after:
      ball:     {dest: pet_bed_l1, p: 0.6, else: toy_basket_l1}   # [DESIGN]
      chew_toy: {dest: pet_bed_l1, p: 0.5, else: toy_basket_l1}
      cushion:  {dest: pet_bed_l1, p: 0.6, else: sofa_l1}
  evening_walk:
    jitter_min: 15                                   # [DESIGN]
    objects: [dog_leash, phone]
    during: {dog_leash: entry_hook_e1, phone: entry_hook_e1}
    after:
      dog_leash: {dest: entry_hook_e1, p: 0.85, else: sofa_l1}
      phone:     {dest: sofa_l1, p: 0.5, else: counter_k1}
  dinner:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone, blanket]
    during: {remote: sofa_l1, phone: sofa_l1, blanket: sofa_l1}
    after:
      remote:  {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:   {dest: nightstand_r1, p: 0.85, else: sofa_l1}
      blanket: {dest: pet_bed_l1, p: 0.5, else: sofa_l1}      # [DESIGN] the dog reclaims it
placements:
  # DIAGNOSTIC (SEMANTICS-necessary; pet tells)
  dog_leash:    {home: entry_hook_e1, volatility_class_hint: high}   # [DESIGN]
  food_bowl:    {home: feed_station_k1, volatility_class_hint: high} # [DESIGN]
  litter_scoop: {home: feed_station_k1}                              # [DESIGN]
  chew_toy:     {home: toy_basket_l1, volatility_class_hint: high}   # [DESIGN]
  # DEPENDENT (shared; regime -> pet bed)
  cushion:  {home: sofa_l1, volatility_class_hint: high}             # [DESIGN]
  blanket:  {home: sofa_l1, volatility_class_hint: high}             # [DESIGN]
  ball:     {home: toy_basket_l1, volatility_class_hint: high}       # [DESIGN]
  # ordinary
  coffee_mug: {home: cupboard_k1}
  bowl:   {home: cupboard_k1}
  plate:  {home: cupboard_k1}
  fork:   {home: cupboard_k1}
  remote: {home: coffee_table_l1}
  phone:  {home: nightstand_r1, volatility_class_hint: high}
  keys:   {home: entry_hook_e1, p_misplace: 0.08, misplace_set: [counter_k1, sofa_l1]}
  # static
  toaster:       {home: counter_k1,  volatility_class_hint: static}
  router:        {home: tv_stand_l1, volatility_class_hint: static}
  first_aid_kit: {home: bathroom_c1, volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9. [DESIGN]
