# regime_night_nurse_v1 -- INFERABLE-REGIME atypical (H2 redesign)
#
# The CONFUSABLE PARTNER of regime_early_fitness_v1: both households show
# activity around 05:00-06:00, so a single "someone is up early" sighting is
# ambiguous. The DIAGNOSTIC objects disambiguate: scrubs/badge/stethoscope say
# "night-shift nurse" (asleep during the day, at the hospital overnight), where
# yoga_mat/dumbbells said "early-morning fitness". The regime flips the location
# of the SHARED dependent objects: at 11:00 the nurse is ASLEEP, so her phone is
# on the nightstand and her keys are in the bowl by the bed -- not in the kitchen
# a typical daytime prior assumes.
#
# Persona: an ICU nurse on three 12h night shifts (Mon/Tue/Wed nights).
#
# DIAGNOSTIC (persona-exclusive): scrubs, badge, stethoscope, thermos.
# DEPENDENT (shared, regime-set): water_bottle, phone, keys -- held-out targets.
#
# Provenance: [ATUS] [BEHAV] [HOMER] [HKEEP] [DESIGN]; night-shift structure and
# the diagnostic set are [DESIGN].

household: regime_night_nurse_v1
status: VERIFIED  # regime-inference redesign (Oliver, 2026-07-21)
derived_from: null
transformation: null

receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: closet_r1,     room: bedroom,  aliases: [wardrobe]}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: shoe_rack_e1,  room: entryway, aliases: []}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}

residents:
  - id: R1
    description: ICU nurse on three 12h night shifts (Mon/Tue/Wed nights)
    schedule:
      # non-shift nights she sleeps normally (Thu/Fri/Sat/Sun nights)
      - {activity: sleep,        days: [Th,Fr,Sa,Su], start: "23:30", end: "07:30"}  # [DESIGN]
      - {activity: morning_prep, days: [Fr,Sa,Su],    start: "07:30", end: "08:00"}  # [ATUS] (Thu am = returning from Wed-night shift)
      - {activity: breakfast,    days: [Fr,Sa,Su],    start: "08:00", end: "08:30"}  # [ATUS]
      - {activity: errand,       days: [Fr,Sa],       start: "11:00", end: "12:00"}  # [DESIGN]
      - {activity: dinner,       days: [Th,Fr,Sa,Su], start: "18:00", end: "18:45"}  # [ATUS]
      - {activity: tv_evening,   days: [Th,Fr,Sa,Su], start: "20:00", end: "22:30"}  # [ATUS]
      # shift-day evening ramp (Mon/Tue/Wed): dress, pack, leave for the night
      - {activity: work_prep,    days: [Mo,Tu,We],    start: "18:00", end: "18:30"}  # [DESIGN] scrubs/badge on
      - {activity: leave_work,   days: [Mo,Tu,We],    start: "18:30", end: "19:00"}  # [DESIGN]
      - {activity: away_shift,   days: [Mo,Tu,We],    start: "19:00", end: "07:30"}  # [DESIGN] 12h night, no-op
      # shift-morning return + day sleep (Tue/Wed/Thu after Mon/Tue/Wed nights)
      - {activity: return_home,  days: [Tu,We,Th],    start: "07:45", end: "08:15"}  # [DESIGN]
      - {activity: day_sleep,    days: [Tu,We,Th],    start: "08:30", end: "15:30"}  # [DESIGN] no-op (asleep at 11:00)
      - {activity: wake_meal,    days: [Tu,We,Th],    start: "16:00", end: "16:40"}  # [DESIGN] her "dinner" mid-afternoon

activities:
  morning_prep:
    jitter_min: 10                                   # [HOMER]
    objects: [phone, water_bottle]
    during: {phone: nightstand_r1, water_bottle: nightstand_r1}
    after:
      phone:        {dest: counter_k1, p: 0.8, else: nightstand_r1}
      water_bottle: {dest: counter_k1, p: 0.6, else: nightstand_r1}
  breakfast:
    jitter_min: 10                                   # [HOMER]
    objects: [mug, bowl]
    during: {mug: counter_k1, bowl: table_d1}
    after:
      mug:  {dest: sink_k1, p: 0.7, else: counter_k1}
      bowl: {dest: sink_k1, p: 0.8, else: table_d1}
  work_prep:
    jitter_min: 10                                   # [DESIGN] dons the shift kit
    objects: [scrubs, badge, stethoscope]
    during: {scrubs: bed_r1, badge: nightstand_r1, stethoscope: closet_r1}
    after:
      scrubs:      {dest: null, p: 1.0}              # worn out
      badge:       {dest: null, p: 1.0}
      stethoscope: {dest: null, p: 1.0}
  leave_work:
    jitter_min: 8                                    # [DESIGN]
    objects: [keys, phone, thermos, water_bottle]
    after:
      keys:         {dest: null, p: 1.0}
      phone:        {dest: null, p: 1.0}
      thermos:      {dest: null, p: 1.0}
      water_bottle: {dest: nightstand_r1, p: 1.0}    # [DESIGN] uses the thermos at work; bottle STAYS at the bedside
  return_home:
    jitter_min: 20                                   # [DESIGN] home from the night, heading to sleep
    objects: [keys, phone, thermos, badge, scrubs, stethoscope]
    after:
      keys:        {dest: entry_hook_e1, p: 0.8, else: nightstand_r1}
      phone:       {dest: nightstand_r1, p: 0.85, else: sofa_l1}   # [DESIGN] to bed with her -> nightstand at 11:00
      thermos:     {dest: sink_k1, p: 0.7, else: counter_k1}
      badge:       {dest: nightstand_r1, p: 0.7, else: entry_hook_e1}
      scrubs:      {dest: closet_r1, p: 0.6, else: sofa_l1}
      stethoscope: {dest: closet_r1, p: 0.6, else: nightstand_r1}
  wake_meal:
    jitter_min: 20                                   # [DESIGN]
    objects: [plate, fork, mug]
    during: {plate: table_d1, fork: table_d1, mug: counter_k1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
      mug:   {dest: sink_k1, p: 0.6, else: counter_k1}
  errand:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, phone]
    after:
      keys:  {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone: {dest: sofa_l1, p: 0.5, else: counter_k1}
  dinner:
    jitter_min: 10
    objects: [plate, fork, water_bottle]
    during: {plate: table_d1, fork: table_d1, water_bottle: table_d1}
    after:
      plate:        {dest: sink_k1, p: 0.85, else: table_d1}
      fork:         {dest: sink_k1, p: 0.85, else: table_d1}
      water_bottle: {dest: nightstand_r1, p: 0.6, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.9, else: sofa_l1}

placements:
  # DIAGNOSTIC (persona-exclusive; reveal the night-shift regime)
  scrubs:         {home: closet_r1, volatility_class_hint: high}       # [DESIGN]
  badge:          {home: nightstand_r1, volatility_class_hint: high}   # [DESIGN]
  stethoscope:    {home: closet_r1}                                    # [DESIGN]
  thermos:        {home: cupboard_k1, volatility_class_hint: high}     # [DESIGN] packed for the shift
  # DEPENDENT (shared with early_fitness; regime sets their location -> targets)
  water_bottle:   {home: nightstand_r1, volatility_class_hint: high}   # [DESIGN] bedside (she uses a thermos at work)
  phone:          {home: nightstand_r1, volatility_class_hint: high}   # nightstand at 11:00 (asleep)
  keys:           {home: entry_hook_e1, p_misplace: 0.10, misplace_set: [counter_k1, nightstand_r1]}  # [HKEEP]
  # ordinary objects
  mug:            {home: cupboard_k1}
  bowl:           {home: cupboard_k1}
  plate:          {home: cupboard_k1}
  fork:           {home: cupboard_k1}
  remote:         {home: coffee_table_l1}
  # static tercile
  toaster:        {home: counter_k1,  volatility_class_hint: static}
  coffee_maker:   {home: counter_k1,  volatility_class_hint: static}
  router:         {home: tv_stand_l1, volatility_class_hint: static}
  first_aid_kit:  {home: bathroom_c1, volatility_class_hint: static}

# Dish-cycle rule (all profiles): objects on sink_k1 at 21:30 return home at 21:45
# with p=0.9. On shift nights she is at the hospital at 21:30. [DESIGN]
