# regime_office_commuter_v1 -- INFERABLE-REGIME atypical (H2 redesign)
#
# CONFUSABLE PARTNER of regime_wfh_hybrid_v1: a full-time office commuter whose
# laptop leaves EVERY weekday morning and returns each evening. DIAGNOSTIC
# objects (transit_card, work_lanyard, travel_mug -- a commuter kit that leaves
# daily) reveal the regime, versus the WFH person's headset/webcam rig that stays
# at the home desk. At 14:00 on a Wednesday this household's laptop is AWAY (the
# typical answer), whereas the WFH household's is at the home desk -- the same
# midday query, opposite correct answer, resolved only by the diagnostic objects.
#
# DIAGNOSTIC (persona-exclusive): transit_card, work_lanyard, travel_mug.
# DEPENDENT (shared): laptop, coffee_mug -- held-out targets.

household: regime_office_commuter_v1
status: VERIFIED  # regime-inference redesign (Oliver, 2026-07-21)
derived_from: null
transformation: null

receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: desk_o1,       room: office,   aliases: [desk]}
  - {id: bookshelf_o1,  room: office,   aliases: []}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: shoe_rack_e1,  room: entryway, aliases: []}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}

residents:
  - id: R1
    description: full-time office worker who commutes every weekday
    schedule:
      - {activity: sleep,        days: [Mo,Tu,We,Th,Fr], start: "23:00", end: "06:45"}  # [ATUS]
      - {activity: morning_prep, days: [Mo,Tu,We,Th,Fr], start: "06:45", end: "07:15"}  # [ATUS]
      - {activity: breakfast,    days: [Mo,Tu,We,Th,Fr], start: "07:15", end: "07:45"}  # [ATUS]
      - {activity: leave_office, days: [Mo,Tu,We,Th,Fr], start: "08:00", end: "08:30"}  # [DESIGN] laptop leaves DAILY
      - {activity: away_office,  days: [Mo,Tu,We,Th,Fr], start: "08:30", end: "17:30"}  # [ATUS] no-op
      - {activity: return_office,days: [Mo,Tu,We,Th,Fr], start: "17:30", end: "18:00"}  # [ATUS]
      - {activity: dinner,       days: [Mo,Tu,We,Th,Fr], start: "18:30", end: "19:15"}  # [ATUS]
      - {activity: tv_evening,   days: [Mo,Tu,We,Th,Fr], start: "20:00", end: "22:30"}  # [ATUS]
      - {activity: sleep,        days: [Sa,Su],          start: "00:00", end: "08:30"}  # [ATUS] weekend
      - {activity: errand,       days: [Sa,Su],          start: "11:00", end: "12:30"}  # [DESIGN]
      - {activity: dinner,       days: [Sa,Su],          start: "18:30", end: "19:15"}  # [ATUS]
      - {activity: tv_evening,   days: [Sa,Su],          start: "20:00", end: "23:00"}  # [ATUS]

activities:
  morning_prep:
    jitter_min: 10                                   # [HOMER]
    objects: [phone]
    during: {phone: nightstand_r1}
    after:
      phone: {dest: counter_k1, p: 0.7, else: nightstand_r1}
  breakfast:
    jitter_min: 10                                   # [HOMER]
    objects: [coffee_mug, bowl]
    during: {coffee_mug: counter_k1, bowl: table_d1}
    after:
      coffee_mug: {dest: sink_k1, p: 0.7, else: counter_k1}  # [DESIGN] used only in the morning, then washed
      bowl:       {dest: sink_k1, p: 0.8, else: table_d1}
  leave_office:
    jitter_min: 5                                    # [DESIGN] the commuter kit + laptop leave
    objects: [keys, laptop, phone, transit_card, work_lanyard, travel_mug]
    after:
      keys:         {dest: null, p: 1.0}
      laptop:       {dest: null, p: 1.0}             # [DESIGN] laptop AWAY every weekday midday
      phone:        {dest: null, p: 1.0}
      transit_card: {dest: null, p: 1.0}
      work_lanyard: {dest: null, p: 1.0}
      travel_mug:   {dest: null, p: 1.0}
  return_office:
    jitter_min: 25                                   # [DESIGN] commute variance
    objects: [keys, laptop, phone, transit_card, work_lanyard, travel_mug]
    after:
      keys:         {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      laptop:       {dest: desk_o1, p: 0.8, else: sofa_l1}
      phone:        {dest: sofa_l1, p: 0.5, else: counter_k1}
      transit_card: {dest: entry_hook_e1, p: 0.7, else: counter_k1}  # [DESIGN] by the door for tomorrow
      work_lanyard: {dest: entry_hook_e1, p: 0.7, else: desk_o1}
      travel_mug:   {dest: sink_k1, p: 0.8, else: counter_k1}
  dinner:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.9, else: sofa_l1}
  errand:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, phone, travel_mug]
    after:
      keys:       {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone:      {dest: sofa_l1, p: 0.5, else: counter_k1}
      travel_mug: {dest: sink_k1, p: 0.6, else: counter_k1}

placements:
  # DIAGNOSTIC (persona-exclusive commuter kit; leaves daily)
  transit_card: {home: entry_hook_e1, volatility_class_hint: high}   # [DESIGN]
  work_lanyard: {home: entry_hook_e1, volatility_class_hint: high}   # [DESIGN]
  travel_mug:   {home: cupboard_k1, volatility_class_hint: high}     # [DESIGN]
  # DEPENDENT (shared; regime sets midday location -> targets)
  laptop:       {home: desk_o1, volatility_class_hint: high}         # [DESIGN] away every weekday midday
  coffee_mug:   {home: cupboard_k1, volatility_class_hint: high}     # [DESIGN] morning-only, kitchen
  phone:        {home: nightstand_r1, volatility_class_hint: high}
  keys:         {home: entry_hook_e1, p_misplace: 0.10, misplace_set: [counter_k1, sofa_l1]}  # [HKEEP]
  bowl:         {home: cupboard_k1}
  plate:        {home: cupboard_k1}
  fork:         {home: cupboard_k1}
  remote:       {home: coffee_table_l1}
  # static
  router:       {home: bookshelf_o1, volatility_class_hint: static}
  toaster:      {home: counter_k1,   volatility_class_hint: static}
  first_aid_kit: {home: bathroom_c1,  volatility_class_hint: static}

# Dish-cycle rule (all profiles): sink_k1 at 21:30 -> home at 21:45, p=0.9. [DESIGN]
