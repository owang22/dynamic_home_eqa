# v22_plant_collector -- VERSION22 confirmatory household (pair D with
# v22_reptile_keeper: both do 08:00 care rounds with water/spray gear).
# Persona: houseplant collector (60+ plants); misting + watering round every
#   morning, repotting session Su afternoon; hybrid office job Tu/Th.
# IDIOSYNCRATIC-BUT-REALISTIC: pruning SCISSORS live in a TEACUP on the plant
#   shelf (not the kitchen drawer); the WATERING_CAN lives on the living-room
#   windowsill; a NOTEBOOK (watering journal) stays wedged by the windowsill.
# DIAGNOSTIC: plant_mister, moisture_meter, neem_oil_bottle, repotting_trowel.
# DEPENDENT targets: watering_can (windowsill_l1 at 08:30), scissors (teacup on
#   plant_shelf_l1), notebook (windowsill_l1 at 09:00).
# STATIC DISTRACTORS: dining_chair, bed_pillow, wall_clock, floor_lamp, doormat,
#   waste_bin, picture_frame, bath_mat.
household: v22_plant_collector
status: DRAFT  # version22 authoring 2026-07-22 — needs human anchor verification
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,          room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1,   room: bedroom,  aliases: []}
  - {id: sofa_l1,         room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living,   aliases: []}
  - {id: windowsill_l1,   room: living,   aliases: [plant_windowsill]}
  - {id: plant_shelf_l1,  room: living,   aliases: [plant_stand]}
  - {id: balcony_bench_b1, room: balcony, aliases: [potting_bench]}
  - {id: counter_k1,      room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,     room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,         room: kitchen,  aliases: []}
  - {id: table_d1,        room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1,   room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,     room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: houseplant collector; daily 08:00 misting round, Su repotting, office Tu/Th
    schedule:
      - {activity: sleep,          days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "22:45", end: "07:00"}
      - {activity: breakfast,      days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:15", end: "07:50"}
      - {activity: plant_round,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "08:00", end: "09:10"}
      - {activity: leave_office,   days: [Tu,Th],                start: "09:30", end: "09:45"}
      - {activity: away_office,    days: [Tu,Th],                start: "09:45", end: "17:45"}
      - {activity: return_office,  days: [Tu,Th],                start: "17:45", end: "18:05"}
      - {activity: wfh_desk,       days: [Mo,We,Fr],             start: "09:45", end: "12:30"}
      - {activity: lunch,          days: [Mo,We,Fr,Sa,Su],      start: "12:45", end: "13:20"}
      - {activity: wfh_desk,       days: [Mo,We,Fr],             start: "13:45", end: "17:00"}
      - {activity: repotting,      days: [Su],                   start: "14:30", end: "16:30"}
      - {activity: dinner,         days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "18:30", end: "19:10"}
      - {activity: tv_evening,     days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:30", end: "22:00"}
activities:
  breakfast:
    jitter_min: 10
    objects: [bowl, coffee_mug]
    during: {bowl: table_d1, coffee_mug: table_d1}
    after:
      bowl:       {dest: sink_k1, p: 0.85, else: table_d1}
      coffee_mug: {dest: sink_k1, p: 0.6, else: table_d1}
  plant_round:
    jitter_min: 15
    objects: [plant_mister, moisture_meter, watering_can, scissors, notebook]
    during: {plant_mister: plant_shelf_l1, moisture_meter: plant_shelf_l1,
             watering_can: windowsill_l1, scissors: plant_shelf_l1,
             notebook: windowsill_l1}
    after:
      plant_mister:   {dest: plant_shelf_l1, p: 0.85, else: windowsill_l1}
      moisture_meter: {dest: plant_shelf_l1, p: 0.8, else: windowsill_l1}
      watering_can:   {dest: windowsill_l1, p: 0.75, else: sink_k1}  # stays by the plants
      scissors:       {dest: plant_shelf_l1, p: 0.9}                 # back in the teacup
      notebook:       {dest: windowsill_l1, p: 0.85, else: coffee_table_l1}
  leave_office:
    jitter_min: 5
    objects: [keys, phone, laptop]
    after:
      keys:   {dest: null, p: 1.0}
      phone:  {dest: null, p: 1.0}
      laptop: {dest: null, p: 1.0}
  return_office:
    jitter_min: 20
    objects: [keys, phone, laptop]
    after:
      keys:   {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone:  {dest: sofa_l1, p: 0.5, else: counter_k1}
      laptop: {dest: table_d1, p: 0.8, else: sofa_l1}
  wfh_desk:
    jitter_min: 15
    objects: [laptop, phone, coffee_mug]
    during: {laptop: table_d1, phone: table_d1, coffee_mug: table_d1}
    after:
      laptop:     {dest: table_d1, p: 0.8, else: sofa_l1}
      phone:      {dest: table_d1, p: 0.6, else: sofa_l1}
      coffee_mug: {dest: sink_k1, p: 0.6, else: table_d1}
  lunch:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  repotting:
    jitter_min: 20
    objects: [repotting_trowel, neem_oil_bottle, watering_can, scissors, notebook]
    during: {repotting_trowel: balcony_bench_b1, neem_oil_bottle: balcony_bench_b1,
             watering_can: balcony_bench_b1, scissors: balcony_bench_b1,
             notebook: balcony_bench_b1}
    after:
      repotting_trowel: {dest: balcony_bench_b1, p: 0.9}
      neem_oil_bottle:  {dest: balcony_bench_b1, p: 0.85, else: plant_shelf_l1}
      watering_can:     {dest: windowsill_l1, p: 0.7, else: balcony_bench_b1}
      scissors:         {dest: plant_shelf_l1, p: 0.8, else: balcony_bench_b1}
      notebook:         {dest: windowsill_l1, p: 0.8, else: balcony_bench_b1}
  dinner:
    jitter_min: 15
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.85, else: sofa_l1}
placements:
  # DIAGNOSTIC
  plant_mister:     {home: plant_shelf_l1, volatility_class_hint: high}
  moisture_meter:   {home: plant_shelf_l1}
  neem_oil_bottle:  {home: balcony_bench_b1}
  repotting_trowel: {home: balcony_bench_b1}
  # DEPENDENT targets (idiosyncratic homes)
  watering_can: {home: windowsill_l1, volatility_class_hint: high}  # indoors by the plants
  scissors:     {home: plant_shelf_l1, volatility_class_hint: high} # in a teacup on the shelf
  notebook:     {home: windowsill_l1, volatility_class_hint: high}  # watering journal
  # ordinary
  bowl:       {home: cupboard_k1}
  plate:      {home: cupboard_k1}
  fork:       {home: cupboard_k1}
  coffee_mug: {home: cupboard_k1}
  remote:     {home: coffee_table_l1}
  phone:      {home: nightstand_r1, volatility_class_hint: high}
  laptop:     {home: table_d1}
  keys:       {home: entry_hook_e1, p_misplace: 0.08, misplace_set: [counter_k1, coffee_table_l1]}
  # STATIC DISTRACTORS
  dining_chair:  {home: table_d1,        volatility_class_hint: static}
  bed_pillow:    {home: bed_r1,          volatility_class_hint: static}
  wall_clock:    {home: counter_k1,      volatility_class_hint: static}
  floor_lamp:    {home: sofa_l1,         volatility_class_hint: static}
  doormat:       {home: entry_hook_e1,   volatility_class_hint: static}
  waste_bin:     {home: counter_k1,      volatility_class_hint: static}
  picture_frame: {home: coffee_table_l1, volatility_class_hint: static}
  bath_mat:      {home: bathroom_c1,     volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9.
