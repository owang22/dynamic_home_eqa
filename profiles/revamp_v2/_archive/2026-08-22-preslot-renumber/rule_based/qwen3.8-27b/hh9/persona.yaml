household_id: hh_009
household_type: grad_student_solo
residents:
  - id: resident_1
    name: Elara
    age: 26
    occupation: PhD Candidate in Marine Biology
    personality: hyper-focused, chaotic, nocturnal
    habits:
      - leaves multiple empty coffee mugs on the desk for days until she finally
        notices them
      - moves her laptop between the kitchen table and the bedroom floor depending
        on where the light is best
      - drops her notebook and pen on the couch while taking breaks, then forgets
        they are there
      - keeps her water bottle in the fridge but often forgets it until it gets
        warm
      - hangs her jacket on the back of the kitchen chair instead of a hook
      - loses her keys in the pile of papers on the entryway table
relationships: >-
  Elara lives alone, so all chores and responsibilities fall to her, though she
  often neglects them due to her intense focus on research. She has no one to share
  living spaces with, which allows her to be extremely messy without social friction,
  but also means she has no one to remind her to eat or clean. The only 'coordination'
  is with herself, often fighting her own habit of leaving things in weird places.
home_layout_notes: >-
  The apartment is small, with a combined living and kitchen area. The desk in the
  corner is her primary command center, cluttered with papers and electronics. The
  couch is her secondary workspace when she is tired, and the kitchen counter is
  where food items and mugs accumulate. The bedroom is mostly for sleeping, with
  the bed often unmade.
