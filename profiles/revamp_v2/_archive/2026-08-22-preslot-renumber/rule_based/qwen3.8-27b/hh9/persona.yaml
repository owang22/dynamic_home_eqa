daily_life_summary: >-
  Elara's day is dictated by her research schedule rather than the sun. She often
  works through the night, moving her laptop and notes between the desk and the
  couch. Meals are simple and eaten standing up or while looking at a screen. She
  is rarely home during the day, spending most of the daytime hours in the library
  or lab, returning late at night to a quiet, cluttered apartment. Her life is solitary,
  with the only interaction being with her own thoughts and the objects she manipulates.
quirks: >-
  Unlike the typical 'tidy but busy' grad student, Elara is actively chaotic and
  uses her mess as a form of spatial memory. She is also nocturnal, which is less
  common for the stereotype of a daytime student.
