daily_life_summary: >-
  Sarah leaves for work before the teens wake up, leaving a note on the fridge for
  their day's schedule. Leo and Maya wake up at different times, often crossing
  paths in the kitchen where Leo might leave his phone on the counter while Maya
  organizes her sketchbook. After school, they return to a quiet house, spending
  the evening in the living room with Leo gaming and Maya sketching, while Sarah
  returns home to find the kitchen cluttered and the living room occupied, leading
  to a routine of her quietly clearing the dishes and resetting the space.
quirks: >-
  This household is not the stereotypical chaotic teen home; Maya is exceptionally
  tidy and artistic, creating a contrast to Leo's messy tech habits. Sarah's anxiety
  manifests in an over-organized system of notes and designated spots, which the
  teens partially respect but often subvert with their own routines.
