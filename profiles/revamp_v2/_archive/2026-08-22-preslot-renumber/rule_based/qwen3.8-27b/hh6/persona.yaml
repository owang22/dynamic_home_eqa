household_id: hh_006
household_type: single_parent_teens
residents:
  - id: resident_1
    name: Sarah
    age: 42
    occupation: HR Manager
    personality: organized, anxious, over-protective
    habits:
      - leaves a sticky note on the fridge with daily reminders for both teens
      - borrows resident_2's headphones to listen to podcasts during work calls
        and returns them to the living room
      - clears all dirty dishes from the kitchen counter immediately after dinner
      - keeps a dedicated 'lost and found' basket in the hallway for resident_3's
        keys and resident_2's charger
      - tidies the living room at the end of the day, moving any stray books back
        to the shelf
      - checks resident_1's own laptop bag before leaving for work to ensure all
        cables are packed
  - id: resident_2
    name: Leo
    age: 16
    occupation: student
    personality: chaotic, tech-focused, forgetful
    habits:
      - leaves gaming controller on the sofa after every session
      - borrows resident_1's phone to check messages and leaves it on the kitchen
        counter
      - scatters notebook pages across the dining table while doing homework
      - leaves water bottle on the nightstand after waking up
      - forgets to return keys to the hook, leaving them in the backpack
      - uses resident_3's laptop for gaming if resident_3 is out
  - id: resident_3
    name: Maya
    age: 14
    occupation: student
    personality: artistic, tidy, independent
    habits:
      - keeps a specific spot on the dining table for sketching, clearing it before
        dinner
      - leaves jacket in the hallway closet rather than on a hook
      - borrows resident_1's pen for quick notes and returns it to the desk drawer
      - keeps water bottle in the backpack at all times
      - organizes books in the living room by color, not title
      - leaves phone on the charger in the bedroom overnight
relationships: >-
  Sarah is the matriarch who tries to maintain order in a home that is slowly being
  taken over by teenage autonomy. Leo and Maya are siblings who share a close bond
  but have distinct territories; Leo's messy tech habits often clash with Maya's
  need for a clean creative space. The main friction point is the kitchen, where
  Sarah insists on immediate tidying, while Leo often leaves mugs and notebooks
  behind, leading to daily silent negotiations over who clears the table.
home_layout_notes: >-
  The living room is the central hub where Leo's gaming setup and Maya's art supplies
  coexist on the coffee table, often creating a cluttered but functional workspace.
  The kitchen is Sarah's domain, kept spotless, while the dining table serves as
  a shared homework and sketching area for the teens. The bedrooms are private sanctuaries,
  with Leo's room dominated by electronics and Maya's room filled with art supplies
  and organized books.
