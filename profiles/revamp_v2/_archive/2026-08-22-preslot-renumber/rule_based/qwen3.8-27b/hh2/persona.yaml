household_id: hh_002
household_type: family_young_children
residents:
  - id: resident_1
    name: Elena
    age: 34
    occupation: Architect
    personality: meticulous, exhausted, visually-driven
    habits:
      - Keeps a strict separation between work materials and personal items, but
        her drafting pencils often roll under the sofa cushions
      - Leaves her laptop open on the dining table when working late, creating a
        digital barrier in the shared space
      - Washes her own dishes immediately but leaves the drying rack for Marcus
        to clear
      - Stores her work portfolio in a specific cabinet that she checks twice before
        leaving the house
      - Uses the balcony for short breaks, leaving her water bottle on the railing
      - Borrows Leo's tablet for a moment to check a reference image, then returns
        it to his room
      - Tends to forget her keys in the hallway hook, relying on the smart lock
      - Leaves her sketchbook on the kitchen counter, often with a coffee ring on
        the page
  - id: resident_2
    name: Marcus
    age: 36
    occupation: Middle School Teacher
    personality: easygoing, forgetful, physically active
    habits:
      - Leaves his gym bag in the entryway until the next morning, often tripping
        over it
      - Forgets his wallet in the car but keeps his phone on his person at all times
      - Leaves his work laptop on the sofa, usually covered in crumbs from his lunch
      - Uses the bathroom mirror to fix his tie, leaving his glasses on the shelf
      - Borrows Elena's charger for his phone but rarely returns it to the drawer
      - Leaves his lunchbox in the fridge, often expiring if he forgets to eat it
      - Stores his school keys in the same hook as Elena's, causing frequent mix-ups
      - Leaves his notebook in the car, then has to drive home to get it for the
        next day
  - id: resident_3
    name: Leo
    age: 6
    occupation: Student
    personality: energetic, imaginative, messy
    habits:
      - Leaves his toy cars scattered across the living room floor, creating a 'city'
        that he plays in
      - Forgets his backpack in the kitchen after eating his snack
      - Uses the tablet for educational apps, leaving it on the coffee table
      - Leaves his water bottle in the bathroom sink, often with a bit of water
        inside
      - Borrows his sister's crayons and leaves them open, running out of color
      - Stores his lunchbox in the fridge, but often forgets to take it to school
      - Leaves his jacket in the hallway, often with a piece of homework stuck to
        the pocket
      - Uses the sofa as a fort, leaving his blanket and pillow there
  - id: resident_4
    name: Mia
    age: 4
    occupation: Student
    personality: clingy, creative, forgetful
    habits:
      - Leaves her drawing paper on the floor, often crumpled up
      - Forgets her hairbrush in the car, leaving it on the passenger seat
      - Uses the tablet for cartoons, leaving it on the bed
      - Leaves her water bottle in the bedroom, often empty
      - Borrows her brother's toy blocks and leaves them in her room
      - Stores her lunchbox in the fridge, but often forgets to take it to school
      - Leaves her jacket in the bedroom, often with a piece of artwork stuck to
        the pocket
      - Uses the sofa as a reading spot, leaving her book there
relationships: >-
  Elena and Marcus are married and try to balance their work and parenting responsibilities,
  but their different approaches to organization often cause friction. Elena is
  meticulous and wants to keep the house tidy, while Marcus is easygoing and often
  forgets where he puts things. Leo and Mia are siblings who share a room and often
  fight over toys and space, but they also support each other in their creative
  pursuits. The family divides chores based on their strengths, with Elena handling
  the visual and organizational tasks, Marcus handling the physical tasks, and the
  kids helping with small tasks like picking up their toys.
home_layout_notes: >-
  The family uses the living room as a central hub for relaxation and play, with
  the sofa being a favorite spot for Leo to build forts and Mia to read. The kitchen
  is a shared space where Elena works on her architecture projects and Marcus prepares
  his lunch, often leading to clutter. The bedrooms are personal spaces for the
  kids, with Leo's room being a mess of toys and Mia's room being a creative space
  for her drawings. The entryway is a shared space where the family leaves their
  keys and jackets, often leading to mix-ups.
