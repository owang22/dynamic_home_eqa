daily_life_summary: >-
  Sara typically starts her day by setting up her laptop at the bedroom window,
  while Elias remains at the kitchen table, juggling data tasks. They cross paths
  during mid-morning coffee breaks, where Sara usually clears the table before Elias
  can leave his mug. Afternoons see Sara moving to the living room for collaborative
  reviews, while Elias migrates to the sofa, often leaving his laptop open. Their
  days overlap significantly, leading to frequent interruptions and a shared rhythm
  of working, pausing for food, and tidying the shared spaces together in the evening.
quirks: >-
  They have a 'digital sunset' where both devices are silenced after a certain point,
  but Elias often violates this by checking data alerts. They share a single high-end
  gaming controller that Sara uses for work breaks, blurring the line between work
  and leisure tools.
