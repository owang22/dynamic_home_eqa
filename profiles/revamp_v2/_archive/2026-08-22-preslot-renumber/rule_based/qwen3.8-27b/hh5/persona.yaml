household_id: hh_005
household_type: remote_worker_couple
residents:
  - id: resident_1
    name: Elias
    age: 34
    occupation: Data Scientist
    personality: methodical, hoarder of tech, easily distracted
    habits:
      - Leaves his laptop open on the kitchen table even when working from the sofa
      - Buries his phone under a stack of technical notebooks until he needs it
      - Steals resident_2's water bottle when his runs dry
      - Keeps a dedicated 'work zone' on the desk but lets it bleed into the living
        room with cables
      - Forgets to put his glasses in the case, leaving them on the armchair
  - id: resident_2
    name: Sara
    age: 31
    occupation: UX Designer
    personality: aesthetic-focused, organized, short-tempered about clutter
    habits:
      - Uses a specific color-coded pen for each project, keeping them in a jar
        on her desk
      - Moves her laptop to the bedroom window for better light during afternoon
        design sessions
      - Clears the kitchen counter of any food items within minutes of eating
      - Borrows Elias's gaming controller to play casual puzzles when stuck on a
        design problem
      - Leaves her sketchbook open on the couch, often with a pencil resting on
        the page
relationships: >-
  Elias and Sara are partners of five years who share a studio apartment. They have
  a fragile peace about space: Elias tolerates Sara's strict organization of shared
  areas, while Sara tolerates Elias's tech clutter in his 'zone,' though it frequently
  encroaches on hers. Their main friction is the kitchen table; Elias uses it as
  a secondary desk, while Sara wants it kept clear for meals and her occasional
  paper prototypes. They coordinate by a silent agreement that whoever finishes
  their meal first clears the table, though Elias often forgets this rule.
home_layout_notes: >-
  The studio is divided by an invisible line: the left side (bedroom and desk area)
  is Sara's domain, kept minimalist and bright. The right side (sofa and kitchen
  nook) is Elias's chaotic workspace. The kitchen counter is the primary shared
  surface, used for meals and quick snacks, and is the site of most daily negotiations.
  The sofa is neutral ground where both often end up working or relaxing in the
  evening.
