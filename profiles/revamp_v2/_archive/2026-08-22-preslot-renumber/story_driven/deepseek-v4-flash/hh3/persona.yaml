daily_life_summary: >-
  Arthur wakes first and starts the coffee, then reads the newspaper at the kitchen
  table. Marilyn wakes later and makes tea, often carrying her mug to the living
  room to watch morning shows. They have lunch together at the dining table, then
  part ways — Arthur potters in the yard or does small repairs, while Marilyn knits
  or calls family in the sunroom. Evenings they watch television together in the
  living room, with Arthur managing the remote and Marilyn occasionally dozing under
  her blanket. Their paths cross most in the kitchen and living room, and Arthur
  often tidies up behind Marilyn as she moves through the house.
quirks: >-
  Arthur keeps a detailed log of when he takes his medication and refills the water
  bottles on a strict schedule, treating household objects like inventory. Marilyn
  often starts knitting projects and leaves half-finished scarves draped over furniture,
  which Arthur tolerates but never touches.
