household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Arthur Chen
    age: 72
    occupation: retired
    personality: meticulous, nostalgic, creature of habit
    habits:
      - polishes his glasses with his shirt every morning and sets them on the nightstand
      - reads the newspaper at the kitchen table and leaves it folded open to the
        crossword
      - takes his medication bottle from the kitchen counter, uses it, then places
        it back in the same spot
      - fills both their water bottles from the tap each evening and leaves them
        on the kitchen counter
      - borrows resident_2's blanket from the sofa when napping and folds it neatly
        before returning it
      - adjusts the living room remote to the correct volume before handing it to
        resident_2
  - id: resident_2
    name: Marilyn Chen
    age: 69
    occupation: retired
    personality: spontaneous, chatty, slightly forgetful
    habits:
      - knits in the armchair and leaves her glasses on the end table when she gets
        up
      - makes tea and sets the mug down wherever she is — often leaving it on the
        coffee table overnight
      - moves Arthur's newspaper from the table to the recycling bin when clearing
        for dinner
      - uses the laptop at the dining table to video-call their daughter, then leaves
        it plugged in there
      - loses the remote in the sofa cushions at least twice a week
      - borrows resident_1's jacket from the hall closet when going for a walk and
        hangs it back on the wrong hook
relationships: >-
  Arthur and Marilyn have been married for 45 years. Arthur handles the morning
  routine — making coffee and tidying the kitchen — while Marilyn does the evening
  dishes. They share the living room and dining table equally, but friction arises
  when Marilyn leaves mugs around and Arthur insists on immediate cleanup. Arthur's
  need for order clashes with Marilyn's habit of dropping things wherever she finishes
  with them.
home_layout_notes: >-
  The home is a single-story house with a master bedroom, a living room, a small
  dining area off the kitchen, and a sunroom. Arthur spends most of his time in
  the living room armchair or at the kitchen table; Marilyn knits in the armchair
  in the living room or sits in the sunroom. The dining table is their shared surface
  for the laptop, mail, and newspapers.
