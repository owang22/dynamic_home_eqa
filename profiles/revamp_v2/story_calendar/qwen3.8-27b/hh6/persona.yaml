daily_life_summary: >-
  Elena often leaves for work late at night, leaving the house quiet, and returns
  in the morning to find the kitchen cluttered with Leo's leftovers and Maya's clean
  dishes. Leo spends his day at school and then in his room or the kitchen, creating
  noise and mess, while Maya returns from swim practice to clean up and study in
  the living room. The three rarely overlap fully in the evening, with Elena arriving
  to find the house in various states of disorder, and the teens managing their
  own routines independently during the day.
quirks: >-
  Elena uses the living room armchair as a temporary bed, which is unusual for a
  single parent but common for shift workers. Leo's tech setup is so extensive that
  it has taken over the kitchen table, making it unusable for dining, which is a
  significant deviation from the norm for a family home.
