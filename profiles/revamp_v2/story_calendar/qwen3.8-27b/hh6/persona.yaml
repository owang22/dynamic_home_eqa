household_id: hh_006
household_type: single_parent_teens
residents:
  - id: resident_1
    name: Elena
    age: 42
    occupation: Nurse
    personality: Exhausted, practical, protective
    habits:
      - Leaves her work bag and scrubs on the hook by the door immediately upon
        entering, often not moving them until her next shift.
      - Keeps a dedicated 'grab-and-go' bowl of nuts and fruit in the kitchen for
        quick meals when rushing out.
      - Uses the living room armchair as a nap spot if she has a day off, leaving
        her blanket draped over it.
      - Does a single large load of laundry every weekend, leaving the basket overflowing
        for days.
      - Leaves her phone on the kitchen counter charging when she is home, but takes
        it everywhere else.
      - Keeps a notebook in her pocket to jot down meds or reminders, often losing
        it in the couch cushions.
  - id: resident_2
    name: Leo
    age: 17
    occupation: student
    personality: Chaotic, tech-obsessed, loud
    habits:
      - Leaves his gaming controller and headphones on the floor next to his bed
        after late-night sessions.
      - Uses the kitchen table as a workspace for his laptop and mixing gear, leaving
        cables and mugs scattered.
      - Takes his phone and keys out of the house for school and activities, rarely
        returning them to a central spot.
      - Leaves empty energy drink cans on his desk for days before noticing them.
      - Wears the same jacket for multiple days, hanging it over the back of his
        chair rather than a hook.
      - Leaves his school backpack on the hallway floor after coming home.
  - id: resident_3
    name: Maya
    age: 15
    occupation: student
    personality: Neat, focused, anxious
    habits:
      - Keeps her art supplies strictly organized in her room, refusing to use the
        kitchen table unless absolutely necessary.
      - Washes her face and brushes her hair immediately after school, leaving her
        towel on the bathroom rack for a specific time before moving it to the laundry.
      - Takes her swim bag and water bottle out of the house for practice, ensuring
        they are packed the night before.
      - Leaves her notebook and pen on her desk, keeping her workspace clear of
        personal clutter.
      - Uses the living room sofa for reading or studying, leaving her book open
        on the cushion.
      - Keeps her phone on silent and on her person, rarely setting it down in shared
        spaces.
relationships: >-
  Elena is the sole caregiver, managing the household logistics while working irregular
  shifts, which means Leo and Maya often spend the day alone. Leo and Maya have
  a tense sibling dynamic; Leo's noise and mess annoy Maya, who requires quiet for
  her studies and art, leading to frequent arguments about shared spaces like the
  kitchen and living room. Elena tries to mediate by setting clear rules for shared
  areas, but her exhaustion means enforcement is inconsistent, resulting in a home
  that is often messy in the common areas but tidy in the teens' private rooms.
home_layout_notes: >-
  The home consists of a shared kitchen, living room, and hallway, with separate
  bedrooms for each resident. The kitchen is the primary conflict zone, with Leo's
  clutter on the table and Maya's need for a clean space to eat or study. The living
  room is used by Elena for napping and by Maya for reading, while Leo tends to
  stay in his room or the kitchen. The bathroom is shared, with Maya's strict routine
  clashing with Leo's tendency to leave items around.
