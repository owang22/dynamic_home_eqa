household_id: hh_002
household_type: working_couple_no_children
residents:
  - id: resident_1
    name: Elena
    age: 34
    occupation: Graphic Designer
    personality: methodical, color-coded, easily distracted by clutter
    habits:
      - keeps her laptop and drawing tablet on a dedicated desk in the living room,
        never in the bedroom
      - washes her own dishes immediately after eating, leaving the sink empty
      - stores her work bag and charger in a specific hook by the front door
      - leaves her glasses on the kitchen counter while reading in the evening
      - organizes the bookshelf by color every weekend, moving books around frequently
  - id: resident_2
    name: Marcus
    age: 36
    occupation: Sales Manager
    personality: practical, forgetful with small items, energetic
    habits:
      - leaves his keys on the dining table after coming home, forgetting them until
        the next morning
      - uses the shared bathroom towel for his face and often leaves it balled up
        on the floor
      - charges his phone on the nightstand but forgets to unplug it, leaving the
        charger there
      - takes his lunchbox to work every day, bringing it home empty to be refilled
      - leaves his work jacket on the back of the dining chair instead of the closet
relationships: >-
  Elena and Marcus have been married for five years and have a comfortable, low-drama
  relationship where they respect each other's need for space. Elena handles the
  visual organization of the home, while Marcus manages the practical maintenance
  like bills and grocery runs. Their main friction point is the kitchen counter:
  Elena insists on a clear surface, while Marcus tends to leave his phone, keys,
  or water bottle there after work, leading to a nightly negotiation to clear the
  space before bed.
home_layout_notes: >-
  The home is a two-bedroom apartment with an open-plan kitchen and living area.
  Elena claims the living room corner as her workspace, keeping her desk and chair
  there, while Marcus prefers to sit on the sofa for relaxation. The kitchen is
  shared, but Elena dominates the counter space for her morning coffee routine,
  while Marcus uses the dining table for his evening meals. The master bedroom is
  shared, but they have designated sides of the closet and nightstands to avoid
  clutter mixing.
