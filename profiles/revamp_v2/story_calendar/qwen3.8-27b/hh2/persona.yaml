daily_life_summary: >-
  On weekdays, Elena and Marcus leave the house at the same time, creating a brief
  overlap in the kitchen where they grab their coffee and bags. Elena takes her
  laptop to the office, while Marcus takes his phone and work bag. They are both
  away for the majority of the day, returning home in the late afternoon. Their
  evenings overlap in the kitchen and living room, where they cook dinner together
  and then settle into their separate corners of the living room for work or relaxation.
  They rarely cross paths in the bedroom until late at night when they both wind
  down.
quirks: >-
  Elena has a habit of reorganizing the bookshelf by color, which means books are
  constantly moving to new locations. Marcus has a tendency to leave his work jacket
  on the dining chair, creating a small pile of fabric that Elena has to move to
  the closet every night.
