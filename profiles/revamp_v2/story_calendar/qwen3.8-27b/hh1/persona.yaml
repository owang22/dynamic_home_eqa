household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Elara Vance
    age: 34
    occupation: Emergency Room Nurse
    personality: exhausted, highly structured, solitary
    habits:
      - sleeps with the blackout curtains drawn tight and the room temperature set
        low
      - leaves her scrubs in a dedicated hamper by the door to avoid mixing with
        street clothes
      - keeps a heavy wool blanket on the sofa for the brief wakefulness between
        shifts
      - uses the same ceramic mug for all beverages, washing it only when completely
        empty
      - sets her phone on the kitchen counter with the screen face down to silence
        notifications
      - takes a cold shower immediately after returning home to wake up before sleeping
      - leaves her work badge in the entryway hook to ensure she doesn't bring it
        back to the hospital
relationships: >-
  Elara lives alone and maintains a strict boundary between her professional and
  personal life. She is disciplined about keeping her living space clean to reduce
  cognitive load during her rare waking hours. The primary friction in her routine
  is the conflict between her biological clock and her work schedule, leading to
  a constant state of grogginess that she manages through rigid environmental cues.
home_layout_notes: >-
  The one-bedroom apartment is divided into a 'sleep zone' (bedroom) and a 'wake
  zone' (kitchen/living area). Elara spends most of her waking hours in the kitchen
  or on the sofa, while the bedroom is reserved exclusively for sleep to reinforce
  circadian rhythm. The bathroom is used primarily for high-temperature or cold-temperature
  showers to aid in sleep/wake transitions.
object_inventory:
  - id: mug_1
    class: mug
    owner: resident_1
    role: Elara's primary drinking vessel, kept on the kitchen counter and moved
      to the sink only for washing, never left in the bedroom.
  - id: blanket_1
    class: blanket
    owner: resident_1
    role: A heavy wool blanket used on the sofa during waking hours for warmth and
      comfort, often left draped over the armrest.
  - id: phone_1
    class: phone
    owner: resident_1
    role: Carried with Elara during her commute, placed on the kitchen counter face-down
      during sleep to ensure silence, and picked up in the evening for personal
      calls.
  - id: keys_1
    class: keys
    owner: resident_1
    role: Hung on the entryway hook immediately upon arrival, removed only when
      leaving for work, serving as a physical marker of her transition between home
      and hospital.
  - id: laptop_1
    class: laptop
    owner: resident_1
    role: Used on the kitchen table in the evening for emails and online shopping,
      closed and left on the table overnight, not brought into the bedroom.
  - id: water_bottle_1
    class: water_bottle
    owner: resident_1
    role: Filled in the kitchen each evening and left on the nightstand, moved to
      the sink for refilling only when empty, serving as a hydration reminder during
      waking hours.
  - id: jacket_1
    class: jacket
    owner: resident_1
    role: Worn during the commute, hung on the back of the bedroom door upon arrival,
      and retrieved from the door hook before leaving for work.
  - id: book_1
    class: book
    owner: resident_1
    role: Read on the sofa in the evening, left open on the coffee table, and moved
      to the nightstand only if Elara decides to read in bed, which is rare.
  - id: remote_1
    class: remote
    owner: resident_1
    role: Used on the sofa to control the television, placed in a designated pocket
      on the armrest to prevent it from being lost under cushions.
  - id: glasses_1
    class: glasses
    owner: resident_1
    role: Worn during evening reading and screen use, placed in a case on the kitchen
      table, and moved to the nightstand only for the brief moments of waking before
      sleep.
  - id: notebook_1
    class: notebook
    owner: resident_1
    role: Used for jotting down shift notes or personal thoughts, kept in a drawer
      in the kitchen table, and moved to the counter only when actively writing.
  - id: hairbrush_1
    class: hairbrush
    owner: resident_1
    role: Used in the bathroom during the morning shower routine, left on the bathroom
      counter, and moved to the sink only for cleaning, never taken to the bedroom.
  - id: medication_bottle_1
    class: medication_bottle
    owner: resident_1
    role: Contains sleep aids taken immediately after the cold shower, placed on
      the nightstand for easy access, and moved to the bathroom cabinet after use.
daily_life_summary: >-
  Elara's day is inverted; she returns home from a long shift, performs a quick
  wake-up routine involving a cold shower and a small snack, and then sleeps through
  what is typically the daytime hours for others. She wakes up in the evening to
  prepare a meal and engage in solitary leisure activities like reading or watching
  television. Her interactions with the outside world are minimal and concentrated
  in the late afternoon and early morning, ensuring her sleep environment is quiet
  and dark.
quirks: >-
  Elara keeps a 'wake-up light' in the bedroom that she manually adjusts to simulate
  a sunrise, even though she is sleeping during the day, to help regulate her internal
  clock. She refuses to have any personal items from her work (like a hospital lanyard)
  inside the apartment, maintaining a strict psychological separation between her
  professional and personal selves.
