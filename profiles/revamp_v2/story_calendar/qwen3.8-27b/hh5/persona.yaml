daily_life_summary: >-
  The household day is a continuous loop of care and work. Elena starts by preparing
  Leo's breakfast and managing his morning energy, while Arthur works from the kitchen
  table or living room, often interrupted by Leo's questions. After Leo's nap, Arthur
  takes over active play, allowing Elena to focus on design work, often moving to
  the sofa or bedroom for privacy. Evenings involve a shared dinner, followed by
  a chaotic wind-down where Leo is bathed and put to bed, and the parents briefly
  decompress on the sofa, often watching a show or discussing their day. The objects
  in the home reflect this blend of work and play, with laptops and toys coexisting
  on the same surfaces.
quirks: >-
  The household has a 'toy migration' pattern where toys are never returned to their
  bins, instead accumulating in the kitchen and bedroom. They also have a 'shared
  charger' habit where both adults use the same multi-port charger on the kitchen
  island, leading to constant plugging and unplugging.
