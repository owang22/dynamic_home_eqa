household_id: hh_005
household_type: couple_with_toddler
residents:
  - id: resident_1
    name: Arthur
    age: 34
    occupation: Remote Software Engineer
    personality: Systematic, patient, quiet
    habits:
      - Leaves his laptop charger plugged into the kitchen outlet even when the
        laptop is in the bedroom
      - Keeps his water bottle in the refrigerator and moves it to the desk, then
        back to the fridge daily
      - Sits on the floor to play with the toddler, often moving toys from the living
        room rug to the bedroom
      - Forgets to put his glasses in the case, leaving them on the monitor stand
      - Carries his phone in his back pocket, often knocking it off the table during
        video calls
      - Uses the bathroom mirror to check his appearance before calls, leaving a
        faint smudge
      - Tidies up the toddler's blocks after play but leaves the bucket in the hallway
  - id: resident_2
    name: Elena
    age: 32
    occupation: Freelance Graphic Designer
    personality: Creative, forgetful, energetic
    habits:
      - Scatters her sketchbook and pens on the kitchen table while brainstorming
      - Leaves her makeup kit on the bathroom counter, often running out of space
        for Arthur's toothbrush
      - Carries her tablet around the house to show the toddler pictures, losing
        track of it in the couch cushions
      - Holds the toddler's hand while cooking, leading to sticky counters and misplaced
        utensils
      - Leaves her phone on the sofa armrest while working, often forgetting to
        charge it until it dies
      - Uses the laundry basket as a temporary storage for toddler clothes that
        need ironing or sorting
      - Forgets to put her keys in the dish by the door, searching for them throughout
        the hallway
  - id: resident_3
    name: Leo
    age: 3
    occupation: Toddler
    personality: Curious, mobile, messy
    habits:
      - Carries one toy from the living room to the kitchen to 'show' the parents,
        then drops it
      - Lies on the rug with a blanket, dragging it across the floor to the bedroom
      - Holds a water bottle everywhere, leaving small puddles on the coffee table
      - Sits in the high chair with a plate, often throwing food on the floor
      - Grabs the remote from the coffee table and drops it on the rug
      - Carries a stuffed animal to bed, then loses it in the sofa cushions
relationships: >-
  Arthur and Elena are a married couple balancing remote work with full-time toddler
  care. Arthur handles the 'system' of the house (tech, cleaning, bedtime routines)
  while Elena manages the 'creative' chaos (art, meals, play). Their main friction
  is over the cleanliness of the shared living space; Arthur wants the rug clear
  for his work, while Leo and Elena use it for play and brainstorming. They coordinate
  by taking shifts: Arthur works in the morning while Elena handles Leo, and they
  swap in the afternoon, though this schedule is fluid and often disrupted by Leo's
  naps or Elena's client deadlines.
home_layout_notes: >-
  The home is a two-bedroom apartment with an open-plan living/kitchen area. The
  living room is the primary shared space, containing a sofa, a rug, a coffee table,
  and a high chair. The kitchen is where most family interaction happens, with a
  central island/table. The master bedroom is for Arthur and Elena, while the second
  bedroom is Leo's, though he often sleeps in the living room on a mat. The bathroom
  is small and shared, leading to frequent congestion during morning routines.
