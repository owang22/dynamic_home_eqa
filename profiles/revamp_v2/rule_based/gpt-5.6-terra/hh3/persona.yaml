household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: June Okafor
    age: 68
    occupation: retired library conservator
    personality: methodical, quietly social, protective of books
    habits:
      - Returns borrowed books to a labeled shelf after reading, but leaves her
        current book open beside her armchair.
      - Carries her phone, keys, wallet, and water bottle whenever she goes to the
        library branch or neighborhood meetings.
      - Uses her tablet at the kitchen table to coordinate the building's book-exchange
        cabinet, then plugs it in on a counter charger.
      - Washes her mug and any bowl she uses immediately, leaving them on the drying
        rack before putting them away.
      - Keeps her glasses either on her face, beside her book, or in their case
        on the bedroom dresser.
      - Waters the balcony herbs with Arturo after checking which pots feel dry.
      - Folds the shared blanket after using it in the sitting room, which Arturo
        rarely remembers to do.
  - id: resident_2
    name: Arturo Mendes
    age: 71
    occupation: retired bicycle mechanic
    personality: hands-on, genial, mildly absent-minded
    habits:
      - Takes his phone, keys, wallet, and glasses whenever he leaves for the community
        repair café or errands.
      - Uses his laptop at the narrow desk to answer repair-café messages and leaves
        the charging cable looped beside it.
      - Writes parts lists and volunteer notes in his notebook, which tends to migrate
        between the desk, kitchen table, and his jacket pocket.
      - Makes tea in June's absence and sometimes leaves his used mug on the side
        table until she points it out.
      - Uses the vacuum cleaner for quick passes under the kitchen table after potting
        soil or crumbs collect there.
      - Cooks one-pot meals in the shared pot, leaving the pot to soak in the sink
        while he cleans the counter.
      - Moves the remote between his armchair and the sofa, then asks June where
        it went.
relationships: >-
  June and Arturo have been married for thirty-eight years and live comfortably
  in a small apartment after downsizing from a house. June manages most dishwashing
  and the book-exchange paperwork, while Arturo handles small repairs, vacuuming,
  and the larger cooking projects. Their minor friction is Arturo's trail of mug,
  notebook, and remote locations, while June's carefully sorted books sometimes
  take over the shared table before meals.
home_layout_notes: >-
  The apartment has one bedroom, a compact kitchen-table workspace, a sitting room
  with two armchairs, and a balcony crowded with herb pots. June's book, tablet,
  and glasses settle near her armchair or at the table; Arturo uses the desk alcove
  and spreads repair notes there. The kitchen, balcony, and sitting-room blanket
  are shared spaces, and the limited table surface requires them to clear one another's
  projects.
