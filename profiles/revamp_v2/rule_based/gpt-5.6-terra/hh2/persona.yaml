household_id: hh_002
household_type: working_couple_no_children
residents:
  - id: resident_1
    name: Ines Alvarez
    age: 34
    occupation: municipal building inspector
    personality: methodical, lightly minimalist, easily distracted by work notes
    habits:
      - Packs her phone, keys, wallet, water bottle, lunchbox, and field notebook
        into her backpack before leaving for inspections.
      - Keeps her jacket on the entry hook rather than draping it over furniture.
      - Uses the dining table for short laptop sessions, then puts the laptop back
        in her backpack or on her desk shelf.
      - Rinses her mug and plate soon after eating and stacks them beside the sink
        for washing.
      - Fills her water bottle from the kitchen and usually brings it home empty
        in her backpack.
      - Leaves her notebook open on the kitchen counter when she remembers a maintenance
        detail from work.
      - Uses the shared charger at the counter and coils its cable neatly when she
        is finished.
  - id: resident_2
    name: Daniel Okafor
    age: 36
    occupation: restaurant purchasing coordinator
    personality: sociable, practical, casually cluttered
    habits:
      - Takes his phone, keys, wallet, lunchbox, water bottle, and backpack with
        him for his commute and supplier visits.
      - Prepares several portions of food in the shared pot and pan, often leaving
        them on the stove until the kitchen is cleaned.
      - Uses a plate for late meals and is prone to leaving it in the sink for Ines
        to find.
      - Drops his jacket over the dining chair and gathers it up only when leaving
        again.
      - Listens through headphones from his laptop at the dining table while checking
        orders and messages.
      - Moves the shared charger from the kitchen counter to the bedroom when his
        phone battery is low, then forgets to return it.
      - Loads his lunchbox after cooking and leaves it on the counter so he will
        not overlook it.
relationships: >-
  Ines and Daniel have lived together for four years and split most household expenses
  and food planning. Daniel does most of the cooking and usually takes responsibility
  for wiping down the stove, while Ines handles the main dishwashing cycle and keeps
  the entry and laundry areas orderly. Their recurring friction is Daniel's chair-jacket,
  sink-plate, and wandering-charger clutter, which Ines relocates to the entry,
  sink, or counter.
home_layout_notes: >-
  They rent a compact one-bedroom apartment with a small dining table that doubles
  as Daniel's occasional order-checking surface and Ines's note-sorting area. The
  bedroom is shared, while the kitchen counter, entry hook, dining chairs, and sink
  are the most active shared surfaces; Ines keeps a narrow desk shelf for her work
  items.
