daily_life_summary: >-
  On weekdays, both residents leave the apartment for on-site jobs, carrying their
  personal essentials in backpacks and returning with lunch containers and water
  bottles. They overlap most reliably in the kitchen, where Daniel cooks in batches
  and Ines restores dishes to the cupboard after washing. Ines sometimes has paperwork
  to check at home, while Daniel uses his laptop and headphones nearby, so they
  share the dining table without needing separate offices. Their shared charger
  and unwashed dishware regularly migrate between the counter, bedroom, and sink.
quirks: >-
  Although they are a child-free working couple, they rarely order takeout because
  Daniel treats the kitchen as a small meal-prep operation. They do not maintain
  a television-centered living room; their laptop, headphones, and kitchen table
  receive more use than a remote.
