daily_life_summary: >-
  Elena leaves the apartment for museum work on weekdays, carrying her phone, keys,
  wallet, laptop, backpack, and water bottle. She returns with her work things and
  usually changes in the bedroom before making a quick meal or reading in the living
  room. Her home is quiet while she is out, and most object movement happens when
  she transitions through the entryway, kitchen, and desk area. On days off, she
  does laundry and cleaning, reorganizes her work materials, and spends longer stretches
  reading at home.
quirks: >-
  Although she works in a highly visual field, Elena keeps a deliberately sparse
  home and dislikes decorative clutter. She is a competent cook but relies on batch
  meals and assembled lunches rather than elaborate recipes.
