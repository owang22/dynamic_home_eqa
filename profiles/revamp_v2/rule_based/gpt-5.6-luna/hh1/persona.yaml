household_id: hh_001
household_type: working_professional_solo
residents:
  - id: resident_1
    name: Elena Marquez
    age: 34
    occupation: museum exhibition coordinator
    personality: organized, aesthetically particular, mildly absent-minded when
      tired
    habits:
      - leaves her phone and keys in a ceramic tray by the entry after commuting
        home
      - takes a laptop, notebook, and pen to work and returns them to a desk drawer
        in the evening
      - drinks coffee from one preferred mug and leaves it beside the kitchen sink
        until she has finished getting ready
      - cooks simple meals in batches, washing the pot and pan but sometimes leaving
        plates in the sink overnight
      - hangs her work jacket on a dining chair rather than the coat hook
      - reads art monographs on the sofa and leaves the open book face-down on the
        coffee table
      - fills her water bottle before leaving and carries it in her backpack
      - does a concentrated weekend reset using the vacuum cleaner and laundry basket
relationships: >-
  Elena lives alone and owns all personal belongings in the apartment. She handles
  every chore herself, but her tendency to leave work materials and jackets on shared
  surfaces creates occasional clutter that she clears during her weekly reset.
home_layout_notes: >-
  The apartment has a compact bedroom, a combined kitchen-living room, a small entryway,
  and a desk against the living-room wall. Elena uses the desk for paperwork, the
  sofa and coffee table for reading, and the entry tray for objects she carries
  to and from work; all spaces are hers but the kitchen counters and dining table
  accumulate the most temporary items.
