household_id: hh_002
household_type: family_young_children
residents:
  - id: resident_1
    name: Elena
    age: 34
    occupation: stay-at-home parent
    personality: organized, patient, detail-oriented
    habits:
      - sorts laundry by color every morning before dropping the kids off
      - keeps a basket of small toys in the living room for easy cleanup
      - checks pockets of jackets and backpacks to retrieve lost items
      - cleans up snack spills immediately to prevent sticky surfaces
      - shares the remote control with resident_2 after dinner
      - tucks resident_3's book under their pillow at night
      - folds resident_4's blanket neatly after nap time
  - id: resident_2
    name: Marcus
    age: 36
    occupation: civil engineer
    personality: relaxed, hands-on, slightly absent-minded
    habits:
      - leaves work tools and hard hat in the mudroom entry
      - uses the laptop for work emails while sitting on the sofa
      - helps resident_3 with homework but often misplaces the pen
      - wears resident_1's glasses when looking for small items
      - carries resident_4's water bottle to the kitchen for refills
      - leaves his jacket on the chair after coming home
      - uses the remote to change channels during family movie time
  - id: resident_3
    name: Leo
    age: 6
    occupation: student
    personality: energetic, curious, messy
    habits:
      - leaves school notebook open on the dining table after drawing
      - throws backpack in the corner near the door
      - uses the gaming controller to play games with resident_4
      - keeps a toy dinosaur on the nightstand
      - borrows resident_1's mug for drinking juice
      - hides books under the bed when he doesn't want to read
      - uses the umbrella when it rains without asking
  - id: resident_4
    name: Mia
    age: 4
    occupation: preschooler
    personality: imaginative, clingy, playful
    habits:
      - carries her blanket everywhere in the house
      - leaves her bowl on the floor after eating
      - uses the toy truck to pretend-drive in the hallway
      - hides her wallet (toy) in her pockets
      - borrows resident_3's headphones to listen to music
      - puts her keys in the fruit bowl
      - uses the towel to wipe her face after washing hands
relationships: >-
  Elena and Marcus are married and share primary responsibility for the children's
  daily routines and household management. Elena tends to handle the bulk of cleaning
  and organization, while Marcus assists with childcare and heavier chores, though
  he often leaves his work items in shared spaces. The children, Leo and Mia, share
  a bedroom and often play together, leading to occasional friction over toys and
  space, but they generally support each other in their activities. Coordination
  around meal times and bedtime is a daily point of negotiation, with Elena usually
  taking the lead on getting the kids ready while Marcus handles dinner preparation
  and cleanup.
home_layout_notes: >-
  The home features an open-plan living and dining area where most family interactions
  occur, making it a high-traffic zone for shared objects like the remote, laptop,
  and mugs. The mudroom entry serves as a drop-off point for keys, jackets, and
  backpacks, creating a clutter zone that requires regular tidying. The children's
  bedroom is small and doubles as a play area, leading to toys and books being scattered
  throughout the house if not contained.
