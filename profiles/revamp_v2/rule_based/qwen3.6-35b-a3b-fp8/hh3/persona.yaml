household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Arthur
    age: 72
    occupation: retired
    personality: meticulous, nostalgic, slow-paced
    habits:
      - polishes his glasses with his shirttail before putting them on
      - leaves his reading book face-down on the armchair until he finishes the
        chapter
      - keeps his wallet in the same left pocket of every jacket he owns
      - insists on wiping down the kitchen counter after making tea, even if nothing
        spilled
      - puts his slippers in a precise row by the door when he goes out
      - asks Eleanor to read labels on medication bottles because his eyes are tired
      - collects empty pill boxes in a drawer until they are full
  - id: resident_2
    name: Eleanor
    age: 69
    occupation: retired
    personality: practical, social, organized
    habits:
      - hangs her jacket on the hook furthest from the door to keep it out of the
        way
      - clears Arthur's tea mug to the sink immediately after he finishes
      - keeps the remote control in the same pocket of her cardigan
      - organizes the shared notebook by date and topic in a drawer
      - takes her water bottle to the garden when she tends the flowers
      - forgets to put her keys on the hook until she needs to leave
      - writes grocery lists in the shared notebook before going to the store
relationships: >-
  Arthur and Eleanor have been married for 45 years and share a life built on quiet
  routines and mutual care. They divide chores naturally: Arthur handles the technical
  maintenance and heavy lifting, while Eleanor manages the household inventory and
  social planning. There is a minor friction regarding shared spaces; Arthur tends
  to leave his books and glasses in the living room, which Eleanor sometimes trips
  over, leading her to gently tidy his corner of the sofa when she passes by. They
  rely on each other for memory tasks, such as Arthur needing help with small print
  and Eleanor needing help reaching high shelves.
home_layout_notes: >-
  The home is a modest two-bedroom house with a clutter-free but cozy aesthetic.
  The living room is the primary shared space, dominated by Arthur's reading chair
  and Eleanor's sewing table. The kitchen is compact and highly organized, with
  specific spots for their mugs and water bottles. The hallway features a dedicated
  coat rack with hooks that both residents use, though they have designated spots
  they prefer.
