household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Elias Thorne
    age: 34
    occupation: night_shift_worker
    personality: sleepy, disorganized, pragmatic
    habits:
      - leaves work clothes in a pile on the bedroom floor instead of putting them
        in the hamper
      - eats dinner standing up at the kitchen counter while checking phone notifications
      - places keys on the kitchen counter immediately upon entering, often on top
        of mail
      - leaves the bathroom light on and door slightly ajar after using it
      - drinks coffee from a travel mug that stays on the nightstand until the next
        morning
      - takes a shower before leaving for work, leaving wet towels on the floor
      - eats lunch from a container in the living room while watching TV
      - leaves the front door unlocked briefly when taking out trash, then forgets
        to lock it
relationships: >-
  Elias lives entirely alone in his one-bedroom apartment, so all household management
  falls on him. He tends to let small messes accumulate because he prioritizes sleep
  over tidiness, and there is no one else to coordinate with or correct his habits.
  The only 'relationship' is with his environment, which he treats as a functional
  base rather than a curated space.
home_layout_notes: >-
  The apartment is a compact one-bedroom with an open-plan kitchen and living area.
  The bedroom is primarily for sleeping and storing work clothes, while the kitchen
  counter serves as the main hub for eating and dropping off items. The bathroom
  is small and shared, and the living area has limited seating, so surfaces like
  the coffee table and kitchen counters become temporary storage zones.
object_inventory:
  - id: keys_1
    class: keys
    owner: resident_1
    role: daily entry to apartment, left on kitchen counter or dropped on entryway
      mat
  - id: phone_1
    class: phone
    owner: resident_1
    role: constant companion, used for work alerts and entertainment, moves from
      nightstand to kitchen counter
  - id: mug_1
    class: mug
    owner: resident_1
    role: travel coffee mug, stays on nightstand overnight, moved to kitchen for
      refills
  - id: charger_1
    class: charger
    owner: resident_1
    role: charges phone, often left plugged in on nightstand or kitchen counter
      after use
  - id: laptop_1
    class: laptop
    owner: resident_1
    role: work-related browsing and personal entertainment, left open on living
      room table or bed
  - id: jacket_1
    class: jacket
    owner: resident_1
    role: work uniform layer, hung on back of chair or draped over sofa arm after
      shift
  - id: towel_1
    class: towel
    owner: resident_1
    role: bathroom use, often left on floor or hook after shower
  - id: notebook_1
    class: notebook
    owner: resident_1
    role: jotting down work notes or reminders, found on kitchen counter or nightstand
  - id: pen_1
    class: pen
    owner: resident_1
    role: used with notebook, frequently lost in jacket pockets or on tables
daily_life_summary: >-
  Elias wakes up in the late afternoon, groggy and disoriented, and quickly prepares
  a meal or snack in the kitchen. He spends the evening hours either working remotely
  on his laptop or relaxing in the living room, often eating and watching TV in
  the same spot. Before his shift starts, he rushes through a shower and gets dressed,
  leaving a trail of used items behind. He leaves for work in the early evening,
  leaving the apartment quiet until he returns the next day.
quirks: >-
  Despite working nights, he keeps his blinds closed during the day to mimic night,
  but leaves the living room lights on for hours while he sleeps, creating a weirdly
  lit daytime atmosphere in the apartment.
