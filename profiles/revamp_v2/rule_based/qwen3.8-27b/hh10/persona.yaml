household_id: hh_010
household_type: couple_with_toddler
residents:
  - id: resident_1
    name: Elena
    age: 32
    occupation: Graphic Designer
    personality: visually driven, chaotic, empathetic
    habits:
      - scatters design printouts and swatches across the dining table when working
      - leaves toddler toys in the hallway to keep them away from her desk
      - uses the living room sofa as a makeshift nap spot for the toddler during
        work hours
      - borrows resident_2's water bottle when hers is empty and forgets to return
        it
      - keeps a dedicated 'landing zone' by the front door for keys and wallets
        but rarely uses it
  - id: resident_2
    name: Marcus
    age: 34
    occupation: Civil Engineer
    personality: structured, practical, patient
    habits:
      - maintains a strict routine for the toddler's meals and naps
      - organizes the kitchen by color-coding plates and bowls
      - leaves his work laptop in the home office to avoid distraction
      - puts the toddler's blanket in the laundry basket only after it has been
        used for a full day
      - keeps his keys in a specific hook by the door and expects others to do the
        same
  - id: resident_3
    name: Leo
    age: 2
    occupation: toddler
    personality: curious, mobile, object-obsessed
    habits:
      - carries a single toy or block around the house for hours
      - attempts to put small objects like keys or pens in his mouth
      - drags the remote control under the sofa when he wants attention
      - throws plates on the floor when frustrated during mealtime
      - holds onto the water bottle and refuses to let go during transitions
relationships: >-
  Elena and Marcus are partners who share parenting duties, with Marcus handling
  the more structured routines while Elena provides flexible, creative play. Leo
  is their son, who acts as the primary disruptor of both their personal spaces.
  The main point of friction is Elena's tendency to let work materials spill into
  shared living areas, which Marcus counters by enforcing a 'clean table' rule before
  meals.
home_layout_notes: >-
  The home features an open-plan living and dining area where the toddler's play
  mat is permanently set up, creating a barrier between the dining table and the
  sofa. The kitchen is a high-traffic zone for Marcus's meal prep and Leo's snack
  demands, while the home office is Elena's sanctuary that she often has to leave
  to supervise Leo. The bedroom is shared by all three, with Leo in a crib that
  is gradually being converted to a toddler bed.
