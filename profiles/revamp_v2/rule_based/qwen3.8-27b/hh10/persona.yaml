daily_life_summary: >-
  Elena works from home in the living room, often with Leo playing on the mat nearby,
  while Marcus is at the office until late afternoon. When Marcus returns, he takes
  over dinner prep and Leo's bath, allowing Elena to finish her design work in the
  home office. Their days overlap in the evenings when they both wind down with
  Leo, often resulting in a chaotic but warm atmosphere as they navigate the toddler's
  needs and their own fatigue.
quirks: >-
  This household is notably more visually chaotic than the typical tidy young family,
  with Elena's creative work materials constantly competing for space with Leo's
  toys. The dynamic is less about strict routine and more about a flexible, adaptive
  system where Marcus provides structure only when necessary, allowing Elena to
  work in bursts of creativity.
