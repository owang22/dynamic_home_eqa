household_id: hh_010
household_type: couple_with_toddler
residents:
  - id: resident_1
    name: Elena
    age: 34
    occupation: Landscape Architect
    personality: meticulous, sensory-sensitive, patient
    habits:
      - Keeps a dedicated 'drop zone' basket by the front door for all incoming
        items (keys, wallets, jackets) to prevent clutter from spreading.
      - Wipes down the kitchen counter immediately after any meal or snack, refusing
        to let crumbs remain.
      - Borrows resident_2's gardening gloves from the hall shelf when working on
        the balcony plants, often leaving them damp on the counter.
      - Moves the toddler's high chair to the dining table only when needed, then
        pushes it back against the wall to keep the floor clear.
      - Reads one chapter of a book on the couch before bed, leaving it open on
        the side table.
      - Places resident_3's favorite stuffed animal in the crib at nap time, ensuring
        it is always in the same spot.
  - id: resident_2
    name: Marcus
    age: 36
    occupation: High School History Teacher
    personality: relaxed, forgetful, enthusiastic
    habits:
      - Leaves his car keys on the kitchen island while making coffee, relying on
        Elena to remind him to grab them.
      - Carries a notebook in his shirt pocket for lesson ideas, often losing pages
        which he later finds in his jacket pockets.
      - Leaves his work jacket draped over the back of the dining chair, creating
        a tripping hazard that Elena regularly re-hangs.
      - Borrows resident_1's reading glasses to mark up grading papers, returning
        them only when he remembers.
      - Places his phone face down on the nightstand to avoid notifications during
        dinner, but forgets to turn it off.
      - Puts away resident_3's toys in bulk at the end of the day, mixing them into
        a single bin rather than sorting by type.
  - id: resident_3
    name: Leo
    age: 2
    occupation: student
    personality: curious, mobile, destructive
    habits:
      - Grabs any small object (pens, keys, remote) and carries it to the corner
        of the room to hide or drop.
      - Drags his blanket from the crib to the living room floor during nap time,
        then falls asleep on the rug.
      - Chews on the edge of resident_1's book pages when they are left within reach.
      - Pushes resident_2's phone off the nightstand while trying to climb out of
        the crib.
      - Uses the kitchen table as a drawing surface, leaving crayon marks that require
        immediate cleaning.
      - Carries his water bottle to the bathroom and attempts to flush it, requiring
        constant supervision.
relationships: >-
  Elena and Marcus are partners who share domestic labor with an uneven but functional
  split: Elena manages the physical order and sensory environment of the home, while
  Marcus handles the bulk of the toddler's direct care and educational stimulation.
  Their main point of friction is the 'drop zone' discipline; Marcus frequently
  bypasses it, leaving items scattered, which causes Elena significant stress. They
  coordinate on Leo's schedule, with Marcus taking over bath time and bedtime stories
  to allow Elena to decompress in the evening.
home_layout_notes: >-
  The kitchen and living room are the primary shared spaces, heavily trafficked
  by Leo's movements. The dining table is used for meals, Elena's work, and Marcus's
  grading, but is often covered in Leo's toys or drawings. The bedroom is a sanctuary
  for Elena and Marcus, but Leo's blanket and toys frequently invade it. The front
  entryway is strictly controlled by Elena to maintain order, while the balcony
  is Marcus's personal space for gardening.
