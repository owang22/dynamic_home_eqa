household_id: hh_004
household_type: college_roommates
residents:
  - id: resident_1
    name: Leo
    age: 21
    occupation: student
    personality: anxious, detail-oriented, messy
    habits:
      - keeps his laptop open on the desk even when sleeping, often spilling coffee
        on it
      - leaves his headphones tangled around his neck after every lecture
      - borrows resident_2's charger when his own is in the lab and rarely returns
        it
      - stacks empty coffee mugs in the sink until resident_3 yells at him
      - loses his keys in the couch cushions every single day
  - id: resident_2
    name: Maya
    age: 20
    occupation: student
    personality: social, forgetful, energetic
    habits:
      - leaves her backpack in the hallway entryway after coming home from parties
      - uses the shared remote to switch channels while eating, then forgets to
        put it back
      - leaves her water bottle on the kitchen counter for days until it grows mold
      - borrows resident_1's jacket when it gets cold and forgets to return it for
        a week
      - drops her phone on the floor while dancing in the living room
  - id: resident_3
    name: Sam
    age: 22
    occupation: student
    personality: tidy, irritable, efficient
    habits:
      - clears the kitchen table immediately after meals, moving everyone's plates
        to the dishwasher
      - keeps a strict inventory of shared items like the umbrella and towels
      - leaves his glasses on the bathroom counter, which annoys resident_1 who
        needs them for reading
      - puts his medication bottle on the nightstand and forgets to take it if he
        is not in his room
      - uses the gaming controller to play in the living room, blocking resident_2
        from using the couch
  - id: resident_4
    name: Jade
    age: 19
    occupation: student
    personality: creative, distracted, sentimental
    habits:
      - scatters her notebooks and pens across the living room floor while brainstorming
      - keeps her phone on the nightstand in the shared bedroom, leading to late-night
        calls that wake resident_1
      - leaves her book on the shared sofa for days, becoming a permanent fixture
      - uses the shared wallet to buy snacks and forgets to reimburse the group
        fund
      - drops her umbrella in the hallway and forgets to take it, leaving it there
        for a week
relationships: >-
  Leo and Maya are close friends who often borrow each other's items without asking,
  leading to frequent conflicts over missing chargers and jackets. Sam is the de
  facto house manager, enforcing cleanliness and order, which creates friction with
  Leo's messiness and Jade's scattered creativity. Jade and Maya share a bedroom,
  but their different sleep schedules and habits (Jade's late-night calls vs. Maya's
  early mornings) lead to constant negotiation over noise and space. The shared
  living room is a battleground for the remote control, the sofa, and the floor
  space, with Sam often clearing it out and Jade immediately cluttering it again.
home_layout_notes: >-
  The living room is the central shared space, with a sofa, a coffee table, and
  a TV, where all four residents gather, eat, and argue. The kitchen is a high-traffic
  area, with a sink that Leo clogs with mugs and a counter where Maya leaves her
  water bottle. The hallway is a catch-all for forgotten items like Jade's umbrella
  and Maya's backpack. The bedrooms are private, but Jade's phone calls and Leo's
  laptop noise often bleed into the shared space.
