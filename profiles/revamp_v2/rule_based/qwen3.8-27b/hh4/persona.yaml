daily_life_summary: >-
  The day starts with a rush in the hallway as David and Sarah get ready, Leo grabs
  his headphones, and Mia fumbles for her backpack. During the day, the house is
  quiet except for the sound of Leo gaming or Mia drawing, while the parents are
  at work. In the evening, the family converges in the living room and kitchen,
  where Sarah enforces clearing the table and David relaxes on the sofa. The day
  ends with Leo retreating to his room with his controller and Mia bringing her
  blanket to the living room for a final story.
quirks: >-
  David keeps a 'lost and found' drawer in the kitchen specifically for misplaced
  items like keys and wallets, which the kids use to hide their own lost things.
  Leo has a dedicated 'gaming station' in the corner of the living room that is
  technically off-limits to Mia but is always violated.
