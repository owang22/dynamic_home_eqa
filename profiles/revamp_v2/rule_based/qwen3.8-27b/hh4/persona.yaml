daily_life_summary: >-
  Leo spends most of his time in his room, working on his laptop, but his mess spills
  into the shared living room, where Maya often gathers with friends. Sam tries
  to maintain order by cleaning the kitchen and living room, but his efforts are
  constantly undone by Jade's scattered notebooks and Maya's forgotten items. Jade
  is often in the living room or hallway, brainstorming or socializing, while Leo
  and Maya often overlap in the kitchen, leading to conflicts over the sink and
  counter. The days are a cycle of chaos and cleanup, with Sam constantly tidying
  and the others constantly creating mess.
quirks: >-
  This household is not a typical college roommate group because Sam is a senior
  who is trying to maintain a professional and tidy environment, while the others
  are younger and more chaotic. The shared wallet used by Jade for snacks is a unique
  dynamic that leads to constant financial negotiations.
