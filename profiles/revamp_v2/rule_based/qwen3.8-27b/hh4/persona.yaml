household_id: hh_004
household_type: family_teen_and_child
residents:
  - id: resident_1
    name: Sarah
    age: 42
    occupation: Accountant
    personality: organized, stressed, protective
    habits:
      - clears the kitchen table immediately after dinner to reset the space for
        homework
      - keeps her laptop and work documents strictly on the dining table, not the
        desk
      - moves the child's toys from the living room to their bedroom before guests
        arrive
      - leaves her reading glasses on the kitchen counter while checking emails
      - puts the laundry basket in the hallway to remind the teen to do their share
  - id: resident_2
    name: David
    age: 45
    occupation: Sales Manager
    personality: laid-back, forgetful, tech-savvy
    habits:
      - leaves his work jacket over the back of the sofa chair for weeks
      - forgets to put his phone charger in the drawer, leaving it on the nightstand
      - uses the tablet for streaming movies in the living room
      - keeps his wallet in the car but brings it home occasionally, losing it in
        the coat pocket
      - takes the vacuum cleaner out but often forgets to put the attachments back
        on the wall
  - id: resident_3
    name: Leo
    age: 16
    occupation: student
    personality: introverted, focused, messy
    habits:
      - leaves his gaming controller on the couch after playing in the living room
      - keeps his headphones around his neck even when sleeping
      - leaves his school backpack on the bedroom floor, never on the hook
      - borrows the family laptop for homework but leaves it open on his desk
      - drinks from the shared water bottle and leaves it on the fridge door
  - id: resident_4
    name: Mia
    age: 8
    occupation: student
    personality: creative, energetic, forgetful
    habits:
      - draws in the notebook at the kitchen table and leaves the pen on the table
      - leaves her school backpack in the hallway closet, mixing it with dad's jacket
      - plays with the toy blocks on the living room rug, scattering them
      - keeps her water bottle in her backpack until she remembers to drink it
      - brings the blanket from the bedroom to the living room to watch TV
relationships: >-
  Sarah and David are married; Sarah manages the household logistics while David
  handles tech and maintenance, leading to friction when David forgets to put things
  away. Leo and Mia are siblings; Leo often feels his space is invaded by Mia's
  toys, while Mia idolizes Leo but is frustrated by his refusal to help with chores.
  The main coordination point is the kitchen table, where Sarah insists on clearing
  it for homework, but Leo and Mia often leave their items behind.
home_layout_notes: >-
  The kitchen table is the central hub for homework and meals, shared by all four
  but often cluttered. The living room is contested space: David's sofa, Leo's gaming
  setup, and Mia's play area all overlap. Bedrooms are personal: Leo's is tech-heavy
  and messy, Mia's is colorful and toy-filled, and the parents' is relatively tidy
  but holds the main laundry basket.
