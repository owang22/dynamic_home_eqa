  - id: mug_priya
    class: mug
    owner: resident_2
    role: Priya's white porcelain mug, used for tea, always washed immediately after
      use and returned to the cupboard, never left on the counter.
  - id: headphones_elias
    class: headphones
    owner: resident_1
    role: Elias's noise-cancelling headphones, worn around his neck or on his ears,
      often snagged on furniture, and left on his desk or sofa when he takes a break.
  - id: headphones_priya
    class: headphones
    owner: resident_2
    role: Priya's lightweight headphones, kept in her office drawer, used for calls
      and focus, and always returned to the drawer when not in use.
  - id: keys_elias
    class: keys
    owner: resident_1
    role: Elias's car keys, kept in a bowl on the entryway table, often moved by
      Priya when she is tidying, leading to Elias searching for them.
  - id: keys_priya
    class: keys
    owner: resident_2
    role: Priya's car keys, kept in a separate small dish next to Elias's, and she
      is meticulous about returning them to the exact same spot.
  - id: wallet_elias
    class: wallet
    owner: resident_1
    role: Elias's wallet, kept in his pants pocket when out, but left on the kitchen
