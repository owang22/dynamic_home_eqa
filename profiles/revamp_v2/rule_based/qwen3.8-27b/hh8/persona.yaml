household_id: hh_008
household_type: working_couple_no_children
residents:
  - id: resident_1
    name: Elena
    age: 34
    occupation: Architect
    personality: meticulous, visual, impatient with clutter
    habits:
      - leaves architectural sketches and pencils on the kitchen island for review
      - wipes down the desk surface before sitting down to work on personal projects
      - borrows resident_2's umbrella when it starts raining and forgets to return
        it to the hall closet
      - places her reading glasses on top of her laptop when she takes a break
      - organizes her shoes by color in the entryway but leaves her work bag on
        the floor next to them
  - id: resident_2
    name: Marcus
    age: 37
    occupation: High School History Teacher
    personality: relaxed, forgetful, sentimental
    habits:
      - leaves his keys in the same bowl on the counter every single day
      - keeps a stack of old textbooks on the coffee table for reference
      - uses resident_1's water bottle because he forgets to fill his own
      - drops his gym clothes in a pile by the laundry basket instead of in it
      - leaves his phone charging on the nightstand even when he is in the living
        room
relationships: >-
  Elena and Marcus are married and share a practical, low-drama partnership where
  Elena handles the visual aesthetics of the home while Marcus manages the logistical
  routines like grocery lists and bills. They often cross paths in the kitchen in
  the evening, where Elena critiques the placement of items while Marcus tries to
  relax with his books. The main friction point is Marcus's tendency to leave his
  teaching materials and personal items scattered in shared spaces, which Elena
  frequently reorganizes without asking.
home_layout_notes: >-
  The kitchen is the central hub where both residents spend the most time, with
  the island serving as Elena's workspace and the counter as Marcus's drop zone.
  The living room is shared but dominated by Marcus's reading materials and Elena's
  occasional project displays. The bedroom is strictly for sleep, with both keeping
  their sides of the bed organized according to their respective standards.
