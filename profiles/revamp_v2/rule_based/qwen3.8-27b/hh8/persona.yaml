household_id: hh_008
household_type: remote_worker_couple
residents:
  - id: resident_1
    name: Elias
    age: 34
    occupation: Backend Software Engineer
    personality: chaotic, focused, forgetful
    habits:
      - leaves his laptop charger coiled loosely on the desk rather than plugging
        it in when not in use
      - keeps three mugs simultaneously on the kitchen counter, using a new one
        when the current one gets too hot
      - drops his phone on the sofa cushion while watching TV, often forgetting
        it is there until he needs it later
      - stacks technical books on the coffee table as a 'reading queue' that grows
        over weeks
      - wears his headphones around his neck even when not listening, leading to
        them getting snagged on doorframes
  - id: resident_2
    name: Priya
    age: 36
    occupation: UX Researcher
    personality: structured, tidy, analytical
    habits:
      - color-codes her notebooks and keeps them in a specific drawer in the shared
        desk
      - washes her dishes immediately after use, refusing to leave them in the sink
        overnight
      - places her phone on a stand in the kitchen when not in use, keeping it within
        arm's reach but out of the way
      - uses the living room rug for a 15-minute yoga session before work, leaving
        the mat rolled up in the corner
      - organizes shared items like the remote and water bottles into a designated
        'living room tray'
relationships: >-
  Elias and Priya are married and have been working from home together for two years.
  They have a clear division of labor where Priya handles the 'logistical' chores
  (dishes, laundry, grocery ordering) while Elias handles the 'technical' repairs
  and maintenance. The main point of friction is the shared living room; Elias tends
  to sprawl his work items across the coffee table and sofa, which disrupts Priya's
  need for a visually clear space to think, leading to frequent (but low-stakes)
  negotiations about who gets the 'quiet zone'.
home_layout_notes: >-
  The home features a dedicated home office for Priya, which she treats as a sanctuary,
  while Elias works from a desk in the living room and often migrates to the kitchen
  table when his energy shifts. The kitchen is the primary shared space where they
  cross paths for meals and coffee, and the living room is the contested zone where
  leisure and work overlap. The bedroom is strictly for sleep, with a rule that
  no work devices are brought past the door.
object_inventory:
  - id: laptop_elias
    class: laptop
    owner: resident_1
    role: Elias's primary work tool, moves between his living room desk and the
      kitchen table depending on his mood, often left open with code on screen even
      when he steps away.
  - id: laptop_priya
    class: laptop
    owner: resident_2
    role: Priya's work tool, stays in her dedicated home office, rarely leaves the
      desk, and is covered with a sleeve when not in use.
  - id: phone_elias
    class: phone
    owner: resident_1
    role: Elias's personal phone, travels with him throughout the house, often left
      on the sofa, kitchen counter, or nightstand, and is the source of many 'where
      is my phone' moments.
  - id: phone_priya
    class: phone
    owner: resident_2
    role: Priya's personal phone, kept on a kitchen stand or in her office, rarely
      leaves her immediate workspace, and is used for quick notes and scheduling.
  - id: mug_elias_1
    class: mug
    owner: resident_1
    role: Elias's favorite black mug, used for coffee, often found on the living
