daily_life_summary: >-
  Both residents are home for the entire day, creating a high-overlap dynamic where
  they navigate shared spaces constantly. Their days often start with Priya's quiet
  yoga routine while Elias is already hunched over his laptop at the kitchen table.
  Mid-day, they cross paths in the kitchen for lunch, where Priya clears the table
  and Elias is usually still typing. In the evenings, they share the living room
  for leisure, but the transition from work to play is often messy as Elias struggles
  to mentally 'clock out' and clear his workspace.
quirks: >-
  They have a 'silent hour' from 2:00 PM to 3:00 PM where neither speaks to the
  other to allow for deep work, often communicating via sticky notes on the fridge.
  Elias has a 'junk drawer' in the living room that Priya refuses to enter, containing
  a mix of forgotten chargers, snacks, and random hardware.
