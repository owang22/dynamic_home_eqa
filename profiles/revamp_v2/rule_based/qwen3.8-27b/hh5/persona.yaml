daily_life_summary: >-
  Both residents start their days by preparing coffee in the kitchen, often bumping
  into each other as they reach for mugs and bowls. They work side-by-side at the
  dining table for several hours, occasionally stepping into the living room to
  stretch or take calls. In the afternoon, their routines diverge slightly as Elena
  moves to her armchair for sketching, while Marcus remains at the table for data
  entry. They converge in the evening to cook dinner together, clearing the workspace
  of laptops and notebooks before sitting down to eat.
quirks: >-
  Despite both working from home, they have developed a 'silent office' culture
  where they do not speak unless necessary, communicating primarily through text
  messages sent to each other's phones while sitting across from one another. They
  also have a ritual of 'desk clearing' where they compete to see who can organize
  their workspace the most minimally before leaving for the evening.
