household_id: hh_005
household_type: remote_worker_couple
residents:
  - id: resident_1
    name: Elena
    age: 34
    occupation: UX Designer
    personality: visually sensitive, perfectionist, tactile
    habits:
      - arranges her desk accessories in strict geometric patterns every morning
      - leaves her sketchbook open on the coffee table when taking a break
      - steals resident_2's favorite blue mug for her morning coffee without asking
      - keeps her laptop closed on her lap when working in the living room to avoid
        distraction
      - organizes shared pantry items by color, which annoys resident_2
      - puts her reading glasses on the back of her head, causing them to slide
        off and land on the floor frequently
  - id: resident_2
    name: Marcus
    age: 36
    occupation: Data Analyst
    personality: pragmatic, disorganized, tech-reliant
    habits:
      - leaves his phone on the kitchen counter charging while he cooks
      - keeps his notebook and pen in his jacket pocket until they are needed, then
        loses them
      - borrows Elena's charger when his own is not found, leaving it tangled on
        his desk
      - sits in the armchair with his laptop, causing his jacket to pile up on the
        backrest
      - forgets to return the remote to the media console after watching a video
      - keeps his water bottle on the edge of the desk, knocking it over when reaching
        for his keyboard
relationships: >-
  Elena and Marcus are married and have been working from home together for three
  years. They share the kitchen and living room but have established strict boundaries
  around their desks to maintain focus. The main point of friction is the bathroom
  and kitchen counters, where Marcus's tendency to leave items out clashes with
  Elena's need for visual order, leading to silent negotiations about who cleans
  up first each morning.
home_layout_notes: >-
  The home has an open-plan living and dining area where both work, with a dedicated
  kitchen island that serves as a shared workspace. Elena uses the left side of
  the long dining table for her design work, while Marcus occupies the right side.
  The living room sofa is a shared relaxation zone, but the armchair is Marcus's
  personal spot for quick breaks.
