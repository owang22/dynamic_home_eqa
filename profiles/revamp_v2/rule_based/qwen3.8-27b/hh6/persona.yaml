daily_life_summary: >-
  Elena leaves for work early, leaving instructions on the fridge for the teens.
  Marcus usually wakes up last, grabbing a snack and heading to his room, while
  Maya rises early to study or work on art. In the evenings, they cross paths in
  the kitchen and living room, where Elena tries to enforce a tidy environment while
  the teens negotiate for space and privacy. The house is quiet in the late evening
  once the teens are in their rooms, but the kitchen often remains a mess until
  Elena cleans it.
quirks: >-
  Unlike the stereotype of a chaotic single-parent home, this household has a strong
  underlying structure enforced by Elena, but it is constantly undermined by the
  teenagers' individual habits. The dining table serves as a unique 'no-man's-land'
  where homework, grading, and snacking intersect, creating a daily negotiation
  for space.
