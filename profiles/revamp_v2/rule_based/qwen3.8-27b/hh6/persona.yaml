household_id: hh_006
household_type: single_parent_teens
residents:
  - id: resident_1
    name: Elena
    age: 42
    occupation: High School History Teacher
    personality: Organized, anxious, over-caffeinated
    habits:
      - Leaves a stack of graded essays on the dining table until she can find a
        moment to file them
      - Keeps a specific mug for herself and gets annoyed if it is moved to the
        top shelf
      - Lends her laptop to resident_2 when they claim it is 'for research' but
        often ends up playing games
      - Clears the kitchen counter every night to reset the space for the next morning
      - Borrows resident_3's charger from the bedroom to keep her phone alive during
        grading
      - Leaves a bowl of fruit on the counter as a snack for whoever comes home
        first
  - id: resident_2
    name: Marcus
    age: 16
    occupation: Student
    personality: Chaotic, tech-obsessed, forgetful
    habits:
      - Dumps his backpack in the hallway corner immediately upon entering the house
      - Leaves his headphones on the couch or bed, often tangled around his neck
      - Borrows resident_1's laptop and leaves it open on the dining table with
        a half-finished project
      - Leaves his water bottle in the fridge until it is completely empty
      - Sneaks snacks from the shared bowl and leaves crumbs on the counter
      - Leaves his phone on the kitchen counter to charge, blocking the space for
        others
  - id: resident_3
    name: Maya
    age: 14
    occupation: Student
    personality: Tidy, artistic, quiet
    habits:
      - Keeps her notebook and pens neatly arranged in a specific spot on her desk
      - Leaves her glasses on the bathroom counter after washing her face
      - Moves the shared remote to the coffee table when she watches TV in the evening
      - Leaves a blanket on the couch after reading, which she tries to fold but
        often leaves slightly askew
      - Borrows resident_1's car keys to go to the library and returns them to the
        hook by the door
      - Leaves her lunchbox in the fridge until the next morning, where it tends
        to collect condensation
relationships: >-
  Elena is the matriarch who tries to maintain order in a house that constantly
  slides into chaos. Marcus and Maya have a sibling dynamic where Marcus often invades
  Maya's space with his noise and clutter, while Maya keeps her side of the house
  pristine. The main friction point is the dining table, which serves as a neutral
  zone for homework, grading, and snacking, leading to frequent arguments about
  who is occupying the space.
home_layout_notes: >-
  The kitchen is the central hub where Elena prepares food and Marcus tends to clutter
  the counter with electronics. The living room is shared for relaxation, with Maya
  claiming the couch and Marcus using the armchair for gaming. The bedrooms are
  private sanctuaries, with Maya's room being the only truly organized space in
  the house.
