daily_life_summary: >-
  The day begins with Alex and Dana waking early, preparing breakfast in the kitchen,
  while Bella and Chad sleep in. As the day progresses, Bella and Chad emerge, contributing
  to the kitchen mess and common area clutter. Alex studies in his room, Dana organizes
  the common area, and Chad plays games in the living room. In the evening, all
  four gather in the living room for a meal, often takeout, leading to a pile of
  dishes that Dana cleans. The night ends with Alex and Dana tidying their rooms,
  while Bella and Chad leave their items scattered, setting the stage for the next
  day's friction.
quirks: >-
  The household has a 'silent agreement' that Alex's room is off-limits, but Bella
  and Chad occasionally enter to borrow chargers or escape noise. The shared bathroom
  has a 'rotation system' for the hairbrush, but it is often ignored, leading to
  Dana disinfecting it secretly. The kitchen has a 'no leftovers' rule, but Chad's
  takeout containers often linger, prompting Dana to write increasingly stern notes.
