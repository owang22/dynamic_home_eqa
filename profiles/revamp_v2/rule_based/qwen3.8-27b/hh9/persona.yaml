household_id: hh_009
household_type: college_roommates
residents:
  - id: resident_1
    name: Alex
    age: 19
    occupation: student
    personality: disciplined, punctual, minimalist
    habits:
      - Makes bed immediately upon waking, keeps it pristine
      - Uses the same two mugs, washing them immediately after use
      - Charges phone on the nightstand, never leaves it unattended
      - Packs gym bag the previous evening, keeps it by the door
      - Reads textbooks at the desk, stacks them neatly when done
      - Avoids using shared kitchen appliances unless necessary
      - Keeps personal items strictly within their own room boundaries
  - id: resident_2
    name: Bella
    age: 20
    occupation: student
    personality: creative, disorganized, forgetful
    habits:
      - Leaves sketchbooks and pens scattered on the floor and bed
      - Forgets to put dirty dishes in the sink, often leaves them on the counter
      - Uses the shared hairbrush, leaving it on the bathroom counter
      - Plays music loudly on headphones, often losing one earcup
      - Leaves laundry in the hamper until it overflows
      - Keeps a water bottle on the desk for days, refilling it only when empty
      - Borrows Alex's charger when hers breaks, rarely returns it
  - id: resident_3
    name: Chad
    age: 19
    occupation: student
    personality: social, tech-oriented, messy
    habits:
      - Plays video games for long sessions, leaves controller on the bed
      - Eats snacks at the desk, leaving crumbs and wrappers
      - Charges gaming console in the common area, plugging into any available outlet
      - Keeps phone in pocket, rarely uses it for calls, mostly for games
      - Leaves jacket draped over the back of his chair
      - Uses the shared remote to change channels, often leaving it on the coffee
        table
      - Brings takeout containers to the room, discarding them in the shared trash
        can
  - id: resident_4
    name: Dana
    age: 21
    occupation: student
    personality: organized, social, clean
    habits:
      - Does the dishes after everyone else, wiping down the counter
      - Keeps the common area tidy, picking up others' items to put them away
      - Uses the shared vacuum cleaner weekly, storing it in the closet
      - Leaves notes on the fridge about groceries or chores
      - Keeps a notebook in her bag, writing down schedules and reminders
      - Uses the shared makeup kit, organizing it after use
      - Leaves umbrella by the door when it rains, remembering to bring it back
relationships: >-
  Alex and Dana are the 'clean' half, often frustrated by Bella and Chad's mess,
  leading to passive-aggressive notes and unspoken tensions. Bella and Chad are
  the 'messy' half, sharing a chaotic energy and often covering for each other when
  chores are missed. Dana mediates disputes, while Alex withdraws into his room.
  The friction point is the kitchen: Bella and Chad leave messes, and Dana cleans
  them, while Alex avoids the kitchen entirely, creating a divide in shared space
  usage.
home_layout_notes: >-
  The apartment has four bedrooms, two bathrooms, and a shared kitchen/living area.
  Alex and Dana use their rooms for study and rest, keeping them tidy. Bella and
  Chad use their rooms for creative and gaming activities, respectively, with items
  spilling into the hallway. The common area is a battleground: the kitchen counter
  is a hub for dishes and snacks, the living room sofa is where Chad plays games
  and Dana reads, and the bathroom is where Bella's hairbrush and Dana's makeup
  kit compete for space. The laundry room is shared, with Bella's overflowing hamper
  and Dana's organized baskets.
