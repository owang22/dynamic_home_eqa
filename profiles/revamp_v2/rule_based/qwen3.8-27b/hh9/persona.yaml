daily_life_summary: >-
  Elara's day is structured around her research, with long stretches of silence
  interrupted by the sound of typing. She is home for most of the day, only leaving
  for the university library or the lab for short periods. Her days overlap with
  no one, so the apartment is often empty when she is out, and she returns to the
  same static mess she left. The only movement in the space is driven by her shifting
  focus between work and survival tasks like eating and sleeping.
quirks: >-
  Elara does not follow the stereotype of the 'tidy academic'; instead, her workspace
  is a chaotic nest of papers and mugs that she considers 'organized chaos.' She
  also does not use her apartment for socializing, treating it as a purely functional
  space for survival and work.
