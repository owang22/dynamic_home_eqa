household_id: hh_009
household_type: grad_student_solo
residents:
  - id: resident_1
    name: Elara Vance
    age: 26
    occupation: PhD Candidate in Marine Biology
    personality: hyper-focused, chronically disorganized, caffeine-dependent
    habits:
      - stacks empty coffee mugs on the desk until the pile becomes unstable
      - leaves a wet towel on the bathroom floor after showering and forgets to
        put it back
      - moves the laptop from the desk to the couch to the kitchen table depending
        on where the Wi-Fi is strongest
      - uses a single notebook for both lab data and grocery lists, leading to crossed-out
        entries
      - keeps a water bottle in the backpack and forgets to refill it until it is
        completely empty
      - leaves the phone face down on the counter to silence notifications while
        reading
relationships: >-
  Elara lives alone in a small studio apartment, so all chores and spatial decisions
  are entirely hers. She has no one to share chores with, which leads to a cycle
  of neglecting housekeeping until the mess becomes overwhelming, at which point
  she spends an entire day frantically organizing. The primary friction is internal:
  her need for order conflicts with her chaotic work habits, resulting in a home
  that is simultaneously cluttered and intensely personal.
home_layout_notes: >-
  The studio apartment consists of a combined living/sleeping area and a small kitchen
  nook. Elara spends most of her time at the desk by the window, which is her primary
  workspace, and the couch, which is where she sleeps and relaxes. The kitchen counter
  is used for quick meals and as a dumping ground for dirty dishes and books.
