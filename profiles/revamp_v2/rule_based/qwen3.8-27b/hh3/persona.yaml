household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Arthur
    age: 74
    occupation: retired
    personality: methodical, sentimental, meticulous
    habits:
      - Keeps a dedicated, organized station in the living room for his antique
        clock repair kit, ensuring every screw is accounted for.
      - Leaves his reading glasses on the arm of the wingback chair after every
        session.
      - Saves every envelope from official mail in a specific drawer, which often
        overflows onto the desk.
      - Pours a precise amount of tea into his specific blue mug, never using any
        other cup.
      - Borrows resident_2's magnifying lamp for detailed work and returns it only
        when the task is fully complete.
  - id: resident_2
    name: Eleanor
    age: 71
    occupation: retired
    personality: spontaneous, social, clutter-averse
    habits:
      - Uses the dining table as a temporary staging area for gardening tools and
        plants, clearing it only when guests are expected.
      - Leaves her gardening gloves and trowel in the hallway basket, regardless
        of where they were last used.
      - Writes grocery lists on the back of old receipts and leaves them on the
        kitchen counter.
      - Borrows resident_1's sturdy ladder for reaching high shelves and often forgets
        to put it back in the garage.
      - Moves her comfortable throw blanket from the sofa to the armchair depending
        on where the afternoon sun hits.
relationships: >-
  Arthur and Eleanor have been married for 45 years and share a deep, comfortable
  silence, though their approaches to order clash frequently. Eleanor’s spontaneous
  gardening projects often encroach on Arthur’s meticulously organized workshop
  space, leading to gentle but persistent friction. They coordinate by Arthur handling
  all financial and administrative paperwork while Eleanor manages household maintenance
  and social invitations, though they often argue over whose turn it is to water
  the plants in the conservatory.
home_layout_notes: >-
  The home is centered around a large conservatory where Eleanor spends most of
  her days, while Arthur claims a quiet corner of the living room as his personal
  workshop. The kitchen is the primary shared space where they both linger, with
  Arthur’s desk nearby allowing him to monitor the room while working. The hallway
  is a neutral zone where Eleanor’s gardening equipment often piles up, blocking
  Arthur’s path to his workshop.
