household_id: hh_007
household_type: family_school_age_children
residents:
  - id: resident_1
    name: Elena
    age: 38
    occupation: Architect
    personality: organized, perfectionist, easily distracted by clutter
    habits:
      - keeps her drafting tools and pencils in a specific drawer in the kitchen
        island, returning them immediately after use
      - borrows resident_2's reading glasses from the bathroom counter and often
        leaves them on the coffee table
      - clears the dining table of all school papers and snacks immediately after
        the children finish eating
      - uses her laptop at the kitchen table while the kids do homework, creating
        a 'work zone' that encroaches on their space
      - hangs wet towels on the bathroom rack in a precise fold, adjusting them
        if resident_3 leaves them crumpled
  - id: resident_2
    name: Marcus
    age: 40
    occupation: High School History Teacher
    personality: relaxed, forgetful, sentimental
    habits:
      - leaves his work notebook and loose papers on the kitchen counter for days
        until Elena moves them
      - forgets to put his car keys in the bowl by the door, leading to frantic
        searches
      - reads in the living room armchair, leaving his book open on the cushion
      - often leaves his phone charging on the nightstand, but frequently takes
        it to the bathroom and forgets it there
      - borrows resident_1's water bottle from the fridge and refills it, rarely
        returning it to its original spot
  - id: resident_3
    name: Leo
    age: 12
    occupation: student
    personality: independent, tech-focused, messy
    habits:
      - leaves his backpack on the floor by the front door, kicking it aside to
        enter
      - uses his headphones in the living room, often losing the remote control
        under the couch cushions
      - leaves his gaming controller on the sofa armrest after playing
      - forgets his lunchbox in the fridge, requiring resident_1 to remind him
      - uses his laptop in his bedroom, leaving it open on the bed
  - id: resident_4
    name: Maya
    age: 8
    occupation: student
    personality: creative, energetic, forgetful
    habits:
      - leaves her art supplies and colored pencils scattered on the dining table
      - borrows resident_1's pen from the kitchen drawer and loses it frequently
      - leaves her school jacket on the back of the dining chair
      - keeps her water bottle in the living room, moving it between the sofa and
        the coffee table
      - leaves her book on the kitchen counter after reading
relationships: >-
  Elena and Marcus are married, with Elena managing the household's organization
  and Marcus providing a more relaxed counterbalance. The children, Leo and Maya,
  are siblings who share a bedroom but have distinct personalities and habits. Elena
  often feels frustrated by the clutter created by Marcus and the children, leading
  to occasional tensions about tidiness. Marcus tries to mediate by helping with
  light chores, but his forgetfulness often requires Elena to step in and clean
  up after him. The children's belongings frequently spread into shared spaces,
  particularly the kitchen and living room, creating a constant need for coordination
  and cleanup.
home_layout_notes: >-
  The kitchen is the central hub, used by all four residents for meals, homework,
  and work. Elena's work zone at the kitchen table often overlaps with the children's
  homework area. The living room is shared for leisure, with the sofa and coffee
  table frequently occupied by Leo's tech gadgets and Maya's art supplies. The bedrooms
  are private, but items often migrate to shared spaces. The bathroom is shared,
  with towels and glasses often misplaced by Marcus and Elena.
