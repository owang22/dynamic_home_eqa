household_id: hh_007
household_type: family_school_age_children
residents:
  - id: resident_1
    name: Elena
    age: 38
    occupation: Architect
    personality: meticulous, visual, easily distracted by clutter
    habits:
      - sketches on any available surface, often leaving notebooks and pens scattered
        on the dining table
      - uses the dining table as a drafting space, pushing shared items to the edges
      - organizes the kids' school bags by color but often forgets to put her own
        keys back in the hook
      - moves the laptop between the desk and the couch depending on where she finds
        quiet
      - borrows resident_2's reading glasses when her own are in the sink, leaving
        them on the counter
      - clears the dining table of the children's homework before starting her own
        work, causing minor friction
      - keeps her water bottle on the desk, but it often ends up in the kids' room
        if they see it
  - id: resident_2
    name: Marcus
    age: 41
    occupation: High School History Teacher
    personality: organized, patient, sentimental about objects
    habits:
      - keeps a strict routine for packing lunchboxes, often waking the house up
        with the sound of zippers
      - leaves his teaching materials (notebooks, pens) on the kitchen table late
        into the evening
      - uses the living room armchair for grading, often leaving a stack of papers
        and his glasses there
      - borrows resident_1's laptop charger for his own devices, creating a constant
        game of 'who has the right plug'
      - keeps his wallet and keys in a specific bowl by the door, but the children
        often move it
      - reads in bed, leaving his book on the nightstand, which Elena sometimes
        moves to the table
      - organizes the toy bin, but the children always re-fill it within hours
  - id: resident_3
    name: Leo
    age: 11
    occupation: student
    personality: chaotic, curious, forgetful
    habits:
      - leaves his backpack in the middle of the hallway, creating a tripping hazard
      - uses the dining table for homework, leaving pens and notebooks scattered
      - borrows resident_1's headphones to listen to music, often leaving them on
        the couch
      - keeps his water bottle in his backpack, but it leaks and soaks his homework
      - moves the remote control to the couch, where he plays video games, ignoring
        the kitchen area
      - forgets to return his lunchbox to the fridge, leaving it in the hallway
      - takes resident_2's glasses to see the whiteboard, leaving them on the desk
  - id: resident_4
    name: Mia
    age: 7
    occupation: student
    personality: creative, messy, affectionate
    habits:
      - leaves her art supplies (pens, notebooks) on the dining table and floor
      - uses the living room rug for drawing, often moving the blanket around
      - borrows resident_1's water bottle, often leaving it empty on the table
      - keeps her toy in her backpack, but it often falls out in the hallway
      - moves the remote control to her room, where she watches cartoons, ignoring
        the shared space
      - forgets to put her jacket in the closet, leaving it on the chair
      - takes resident_2's book to bed, leaving it on the nightstand
relationships: >-
  Elena and Marcus are partners who share the burden of school logistics, though
  Elena’s need for a clear workspace often conflicts with the children’s tendency
  to spread their belongings across the dining table. Leo and Mia are siblings who
  constantly mix up their items, with Leo often taking charge of returning things
  and Mia leaving a trail of creative messes. The main friction point is the dining
  table, which serves as a drafting desk, a homework station, and a play area, leading
  to daily negotiations about whose items get moved.
home_layout_notes: >-
  The dining table is the central hub, used by Elena for work, Marcus for grading,
  and the children for homework and art. The living room is a shared space for relaxation,
  where the couch and rug are frequently occupied by the children, and the hallway
  is a bottleneck for backpacks and jackets. The kitchen is Marcus’s domain for
  meal prep, but it is constantly invaded by the children’s water bottles and snack
  wrappers.
