household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Dario Mercado
    age: 34
    occupation: hospital sterile-processing technician (overnight shift)
    personality: methodical at work but drops things wherever he lands at home;
      protective of his sleep; sentimental about a few specific objects
    habits:
      - comes home at dawn and sheds his jacket, keys, and wallet in a pile on the
        entry table before doing anything else
      - packs his lunchbox the evening before a shift and stages it on the kitchen
        counter by the door so he can grab it half-asleep
      - takes melatonin from the medication bottle on the nightstand and puts his
        phone face-down next to it before blacking out the bedroom
      - eats his 'dinner' breakfast on the couch from a bowl, wrapped in the couch
        blanket, and often leaves the bowl on the coffee table until he wakes
      - plays a quiet hour of games before bed, then abandons the gaming controller
        on the couch cushion where the remote also hides
      - refills the same dented water bottle every wake-up and carries it room to
        room, losing track of it about once a week
      - reads a few pages of a paperback under the blackout curtains, leaving the
        book splayed open on the bed when sleep hits
      - does one fast tidy pass on his nights off, ferrying stray mugs and the bowl
        back to the kitchen sink in a single armload
relationships: >-
  Dario lives alone, so every chore is his — done in bursts on his two nights off
  rather than daily. His main coordination problem is with himself across sleep
  cycles: pre-work Dario stages things by the door for post-work Dario, who is too
  tired to put anything back where it belongs. The entry table pile and the coffee-table
  dishes are a standing truce between his two selves.
home_layout_notes: >-
  One-bedroom apartment: a blacked-out bedroom he treats as a sleep cave (nightstand
  holds phone, medication, glasses, and whatever book he's reading), a living room
  where he actually lives (couch, coffee table, TV corner), and a small kitchen
  whose counter by the door doubles as a launch pad for lunchbox and keys. The bathroom
  towel rack and the entry table are the only other surfaces that see daily traffic.
object_inventory:
  - id: phone_dario
    class: phone
    owner: resident_1
    role: alarm and shift-schedule lifeline; travels from pocket to nightstand at
      dawn, charges there while he sleeps
  - id: keys_dario
    class: keys
    owner: resident_1
    role: dropped on the entry table at dawn, snatched up again at dusk; the object
      he most often pats his pockets hunting for
  - id: wallet_dario
    class: wallet
    owner: resident_1
    role: rides in his jacket pocket to work and lands on the entry table with the
      keys after every shift
  - id: jacket_dario
    class: jacket
    owner: resident_1
    role: commute layer against the pre-dawn chill; slung over the entry chair after
      shifts instead of the closet hook
  - id: lunchbox_dario
    class: lunchbox
    owner: resident_1
    role: midnight-meal carrier; packed the evening before, staged on the counter
      by the door, dumped by the sink at dawn
  - id: medication_bottle_melatonin
    class: medication_bottle
    owner: resident_1
    role: melatonin for daytime sleep; lives on the nightstand and is the last thing
      he touches before bed, occasionally carried to the kitchen and stranded there
  - id: water_bottle_dario
    class: water_bottle
    owner: resident_1
    role: his roaming hydration companion; refilled at the kitchen sink each wake-up,
      migrates to the couch, nightstand, or work bag
  - id: bowl_1
    class: bowl
    owner: resident_1
    role: the dawn-dinner bowl; travels kitchen to coffee table almost daily and
      back to the sink only on tidy nights
  - id: mug_1
    class: mug
    owner: resident_1
    role: evening 'morning coffee' mug before shifts; often abandoned half-full
      on the counter or coffee table
  - id: plate_1
    class: plate
    owner: resident_1
    role: used on nights off for real cooked meals at the kitchen counter; washed
      and reshelved the same night
  - id: blanket_couch
    class: blanket
    owner: resident_1
    role: couch cocoon for post-shift decompression; left rumpled on the couch,
      refolded only during tidy passes
  - id: remote_tv
    class: remote
    owner: resident_1
    role: vanishes into couch cushions under the blanket; retrieved every wind-down
      session
  - id: gaming_controller_1
    class: gaming_controller
    owner: resident_1
    role: his pre-sleep decompression tool; picked up on the couch after dawn dinner,
      abandoned on the cushion when melatonin kicks in
  - id: headphones_dario
    class: headphones
    owner: resident_1
    role: worn on the walk home and for quiet late-night gaming so neighbors sleep;
      hung on the entry hook or forgotten around his neck
  - id: book_paperback
    class: book
    owner: resident_1
    role: bedside paperback read in the blackout dark's last minutes; found splayed
      face-down on the bed or nightstand
  - id: glasses_dario
    class: glasses
    owner: resident_1
    role: reading glasses that shuttle between nightstand and coffee table depending
      on where he last read or gamed
  - id: charger_bedroom
