daily_life_summary: >-
  Dario's day runs backward from the neighborhood's: he leaves for the hospital
  when the building is settling down for the night and comes home as it wakes up.
  On return he sheds jacket, keys, and wallet at the door, showers, eats a bowl
  of leftovers on the couch under the blanket, games or reads briefly, takes melatonin,
  and sleeps through the loud middle of the day behind blackout curtains. He wakes
  in the late afternoon to the apartment exactly as he left it — no one moves anything
  but him — refills his water bottle, packs the lunchbox, and cooks a real meal
  only on nights off. He crosses paths with almost no one, which makes his two nights
  off feel like visiting a different, sunlit apartment.
quirks: >-
  Despite the graveyard schedule he is not a hermit — on his nights off he cooks
  elaborate meals and video-calls family from the kitchen counter, treating the
  plate and laptop-less counter as his social hub. He also runs a strict 'two selves'
  system: pre-shift Dario stages objects by the door as gifts to post-shift Dario,
  and blames him loudly when the system fails.
