household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Alex Torres
    age: 29
    occupation: hospital lab technician
    personality: methodical, sleep-deprived, creature of habit
    habits:
      - leaves work boots by the door and kicks them into the corner
      - eats a bowl of cereal standing at the kitchen counter at 2 AM
      - charges phone in the bathroom while showering, forgets it there sometimes
      - reads on the couch with a blanket, leaves the book face-down on the armrest
      - sets multiple alarms on the phone, but often sleeps through the first two
      - carries the water bottle from bedroom to kitchen to couch throughout the
        night
      - uses the same mug every night for coffee, leaves it in the sink unwashed
        until the next morning
relationships: >-
  Alex lives alone. There is no one else to share chores or spaces with, so everything
  is Alex's responsibility, but clutter accumulates because Alex is too tired after
  shifts to clean thoroughly. The only friction is between Alex's night schedule
  and the apartment building's daytime maintenance hours, which sometimes disrupt
  sleep.
home_layout_notes: >-
  One-bedroom apartment. The bedroom has blackout curtains and is used exclusively
  for sleeping. The kitchen and living room are combined; Alex uses the kitchen
  counter as a catch-all for mail, keys, and the phone charger. The couch is the
  main reading and eating spot during waking hours.
object_inventory:
  - id: mug_1
    class: mug
    owner: resident_1
    role: Alex's sole coffee mug; used every night, left in sink until next evening
  - id: bowl_1
    class: bowl
    owner: resident_1
    role: used for cereal and quick meals; left on counter after eating
  - id: phone_1
    class: phone
    owner: resident_1
    role: Alex's alarm clock and only connection to daytime world; moved from nightstand
      to bathroom to pocket
  - id: keys_1
    class: keys
    owner: resident_1
    role: apartment and work keys; always dropped on kitchen counter upon entry
  - id: water_bottle_1
    class: water_bottle
    owner: resident_1
    role: carried from bedroom to kitchen to couch during the night; refilled at
      kitchen sink
  - id: book_1
    class: book
    owner: resident_1
    role: nighttime reading; left face-down on couch armrest or nightstand
  - id: blanket_1
    class: blanket
    owner: resident_1
    role: used on couch during wind-down; often left crumpled on couch all day
  - id: laptop_1
    class: laptop
    owner: resident_1
    role: used for occasional online errands and streaming; stays on coffee table
      mostly
daily_life_summary: >-
  Alex wakes in the late afternoon, groggy, and makes coffee in the same mug every
  evening. The apartment is dark and quiet. Alex eats a quick meal, then leaves
  for the hospital before most people are eating dinner. During the overnight shift,
  Alex works in the lab with few colleagues. Returns home around sunrise, eats a
  small snack, and winds down on the couch with a book or phone before falling asleep
  mid-morning. The apartment is empty and silent while Alex sleeps through the day.
quirks: >-
  Unlike the stereotype of a night shift worker who sleeps all day and does nothing
  else, Alex maintains a reading habit and actually eats sit-down meals (even if
  just cereal). The apartment is not messy in a chaotic way, but has a precise,
  tired clutter — everything is exactly where Alex last dropped it.
