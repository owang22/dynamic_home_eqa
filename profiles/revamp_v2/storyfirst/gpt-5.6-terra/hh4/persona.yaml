daily_life_summary: >-
  Nadia and Evan leave the home for separate work responsibilities, while Leila
  and Mateo take school bags, phones, and water bottles out for school. When everyone
  returns, the kitchen becomes the busiest place for unpacking lunchboxes, homework,
  meal preparation, and reminders about chores. Leila often retreats upstairs with
  schoolwork, while Mateo remains near the living room and kitchen; the family reconnects
  over a shared meal and a negotiated reset of dishes, toys, and the remote. On
  non-school days, Evan's inspection paperwork and Nadia's planning can share the
  kitchen table with the children's projects.
quirks: >-
  Rather than being sports-centered, this family spends much of its shared indoor
  time reading, homework, drawing, and building elaborate blanket forts. The parents
  use a visible chore system, but it is intentionally flexible enough that each
  child can trade a task when schoolwork or a project is demanding.
