household_id: hh_004
household_type: family_teen_and_child
residents:
  - id: resident_1
    name: Nadia Flores
    age: 42
    occupation: public library branch manager
    personality: methodical, warm, mildly clutter-averse
    habits:
      - sets her phone, keys, and wallet together in a bowl by the entry after returning
        home
      - carries a water bottle and lunchbox out for work, then rinses them at the
        kitchen sink
      - clears the dinner table and assigns the children specific dishwashing tasks
      - keeps a library book on her nightstand and moves it between bed and the
        sofa
      - uses a notebook on the kitchen counter to track groceries and school reminders
      - folds clean towels from the laundry basket and leaves each person's stack
        outside their bedroom
      - returns stray mugs and plates from bedrooms to the sink when she notices
        them
  - id: resident_2
    name: Evan Flores
    age: 44
    occupation: building inspector
    personality: practical, hurried, handy but forgetful
    habits:
      - takes his phone, keys, wallet, and work backpack whenever he leaves for
        inspections
      - drops his jacket over the dining-chair back instead of hanging it in the
        entry closet
      - makes coffee in his marked mug and often leaves it beside the sink until
        Nadia prompts him
      - uses his laptop at the dining table to finish reports and packs it back
        into his backpack afterward
      - keeps a small notebook and pen in his backpack for site notes
      - does the heavier laundry loads and moves the shared laundry basket between
        bedrooms and the washer
      - searches for the shared remote after Mateo has carried it away from the
        sofa
  - id: resident_3
    name: Leila Flores
    age: 16
    occupation: student
    personality: creative, private, organized only around schoolwork
    habits:
      - takes her phone, keys, wallet, backpack, and water bottle whenever she goes
        to school or meets friends
      - does homework on her bedroom desk with headphones on and leaves notebooks
        spread there
      - charges her phone beside her bed, sometimes taking a family charger from
        the kitchen
      - carries dishes upstairs while studying and leaves a mug or bowl on her nightstand
        until asked to bring it down
      - keeps her makeup kit and hairbrush on her dresser rather than in the shared
        bathroom
      - uses a yoga mat in her bedroom for short stretches and rolls it behind her
        door afterward
      - borrows the bathroom mirror space before outings, which leaves the counter
        crowded with her things
  - id: resident_4
    name: Mateo Flores
    age: 9
    occupation: student
    personality: energetic, imaginative, easily distracted
    habits:
      - puts his phone and house keys in his backpack for school but sometimes forgets
        to unpack them at home
      - spreads toys across the living-room rug while watching programs with the
        shared remote
      - takes his water bottle and lunchbox to school and leaves both on the kitchen
        counter afterward
      - does homework at the kitchen table, leaving pencils, notebooks, and a bowl
        nearby
      - builds blanket forts on the sofa and returns the blanket only after being
        reminded
      - uses the family tablet for games at the dining table and leaves it there
        when called away
      - puts dirty clothes beside, rather than inside, the laundry basket unless
        Evan checks
relationships: >-
  Nadia and Evan are married and coordinate school logistics, meals, and laundry,
  although Nadia handles most daily tidying while Evan takes on larger loads and
  practical errands. Leila has a bedroom of her own and guards her desk space, while
  Mateo gravitates toward the kitchen and living room; both children are expected
  to clear their own dishes. A recurring friction point is Leila's upstairs dishware
  and Mateo's toys and remote migrating through the living room, which Evan usually
  asks them to reset before family use of the space.
home_layout_notes: >-
  The kitchen table is a shared landing zone for Mateo's homework, Evan's occasional
  reports, and family meals, so it is cleared and reused often. Leila's bedroom
  contains her desk, personal charger, makeup kit, and yoga mat, while Mateo's bedroom
  holds most of his toys but some regularly spill into the living room. The entry
  bowl and coat area are important shared transition spaces for phones, keys, bags,
  jackets, and school items.
