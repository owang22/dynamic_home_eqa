household_id: hh_005
household_type: couple_with_toddler
residents:
  - id: resident_1
    name: Elena Park
    age: 34
    occupation: museum education coordinator
    personality: methodical, warm, mildly clutter-blind during busy stretches
    habits:
      - packs her phone, keys, wallet, and lunchbox together before leaving home
      - drinks tea from her own mug and leaves it beside the kitchen sink until
        she can wash it
      - keeps a notebook and pen on the dining table for family lists and toddler
        observations
      - sets out a bowl and spoon for Milo's snacks, then rinses them after he finishes
      - brings library books into Milo's bedroom for stories and returns them to
        the living-room basket afterward
      - folds clean towels on the sofa before carrying them to the bathroom
      - checks that Milo's water bottle is in his backpack before childcare drop-off
  - id: resident_2
    name: Jonah Reed
    age: 36
    occupation: bicycle mechanic
    personality: practical, playful, forgetful about tidying
    habits:
      - takes his phone, keys, wallet, and water bottle out with him and empties
        his pockets onto the entry shelf when he returns
      - uses the shared pot or pan for simple dinners and leaves it soaking in the
        sink if Milo needs attention
      - builds block towers with Milo on the living-room rug and gathers the toys
        into a low basket afterward, though not always completely
      - keeps his jacket draped over the back of a dining chair instead of hanging
        it up
      - uses the vacuum cleaner for quick passes around the dining table after messy
        meals
      - borrows Elena's pen for shopping notes and leaves it near the refrigerator
      - takes over bath cleanup by hanging wet towels and putting bath toys back
        in the bathroom
  - id: resident_3
    name: Milo Reed-Park
    age: 3
    occupation: student
    personality: curious, energetic, possessive of favorite things
    habits:
      - carries his water bottle between the kitchen, living room, and bedroom and
        often abandons it under the sofa
      - uses the same small bowl for fruit or crackers and pushes it toward an adult
        when he wants more
      - moves toy animals and blocks from the living-room rug into the hallway and
        back again
      - asks for picture books at bedtime and leaves one open on his blanket
      - wears his small backpack for outings and drops it by the entry when he comes
        home
      - insists on using his own spoon and plate at meals, sometimes leaving them
        on the table
      - brings one favorite toy into the bathroom during tooth-brushing and needs
        a parent to carry it back out
relationships: >-
  Elena and Jonah are partners and share care of Milo, coordinating handoffs around
  childcare, meals, and bedtime. Elena manages lists, bags, and most dishwashing,
  while Jonah handles bath cleanup, quick vacuuming, and much of the cooking. Their
  recurring friction is Jonah's entryway clutter and half-finished toy pickup, while
  Milo objects when either adult moves his preferred toys or snack bowl.
home_layout_notes: >-
  The main shared zone is an open kitchen and living room: Elena uses the dining
  table for lists, Jonah cooks at the kitchen counter, and Milo's toys spread across
  the rug and hallway. Milo has his own bedroom with a low book area and blanket,
  while the adults share the other bedroom and use the entry shelf for leaving-home
  items. The bathroom is a heavily shared cleanup space, with towels and bath toys
  regularly moving through it.
