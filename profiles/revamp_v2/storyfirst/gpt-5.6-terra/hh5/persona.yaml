daily_life_summary: >-
  Elena and Jonah prepare Milo's bag, food, and outerwear together before one of
  them takes him to childcare. Their work keeps them out of the home for much of
  the day, and they regroup in the kitchen and living room for meals, play, and
  cleanup. Milo is most active in the shared rooms when both adults are home, turning
  the route between the rug, table, and bathroom into a trail of toys and dishes.
  After he is asleep, the adults reset the kitchen unevenly: Elena clears dishes
  while Jonah gathers the most visible clutter.
quirks: >-
  They keep a small rotating set of museum-themed picture books and use them more
  than screens. Jonah's repair-minded approach means he turns cleanup into games,
  asking Milo to "park" toys in their basket.
