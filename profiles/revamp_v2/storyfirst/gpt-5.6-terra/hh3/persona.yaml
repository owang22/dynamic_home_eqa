household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Elaine Mercer
    age: 68
    occupation: retired public librarian
    personality: methodical, sociable, gently particular about order
    habits:
      - Makes tea in her own mug and returns it to the same front cupboard after
        washing it.
      - Carries her phone, keys, wallet, and water bottle whenever she leaves for
        library volunteering or errands.
      - Keeps a current library book on the arm of her reading chair, with her glasses
        tucked inside it.
      - Writes shopping lists in a notebook at the kitchen table and leaves a pen
        clipped to its cover.
      - Waters the patio herbs with the watering can and sets it beside the back
        door afterward.
      - Clears breakfast dishes promptly but lets dinner plates wait in the sink
        if they have visitors.
      - Folds clean towels and places them in the linen cupboard, reminding Martin
        not to leave damp ones on the bathroom floor.
  - id: resident_2
    name: Martin Mercer
    age: 71
    occupation: retired city bus mechanic
    personality: practical, relaxed, mildly absent-minded
    habits:
      - Takes his phone, keys, wallet, and jacket with him for walks, appointments,
        and hardware-store errands.
      - Reads newspapers and puzzle books at the kitchen table, leaving his glasses
        and pen beside the placemat.
      - Uses the shared tablet for weather, sports scores, and video calls, then
        leaves it charging on the sideboard.
      - Tends the patio containers and often leaves the watering can near the plants
        until Elaine puts it away.
      - Uses a blanket and the remote from his end of the sofa, sometimes misplacing
        the remote under the blanket.
      - Loads the dishwasher after shared meals but needs Elaine to point out cups
        or bowls left in the sitting room.
      - Keeps his medication bottle in a kitchen-cabinet basket and refills a water
        bottle before going out.
relationships: >-
  Elaine and Martin have been married for forty-three years and share a compact,
  settled routine built around meals, errands, reading, and tending their patio
  plants. Elaine manages most household lists, laundry, and the final tidying pass,
  while Martin handles heavier cleaning, dish loading, and plant pots. Their small
  recurring friction is Martin's trail of reading materials, damp towels, and the
  wandering television remote; he usually responds good-naturedly when Elaine gathers
  them back into place.
home_layout_notes: >-
  The kitchen table is a shared command center for meals, lists, puzzles, and visiting
  neighbors, while the sitting room has Elaine's reading chair and Martin's regular
  sofa corner. Their bedroom is shared but has separate bedside surfaces for books,
  medication, and chargers. The patio is used jointly for container gardening, with
  the watering can moving between the back door and the plants.
