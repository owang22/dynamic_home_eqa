household_id: hh_010
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Nadia Flores
    age: 34
    occupation: hospital laboratory technician
    personality: methodical, light-sensitive, quietly forgetful when tired
    habits:
      - packs her lunchbox and water bottle on the kitchen counter before leaving
        for a shift
      - carries her phone, keys, wallet, and backpack with her whenever she leaves
        the apartment
      - drops her jacket over the back of the dining chair instead of hanging it
        in the closet
      - sets her glasses and phone charger together on the bedroom nightstand before
        sleeping
      - makes tea in the same mug and leaves it beside the sofa while she decompresses
      - rinses bowls and plates promptly but sometimes leaves them on the drying
        rack for several days
      - uses headphones and a tablet in bed to avoid disturbing neighbors with sound
      - keeps blackout blanket layers folded at the foot of the bed when she is
        not sleeping
relationships: >-
  Nadia lives alone and has no household members to divide chores with. She keeps
  shared-looking items such as dishware and the remote in predictable places for
  herself, but fatigue sometimes leaves her jacket on the chair and a mug by the
  sofa until her next reset. Her main point of friction is with her own need for
  order: she wants the bedroom clear and dark for sleep but tends to bring chargers,
  glasses, and reading material onto the nightstand.
home_layout_notes: >-
  The one-bedroom apartment has a compact kitchen opening into a combined dining
  and living area, with the dining chair acting as Nadia's usual landing spot for
  her jacket and backpack. The bedroom is her protected sleep space, centered on
  a blackout-covered bed and a crowded nightstand; the sofa and coffee table are
  used for tea, streaming, and quiet meals. Kitchen counters are used briefly for
  packing food and washing dishes, rather than as a long-term work surface.
