daily_life_summary: >-
  Nadia's work cycle runs opposite many of her neighbors, so she often returns to
  a quiet apartment while other residents in the building are beginning their day.
  She prepares food and gathers her travel items in the kitchen, then carries her
  essentials out in her backpack. At home, she keeps lights and sound low, decompresses
  on the sofa with tea or a show, and retreats to the darkened bedroom. On days
  away from work, she catches up on laundry, dishes, and rest rather than hosting
  visitors.
quirks: >-
  Although she works overnight hours, Nadia is not messy or chaotic; she maintains
  a carefully controlled, low-light home. She avoids caffeine-heavy energy drinks
  and relies on tea, packed meals, and a strict bedroom setup instead.
