daily_life_summary: >-
  Emma wakes up early and preps breakfast and lunchboxes in the kitchen while Marcus
  sleeps in. Marcus wakes up later and makes coffee, often moving Emma's mug to
  the sink. Lily goes to school and Sam stays home with Marcus, who watches him
  while grading. In the afternoon, Lily returns and drops her backpack by the door.
  The evening involves Marcus walking the dog, Emma tidying the living room, and
  the kids playing until bedtime, with objects scattering across every room.
quirks: >-
  Despite having young children, the household owns no dedicated toy bin in the
  living room — toys migrate freely. Marcus's habit of borrowing Emma's charger
  instead of using his own creates a daily friction point, and Lily's key-hiding
  game is a running joke.
