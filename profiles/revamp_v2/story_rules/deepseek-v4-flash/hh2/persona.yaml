household_id: hh_002
household_type: family_young_children
residents:
  - id: resident_1
    name: Emma
    age: 34
    occupation: software engineer
    personality: organized, patient, morning person
    habits:
      - makes coffee and leaves the mug on the kitchen counter
      - packs the kids' lunchboxes the night before and leaves them on the counter
      - charges her phone on the kitchen counter overnight
      - reads a book on the couch after the kids go to bed
      - tidies up the living room toys after resident_3 and resident_4 go to bed
      - reminds resident_2 to grab the dog leash from the hook before walks together
  - id: resident_2
    name: Marcus
    age: 36
    occupation: high school teacher
    personality: creative, forgetful, night owl
    habits:
      - leaves his coffee mug on the nightstand after waking up
      - borrows resident_1's charger from the kitchen and rarely returns it
      - spreads his notebook and pen across the dining table while grading
      - takes the dog for a walk in the evening and drops the leash by the door
      - leaves his jacket draped over the back of a dining chair
      - helps resident_1 clear the kids' toys but often misses a few under the couch
  - id: resident_3
    name: Lily
    age: 6
    occupation: student
    personality: curious, messy, energetic
    habits:
      - drops her backpack and jacket in the hallway as soon as she gets home
      - leaves her water bottle on the living room floor after playing
      - takes her toy from the toy bin to her room and leaves it on the bed
      - borrows resident_4's blanket from the couch and drags it to her room
      - leaves her plate on the table after meals without pushing it in
      - hides resident_2's keys in her toy bin sometimes
  - id: resident_4
    name: Sam
    age: 3
    occupation: stay-at-home parent
    personality: clingy, destructive, curious
    habits:
      - carries his blanket everywhere and drops it in random spots
      - takes resident_3's toy from her room and leaves it in the kitchen
      - takes his bowl from the table and leaves it on the living room floor
      - grabs resident_1's phone charger from the kitchen and chews on it
      - leaves his medication bottle on the bathroom sink after Emma gives him medicine
      - follows resident_2 around and pulls his notebook off the table
relationships: >-
  Emma and Marcus are married. Emma handles most morning routines and meal prep,
  while Marcus does evening tidying and dog walks. Lily and Sam share a playroom
  but Sam often invades Lily's space, causing friction over toys. Marcus frequently
  loses his keys, and Emma finds them in Lily's toy bin or under the couch.
home_layout_notes: >-
  The kitchen is the central hub where Emma preps meals and charges devices. The
  dining table is Marcus's grading station and doubles as a craft area for Lily.
  The living room floor is a constant mess of toys and blankets. The kids' bedrooms
  are used mostly for sleeping, with toys migrating to the living room daily.
