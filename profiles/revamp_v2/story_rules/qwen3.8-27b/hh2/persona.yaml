household_id: hh_002
household_type: family_young_children
residents:
  - id: resident_1
    name: Elena
    age: 34
    occupation: Pediatric Nurse
    personality: structured, exhausted, practical
    habits:
      - keeps a dedicated 'drop zone' by the front door for everyone's keys and
        wallets
      - washes her work scrubs immediately after coming home to keep the rest of
        the laundry pile manageable
      - leaves a specific mug on the counter for resident_2 to use while she is
        at work
      - organizes the toy bin by color every Sunday, which resident_3 and resident_4
        try to undo immediately
      - places a notebook on the kitchen table to track who has done the dishes
        and cleaning
      - often falls asleep on the couch with a book or phone before going to bed
  - id: resident_2
    name: Marcus
    age: 36
    occupation: High School History Teacher
    personality: patient, disorganized, tactile
    habits:
      - leaves his laptop open on the dining table while grading papers, creating
        a digital clutter zone
      - forgets to put his glasses in the case, often finding them in his jacket
        pocket
      - cooks dinner but leaves the chopping board on the counter for Elena to clean
      - reads to the kids in the living room, leaving picture books scattered on
        the rug
      - borrows Elena's charger for his phone and forgets to return it to its drawer
      - tends to sit on the edge of the bed when working, pushing personal items
        off the nightstand
  - id: resident_3
    name: Leo
    age: 7
    occupation: student
    personality: energetic, forgetful, creative
    habits:
      - leaves his backpack on the floor by the stairs after school
      - draws on every available surface, including the notebook pages he is supposed
        to be using for school
      - moves his toy dinosaurs to the kitchen table during snack time
      - loses his water bottle in the car or at school, requiring a new one every
        month
      - helps Marcus grade papers by putting random papers in the 'wrong' pile
      - sleeps with a specific stuffed animal that gets carried from room to room
  - id: resident_4
    name: Mia
    age: 4
    occupation: student
    personality: inquisitive, sticky, independent
    habits:
      - climbs on the kitchen counter to reach the high shelf, knocking over small
        objects
      - leaves her lunchbox on the dining chair after breakfast
      - carries her blanket to the living room to watch cartoons
      - hides her glasses under the couch cushions
      - puts her hair clip in her school notebook
      - drags her toy truck across the hardwood floors, leaving squeaky tracks
relationships: >-
  Elena and Marcus are a couple who have been married for eight years and are navigating
  the chaotic transition of raising two young children. Elena provides the structural
  framework for the household, while Marcus offers a more relaxed, flexible approach
  to daily life, leading to frequent but low-stakes arguments about tidiness and
  routines. The children, Leo and Mia, share a room and often compete for attention,
  with Leo's larger toys and loud energy frequently overwhelming Mia's quieter play
  spaces.
home_layout_notes: >-
  The home is a three-bedroom house with an open-plan kitchen and living area that
  serves as the central hub for family interaction. The kitchen counter and dining
  table are the most contested surfaces, used for meals, homework, and toy play,
  while the living room is dominated by a large couch where the family gathers for
  relaxation. The children's bedroom is a shared space that is perpetually messy,
  with toys and clothes scattered across the floor and beds.
