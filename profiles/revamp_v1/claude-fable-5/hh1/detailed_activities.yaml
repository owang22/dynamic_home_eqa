# Stage-2a ACTIVITY CALENDAR for hh_001 — Marisol Reyes, 21 days.
# Generated from the narrative charter (households/hh_001_...yaml) BEFORE any
# object rules: this file fixes WHEN human activity happens and what story it
# follows; the object-lists (what each activity moves) are authored in the
# next step, after review. Day 0 = Monday. Times are clock times; activities
# on shift nights wrap past midnight into the next calendar day.
#
# Design intent (charter-faithful):
#   - The SLEEP PIPELINE is invariant: bedtime ritual ~09:00 and blackout
#     daysleep ~09:20-16:50 appear every single day, storms or not — the one
#     thing she polices ("methodical about anything that protects her sleep").
#   - Everything else varies: which nights she errands, whether the weekly
#     manic reset happens (charter quirk: first night off), social plans,
#     a covered double, one forced daytime appointment that wrecks a day.
#   - Weeks are NOT copies: week 1 is the clean baseline, week 2 is the
#     fatigue arc (covered shift -> everything slips), week 3 is recovery
#     plus out-of-house social night instead of hosting.

