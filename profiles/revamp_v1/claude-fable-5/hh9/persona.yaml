daily_life_summary: >-
  Dara's weeks have almost no repeating structure — some days she is at the lab
  and the studio sits frozen; other days she never leaves, working in migrating
  sessions that orbit between desk, counter, and couch as momentum rises and falls.
  Meals happen at the keyboard at whatever hour hunger wins, and sleep drifts later
  across a week until a crash resets it. The apartment's state is a readout of the
  deadline cycle: strata of plates and mugs building through a work-sprint, then
  the paradoxical gleam of a panic-clean when a submission looms. Only the video-call
  corner holds constant, spotless for the advisor no matter which regime the rest
  of the studio is in.
quirks: >-
  She inverts the deadline stereotype — the apartment is cleanest when the pressure
  is highest, because cleaning is her procrastination of choice. And for someone
  with no daily routine at all, her work ritual is rigid: medication beside the
  laptop, notebook to the left, headphones on — a portable, exact setup she rebuilds
  at whichever surface the day's work lands on.
