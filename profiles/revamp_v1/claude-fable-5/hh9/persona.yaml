household_id: hh_009
household_type: grad_student_solo
residents:
  - id: resident_1
    name: Dara Okonkwo
    age: 26
    occupation: PhD candidate (computational biology)
    personality: deadline-driven, oscillates between hyperfocus and slump, cleans
      as a form of procrastination
    habits:
      - eats at the desk almost every meal; plates and mugs accumulate at the keyboard's
        perimeter in datable layers
      - keeps her ADHD medication next to the laptop stand — taking it is step one
        of 'booting up', so the bottle marks her true workspace even when she migrates
      - 'works wherever momentum strikes: desk, kitchen counter standing, couch
        nest, occasionally the floor; the laptop and one notebook travel as a unit'
      - sleeps irregular hours; roughly one night a week ends on the couch under
        the blanket rather than in bed
      - loses her keys inside the apartment about weekly because they enter wherever
        her hands were full; found in the couch, the bathroom, once the fridge
      - deep-cleans the entire apartment when a deadline is close, as high-grade
        procrastination
      - maintains one pristine corner — a tidy bookshelf and clean wall — as her
        video-call backdrop for advisor meetings, whatever the rest looks like
      - reads paper printouts in the bath; a towel and at least one pen permanently
        live within reach of the tub
relationships: >-
  Lives alone; the negotiation is between present-Dara and future-Dara. Present-Dara
  strands mugs, strata of plates, and halfannotated printouts at every worksite;
  future-Dara inherits them during panic-cleans and swears reforms that last three
  days. The lab and her advisor exist only through the laptop, which is why the
  one curated corner of the apartment is the part visible on camera.
home_layout_notes: >-
  Studio apartment with a sleeping alcove. The desk is the nominal workspace, the
  kitchen counter and couch are the real overflow campuses, and the couch nest (blanket,
  chargers, printouts) is semi-permanent. The video-call corner with its tidy bookshelf
  is the only space with enforced order; the bathroom doubles as a reading room.
