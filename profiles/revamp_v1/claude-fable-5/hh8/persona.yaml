household_id: hh_008
household_type: shift_worker_couple_opposite
residents:
  - id: resident_1
    name: Carmen Vasquez
    age: 31
    occupation: ICU nurse (night shift)
    personality: precise from work, affectionate through objects, guards her daytime
      sleep
    habits:
      - checks the handoff shelf by the door the moment she gets home — resident_2's
        note, the car keys, anything routed to her
      - eats the covered plate resident_2 leaves for her, then washes both it and
        whatever he left in the sink — her half of an asymmetric dishes treaty
      - writes back in the shared notebook on the kitchen counter before sleeping,
        usually with a doodle
      - wears resident_2's work jacket for the pre-dawn drive when it's cold, so
        it lives on the wrong hook half the week
      - sleeps through the day with her phone silenced on the far dresser and her
        scrubs staged on the chair for the next shift
      - preps resident_2's lunchbox before she leaves for her shift, as he sleeps
        — her mirror of his covered plate
  - id: resident_2
    name: Dre Vasquez
    age: 33
    occupation: electrician (day work, early starts)
    personality: quiet, methodical, communicates by leaving things ready
    habits:
      - leaves a covered dinner plate for resident_1 before he sleeps, same corner
        of the counter every night
      - takes the prepped lunchbox from the fridge in the dark without turning on
        lights, so nothing on the counter may ever move
      - routes shared objects through the handoff shelf — car keys, mail, the pharmacy
        bag — rather than waking her
      - reads a page or two of the notebook over breakfast and replies in the margins
      - keeps his tools staged in the hall so his early exits are silent; his boots
        never come past the mat
      - does the weekly reset with resident_1 together on their one overlapping
        day off, jealously protected
relationships: >-
  Married couple who have run opposite shifts for four years — Carmen nights at
  the hospital, Dre days on job sites. They share a car, a bed used in alternating
  shifts, and a communication system made of fixed object stations: the handoff
  shelf, the covered plate, the prepped lunchbox, the notebook. Coordination is
  the whole relationship on weekdays; the friction is what happens when either oversleeps
  and the relay chain — car keys, plate, lunchbox — jams all at once.
home_layout_notes: >-
  Small two-bedroom house; the second bedroom is a blackout room where whoever is
  sleeping off-cycle retreats when the other is home and awake. The handoff shelf
  by the front door and the kitchen counter (notebook, covered plate corner) are
  the shared interfaces; the bedroom dresser and closet hooks are split into his-day
  and her-night halves. Dre's staging area for tools owns the hall.
object_inventory:
  - id: keys_car
    class: keys
    owner: shared
    role: single car key set, the household's most choreographed object; lives on
      the handoff shelf between commutes, never in a pocket at home
  - id: keys_carmen
    class: keys
    owner: resident_1
    role: house keys; clipped inside her work bag
  - id: keys_dre
    class: keys
    owner: resident_2
    role: house keys and van keys for the work van; on the handoff shelf's left
      edge
  - id: notebook_shared
    class: notebook
    owner: shared
    role: the marriage's main channel — notes, doodles, grocery lists, arguments
      and their resolutions; lives on the kitchen counter, pen inside the spiral
  - id: pen_notebook
    class: pen
    owner: shared
    role: lives in the notebook's spiral; its absence is itself a message that someone
      wrote in a hurry
  - id: plate_handoff
    class: plate
    owner: shared
    role: the covered-dinner plate; counter corner overnight, washed by Carmen after
      her shift, back in the cupboard by the time Dre cooks again
  - id: plate_1
    class: plate
    owner: shared
    role: everyday plate for the cook's own meal
  - id: plate_2
    class: plate
    owner: shared
    role: everyday plate; used together only on the shared day off
  - id: lunchbox_dre
    class: lunchbox
    owner: resident_2
    role: packed by Carmen before her shift, lifted from the fridge in the dark;
      its presence in the fridge is her 'all is well' signal
  - id: bowl_1
    class: bowl
    owner: shared
    role: Carmen's post-shift cereal bowl at an hour that is her evening and the
      world's morning
  - id: bowl_2
    class: bowl
    owner: shared
    role: spare bowl; sees action on the shared day off
  - id: mug_carmen
    class: mug
    owner: resident_1
    role: her coffee mug, filled before her night shift; rides to the hospital and
      back weekly until she remembers to bring it in
  - id: mug_dre
    class: mug
    owner: resident_2
    role: his pre-dawn coffee mug; rinsed and inverted on the rack before he leaves,
      always
  - id: jacket_dre
    class: jacket
    owner: resident_2
    role: work jacket that Carmen borrows for cold pre-dawn drives; spends half
      the week on her hook, a running joke in the notebook
  - id: jacket_carmen
    class: jacket
    owner: resident_1
    role: her own jacket, on her hook, underused because his is warmer
  - id: phone_carmen
    class: phone
    owner: resident_1
    role: silenced on the far dresser during daysleep; the hospital calls Dre's
      number for true emergencies, by standing arrangement
  - id: phone_dre
    class: phone
    owner: resident_2
    role: alarm and job dispatches; charges in the kitchen so its pre-dawn alarm
      never wakes her
  - id: charger_kitchen
    class: charger
    owner: resident_2
    role: his kitchen charger, part of the silent-morning system
  - id: charger_bedroom
    class: charger
    owner: resident_1
    role: her dresser charger, out of arm's reach by design
  - id: wallet_carmen
    class: wallet
    owner: resident_1
    role: work bag, with her hospital badge
  - id: wallet_dre
    class: wallet
    owner: resident_2
    role: handoff shelf overnight, pocket by day
  - id: medication_bottle_carmen
    class: medication_bottle
    owner: resident_1
    role: vitamin D — the night-worker's sun substitute; next to the kettle so post-shift
      coffee doubles as the reminder
  - id: blanket_blackout
    class: blanket
    owner: shared
    role: heavy blanket of the blackout room; belongs to whoever is sleeping off-cycle,
      which alternates with overtime schedules
  - id: towel_carmen
    class: towel
    owner: resident_1
    role: her towel, used at hours when the bathroom is otherwise idle
  - id: towel_dre
    class: towel
    owner: resident_2
    role: his towel; the pair never queue for the bathroom, one silver lining of
      opposite lives
  - id: remote_tv
    class: remote
    owner: shared
    role: each finds it where the other's viewing session ended — couch arm for
      his evenings, blanket folds for her daytime wind-downs
  - id: book_carmen
    class: book
    owner: resident_1
    role: wind-down paperback read while the neighborhood eats breakfast; nightstand
      on her side
  - id: umbrella_1
    class: umbrella
    owner: shared
    role: handoff shelf's understudy; whoever hears rain first moves it to the shelf
      for the other's commute
daily_life_summary: >-
  Their days interlock like gears that touch at two points: Carmen gets home from
  the hospital shortly after Dre has left for the site, finding his note and her
  covered dinner; Dre gets home in the late afternoon to the lunchbox verdicts and
  notebook replies she wrote before starting her night. On weekdays they can go
  from one shared day off to the next exchanging under twenty spoken minutes, the
  household running instead on the handoff shelf, the plate corner, and the notebook.
  The one overlapping day off is defended absolutely — errands together, the weekly
  reset, and actual conversation.
quirks: >-
  Far from drifting apart, the object-relay system makes them unusually synchronized
  — the house is choreographed to the point that a misplaced car key reads as an
  emergency. Their notebook has years of volumes archived in a closet box; they
  consider it, only half-jokingly, their real wedding album.
