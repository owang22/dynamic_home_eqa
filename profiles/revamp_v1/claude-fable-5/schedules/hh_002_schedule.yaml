# Stage-2 schedule spec for hh_002 (claude-fable-5) — the Whitfield family:
# Priya (physiotherapist, clinic 4 days), Tom (teacher), Asha (7), Ben (4).
# Compiled from the narrative profile; comments cite the habits encoded.
# Day 0 = Monday. School runs Mo-Fr; Priya's clinic days are Mo,Tu,Th,Fr.
#
# Punctuality personas (jitter_scale, calibrated range 0.5-2.0):
#   Priya 0.8  "brisk, systematizing" — the launch-pad enforcer
#   Tom   1.3  "warm, absent-minded"  — sprawl and lost keys
#   Asha  1.1  school-anchored but easily distracted
#   Ben   1.2  four years old
#
# The family contrast with hh_001: a NIGHTLY dish cycle and NIGHTLY toy
# sweep (Priya/Tom restore order daily; Marisol oscillates weekly), plus
# the launch-pad staging system at the entry.

household: hh_002
jitter_classes: {external: 10, routine: 30, flexible: 75, loose: 110}
source_profile: ../households/hh_002_family_young_children.yaml
day0: Monday

receptacles:
  - {id: entry_hooks_e1,   room: entry}     # labeled hooks: adult keys/jackets
  - {id: entry_stage_e1,   room: entry}     # the launch pad: staged backpacks
  - {id: hall_floor_e1,    room: entry}     # where Asha's backpack detonates
  - {id: dining_table_d1,  room: dining}    # meals + Tom's marking sprawl
  - {id: counter_k1,       room: kitchen}   # vitamins, lunch-packing line
  - {id: sink_k1,          room: kitchen}
  - {id: cupboard_k1,      room: kitchen}
  - {id: couch_l1,         room: living}
  - {id: coffee_table_l1,  room: living}
  - {id: high_shelf_l1,    room: living}    # remote confiscation site
  - {id: toy_basket_l1,    room: living}
  - {id: fort_l1,          room: living}    # blanket fort behind the couch
  - {id: bed_parents_p1,   room: bedroom_parents}
  - {id: nightstand_p1,    room: bedroom_parents}
  - {id: bed_asha_a1,      room: bedroom_asha}
  - {id: bed_ben_b1,       room: bedroom_ben}
  - {id: bathroom_shelf_ba1, room: bathroom}

placements:
  toy_1:      {home: toy_basket_l1, p_misplace: 0.35,          # toy of the week
               misplace_set: [fort_l1, counter_k1, bathroom_shelf_ba1, couch_l1]}
  toy_2:      {home: toy_basket_l1}                            # Ben's dinosaur
  toy_3:      {home: toy_basket_l1}                            # shared blocks
  toy_4:      {home: bathroom_shelf_ba1, p_misplace: 0.2,      # bath boat that
               misplace_set: [counter_k1, couch_l1]}           # escapes the bathroom
  blanket_ben:   {home: bed_ben_b1}
  blanket_couch: {home: couch_l1}
  remote_tv:  {home: high_shelf_l1}                            # confiscation home
  backpack_asha: {home: entry_stage_e1}
  backpack_ben:  {home: entry_stage_e1}
  lunchbox_asha: {home: cupboard_k1}
  lunchbox_ben:  {home: cupboard_k1}
  laptop_tom:    {home: dining_table_d1}
  notebook_tom:  {home: dining_table_d1}
  pen_1:      {home: dining_table_d1, p_misplace: 0.3,         # marking pen vanishes
               misplace_set: [couch_l1, counter_k1]}
  book_bedtime_1: {home: bed_asha_a1}                          # the hoarded pile
  book_priya:     {home: couch_l1}                             # wedged in cushions
  medication_bottle_vitamins: {home: counter_k1, static: true} # dispensed in place
  mug_priya:  {home: cupboard_k1}
  mug_tom_1:  {home: cupboard_k1}
  mug_tom_2:  {home: cupboard_k1}
  bowl_1:     {home: cupboard_k1}
  bowl_2:     {home: cupboard_k1}
  bowl_3:     {home: cupboard_k1}
  bowl_4:     {home: cupboard_k1}
  plate_1:    {home: cupboard_k1}
  plate_2:    {home: cupboard_k1}
  plate_3:    {home: cupboard_k1}
  plate_4:    {home: cupboard_k1}
  phone_priya: {home: 'person:resident_1'}   # phones live on the person
  phone_tom:  {home: 'person:resident_2', p_misplace: 0.35,    # set down and mislaid
               misplace_set: [couch_l1, dining_table_d1, counter_k1, bathroom_shelf_ba1]}
  keys_priya: {home: entry_hooks_e1}                           # always the hook
  keys_tom:   {home: entry_hooks_e1, p_misplace: 0.3,          # lost twice a week
               misplace_set: [dining_table_d1, couch_l1, counter_k1]}
  wallet_priya: {home: entry_hooks_e1}                         # in the work bag
  wallet_tom: {home: entry_hooks_e1, p_misplace: 0.2,
               misplace_set: [dining_table_d1, counter_k1]}
  jacket_priya: {home: entry_hooks_e1}
  jacket_tom:  {home: entry_hooks_e1}                          # official home; reality: chairs
  jacket_asha: {home: entry_hooks_e1}
  jacket_ben:  {home: entry_stage_e1}                          # parked with his backpack
  water_bottle_asha: {home: entry_stage_e1}                    # lives in the staged backpack
  umbrella_1: {home: entry_stage_e1}

residents:
  # ---------------- Priya: the system ----------------
  - id: resident_1
    jitter_scale: 0.8
    schedule:
      - {activity: priya_morning,   days: [Mo,Tu,We,Th,Fr], start: "06:45", end: "07:30"}
      - {activity: priya_depart,    days: [Mo,Tu,Th,Fr],    start: "07:50", end: "08:05"}
      - {activity: priya_return,    days: [Mo,Tu,Th,Fr],    start: "17:45", end: "18:00"}
      - {activity: bath_bedtime,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:30", end: "20:15"}
      - {activity: toy_sweep,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "20:30", end: "20:50"}
      - {activity: launch_stage,    days: [Su,Mo,Tu,We,Th], start: "20:50", end: "21:10"}  # school nights
      - {activity: priya_read,      days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "21:15", end: "22:15"}
      - {activity: outing_depart,   days: [Sa], start: "10:00", end: "10:20"}
      - {activity: outing_return,   days: [Sa], start: "13:00", end: "13:20"}
  # ---------------- Tom: the sprawl ----------------
  - id: resident_2
    jitter_scale: 1.3
    schedule:
      - {activity: lunch_pack,      days: [Mo,Tu,We,Th,Fr], start: "07:00", end: "07:30"}
      - {activity: school_run,      days: [Mo,Tu,We,Th,Fr], start: "07:40", end: "07:55"}
      - {activity: kids_return,     days: [Mo,Tu,We,Th,Fr], start: "15:20", end: "15:45"}
      - {activity: tom_marking,     days: [Mo,Tu,We,Th,Fr,Su], start: "16:00", end: "17:45"}
      - {activity: family_dinner,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "18:15", end: "19:00"}
      - {activity: tom_dishes,      days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:05", end: "19:35"}
      - {activity: bedtime_story,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "20:00", end: "20:25"}
      - {activity: tom_tea,         days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "21:00", end: "22:00"}
      - {activity: tom_outing_depart, days: [Sa], start: "10:00", end: "10:20"}
      - {activity: tom_outing_return, days: [Sa], start: "13:00", end: "13:20"}
  # ---------------- Asha, 7 ----------------
  - id: resident_3
    jitter_scale: 1.1
    schedule:
      - {activity: kids_breakfast,  days: [Mo,Tu,We,Th,Fr], start: "07:05", end: "07:35"}
      - {activity: asha_play,       days: [Mo,Tu,We,Th,Fr], start: "16:00", end: "18:00"}
      - {activity: asha_play,       days: [Sa,Su], start: "15:00", end: "17:00"}
  # ---------------- Ben, 4 ----------------
  - id: resident_4
    jitter_scale: 1.2
    schedule:
      - {activity: ben_wake_drag,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:10", end: "07:20"}
      - {activity: ben_morning_dump, days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:30", end: "07:50"}
      - {activity: ben_play,        days: [Mo,Tu,We,Th,Fr], start: "16:00", end: "17:30"}
      - {activity: fort_time,       days: [Sa,Su], start: "15:00", end: "17:00"}

activities:
  # ---- Priya ----
  priya_morning:                          # vitamins at the counter, own mug rinsed
    jitter: routine
    at: counter_k1
    during: {mug_priya: counter_k1, bowl_3: dining_table_d1,
             phone_priya: 'person:resident_1'}      # picked up with the day
    after:
      mug_priya: {dest: cupboard_k1, p: 0.85, else: sink_k1}   # "rinsed and reused"
      bowl_3:    {dest: sink_k1, p: 0.8, else: dining_table_d1}
  priya_depart:
    jitter: external
    at: entry_hooks_e1
    during: {}
    after:
      keys_priya:   {dest: ELSEWHERE}
      wallet_priya: {dest: ELSEWHERE}
      jacket_priya: {dest: ELSEWHERE}
  priya_return:
    jitter: external
    at: entry_hooks_e1
    during: {}
    after:                                # "military consistency" at the hooks
      keys_priya:   {dest: entry_hooks_e1}
      wallet_priya: {dest: entry_hooks_e1}
      jacket_priya: {dest: entry_hooks_e1}
  bath_bedtime:                           # baths, Ben's blanket back, jacket re-hang
    jitter: routine
    at: bathroom_shelf_ba1
    during: {toy_4: bathroom_shelf_ba1}   # the boat is bath equipment
    after:
      blanket_ben: {dest: bed_ben_b1, p: 0.9, else: couch_l1,  # "back (with reminding)"
                    only_from: [couch_l1, fort_l1]}
      jacket_asha: {dest: entry_hooks_e1, p: 0.8, else: hall_floor_e1,
                    only_from: [hall_floor_e1]}                # re-hung by Priya
      water_bottle_asha: {dest: bathroom_shelf_ba1, p: 0.6, else: entry_stage_e1,
                          only_from: [couch_l1, hall_floor_e1]} # stranded after teeth
  toy_sweep:                              # the NIGHTLY sweep, as a timed tidy
    jitter: routine                         # walk: nearest item first, each one
    at: couch_l1                            # taking minutes — a 20-min bout may
    during: {}                              # not reach everything
    after: {}
    reset_all: {p: 0.85,
                objects: [toy_1, toy_2, toy_3, toy_4, blanket_couch, remote_tv]}
  launch_stage:                           # school-night staging at the door
    jitter: routine
    at: entry_stage_e1
    during: {}
    after:
      backpack_asha: {dest: entry_stage_e1}
      backpack_ben:  {dest: entry_stage_e1}
      jacket_ben:    {dest: entry_stage_e1}
      water_bottle_asha: {dest: entry_stage_e1, p: 0.8, else: bathroom_shelf_ba1}
      umbrella_1: {dest: entry_stage_e1, only_from: [hall_floor_e1, counter_k1]}
  priya_read:
    jitter: flexible
    at: couch_l1
    during: {book_priya: couch_l1, remote_tv: couch_l1}        # retrieves remote for TV
    after:
      book_priya: {dest: couch_l1, p: 0.85, else: nightstand_p1}  # wedged in cushions
      phone_priya: {dest: nightstand_p1,                       # docked overnight
                    only_from: ['person:resident_1']}
      remote_tv: {dist: {coffee_table_l1: 0.5, couch_l1: 0.5}} # left out overnight
  outing_depart:
    jitter: loose
    at: entry_hooks_e1
    during: {}
    after:                                # Priya wrangles her own kit + kids' jackets
      keys_priya: {dest: ELSEWHERE}
      wallet_priya: {dest: ELSEWHERE}
      jacket_priya: {dest: ELSEWHERE}
      jacket_asha: {dest: ELSEWHERE}
      jacket_ben: {dest: ELSEWHERE}
  outing_return:
    jitter: loose
    at: entry_hooks_e1
    during: {}
    after:
      keys_priya: {dest: entry_hooks_e1}
      wallet_priya: {dest: entry_hooks_e1}
      jacket_priya: {dest: entry_hooks_e1}
      jacket_asha: {dist: {hall_floor_e1: 0.6, entry_hooks_e1: 0.4}}
      jacket_ben: {dist: {entry_stage_e1: 0.5, hall_floor_e1: 0.5}}

  # ---- Tom ----
  lunch_pack:
    jitter: routine
    at: counter_k1
    during: {lunchbox_asha: counter_k1, lunchbox_ben: counter_k1,
             phone_tom: 'person:resident_2'}        # grabbed with the morning
    after: {}
  school_run:                             # the launch: kids' kit leaves the house
    jitter: external
    at: entry_stage_e1
    during: {}
    after:
      lunchbox_asha: {dest: ELSEWHERE}
      lunchbox_ben:  {dest: ELSEWHERE}
      backpack_asha: {dest: ELSEWHERE}
      backpack_ben:  {dest: ELSEWHERE}
      jacket_asha:   {dest: ELSEWHERE}
      jacket_ben:    {dest: ELSEWHERE}
      water_bottle_asha: {dest: ELSEWHERE}
      keys_tom:   {dest: ELSEWHERE}
      wallet_tom: {dest: ELSEWHERE}
      jacket_tom: {dest: ELSEWHERE}
      umbrella_1: {dest: ELSEWHERE, p: 0.3, else: entry_stage_e1}  # rain days
  kids_return:                            # the afternoon detonation
    jitter: external
    at: entry_stage_e1
    during: {}
    after:
      keys_tom:   {dist: {entry_hooks_e1: 0.5, dining_table_d1: 0.2,
                          counter_k1: 0.15, couch_l1: 0.15}}   # "locations vary wildly"
      wallet_tom: {dist: {entry_hooks_e1: 0.55, dining_table_d1: 0.25, counter_k1: 0.2}}
      jacket_tom: {dist: {dining_table_d1: 0.6, entry_hooks_e1: 0.4}}  # draped on chairs
      backpack_asha: {dest: hall_floor_e1}                     # "emptied onto the floor"
      backpack_ben:  {dest: entry_stage_e1, p: 0.6, else: hall_floor_e1}
      lunchbox_asha: {dest: counter_k1}                        # "returns dirty"
      lunchbox_ben:  {dest: counter_k1}
      jacket_asha: {dest: hall_floor_e1}                       # "dropped inside the door"
      jacket_ben:  {dist: {entry_stage_e1: 0.5, hall_floor_e1: 0.5}}
      water_bottle_asha: {dist: {couch_l1: 0.5, entry_stage_e1: 0.5}}
      umbrella_1: {dest: entry_stage_e1, p: 0.7, else: hall_floor_e1,
                   only_from: [ELSEWHERE]}                     # 1-in-3 stays at school
  tom_marking:                            # the dining-table colonization
    jitter: flexible
    at: dining_table_d1
    during: {laptop_tom: dining_table_d1, notebook_tom: dining_table_d1,
             pen_1: dining_table_d1, mug_tom_1: dining_table_d1,
             phone_tom: 'person:resident_2'}        # reclaimed from wherever
    after:
      mug_tom_1: {dist: {dining_table_d1: 0.6, couch_l1: 0.25, sink_k1: 0.15}}
      pen_1:     {dist: {dining_table_d1: 0.6, couch_l1: 0.2, counter_k1: 0.2}}
  family_dinner:
    jitter: routine
    at: dining_table_d1
    during: {plate_1: dining_table_d1, plate_2: dining_table_d1,
             plate_3: dining_table_d1, plate_4: dining_table_d1}
    after:                                # marking evacuated "in a rush" pre-meal
      laptop_tom:   {dest: couch_l1, p: 0.9, else: dining_table_d1,
                     only_from: [dining_table_d1]}
      notebook_tom: {dest: couch_l1, p: 0.85, else: dining_table_d1,
                     only_from: [dining_table_d1]}
  tom_dishes:                             # the NIGHTLY dish cycle (contrast hh_001)
    jitter: routine
    at: sink_k1
    during: {}
    after:
      plate_1: {dest: cupboard_k1, p: 0.85, else: sink_k1, only_from: [dining_table_d1, sink_k1]}
      plate_2: {dest: cupboard_k1, p: 0.85, else: sink_k1, only_from: [dining_table_d1, sink_k1]}
      plate_3: {dest: cupboard_k1, p: 0.85, else: sink_k1, only_from: [dining_table_d1, sink_k1]}
      plate_4: {dest: cupboard_k1, p: 0.85, else: sink_k1, only_from: [dining_table_d1, sink_k1]}
      bowl_1:  {dest: cupboard_k1, p: 0.8, else: sink_k1,
                only_from: [dining_table_d1, couch_l1, sink_k1]}
      bowl_2:  {dest: cupboard_k1, p: 0.8, else: sink_k1,
                only_from: [dining_table_d1, couch_l1, sink_k1]}
      bowl_3:  {dest: cupboard_k1, p: 0.8, else: sink_k1,
                only_from: [dining_table_d1, couch_l1, sink_k1]}
      bowl_4:  {dest: cupboard_k1, p: 0.8, else: sink_k1,
                only_from: [dining_table_d1, couch_l1, sink_k1]}
      mug_tom_1: {dest: cupboard_k1, p: 0.5, else: sink_k1,
                  only_from: [dining_table_d1, couch_l1, sink_k1]}  # half of them found
      mug_tom_2: {dest: cupboard_k1, p: 0.5, else: sink_k1,
                  only_from: [dining_table_d1, couch_l1, coffee_table_l1, sink_k1]}
      lunchbox_asha: {dest: cupboard_k1, p: 0.8, else: counter_k1, only_from: [counter_k1]}
      lunchbox_ben:  {dest: cupboard_k1, p: 0.8, else: counter_k1, only_from: [counter_k1]}
  bedtime_story:
    jitter: routine
    at: bed_asha_a1
    during: {book_bedtime_1: bed_asha_a1}
    after:
      book_bedtime_1: {dest: bed_asha_a1, p: 0.85, else: couch_l1}  # the hoarded pile
  tom_tea:
    jitter: flexible
    at: couch_l1
    during: {mug_tom_2: couch_l1, phone_tom: 'person:resident_2'}  # the found-by-calling-it moment
    after:                                # "dining table, windowsill, once the bathroom"
      mug_tom_2: {dist: {couch_l1: 0.4, coffee_table_l1: 0.3,
                         dining_table_d1: 0.2, bathroom_shelf_ba1: 0.1}}
      phone_tom: {dest: nightstand_p1, p: 0.6,               # docked... usually
                  only_from: ['person:resident_2']}
  tom_outing_depart:
    jitter: loose
    at: entry_hooks_e1
    during: {phone_tom: 'person:resident_2'}
    after:
      keys_tom: {dest: ELSEWHERE}
      wallet_tom: {dest: ELSEWHERE}
      jacket_tom: {dest: ELSEWHERE}
  tom_outing_return:
    jitter: loose
    at: entry_hooks_e1
    during: {}
    after:
      keys_tom: {dist: {entry_hooks_e1: 0.5, dining_table_d1: 0.25, couch_l1: 0.25}}
      wallet_tom: {dist: {entry_hooks_e1: 0.6, counter_k1: 0.4}}
      jacket_tom: {dist: {dining_table_d1: 0.5, entry_hooks_e1: 0.5}}

  # ---- Asha ----
  kids_breakfast:
    jitter: routine
    at: dining_table_d1
    during: {bowl_1: dining_table_d1, bowl_2: dining_table_d1}
    after: {}                             # adults clear at tom_dishes
  asha_play:                              # toy-of-the-week abandoned mid-house
    jitter: flexible
    at: couch_l1
    during: {toy_1: couch_l1}
    after:
      toy_1: {dist: {fort_l1: 0.3, couch_l1: 0.3, counter_k1: 0.2, bathroom_shelf_ba1: 0.2}}
      toy_2: {dist: {fort_l1: 0.4, couch_l1: 0.3, toy_basket_l1: 0.3},   # raids Ben's
              only_from: [toy_basket_l1, fort_l1, couch_l1]}
      bowl_4: {dest: couch_l1, p: 0.25, only_from: [cupboard_k1]}        # snack bowl

  # ---- Ben ----
  ben_wake_drag:                          # THE daily blanket commute
    jitter: routine
    at: bed_ben_b1
    during: {blanket_ben: couch_l1}
    after: {}
  ben_morning_dump:                       # toy bin upended within an hour of waking
    jitter: routine
    at: toy_basket_l1
    during: {toy_3: couch_l1}
    after:
      toy_3: {dist: {couch_l1: 0.5, fort_l1: 0.3, coffee_table_l1: 0.2}}
  ben_play:
    jitter: flexible
    at: fort_l1
    during: {toy_2: fort_l1}
    after:
      toy_2: {dist: {fort_l1: 0.5, couch_l1: 0.35, counter_k1: 0.15}}
      remote_tv: {dest: fort_l1, p: 0.45,                     # the pretend phone
                  only_from: [couch_l1, coffee_table_l1]}
      blanket_couch: {dest: fort_l1, p: 0.4, only_from: [couch_l1]}
  fort_time:                              # weekend fort construction
    jitter: loose
    at: fort_l1
    during: {blanket_couch: fort_l1}
    after:
      blanket_couch: {dest: couch_l1, p: 0.4, else: fort_l1}  # usually left as fort
      toy_2: {dest: fort_l1, p: 0.6, only_from: [toy_basket_l1, couch_l1]}
      remote_tv: {dest: fort_l1, p: 0.35, only_from: [couch_l1, coffee_table_l1]}
