household_id: hh_010
household_type: frequent_traveler_couple
residents:
  - id: resident_1
    name: Sung-min Park
    age: 41
    occupation: field applications engineer (travels to client sites most weeks)
    personality: lives out of staging areas, ritualistic about packing, re-enters
      the home like a guest for the first hour
    habits:
      - keeps his travel backpack perpetually half-packed by the closet; packing
        is a ritual of moving items from fixed home positions to fixed bag positions
      - 'runs a re-entry ritual on return: wallet, keys, and travel receipts dumped
        into the bowl on the dresser, bag emptied within the hour'
      - owns a duplicate travel set — charger, headphones, toiletries — so the home
        set never moves; the system fails whenever resident_2 borrows the travel
        charger mid-week
      - cooks an elaborate reunion dinner with resident_2 on his first evening back
        — their fixed ritual
      - 'spends his first morning home re-normalizing the house: chairs, remote,
        and kitchen items back to couple-mode positions after resident_2''s solo
        week'
      - video-calls resident_2 from the road each evening, which is when resident_2
        confesses what got borrowed or moved
  - id: resident_2
    name: Owen Park
    age: 38
    occupation: freelance illustrator (works from the home studio)
    personality: expands to fill available space, nocturnal when alone, sentimental
      about the reunion rituals
    habits:
      - colonizes the whole house within a day of resident_1 leaving — drawing supplies
        to the kitchen table, reference books to the couch, music on in every room
      - borrows the travel charger from resident_1's staged backpack mid-week, the
        household's most reliable recurring failure
      - contracts his sprawl back to the studio the day before resident_1 returns,
        in a ritual he calls 'the retreat'
      - eats one-pan meals over the sink or at the drawing table when alone; the
        good plates only move during two-person weeks
      - sleeps diagonal and nocturnal during solo weeks, keeping the other nightstand's
        book and glasses untouched like a museum
      - walks to the same café every solo-week afternoon, jacket and sketchbook-notebook,
        as his one fixed structure
relationships: >-
  Married eight years; Sung-min's client travel means the home alternates weekly
  between Owen's one-person regime and a two-person regime. They handle it with
  rituals at both boundaries — Owen's 'retreat' before returns, Sung-min's re-entry
  dump and next-morning re-normalization, the reunion dinner. The persistent friction
  is boundary leakage: Owen borrowing from the staged travel bag, and Sung-min's
  re-normalization sweeping away studio arrangements Owen considered in-progress
  work.
home_layout_notes: >-
  Two-bedroom house; the second bedroom is Owen's studio, which is his sovereign
  territory in all regimes. In couple weeks life centers on the kitchen and dining
  table; in solo weeks Owen's supplies annex those same surfaces. The closet-side
  staging zone (half-packed backpack) and the dresser bowl are Sung-min's fixed
  infrastructure, and the two nightstands preserve each partner's state between
  regime changes.
object_inventory:
  - id: backpack_travel
    class: backpack
    owner: resident_1
    role: the travel bag, perpetually half-packed by the closet; its completeness
      is Sung-min's readiness state, and Owen's raids on it are the recurring system
      failure
  - id: charger_travel
    class: charger
    owner: resident_1
    role: lives in the travel bag by design; borrowed by Owen most weeks and recovered
      during packing panics
  - id: charger_home_sm
    class: charger
    owner: resident_1
    role: his never-moves bedside charger, the fixed half of the duplicate-set system
  - id: charger_owen
    class: charger
    owner: resident_2
    role: studio charger; migrates to the kitchen table during solo-week sprawl
  - id: headphones_travel
    class: headphones
    owner: resident_1
    role: flight headphones; travel-bag residents, second-most borrowed after the
      charger
  - id: headphones_owen
    class: headphones
    owner: resident_2
    role: studio headphones for drawing; roam the house in solo weeks, studio-bound
      in couple weeks
  - id: bowl_dresser
    class: bowl
    owner: resident_1
    role: 'dresser bowl, target of the re-entry dump: wallet, keys, receipts, boarding
      passes'
  - id: bowl_1
    class: bowl
    owner: shared
    role: kitchen bowl; in solo weeks it is Owen's over-the-sink dinner vessel
  - id: bowl_2
    class: bowl
    owner: shared
    role: kitchen bowl; sees real use only in couple weeks
  - id: plate_good_1
    class: plate
    owner: shared
    role: reunion-dinner plate; cabinet-bound during solo weeks, its appearance
      marks two-person mode
  - id: plate_good_2
    class: plate
    owner: shared
    role: reunion-dinner plate, the pair to plate_good_1
  - id: plate_everyday
    class: plate
    owner: shared
    role: Owen's solo-week plate, when he uses one at all; drying rack permanent
      resident
  - id: mug_sungmin
    class: mug
    owner: resident_1
    role: his coffee mug; untouched on its hook all week, first thing down on his
      first morning home
  - id: mug_owen
    class: mug
    owner: resident_2
    role: tea mug; follows Owen's sprawl through the house and collects at the drawing
      table
  - id: mug_1
    class: mug
    owner: shared
    role: guest mug drafted into Owen's rotation when his is dirty
  - id: laptop_sungmin
    class: laptop
    owner: resident_1
    role: work machine; travels in the bag's fixed laptop slot, docks on the dining
      table during home weeks
  - id: laptop_owen
    class: laptop
    owner: resident_2
    role: studio machine for scans and invoices; anchored to the studio desk in
      all regimes
  - id: notebook_sketchbook
    class: notebook
    owner: resident_2
    role: Owen's café sketchbook; lives in his jacket pocket, the axis of his solo-week
      afternoons
  - id: notebook_shared
    class: notebook
    owner: shared
    role: kitchen logistics notebook; Owen logs what he borrowed or broke, Sung-min
      reads it on re-entry — the confession ledger
  - id: pen_1
    class: pen
    owner: resident_2
    role: drawing pen population's ambassador to the kitchen notebook; always one
      clipped there
  - id: book_owen
    class: book
    owner: resident_2
    role: couch reference books during solo sprawl; re-shelved in the retreat
  - id: book_sungmin
    class: book
    owner: resident_1
    role: nightstand novel that advances only on home weeks; its bookmark is a calendar
      of his travel year
  - id: glasses_sungmin
    class: glasses
    owner: resident_1
    role: reading glasses on his nightstand, museum-still during travel weeks, in
      use during home weeks
  - id: phone_sungmin
    class: phone
    owner: resident_1
    role: always on him; the evening video call is the household's synchronization
      protocol
  - id: phone_owen
    class: phone
    owner: resident_2
    role: lost in the sprawl during solo weeks; located by the evening call's ringtone
  - id: keys_sungmin
    class: keys
    owner: resident_1
    role: dresser bowl between trips; in the bag's front pocket in transit
  - id: keys_owen
    class: keys
    owner: resident_2
    role: jacket pocket, because the café walk is the only time they're needed
  - id: wallet_sungmin
    class: wallet
    owner: resident_1
    role: dresser bowl at home, breast pocket in transit; receipts accumulate inside
      as trip sediment
  - id: wallet_owen
    class: wallet
    owner: resident_2
    role: with the keys in the jacket; thin, since solo weeks run on two subscriptions
      and one café
  - id: jacket_owen
    class: jacket
    owner: resident_2
    role: the café-walk jacket; holds keys, wallet, and sketchbook — a complete
      going-out kit on one hook
  - id: jacket_sungmin
    class: jacket
    owner: resident_1
    role: travel blazer; garment hook by the closet staging zone, moving only between
      hook and bag
  - id: water_bottle_owen
    class: water_bottle
    owner: resident_2
    role: studio bottle; the one hydration habit that survives both regimes
  - id: blanket_couch
    class: blanket
    owner: shared
    role: couch blanket; nest material in Owen's solo weeks, folded to couple-mode
      neatness during the re-normalization
  - id: remote_tv
    class: remote
    owner: shared
    role: solo weeks strand it in Owen's nest; the re-normalization returns it to
      the media shelf, its couple-mode home
  - id: umbrella_travel
    class: umbrella
    owner: resident_1
    role: compact umbrella resident in the travel bag; the house itself goes without,
      a known gap Owen complains about in rain
daily_life_summary: >-
  The house lives in two alternating regimes. In solo weeks Owen goes nocturnal
  and expands — supplies on every surface, meals over the sink, one fixed café walk
  per afternoon — while the evening video call briefly re-synchronizes the couple.
  The boundary days have their own choreography: Owen's retreat compresses his sprawl
  back into the studio, then Sung-min's return triggers the dresser-bowl dump, the
  reunion dinner, and a next-morning re-normalization of every drifted object. Couple
  weeks run diurnal and centered on the kitchen table, until the half-packed backpack
  by the closet fills again and the cycle turns.
quirks: >-
  Against the absent-partner stereotype, the traveler is the tidier and more domestically
  ritualistic of the two — the home's fixed points (staging zone, dresser bowl,
  duplicate sets) are all Sung-min's infrastructure imposed on Owen's entropy. The
  confession-ledger notebook means regime changes are documented in writing: the
  house may be the only one on the street with minutes.
