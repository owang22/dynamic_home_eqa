daily_life_summary: >-
  Mornings are a coordinated launch — Tom packs lunchboxes while the kids eat, Priya
  runs the door checklist, and everyone leaves in one wave for school, preschool,
  and work. The house sits empty and frozen mid-chaos through the day. The kids
  come home first with Tom, detonating backpacks and toys through the hallway and
  living room while he starts marking at the dining table; Priya arrives last into
  the mess. Evenings run parent-shifted — Tom on dishes, Priya on baths and then
  the nightly sweep — so the parents mostly cross paths in the kitchen doorway handing
  off children.
quirks: >-
  For all the interior chaos, the front-door launch pad is run with aerospace discipline
  — visitors are startled by staged backpacks under labeled hooks ten feet from
  a living room ankle-deep in blocks. The family also has no toys or screens in
  the kids' bedrooms by policy, which is why every object the children own funnels
  into the living room.
