household_id: hh_002
household_type: family_young_children
residents:
  - id: resident_1
    name: Priya Whitfield
    age: 38
    occupation: physiotherapist (clinic, four days a week)
    personality: brisk, systematizing, allergic to clutter at the front door
    habits:
      - runs a nightly toy sweep after the kids are in bed, dumping everything into
        the living-room toy basket regardless of where it belongs
      - confiscates the TV remote to the high bookshelf whenever resident_4 has
        carried it off, which is most days
      - stages both kids' backpacks and lunchboxes by the front door the night before
        school
      - dispenses the kids' vitamins from the bottle on the kitchen counter at breakfast,
        then pockets her own keys from the entry hook
      - leaves her clinic lanyard and keys on the entry hook with military consistency
        and gets audibly upset when resident_2 borrows them
      - reads on the couch with a blanket after the sweep, and her book stays wedged
        in the couch cushions
  - id: resident_2
    name: Tom Whitfield
    age: 40
    occupation: high-school history teacher
    personality: warm, absent-minded, spreads paperwork everywhere
    habits:
      - colonizes the dining table with marking — laptop, notebook, pens — and has
        to clear it in a rush before every family meal
      - loses his own keys about twice a week and borrows resident_1's from the
        entry hook without telling her
      - does the dishes after dinner while resident_1 handles baths, so the sink
        and counter are his territory in the evening
      - reads the kids their bedtime story, and the picture books pile up on resident_3's
        bed rather than the shelf
      - leaves half-finished mugs of tea on the dining table, windowsill, and once
        the bathroom shelf
      - packs both lunchboxes in the morning while the kids eat, then forgets his
        own lunch on the counter about once a week
  - id: resident_3
    name: Asha Whitfield
    age: 7
    occupation: student (year 2)
    personality: collector, negotiator, wants her things WITH her
    habits:
      - carries a chosen toy of the week everywhere and abandons it at the exact
        moment something better appears — bathroom floor, kitchen chair, inside
        resident_4's blanket fort
      - raids resident_4's toys when hers are boring, which starts most of the household's
        disputes
      - unpacks her backpack onto the hallway floor the second she gets home from
        school
      - hoards the bedtime books resident_2 reads on her bed and defends the pile
      - fills her water bottle herself and leaves it in the bathroom after brushing
        teeth
  - id: resident_4
    name: Ben Whitfield
    age: 4
    occupation: preschooler
    personality: velcro-attached to soft things, drags rather than carries
    habits:
      - drags his blanket from his bed to the couch every single morning and back
        (with reminding) at night
      - carries the TV remote around as a 'phone' and leaves it in the toy basket,
        under the couch, or in his room
      - dumps the shared toy bin out in the living room within an hour of resident_1's
        nightly sweep
      - insists on carrying his own lunchbox to the car and hands it to resident_2
        halfway
      - hides shoes — his own and other people's — inside the blanket fort behind
        the couch
relationships: >-
  Married couple with two kids. Priya resets the house every night and owns the
  launch-pad system at the front door; Tom owns dishes and bedtime. The recurring
  frictions are Tom's marking sprawl on the dining table meeting Priya's clear-surfaces
  policy, Tom borrowing Priya's keys when his vanish, and Asha raiding Ben's toys.
  The kids undo the toy basket faster than it fills.
home_layout_notes: >-
  Three-bedroom house. The living room and its toy basket are the kids' domain and
  the main battlefield; the dining table doubles as Tom's marking desk; the kitchen
  counter holds the vitamin bottle and lunch-packing line. The entry hall with its
  hooks and staged backpacks is Priya's tightly run launch pad. The parents' bedroom
  is the only reliably toy-free room.
