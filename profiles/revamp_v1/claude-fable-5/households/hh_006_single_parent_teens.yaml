household_id: hh_006
household_type: single_parent_teens
residents:
  - id: resident_1
    name: Denise Carter
    age: 46
    occupation: paralegal
    personality: efficient, runs the house on systems, tired of being the systems'
      only user
    habits:
      - stages keys on the entry hooks and mail on the hall table; the teens use
        neither, so she also runs a nightly orphan-object sweep
      - confiscates resident_2's headphones from the bathroom and kitchen and piles
        them on his bed with pointed neutrality
      - reclaims her charger from resident_3's room every few days in a recurring
        ritual both treat as normal
      - does a big weekly reset of the living room and kitchen on her day off, after
        which the house is briefly hers
      - leaves case files and her laptop in a strict work corner of the dining table
        that the teens know not to touch
      - reads before bed with the door open, one chapter, book back on the nightstand
      - writes the week's logistics on the message notebook on the kitchen counter;
        the teens actually do read it
  - id: resident_2
    name: Marcus Carter
    age: 16
    occupation: student (high school, junior varsity basketball)
    personality: tidy in private, entropic in public, headphones permanently on
    habits:
      - keeps his own room in immaculate order — the one place his discipline shows
      - sheds headphones, jacket, and water bottle in a trail from the front door
        through the kitchen every afternoon
      - cooks dinner twice a week as his chore, cooks well, and leaves every plate,
        bowl, and pan where it landed
      - 'his backpack is a one-way object hole: chargers, pens, and resident_3''s
        calculator go in and only surface at semester''s end'
      - walks the dog before school and hangs the leash correctly — the one entry-hook
        system he honors
      - answers the message notebook in one-word replies under Denise's paragraphs
  - id: resident_3
    name: Keisha Carter
    age: 13
    occupation: student (middle school)
    personality: borrower, nest-builder, genuinely intends to return things
    habits:
      - borrows resident_1's charger, sweaters, and hair things into her room, where
        they join the nest
      - does homework sprawled on the living-room floor, ringed by notebooks, pens,
        and a snack bowl
      - walks the dog after school (her chore) but leaves the leash on the couch
        arm instead of the hook
      - migrates the TV remote to her floor-nest during homework and leaves it there
      - abandons towels on the bathroom floor, the household's longestrunning dispute
      - keeps a water bottle by her bed and brings home the school one in a rotating
        population
relationships: >-
  Denise has raised the two teens on her own since they were small; the household
  runs on her systems and her nightly and weekly resets, which the teens' object
  trails continuously erode. Chores are formally split — Marcus cooks twice a week,
  Keisha walks the dog after school, both nominally do their own laundry — and the
  standing frictions are Keisha's towels, Marcus's kitchen aftermath, and the slow
  migration of Denise's chargers into Keisha's room.
home_layout_notes: >-
  Three-bedroom house. Marcus's room is a sealed clean zone, Keisha's is a soft
  chaotic nest, and Denise's room and her diningtable work corner are defended adult
  territory. The kitchen counter with its message notebook is the household's bulletin
  board; the living room floor is Keisha's homework zone and the bathroom is the
  towel battleground.
