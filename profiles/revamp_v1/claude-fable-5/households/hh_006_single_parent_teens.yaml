daily_life_summary: >-
  Mornings are staggered departures — Marcus out first for the dog walk and practice,
  then Keisha, then Denise, each grabbing from (or ignoring) the entry-hook system.
  The house is empty through the workday and repopulates in reverse: Keisha first,
  building her homework nest on the living-room floor; Marcus trailing objects through
  the kitchen after practice; Denise last, walking into the day's accumulated entropy.
  Evenings center on dinner — cooked by Marcus twice a week, Denise otherwise —
  with phones surrendered to the counter, followed by Denise's nightly sweep once
  the teens retreat to their rooms.
quirks: >-
  The tidiness gradient is inverted from the stereotype — the teenager's bedroom
  is the cleanest room in the house and the shared spaces are where his order collapses,
  while Denise's systems are less about neatness than about being findable at speed.
  The message notebook, not the group chat, is the family's real communication channel,
  by Denise's explicit design.
