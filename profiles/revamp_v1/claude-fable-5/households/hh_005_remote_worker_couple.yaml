daily_life_summary: >-
  Both are home nearly all day, working three rooms apart and communicating partly
  through object positions — headphones on the desk mean the office is booked, a
  coiled charger means Femi has already shut the house down. The kitchen runs all
  day: coffee rounds, Femi's shared lunch (their main conversation window), and
  kettle boils that trigger his mug-recovery sweeps of her abandoned worksites.
  Anaïs breaks the day with a solo afternoon walk, which is deliberately hers alone;
  Femi's equivalent solitude is the early morning before she wakes. Evenings converge
  on the couch after his shopkeeper's shutdown of both their workstations.
quirks: >-
  They protect solitude inside a shared 900 square feet by time-slicing rather than
  room-splitting — her walk, his early mornings — and they treat it as seriously
  as meetings. Despite two tech jobs, the household's coordination layer is entirely
  physical: headphone tokens, mug trails, and notebook stacks instead of shared
  calendars.
