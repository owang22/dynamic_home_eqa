household_id: hh_005
household_type: remote_worker_couple
residents:
  - id: resident_1
    name: Anaïs Fontaine
    age: 33
    occupation: UX researcher (fully remote)
    personality: restless, migratory worker, thinks by scribbling; leaves a paper
      trail everywhere she settles
    habits:
      - migrates her laptop between the office desk, kitchen table, and couch several
        times a day, trailing a notebook and pen to each site
      - claims the office by putting her headphones on the desk — the couple's agreed
        booking system for call space
      - abandons mugs at every workstation; by day's end there is one at each of
        her three sites
      - borrows resident_2's charger from the office rather than walk to wherever
        she left her own
      - handwrites in a fresh notebook per project; retired notebooks stack on the
        kitchen counter until resident_2 shelves them
      - takes the afternoon walk with the shared umbrella if the sky threatens,
        and hangs it on the wrong hook after
  - id: resident_2
    name: Femi Adeyemi
    age: 35
    occupation: data engineer (fully remote)
    personality: stationary, single-workspace, does closing-time rituals like a
      shopkeeper
    habits:
      - works anchored to the office desk all day and resents discovering resident_1's
        headphone-claim on it
      - runs a mug sweep of all of resident_1's workstations whenever he boils the
        kettle
      - shelves resident_1's retired notebooks from the kitchen counter into the
        office bookcase, in order
      - closes the house like a shop after work — laptops shut, chargers coiled,
        remote to the couch-side table
      - cooks lunch for both of them most days, which is when the couple actually
        talks
      - keeps his keys and wallet in his jacket by the door, undisturbed for so
        long that finding them is an event when he actually goes out
relationships: >-
  Married couple, both remote for years. The core coordination problem is one good
  office and two jobs: the headphone-on-desk booking system mostly works, and Femi
  loses gracefully by relocating to the kitchen. Femi cooks and runs the evening
  shutdown ritual; Anaïs does the shopping and laundry. The friction is directional
  — her worksites sprawl across every horizontal surface, and his tidying follows
  her around the house like a tide.
home_layout_notes: >-
  Two-bedroom apartment; the second bedroom is the office with the one good desk
  and monitor. Anaïs rotates between office, kitchen table, and couch; Femi holds
  the office or falls back to the kitchen. The kitchen is the shared engine of the
  house — used all day for coffee, lunch, and kettle-triggered mug sweeps — and
  the couch becomes joint territory after the shutdown ritual.
