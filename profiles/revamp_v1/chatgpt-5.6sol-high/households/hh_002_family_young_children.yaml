daily_life_summary: >-
  The adults repeatedly create order while the children repeatedly undo it. School
  objects concentrate near the entrance and dining table, while toys and blankets
  migrate throughout the living room and children's bedrooms. Maya and Daniel overlap
  heavily in shared spaces and frequently move objects belonging to Sophie and Eli.
  The children's play creates short, unpredictable bursts of relocation layered
  over otherwise consistent adult habits.
quirks: >-
  The dining table is less a dedicated eating surface than a rotating staging zone
  for meals, schoolwork, crafts, and backpacks. Daniel rarely returns children's
  objects to their exact homes, producing tidy-looking but semantically incorrect
  placements.
