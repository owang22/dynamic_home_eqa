household_id: hh_002
household_type: family_young_children
residents:
  - id: resident_1
    name: Maya Chen
    age: 37
    occupation: elementary school teacher
    personality: organized, patient, habitually tidying
    habits:
      - collects resident_3 and resident_4's cups and plates from the living room
        and returns them to the kitchen
      - checks resident_3's backpack for loose notebooks and lunch items before
        it is put away
      - leaves her phone on the kitchen counter while doing household tasks
      - folds shared blankets and returns them to the sofa after the children build
        forts
      - moves scattered toys into baskets but rarely sorts them precisely
      - hangs resident_2's jacket if he leaves it over a chair
  - id: resident_2
    name: Daniel Chen
    age: 39
    occupation: civil engineer
    personality: practical, distracted, tolerant of clutter
    habits:
      - drops keys and wallet near the entrance, sometimes on different surfaces
      - shares a laptop charger with resident_1 and frequently leaves it near whichever
        seat he last used
      - moves resident_3 and resident_4's toys out of walking paths rather than
        returning them to their proper bins
      - uses a mug while reading and often leaves it beside the sofa
      - packs resident_4's lunchbox and leaves it beside the child's backpack
      - carries the shared remote between the sofa and dining table while supervising
        the children
  - id: resident_3
    name: Sophie Chen
    age: 7
    occupation: student
    personality: curious, energetic, easily distracted
    habits:
      - empties parts of her backpack onto the dining table while looking for notebooks
      - borrows resident_4's toys and leaves them in her bedroom
      - carries books between her bedroom and living room and rarely returns them
        immediately
      - leaves her water bottle beside the sofa or inside her backpack
      - hands drawings and pens to resident_1 for safekeeping
      - moves the shared blanket onto the floor to make forts with resident_4
  - id: resident_4
    name: Eli Chen
    age: 4
    occupation: student
    personality: playful, impulsive, possessive
    habits:
      - carries several toys at once and drops them wherever a new activity starts
      - takes resident_3's books to imitate her and leaves them open on the floor
      - moves bowls and cups from the dining table after meals if resident_1 does
        not stop him
      - hides the shared remote under blankets or cushions during play
      - leaves his jacket wherever resident_2 helps him remove it
      - follows resident_3 between rooms and brings toys into whatever space she
        is using
relationships: >-
  Maya and Daniel are married and share household chores, while Sophie and Eli generate
  most of the home's object movement. Maya restores order systematically, while
  Daniel tends to move clutter only far enough to clear space. Sophie and Eli frequently
  borrow each other's things, creating recurring disputes over where toys, books,
  and drawing supplies ended up.
home_layout_notes: >-
  The home has three bedrooms, a shared living room, kitchen, dining area, and one
  main play corner. The dining table doubles as a homework and craft surface, while
  the living-room floor changes constantly as the children play. The entrance and
  kitchen become staging areas where the adults try to consolidate school and work
  items.
