daily_life_summary: >-
  Carla tries to maintain clear shared areas while Mateo and Nina continually move
  personal objects outward from their rooms. Their belongings concentrate in backpacks
  and bedrooms, then appear transiently on the sofa, dining table, and staircase.
  Carla and the teenagers often miss each other during parts of the day, so object
  placement becomes a form of indirect coordination. Items left on the stairs often
  signal that Carla has tidied something without putting it fully away.
quirks: >-
  The staircase acts as a deliberate halfway state between misplaced and properly
  stored. The teenagers' rooms are cluttered, but their school objects can disappear
  rapidly into backpacks before leaving the house.
