household_id: hh_006
household_type: single_parent_teens
residents:
  - id: resident_1
    name: Carla Mendes
    age: 45
    occupation: insurance claims specialist
    personality: structured, vigilant, easily exasperated
    habits:
      - collects resident_2 and resident_3's dishes from shared spaces and tells
        them to finish the cleanup
      - moves abandoned jackets and backpacks to the stairs rather than carrying
        them into bedrooms
      - keeps her own keys, wallet, and phone together near the entrance
      - checks whether resident_3 has left a charger in the living room before putting
        it aside
      - returns the shared remote to the coffee table
      - sets misplaced school notebooks beside the correct teenager's backpack
  - id: resident_2
    name: Mateo Mendes
    age: 17
    occupation: student
    personality: independent, forgetful, mildly defensive
    habits:
      - drops his backpack in the living room before eventually carrying it upstairs
      - takes plates and mugs into his bedroom and forgets them
      - borrows resident_3's charger when his is buried in his backpack
      - leaves headphones around the sofa after using them
      - moves the shared remote into his room occasionally
      - complains when resident_1 moves his school materials even when they were
        in shared space
  - id: resident_3
    name: Nina Mendes
    age: 14
    occupation: student
    personality: private, creative, cluttered
    habits:
      - keeps notebooks, pens, and books spread across her bedroom floor and desk
      - puts her phone charger into her backpack and then forgets where it is
      - borrows resident_2's headphones without asking
      - carries mugs into her bedroom while drawing or studying
      - leaves her jacket over dining chairs until resident_1 relocates it
      - takes the shared blanket to her bedroom and forgets to return it
relationships: >-
  Carla is the sole parent and acts as the main force maintaining shared-space order.
  Mateo and Nina mostly manage their own rooms, but both let belongings spill into
  the living and dining areas. Friction centers on Carla relocating their things,
  while the siblings also borrow chargers and headphones from each other.
home_layout_notes: >-
  The home has three bedrooms upstairs and shared kitchen, dining, and living areas
  downstairs. The staircase landing becomes an informal transfer point where Carla
  deposits objects that belong upstairs. The teenagers' bedrooms contain dense clusters
  of personal items that periodically leak into shared rooms.
