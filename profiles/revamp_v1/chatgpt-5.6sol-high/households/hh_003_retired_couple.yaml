household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Harold Bennett
    age: 72
    occupation: retired accountant
    personality: precise, routine-oriented, mildly territorial
    habits:
      - keeps his glasses beside his reading chair and becomes annoyed when resident_2
        moves them
      - returns books to the same side table after reading
      - places keys and wallet together in a small entry bowl
      - carries his mug from the kitchen to his chair and returns it when finished
      - moves resident_2's newspapers and notebooks off his preferred chair
      - checks that the shared remote has been returned to the coffee table
  - id: resident_2
    name: Ruth Bennett
    age: 69
    occupation: retired librarian
    personality: orderly, sentimental, quietly stubborn
    habits:
      - keeps an active book and notebook together near the sofa
      - moves Harold's mug to the kitchen if he forgets it
      - uses the shared blanket while reading and folds it over the sofa arm afterward
      - occasionally relocates resident_1's glasses while dusting surfaces
      - keeps her medication bottle beside a water glass in the kitchen
      - sets both residents' umbrellas near the entrance when rain is expected
relationships: >-
  Harold and Ruth have been married for decades and have settled into a stable division
  of chores and spaces. Ruth handles most surface tidying while Harold handles paperwork
  and keeps entry items organized. Their main friction comes from Ruth moving objects
  during cleaning that Harold expects to remain in fixed locations.
home_layout_notes: >-
  Their two-bedroom home has a quiet living room with two preferred chairs, a dining
  room used mostly for meals and paperwork, and a spare bedroom used for storage
  and guests. Most frequently used objects have stable designated surfaces. Movement
  tends to occur along a small set of repeated paths.
object_inventory:
  - id: phone_harold
    class: phone
    owner: resident_1
    role: personal phone; usually stays near his reading chair
  - id: phone_ruth
    class: phone
    owner: resident_2
    role: personal phone; moves between kitchen, sofa, and handbag
  - id: keys_harold
    class: keys
    owner: resident_1
    role: personal keys; kept in a fixed entry bowl
  - id: keys_ruth
    class: keys
    owner: resident_2
    role: personal keys; stored beside Harold's at the entrance
  - id: wallet_harold
    class: wallet
    owner: resident_1
    role: personal wallet; kept beside his keys when home
  - id: wallet_ruth
    class: wallet
    owner: resident_2
    role: personal wallet; usually remains in her handbag or entrance drawer
  - id: glasses_harold
    class: glasses
    owner: resident_1
    role: reading glasses; expected to remain beside Harold's chair
  - id: glasses_ruth
    class: glasses
    owner: resident_2
    role: reading glasses; moves between sofa and bedroom
  - id: book_harold
    class: book
    owner: resident_1
    role: current history book; repeatedly returns to the same side table
  - id: book_ruth
    class: book
    owner: resident_2
    role: current novel; moves between sofa and bedroom
  - id: notebook_ruth
    class: notebook
    owner: resident_2
    role: reading notes and household lists; usually paired with her book
  - id: mug_harold
    class: mug
    owner: resident_1
    role: daily drink mug; follows a stable kitchen-to-chair path
  - id: mug_ruth
    class: mug
    owner: resident_2
    role: tea mug; moves between kitchen and sofa
  - id: remote_1
    class: remote
    owner: shared
    role: shared TV remote; both use it but Harold insists it return to the coffee
      table
  - id: blanket_1
    class: blanket
    owner: shared
    role: shared reading blanket; Ruth moves it most often and folds it after use
  - id: medication_bottle_ruth
    class: medication_bottle
    owner: resident_2
    role: regular medication; kept in one consistent kitchen location
  - id: umbrella_1
    class: umbrella
    owner: shared
    role: shared umbrella; Ruth stages it near the entrance and Harold returns it
      afterward
daily_life_summary: >-
  Harold and Ruth spend much of their time at home and repeatedly use the same chairs,
  surfaces, and storage spots. Their objects therefore show low-entropy movement,
  with books, mugs, glasses, and the remote following familiar routes. They cross
  paths frequently in the living room and kitchen and often tidy after one another.
  Larger displacements usually happen because Ruth is cleaning rather than because
  either resident forgot an object.
quirks: >-
  Their home is unusually stable, but cleaning occasionally produces abrupt temporary
  relocation of several objects at once. Harold's strong expectations about object
  locations make even small displacements behaviorally significant.
