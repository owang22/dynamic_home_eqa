daily_life_summary: >-
  Lena's apartment alternates sharply between periods when she is away working and
  periods when she is home recovering, eating, and doing quiet activities. After
  returning from a shift, several carried objects enter the apartment together and
  spread from the entrance toward the kitchen, sofa, and bedroom. Before leaving
  again, she tends to consolidate essentials such as her keys, wallet, phone, and
  water bottle, while less important objects may remain where she last used them.
  Because she lives alone, objects rarely move unless she is actively using them.
quirks: >-
  Despite working an inverted schedule, Lena is not generally messy; most disorder
  is a short trail of objects created while transitioning between work and sleep.
  Her entrance bowl is intended as a fixed landing spot, but she also sometimes
  repurposes it for food, temporarily disrupting that system.
