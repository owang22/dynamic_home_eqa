household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Lena Ortiz
    age: 34
    occupation: hospital laboratory technician
    personality: methodical at work, absent-minded at home, protective of sleep
    habits:
      - drops her keys and wallet into a bowl near the apartment entrance after
        work, but sometimes carries them farther inside while distracted
      - takes a mug between the kitchen and sofa and often leaves it beside whatever
        she was reading
      - eats simple meals on the sofa more often than at the small dining table,
        so plates regularly migrate into the living room
      - keeps her phone close while resting and frequently leaves its charger plugged
        in beside the bed
      - packs a water bottle into her work bag before leaving and sets it on the
        kitchen counter when unpacking
      - takes off her jacket near the entrance but occasionally drapes it over the
        sofa instead of hanging it up
      - uses headphones around the apartment to block neighboring noise and leaves
        them either beside the bed or near her laptop
relationships: >-
  Lena lives alone and has no one else regularly sharing chores or belongings, so
  nearly every misplaced object is the result of her own movement. She is disciplined
  about keeping the apartment quiet and uncluttered enough to sleep comfortably,
  but less concerned about dishes, books, and clothing accumulating temporarily
  in the living room.
home_layout_notes: >-
  The one-bedroom apartment has a compact kitchen opening into a combined living
  and dining area, plus a separate bedroom and bathroom. Lena uses the bedroom primarily
  for sleep, while the sofa and coffee table become the main landing area for food,
  reading materials, headphones, and other objects carried in after work.
