household_id: hh_005
household_type: remote_worker_couple
residents:
  - id: resident_1
    name: Jonah Feld
    age: 31
    occupation: software engineer
    personality: focused, restless, equipment-heavy
    habits:
      - moves his laptop between office desk, dining table, and sofa depending on
        task
      - carries a charger with him but often leaves it plugged into the last workspace
      - borrows resident_2's headphones when his battery is dead
      - brings mugs into work areas and leaves several partially used
      - relocates the shared blanket from sofa to office chair when cold
      - clears resident_2's notebooks from the dining table when he needs more space
  - id: resident_2
    name: Aisha Morgan
    age: 30
    occupation: graphic designer
    personality: visual, tidy, particular about workspace
    habits:
      - moves her laptop between a dedicated desk and the kitchen table
      - keeps pens and notebook arranged together and restores them after Jonah
        shifts them
      - returns shared mugs to the kitchen whenever she takes a break
      - borrows Jonah's charger rather than moving her own from her desk
      - moves the shared remote away from Jonah's work area when it becomes cluttered
      - keeps headphones beside her laptop unless Jonah has borrowed them
relationships: >-
  Jonah and Aisha are partners who both work from home but prefer different levels
  of workspace order. Their equipment overlaps constantly because both use the dining
  table and living room as secondary workspaces. Aisha repeatedly restores organized
  layouts that Jonah disrupts when spreading into new surfaces.
home_layout_notes: >-
  Their two-bedroom apartment includes one shared office and a second smaller room
  used for storage. Both also use the dining table and sofa for work, making the
  kitchen and living room extensions of the office. Electronics migrate frequently
  even though larger household objects remain stable.
object_inventory:
  - id: phone_jonah
    class: phone
    owner: resident_1
    role: personal phone; follows Jonah between work surfaces
  - id: phone_aisha
    class: phone
    owner: resident_2
    role: personal phone; usually stays beside her laptop
  - id: keys_jonah
    class: keys
    owner: resident_1
    role: personal keys; usually remain near the entrance while he works from home
  - id: keys_aisha
    class: keys
    owner: resident_2
    role: personal keys; stored in a small entry tray
  - id: wallet_jonah
    class: wallet
    owner: resident_1
    role: personal wallet; mostly stationary near the entrance
  - id: wallet_aisha
    class: wallet
    owner: resident_2
    role: personal wallet; usually stays in her bag
  - id: laptop_jonah
    class: laptop
    owner: resident_1
    role: work laptop; migrates among several work surfaces
  - id: laptop_aisha
    class: laptop
    owner: resident_2
    role: design laptop; moves primarily between desk and dining table
  - id: charger_jonah
    class: charger
    owner: resident_1
    role: Jonah's charger; frequently left plugged into temporary workspaces
  - id: charger_aisha
    class: charger
    owner: resident_2
    role: Aisha's charger; normally stays at her desk but occasionally borrowed
      by Jonah
  - id: headphones_jonah
    class: headphones
    owner: resident_1
