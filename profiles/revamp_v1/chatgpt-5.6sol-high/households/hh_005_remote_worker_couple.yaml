    owner: shared
    role: shared blanket; moves between sofa and office according to Jonah's comfort
daily_life_summary: >-
  Both residents spend long stretches at home, so object movement comes from changing
  work locations rather than arrivals and departures. Laptops, chargers, mugs, and
  headphones circulate between the office, dining area, kitchen, and sofa. Jonah
  spreads outward into shared space while Aisha repeatedly consolidates objects.
  They cross paths frequently and often move each other's equipment indirectly while
  reclaiming work surfaces.
quirks: >-
  Their highest-mobility objects are work tools rather than personal carry items
  such as keys or wallets. A single room can change function several times as one
  resident abandons a temporary workspace and the other takes it over.
