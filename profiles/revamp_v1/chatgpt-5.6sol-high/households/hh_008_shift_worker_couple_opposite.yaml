household_id: hh_008
household_type: shift_worker_couple_opposite
residents:
  - id: resident_1
    name: Tessa Ward
    age: 29
    occupation: emergency department nurse
    personality: efficient, quiet, forgetful when tired
    habits:
      - places keys and wallet in an entry tray so resident_2 knows she is home
      - leaves written notes in a notebook on the kitchen counter for resident_2
      - moves resident_2's mug into the sink when clearing space
      - uses a shared charger in the bedroom and often leaves her phone attached
      - hangs her jacket near the entrance unless exhausted, when it lands on a
        chair
      - sets the shared umbrella by resident_2's keys if she thinks he will need
        it
  - id: resident_2
    name: Owen Ward
    age: 32
    occupation: construction site supervisor
    personality: practical, consistent, low-maintenance
    habits:
      - checks the kitchen notebook for messages from resident_1
      - places clean items belonging to Tessa on a chair rather than entering her
        sleeping space
      - returns both residents' keys to separate positions in the entry tray if
        they were disturbed
      - moves Tessa's mug from the kitchen counter to the sink
      - keeps his lunchbox beside his backpack near the entrance
      - leaves the shared remote on the coffee table for Tessa rather than carrying
        it elsewhere
relationships: >-
  Tessa and Owen are married but spend relatively little waking time together because
  their work schedules oppose each other. They coordinate through fixed object locations
  rather than frequent face-to-face handoffs. The entry tray, kitchen counter, and
  one chair near the bedroom act as deliberate exchange points.
home_layout_notes: >-
  Their one-bedroom apartment has a compact kitchen, living area, and narrow entrance.
  Because one person is often sleeping while the other is active, movement into
  the bedroom is minimized. Several surfaces have become stable handoff zones.
object_inventory:
  - id: phone_tessa
    class: phone
    owner: resident_1
    role: personal phone; moves between bedroom, pocket, and charging location
  - id: phone_owen
    class: phone
    owner: resident_2
    role: personal phone; usually travels with him or rests near the kitchen
  - id: keys_tessa
    class: keys
    owner: resident_1
    role: personal keys; placed in a fixed entry-tray position
  - id: keys_owen
    class: keys
    owner: resident_2
    role: personal keys; placed separately in the same tray
  - id: wallet_tessa
    class: wallet
    owner: resident_1
    role: personal wallet; deposited beside her keys
  - id: wallet_owen
    class: wallet
    owner: resident_2
    role: personal wallet; usually stays with keys or backpack
  - id: notebook_shared
    class: notebook
    owner: shared
    role: household message notebook; both residents leave notes for the other on
      the kitchen counter
  - id: pen_shared
    class: pen
    owner: shared
    role: kept with the message notebook and rarely moved elsewhere
  - id: mug_tessa
    class: mug
    owner: resident_1
    role: Tessa's mug; Owen often moves it from counter to sink
  - id: mug_owen
    class: mug
    owner: resident_2
    role: Owen's mug; Tessa clears it when she returns
  - id: charger_shared
    class: charger
    owner: shared
    role: shared charger; both use it but avoid relocating it far from the bedroom
  - id: lunchbox_owen
    class: lunchbox
    owner: resident_2
    role: work lunchbox; cycles between kitchen and entrance staging area
  - id: backpack_owen
    class: backpack
    owner: resident_2
    role: work bag; stays near entrance and receives lunchbox and loose items
  - id: jacket_tessa
    class: jacket
    owner: resident_1
    role: work jacket; usually hung near entrance but occasionally left on a chair
  - id: jacket_owen
    class: jacket
    owner: resident_2
    role: work jacket; consistently stored near his backpack
  - id: remote_1
    class: remote
    owner: shared
    role: shared remote; intentionally returned to the coffee table for the other
      resident
  - id: umbrella_1
    class: umbrella
    owner: shared
    role: shared umbrella; one resident stages it beside the other's keys when useful
daily_life_summary: >-
  The apartment often functions as a one-person home even though two people live
  there. Tessa and Owen leave and recover objects from fixed locations that communicate
  status without direct conversation. Their belongings overlap mainly in the kitchen,
  entrance, and living room, while the bedroom is treated carefully to avoid disturbing
  whoever is sleeping. Object handoffs are therefore unusually deliberate and spatially
  constrained.
quirks: >-
  Misplaced objects are often corrected by the other resident before the owner sees
  them. Several everyday objects function as implicit messages, making location
  informative beyond simple convenience.
