# single_adult_typ_v1 -- typical base #1
# Source: charter_schema_v1.yaml Section B (spec), transcribed.
# Authorship note for the paper's appendix: schema and typical-charter draft
# produced by a model OUTSIDE the evaluated set (Claude); every numeric value
# is provenance-tagged and requires human verification against the cited
# anchor before the charter is marked VERIFIED. Atypical charters are NEVER
# drafted by any model: they are deterministic code transformations of
# verified typical charters (transforms.py).
#
# Provenance key:
#   [ATUS]      American Time Use Survey table for activity timing  -> VERIFY
#   [BEHAV]     BEHAVIOR-1K activity-object definitions             -> VERIFY
#   [HOMER]     HOMER activity->object mappings / variability       -> VERIFY
#   [HKEEP]     Housekeep / PARSEC placement preferences            -> VERIFY
#   [DESIGN]    Free experimental-design parameter (no anchor needed;
#               justify in text: chosen for coverage of volatility terciles)

household: single_adult_typ_v1
# VERIFIED by the researcher (Oliver, 2026-07-19): provenance tags reviewed;
# validate_charter.py passes (V1-V5 PASS/WARN, V6 PASS/WARN/NEEDS_DATA, no FAIL).
# cutting_board retagged [DESIGN] (BEHAVIOR-1K has no distinct board synset).
status: VERIFIED
derived_from: null
transformation: null

receptacles:
  # Rooms implied by receptacle ids; aliases normalize at load (V5).
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: closet_r1,     room: bedroom,  aliases: [wardrobe]}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: stove_k1,      room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: desk_o1,       room: office,   aliases: []}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: shelf_e1,      room: entryway, aliases: []}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}

residents:
  - id: R1
    description: single adult, standard weekday office schedule
    schedule:
      # Weekday block structure and times drawn from ATUS median full-time
      # worker day. VERIFY each start/end against the ATUS table used.
      - {activity: sleep,        days: [Mo,Tu,We,Th,Fr], start: "23:00", end: "06:45"}  # [ATUS]
      - {activity: morning_prep, days: [Mo,Tu,We,Th,Fr], start: "06:45", end: "07:20"}  # [ATUS]
      - {activity: breakfast,    days: [Mo,Tu,We,Th,Fr], start: "07:20", end: "07:45"}  # [ATUS]
      - {activity: leave_work,   days: [Mo,Tu,We,Th,Fr], start: "07:45", end: "08:00"}  # [ATUS]
      - {activity: away_at_work, days: [Mo,Tu,We,Th,Fr], start: "08:00", end: "17:30"}  # [ATUS]
      - {activity: return_home,  days: [Mo,Tu,We,Th,Fr], start: "17:30", end: "17:45"}  # [ATUS]
      - {activity: cook_dinner,  days: [Mo,Tu,We,Th,Fr], start: "18:15", end: "19:00"}  # [ATUS]
      - {activity: dinner,       days: [Mo,Tu,We,Th,Fr], start: "19:00", end: "19:30"}  # [ATUS]
      - {activity: tv_evening,   days: [Mo,Tu,We,Th,Fr], start: "20:00", end: "22:30"}  # [ATUS]
      - {activity: sleep,        days: [Sa,Su],          start: "00:00", end: "08:30"}  # [ATUS] weekend shift
      - {activity: tidy_house,   days: [Sa],             start: "10:00", end: "11:30"}  # [ATUS]
      - {activity: laptop_couch, days: [Sa,Su],          start: "13:00", end: "15:00"}  # [DESIGN]
      - {activity: cook_dinner,  days: [Sa,Su],          start: "18:30", end: "19:15"}  # [ATUS]
      - {activity: tv_evening,   days: [Sa,Su],          start: "20:00", end: "23:30"}  # [ATUS]

activities:
  # Object bindings from BEHAVIOR-1K / HOMER activity definitions.
  # jitter_min: uniform +/- start-time noise, per HOMER day-to-day variability. VERIFY magnitude. [HOMER]
  morning_prep:
    jitter_min: 10                                    # [HOMER]
    objects: [phone, glasses]
    during: {phone: nightstand_r1, glasses: nightstand_r1}
    after:
      phone:   {dest: counter_k1, p: 0.9}             # carried to kitchen [DESIGN]
      glasses: {dest: null, p: 1.0}                   # worn; leaves tracked set until return_home
  breakfast:
    jitter_min: 10                                    # [HOMER]
    objects: [mug, bowl, spoon]
    during: {mug: counter_k1, bowl: table_d1, spoon: table_d1}   # [BEHAV]
    after:
      mug:   {dest: sink_k1, p: 0.7, else: counter_k1}           # [HKEEP] VERIFY p
      bowl:  {dest: sink_k1, p: 0.8, else: table_d1}             # [HKEEP] VERIFY p
      spoon: {dest: sink_k1, p: 0.8, else: table_d1}             # [HKEEP] VERIFY p
  leave_work:
    jitter_min: 5                                     # tight departure window [DESIGN]
    objects: [keys, backpack, phone, laptop]
    after:
      keys:     {dest: null, p: 1.0}                  # leaves house
      backpack: {dest: null, p: 1.0}
      phone:    {dest: null, p: 1.0}
      laptop:   {dest: null, p: 0.8, else: desk_o1}   # sometimes left home [DESIGN]
  return_home:
    jitter_min: 20                                    # commute variance [DESIGN]
    objects: [keys, backpack, phone, laptop, glasses]
    after:
      keys:     {dest: entry_hook_e1, p: 0.85, else: counter_k1} # misplacement channel [HKEEP] VERIFY
      backpack: {dest: shelf_e1, p: 0.7, else: sofa_l1}          # [HKEEP] VERIFY
      phone:    {dest: sofa_l1, p: 0.5, else: counter_k1}        # high-volatility object [DESIGN]
      laptop:   {dest: desk_o1, p: 0.75, else: sofa_l1}          # [HKEEP] VERIFY
      glasses:  {dest: null, p: 1.0}                  # still worn until sleep
  cook_dinner:
    jitter_min: 25                                    # [HOMER]
    objects: [pan, cutting_board, knife]
    during:
      pan:           stove_k1     # [BEHAV]
      cutting_board: counter_k1   # [DESIGN] BEHAVIOR-1K models 'countertop', not a distinct board synset
      knife:         counter_k1   # [BEHAV]
    after:
      pan:           {dest: sink_k1, p: 0.6, else: stove_k1}     # [HKEEP] VERIFY
      cutting_board: {dest: sink_k1, p: 0.7, else: counter_k1}
      knife:         {dest: sink_k1, p: 0.9, else: counter_k1}
  dinner:
    jitter_min: 10
    objects: [plate, fork, water_glass]
    during: {plate: table_d1, fork: table_d1, water_glass: table_d1}
    after:
      plate:       {dest: sink_k1, p: 0.85, else: table_d1}
      fork:        {dest: sink_k1, p: 0.85, else: table_d1}
      water_glass: {dest: sink_k1, p: 0.5,  else: table_d1}      # often lingers [DESIGN]
  tv_evening:
    jitter_min: 20
    objects: [remote_control, phone, water_glass]
    during: {remote_control: sofa_l1, phone: sofa_l1}
    after:
      remote_control: {dest: tv_stand_l1, p: 0.4, else: sofa_l1} # frequently left out [DESIGN]
      phone:          {dest: nightstand_r1, p: 0.9, else: sofa_l1}
      water_glass:    {dest: nightstand_r1, p: 0.3, else: sofa_l1}
  tidy_house:
    jitter_min: 45                                    # loose weekend timing [HOMER]
    objects: [remote_control, water_glass, backpack]  # reset pass
    after:
      remote_control: {dest: tv_stand_l1, p: 1.0}
      water_glass:    {dest: sink_k1, p: 1.0}
      backpack:       {dest: shelf_e1, p: 1.0}
  laptop_couch:
    jitter_min: 30
    objects: [laptop, mug]
    during: {laptop: sofa_l1, mug: sofa_l1}
    after:
      laptop: {dest: sofa_l1, p: 0.6, else: desk_o1}
      mug:    {dest: sink_k1, p: 0.5, else: sofa_l1}

placements:
  # home = resting receptacle; p_misplace = daily chance of drifting to
  # misplace_set outside scripted activities. Keep p_misplace small; it is
  # noise, not routine. All placement homes VERIFY against [HKEEP].
  phone:          {home: nightstand_r1, volatility_class_hint: high}    # [DESIGN]
  keys:           {home: entry_hook_e1, p_misplace: 0.10, misplace_set: [counter_k1, sofa_l1]}  # [HKEEP]
  laptop:         {home: desk_o1}
  backpack:       {home: shelf_e1}
  mug:            {home: cupboard_k1}                 # dish-cycle returns sink->cupboard nightly [DESIGN]
  bowl:           {home: cupboard_k1}
  spoon:          {home: cupboard_k1}
  plate:          {home: cupboard_k1}
  fork:           {home: cupboard_k1}
  water_glass:    {home: cupboard_k1}
  pan:            {home: cupboard_k1}
  cutting_board:  {home: counter_k1}
  knife:          {home: cupboard_k1}
  remote_control: {home: tv_stand_l1}
  glasses:        {home: nightstand_r1}
  # Static anchors for the low-volatility tercile (never bound to activities):
  toaster:        {home: counter_k1,  volatility_class_hint: static}
  vase:           {home: table_d1,    volatility_class_hint: static}
  first_aid_kit:  {home: bathroom_c1, volatility_class_hint: static}

# Dish-cycle rule (generator-level, applies to all charters): objects in
# sink_k1 at 21:30 return to their placement home at 21:45 with p=0.9. [DESIGN]
# This closes the sink->cupboard loop so tableware exhibits daily periodicity
# rather than accumulating in the sink.
