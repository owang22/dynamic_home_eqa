# A ROOM GOES OUT OF ACTION: the bathroom is gutted for a refit for ten days.
# Same ten households, same 32-day calendar shape and same question protocol as
# illness_v1/illness_v2, so the two disruptions can be put side by side; only the
# event rules differ. The mechanism, the per-household spread of destinations and the
# control objects are all documented in events_room_shut.yaml under `bathroom_shut`.
name: room_shut_v1
sim_dir: ../../../data/situation_sim/self_improve/room_shut_v1
events_file: events_room_shut.yaml
activities_file: activities_v3.yaml

day0: Monday
days: 32
calendar:
  - {name: lead,   days: [0, 13],  day_kind: weekday, suppress_random_events: true}
  - {name: shut,   days: [14, 23], day_kind: weekday, suppress_random_events: true,
     force_events: [{event: bathroom_shut}]}
  - {name: return, days: [24, 31], day_kind: weekday, suppress_random_events: true}

# no background events: the only thing that changes is the refit
events:
  rain:              {weekday: 0.0, weekend: 0.0}
  guest_visit:       {weekday: 0.0, weekend: 0.0}
  late_work:         {weekday: 0.0, weekend: 0.0}
  grocery_delivery:  {weekday: 0.0, weekend: 0.0}
  laundry_day:       {weekday: 0.0, weekend: 0.0}
  sick_day:          {weekday: 0.0, weekend: 0.0}
  unwell_spell:      {weekday: 0.0, weekend: 0.0}
  bathroom_shut:     {weekday: 0.0, weekend: 0.0}

# questions: everyone's things. The refit is household-wide, so the controls are
# objects rather than people: see the control list in events_room_shut.yaml.
question_owners: null
questions: activity
question_moment: during
question_min_gap_min: 30
per_day: 24
oversample: 1024
# Six classes with a rule (towel, blanket, razor, skincare, glasses, toiletry_bag) and
# ten deliberately without (mug, glass, water_bottle, book, notebook, charger, remote,
# tablet, plate, snack_bowl).
#
# Two things were settled by measurement rather than taste, both on check 7's "was the
# ordinary routine learnable at all" leg, which needs the settled window to beat the
# learner's own first two days by ten points.
#
#  * hair_dryer, detergent and laundry_basket are LEFT OUT although the refit moves
#    them and the rules for them are still in events_room_shut.yaml. In the settled
#    window none of them ever leaves its shelf - the laundry activity does not run in
#    this calendar at all - so a counting method has them right from the walkthrough
#    onwards, and asking about them only raises the learner's day-one score. With them
#    in, the forgetting learner's settled climb was +7.3 against a +10 bar; without
#    them it is +12.4. The world still moves them; the question bank just does not ask.
#  * plate and snack_bowl are IN although the refit does not touch them, because each
#    travels between three or four surfaces in an ordinary week (plate: the kitchen
#    table at lunch, the dining table at dinner, the sink after; snack_bowl: the
#    coffee table, the counter, the dining table). They are what makes the settled
#    routine something a learner has to earn.
classes: [towel, blanket, razor, skincare, glasses, toiletry_bag,
          mug, glass, water_bottle, book, notebook, charger, remote, tablet,
          plate, snack_bowl]

patrol_hours: 0
patrol_times: "03:00"
feedback_delay_min: 10
shift_focus: 0.0
