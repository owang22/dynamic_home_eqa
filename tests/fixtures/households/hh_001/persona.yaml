household_id: hh_001
household_type: working_professional_solo
residents:
  - id: resident_1
    name: Elena Park
    age: 34
    occupation: museum conservator
    personality: methodical, quietly sentimental, tidy except when absorbed in a
      project
    habits:
      - Carries her phone, keys, wallet, and water bottle in the same backpack whenever
        she leaves for the museum.
      - Sets her work mug beside the kitchen sink after breakfast and washes it
        before making another drink.
      - Uses a notebook at the dining table to sketch treatment ideas, then stacks
        it under her laptop when she is finished.
      - Changes out of her jacket near the entry and hangs it on the wall hook rather
        than draping it over furniture.
      - Cooks simple one-pot meals and rinses her plate, bowl, pot, and pan soon
        after eating.
      - Reads on the sofa with a blanket and leaves her current book on the coffee
        table or bedside table.
      - Waters her windowsill plants with the watering can and returns it to the
        kitchen cabinet after use.
      - Keeps a small suitcase partly packed in the bedroom closet for occasional
        conservation workshops.
relationships: >-
  Elena lives alone and has full control of the apartment's chores, storage, and
  shared surfaces. She prefers objects to have assigned homes, although a notebook,
  book, or laptop may remain on the dining table while she is focused on a project.
  Her main point of friction is with herself: she postpones putting away research
  materials when an idea is still in progress.
home_layout_notes: >-
  The apartment has an entry hook and narrow console for departure items, a combined
  kitchen-dining area, a living room with a sofa and coffee table, and one bedroom.
  Elena uses the dining table as a temporary work surface, while the sofa is her
  reading space; the kitchen counter is kept mostly clear for cooking and plant
  care. Her backpack, jacket, and umbrella cluster near the entry, and personal
  grooming items stay in the bedroom.
