daily_life_summary: >-
  On workdays, Elena packs her essentials into her backpack and leaves the apartment
  for the museum, so the home is quiet for much of the day. When she returns, she
  usually crosses from the entry to the kitchen before settling at the dining table
  or sofa. Her home activities are compact and orderly: cooking, washing a small
  amount of dishware, reading, and tending plants. On days away from the museum,
  her laptop and notebook may stay out longer as she reviews professional material
  at the table.
quirks: >-
  Although she is a working professional who commutes, Elena avoids disposable coffee
  cups and brings the same water bottle nearly everywhere. She treats her dining
  table less like a formal eating area and more like a carefully controlled extension
  of her workbench.
