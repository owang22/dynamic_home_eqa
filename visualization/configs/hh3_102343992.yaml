  counter_k1:           {anchor: [0.22, 0.42], relation: on_surface}
  sink_k1:              {anchor: [0.42, 0.16], relation: on_surface}
  dish_rack_k1:         {anchor: [0.52, 0.16], relation: on_surface}
  cupboard_k1:          {anchor: [0.62, 0.16], relation: on_surface}
  armchair_l1:          {anchor: [0.30, 0.35], relation: on_surface}
  side_table_l1:        {anchor: [0.22, 0.30], relation: on_surface}
  tv_drawer_l1:         {anchor: [0.50, 0.12], relation: on_surface}
  couch_l1:             {anchor: [0.55, 0.55], relation: on_surface}
  sideboard_l1:         {anchor: [0.75, 0.30], relation: on_surface}
