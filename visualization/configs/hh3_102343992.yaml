schedule_spec: ../../profiles/revamp_v1/claude-fable-5/hh3/object_motions.yaml
scene_assets: ../assets/102343992

room_map:
  bedroom: bedroom.004
  living: tv
  kitchen: kitchen
  bathroom: bathroom.001
  entry: hallway.003
  shed: garage

