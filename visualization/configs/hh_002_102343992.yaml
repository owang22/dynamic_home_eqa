# Spatial config: hh_002 (Whitfield family of four) across the ground floor
# of HSSD scene 102343992 — a real family house, so the mapping uses the
# whole floor: actual kitchen/dining/tv rooms, bedroom.004 as the parents'
# room, and the two ground-floor offices standing in for the kids' rooms
# (the scene's real bedrooms are upstairs; the bake is single-floor).
# Anchors are hand-placed bbox fractions, not matched to scene furniture.
# Paths are relative to this config file's directory.

household: hh_002
schedule_spec: ../../profiles/revamp_v1/claude-fable-5/schedules/hh_002_schedule.yaml
scene_assets: ../assets/102343992

room_map:
  entry: hallway.002        # central connector = the launch-pad hall
  kitchen: kitchen
  dining: dining room
  living: tv
  bedroom_parents: bedroom.004
  bedroom_asha: office.001
  bedroom_ben: office.002
  bathroom: bathroom

receptacles:
  entry_hooks_e1:    {anchor: [0.25, 0.25], relation: hook}
  entry_stage_e1:    {anchor: [0.60, 0.50], relation: floor}   # staged backpacks
  hall_floor_e1:     {anchor: [0.40, 0.78], relation: floor}
  dining_table_d1:   {anchor: [0.50, 0.50], relation: on_surface}
  counter_k1:        {anchor: [0.24, 0.42], relation: on_surface}
  sink_k1:           {anchor: [0.42, 0.16], relation: on_surface}
  cupboard_k1:       {anchor: [0.62, 0.16], relation: on_surface}
  couch_l1:          {anchor: [0.38, 0.60], relation: on_surface}
  coffee_table_l1:   {anchor: [0.62, 0.45], relation: on_surface}
  high_shelf_l1:     {anchor: [0.14, 0.22], relation: on_surface}
  toy_basket_l1:     {anchor: [0.78, 0.72], relation: floor}
  fort_l1:           {anchor: [0.22, 0.82], relation: floor}   # behind the couch
  bed_parents_p1:    {anchor: [0.38, 0.58], relation: on_surface}
  nightstand_p1:     {anchor: [0.14, 0.24], relation: on_surface}
  bed_asha_a1:       {anchor: [0.50, 0.52], relation: on_surface}
  bed_ben_b1:        {anchor: [0.50, 0.52], relation: on_surface}
  bathroom_shelf_ba1: {anchor: [0.50, 0.35], relation: on_surface}

elsewhere:
  pos: [6.5, -12.5]         # same blank apron as hh_001 — consistent AWAY spot
  label: "AWAY (outside)"

view_margin_m: 2.0
