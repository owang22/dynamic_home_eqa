# Regime search R6 "sick10_owner": 14 weekdays lead, resident_1 off sick for 10 days (14-23), 8 weekdays return; questions only about resident_1's everyday things (book, water bottle, tablet, mug, charger, glasses, glass, razor), during activities; frozen + forgetting agents (3 d, 1 d).
name: frozen_person
sim_dir: ../../data/situation_sim/regime_search/sick10_owner
