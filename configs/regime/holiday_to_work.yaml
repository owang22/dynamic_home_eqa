# Regime search R2 "holiday_to_work": routine-group questions asked DURING activities, 28 days from a Monday, no random events,
# calendar: 14 days at home on the weekend schedule (a long break), then 14 working weekdays. Seeds 0-9.
name: holiday_to_work
sim_dir: ../../data/situation_sim/regime_search/holiday_to_work
day0: Monday
days: 28
events: {rain: {weekday: 0.0, weekend: 0.0}, guest_visit: {weekday: 0.0, weekend: 0.0}, late_work: {weekday: 0.0, weekend: 0.0},
         grocery_delivery: {weekday: 0.0, weekend: 0.0}, laundry_day: {weekday: 0.0, weekend: 0.0}, sick_day: {weekday: 0.0, weekend: 0.0}}
calendar:
  - {name: home, days: [0, 13],  day_kind: weekend, suppress_random_events: true}
  - {name: work, days: [14, 27], day_kind: weekday, suppress_random_events: true}
patrol_hours: 0
patrol_times: "03:00"
questions: activity
question_moment: during
classes: [mug, bowl, plate, glass, water_bottle, pan, pot, spatula, kitchen_knife, serving_dish, recipe_book, snack_bowl, tablet, charger, remote, glasses, razor, book, shopping_bag, dog_food_bag]
per_day: 64
oversample: 256
timetable_bin_hours: 2
negative_evidence: off
feedback_delay_min: 10
