# Activity templates and per-role daily schedules for situation_sim.
# Activity fields:
#   room: activity room (kitchen, living, bathroom, entry, bedroom (owner's),
#         workspace (office desk if the house has one, else owner's bedroom
#         desk), ELSEWHERE)
#   surface: receptacle kind where used objects are put down when the
#            resident leaves them where they were used
#   uses: object classes (or groups: pocket, outdoor, bag, gym) the activity
#         fetches at its start
#   jitter: jitter class (see timing_constants.JITTER_CLASSES_MIN)
#   mean_bouts: fragmentation (defaults to 1)
#   tidies: true if the activity's end returns misplaced objects to their
#           primary slot; tidy_rooms lists the rooms the pass covers
activities:
  morning_routine: {room: bathroom, surface: bathroom_shelf, uses: [phone, glasses], jitter: routine}
  breakfast:       {room: kitchen, surface: kitchen_table, uses: [phone, mug], jitter: routine}
  commute_work:    {room: ELSEWHERE, uses: [pocket, outdoor, bag], jitter: external}
  work_session:    {room: workspace, surface: desk, uses: [laptop, charger, notebook, headphones, mug, phone, glasses], jitter: routine, mean_bouts: 2}
  lunch:           {room: kitchen, surface: kitchen_table, uses: [phone], jitter: routine}
  lunch_out:       {room: ELSEWHERE, uses: [pocket, outdoor], jitter: flexible}
  walk:            {room: ELSEWHERE, uses: [pocket, outdoor, headphones], jitter: flexible}
  gym:             {room: ELSEWHERE, uses: [pocket, outdoor, gym], jitter: flexible}
  errands:         {room: ELSEWHERE, uses: [pocket, outdoor, bag_leader], jitter: loose}
  chores:          {room: kitchen, surface: counter, uses: [phone, watering_can], jitter: loose, mean_bouts: 3, tidies: true, tidy_rooms: [kitchen]}
  tidy:            {room: living, surface: coffee_table, uses: [], jitter: routine, tidies: true, tidy_rooms: [living, kitchen, entry]}
  cook_dinner:     {room: kitchen, surface: counter, uses: [phone], jitter: routine}
  dinner:          {room: dining_or_kitchen, surface: dining_or_kitchen_table, uses: [phone, water_bottle], jitter: routine}
  evening_tv:      {room: living, surface: coffee_table, uses: [remote, phone, blanket, mug, glasses], jitter: flexible, mean_bouts: 2}
  read:            {room: bedroom, surface: bed, uses: [book, glasses, phone], jitter: flexible}
  host_guest:      {room: living, surface: coffee_table, uses: [phone, mug], jitter: routine}
  unpack_groceries: {room: kitchen, surface: kitchen_table, uses: [water_bottle], jitter: routine}
  laundry:         {room: bathroom, surface: bathroom_shelf, uses: [laundry_basket, towel, blanket, phone], jitter: flexible}
  rest_couch:      {room: living, surface: coffee_table, uses: [laptop, charger, headphones, glasses, mug, medication, book, phone, blanket, water_bottle], jitter: loose}
  sleep:           {room: bedroom, surface: nightstand, uses: [], jitter: routine}

# Per-role schedules. start "HH:MM", duration minutes, skip_p optional.
# Blocks are authored in order; jitter and event edits may reorder nothing
# (a shifted block pushes the next one).
