  wallet:     {size: small, per: resident, p: 1.0, home: [entry_table@entry, nightstand@bedroom, desk@workspace], pocket: true}
  sunglasses: {size: small, per: resident, p: 0.5, home: [entry_table@entry, dresser@bedroom, nightstand@bedroom], outdoor: true}
  jacket:     {size: wearable, per: resident, p: 1.0, home: [entry_hook@entry, wardrobe@bedroom], outdoor: true}
  scarf:      {size: wearable, per: resident, p: 0.5, home: [entry_hook@entry, wardrobe@bedroom, dresser@bedroom], outdoor: true}
  hat:        {size: wearable, per: resident, p: 0.4, home: [entry_hook@entry, dresser@bedroom], outdoor: true}
