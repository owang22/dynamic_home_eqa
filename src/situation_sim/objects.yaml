# Object catalogue for situation_sim. Every tracked object in a home is an
# instance of a class below. Classes are tied to the activities that use
# them (activities.yaml `uses`), so an activity leaves a visible footprint.
#
# Class fields
#   size: small | paper | dish | kitchen_tool | wearable | bag | device |
#         bulky | textile | toiletry | static   (what spots accept it)
#   per: resident | shared
#   p: chance the instance exists (per resident, or for the home)
#   roles: (per resident) only residents with one of these roles own one
#   hobby: only a resident with that hobby owns one (shared: any resident)
#   pet: only if the home has that pet
#   home: spot kinds with room tokens, primary first; first that resolves
#         in this home is used, unresolvable entries are skipped.
#         Room tokens: bedroom (owner's; bedroom_1 for shared), workspace,
#         kitchen, living, bathroom, entry, dining_or_kitchen,
#         storage_or_bedroom, balcony_or_living, office_or_living
#   after_use: spot kind a used one goes to (a dirty plate: the sink)
#   pocket / outdoor: taken on trips out (outdoor items may be a standing
#         omission per trip type, like carry_p in the old params)
#   bag_candidate: may ride in the owner's bag group
#   gym_candidate: may ride in the owner's gym bag
#   words: plain words for the trace

size_accepts:
  # spot kind -> size classes it holds ("*" = anything). A class listed in
  # class_overrides is accepted at that spot regardless of size.
  counter:        [small, dish, kitchen_tool, toiletry, device, paper, bag]
  sink:           [dish, kitchen_tool]
  dish_rack:      [dish, kitchen_tool]
  cupboard:       [dish, kitchen_tool, toiletry]
  drawer_k:       [kitchen_tool, small]
  pantry_shelf:   [dish, kitchen_tool, paper, bag, small]
  kitchen_table:  [small, paper, device, dish, kitchen_tool, bag, textile, toiletry]
  dining_table:   [small, paper, device, dish, kitchen_tool, bag, textile]
  chair:          [bag, wearable, paper, device, textile]
  chair_d:        [bag, wearable, paper, device, textile]
  floor_k:        [small, paper, wearable, bag, device, bulky, textile]
  couch:          [small, paper, device, textile, wearable, bag, bulky, dish]
  armchair:       [small, paper, device, textile, wearable, bag, dish]
  coffee_table:   [small, paper, device, dish, textile, toiletry, bulky]
  side_table:     [small, paper, device, dish, toiletry]
  tv_stand:       [small, device, paper]
  bookshelf:      [paper, small, device, bulky, dish]
  floor_l:        [small, paper, wearable, bag, device, bulky, textile]
  entry_table:    [small, paper, device, bag, toiletry, dish]
  entry_hook:     [wearable, bag]
  shoe_rack:      [wearable]
  entry_floor:    [small, paper, wearable, bag, device, bulky, textile]
  bathroom_shelf: [toiletry, small, textile, dish]
  towel_rack:     [textile, wearable]
  medicine_cabinet: [toiletry]
  sink_ba:        [toiletry, small]
  bed:            [small, paper, device, textile, wearable, bag, bulky]
  nightstand:     [small, paper, device, toiletry, dish]
  desk:           [small, paper, device, dish, bag, toiletry]
  dresser:        [small, paper, device, toiletry, textile, wearable]
  wardrobe:       [wearable, bag, textile, bulky]
  bedroom_floor:  [small, paper, wearable, bag, device, bulky, textile]
  office_shelf:   [paper, small, device, bulky]
  office_chair:   [bag, wearable, paper, device, textile]
  floor_o:        [small, paper, wearable, bag, device, bulky, textile]
  sideboard:      [small, paper, device, dish, bulky]
  storage_shelf:  [bulky, bag, kitchen_tool, small, paper, device]
  storage_floor:  [small, paper, wearable, bag, device, bulky, textile]
  balcony_table:  [small, dish, paper, device]
  balcony_floor:  [small, paper, wearable, bag, device, bulky, textile]

class_overrides:
  # class -> extra spot kinds it may sit on
  keys: [entry_hook]
  dog_leash: [entry_hook]
  umbrella: [entry_hook, entry_floor]
  helmet: [entry_hook]
  watering_can: [counter, cupboard, pantry_shelf, balcony_floor, balcony_table, floor_l, floor_k, storage_shelf]
  shoes: [entry_floor, shoe_rack, wardrobe, bedroom_floor]
  running_shoes: [entry_floor, shoe_rack, wardrobe, bedroom_floor]

classes:
