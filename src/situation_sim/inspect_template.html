<title>Situation Sim Inspector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f7f4; --panel:#ffffff; --panel2:#eef2ee; --ink:#1b2321; --muted:#5f6d68; --line:#d6ddd8; --line2:#e7ece8;
  --accent:#137068; --accent-ink:#ffffff; --accent-soft:#d9eeea;
  --whim:#b6741a; --whim-soft:#f6e9d2;
  --event:#5f4bb0; --event-soft:#e6e1f5;
  --internal:#a8475a; --internal-soft:#f3dfe3;
  --ok:#2c7a4b; --ok-soft:#d8eedf; --bad:#b3352b; --bad-soft:#f4dcd9;
  --seg-l:62%;
  --sans:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141917; --panel:#1b2220; --panel2:#222b28; --ink:#e4eae6; --muted:#98a69f; --line:#2c3733; --line2:#232d2a;
    --accent:#4dc0b0; --accent-ink:#0f1716; --accent-soft:#193a36;
    --whim:#e0a24a; --whim-soft:#3a2d16;
    --event:#a695e8; --event-soft:#2a2440;
    --internal:#e08496; --internal-soft:#3d2228;
    --ok:#6fcf97; --ok-soft:#1d3527; --bad:#ef8a80; --bad-soft:#3d2320;
    --seg-l:46%;
  }
}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b2220; --panel2:#222b28; --ink:#e4eae6; --muted:#98a69f; --line:#2c3733; --line2:#232d2a;
  --accent:#4dc0b0; --accent-ink:#0f1716; --accent-soft:#193a36;
  --whim:#e0a24a; --whim-soft:#3a2d16;
  --event:#a695e8; --event-soft:#2a2440;
  --internal:#e08496; --internal-soft:#3d2228;
  --ok:#6fcf97; --ok-soft:#1d3527; --bad:#ef8a80; --bad-soft:#3d2320;
  --seg-l:46%;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;margin:0}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.seed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.seed select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{accent-color:var(--accent);width:16px;height:16px;margin:0}
main{padding-block:18px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px)}
@media (max-width:860px){.sticky{position:static}}
.id{font-family:var(--mono);font-size:12.5px;padding:0 4px;border-radius:4px;background:var(--panel2);white-space:nowrap}
.id.obj{cursor:pointer;border-bottom:1px solid var(--accent)}
.id.obj:hover{background:var(--accent-soft)}
.id.rec{color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;margin-left:4px;font-family:var(--mono);vertical-align:middle}
.tag.event{background:var(--event-soft);color:var(--event)}
.tag.internal{background:var(--internal-soft);color:var(--internal)}
.tag.whim{background:var(--whim-soft);color:var(--whim);font-family:var(--sans);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:var(--line2);position:relative;min-width:70px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.bar.rose>i{background:var(--internal)}
.bar.amber>i{background:var(--whim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.daytabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.daytabs button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
.daytabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cause{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:14px;border-left:3px solid var(--event);background:var(--event-soft)}
.cause.internal{border-left-color:var(--internal);background:var(--internal-soft)}
.cause .id{background:transparent;padding:0;font-weight:500}
.hiddenbox{border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);font-size:14px;text-align:center}
.hiddenbox button{margin-top:8px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.controls input[type=text],.controls select,.field select,.field input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.timeline{font-size:14px}
.tl{display:grid;grid-template-columns:52px 1fr;gap:0 10px;padding:3px 0;border-bottom:1px solid var(--line2)}
.tl .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.tl.indent{grid-template-columns:52px 1fr;border-bottom:none;padding:1px 0}
.tl.indent .t{visibility:hidden}
.tl.indent .x{padding-left:18px;color:var(--ink)}
.tl.whim .x{background:var(--whim-soft);border-radius:4px;padding:2px 6px 2px 18px}
.tl.head .x{font-weight:600}
.tl.trip .x,.tl.back .x{font-weight:600;color:var(--accent)}
.tl.dim{opacity:.32}
.tl.hit .x{background:var(--accent-soft);border-radius:4px;padding:2px 6px}
.tl.indent.hit .x{padding-left:18px}
.tl.future{opacity:.25;filter:blur(1.5px)}
.strip{display:flex;flex-direction:column;gap:3px;margin:10px 0}
.strow{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.strow .segs{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.seg{height:100%;min-width:1px}
.seg.person{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)}
.seg.out{background:var(--muted);opacity:.55}
.hours{display:grid;grid-template-columns:36px 1fr;gap:8px;font-size:11px;color:var(--muted)}
.hours .h{display:flex;justify-content:space-between;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.q{font-size:20px;font-family:var(--serif);margin:6px 0 12px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.verdict{border-radius:8px;padding:10px 12px;margin-top:12px;font-size:14px}
.verdict.ok{background:var(--ok-soft);border-left:3px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.verdict.none{background:var(--panel2);border-left:3px solid var(--muted)}
.mark{font-weight:700}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.small{font-size:13px;color:var(--muted)}
.evid .tl{grid-template-columns:82px 1fr}
.evid .tl .t{visibility:visible}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.hist{font-size:13px;margin-top:8px}
.hist div{padding:3px 0;border-bottom:1px solid var(--line2)}
@media (prefers-reduced-motion:no-preference){.tl.hit .x{transition:background .2s}}
</style>

<header class="top"><div class="wrap">
  <h1>Situation Sim Inspector</h1>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-view="household">Household</button>
    <button role="tab" data-view="days">Days</button>
    <button role="tab" data-view="objects">Objects</button>
    <button role="tab" data-view="quiz">Quiz</button>
  </nav>
  <span class="spacer"></span>
  <label class="seed">household <select id="seedSel"></select></label>
  <label class="switch"><input type="checkbox" id="reveal"> reveal hidden causes</label>
</div></header>

<main class="wrap">
  <section id="v-household" hidden></section>
  <section id="v-days" hidden></section>
  <section id="v-objects" hidden></section>
  <section id="v-quiz" hidden></section>
</main>

<script type="application/json" id="data">/*__RUNS_JSON__*/</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const RUNS = DATA.runs, EVENTS = DATA.events;
const DAYS = ["Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY = 86400;
const S = {seed: Object.keys(RUNS).sort((a,b)=>+a-+b)[0], view:'days', day:0, reveal:false, filter:'', movesOnly:false,
           obj:null, quiz:{cutoff:'yesterday', pool:'moving', q:null, answered:false, score:null, hist:[]}};
try{ const saved = JSON.parse(localStorage.getItem('ssi-state')||'{}'); Object.assign(S, {view:saved.view||S.view, seed: RUNS[saved.seed]?saved.seed:S.seed, day: saved.day||0}); }catch(e){}

// ---------- data helpers ----------
const run = () => RUNS[S.seed];
const hh = () => run().state.household;
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const resName = id => hh().residents[id] ? cap(hh().residents[id].name) : id;
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = m => `${String(Math.floor(Math.min(m,1439)/60)).padStart(2,'0')}:${String(Math.min(m,1439)%60).padStart(2,'0')}`;
const fmtT = t => { const d=Math.floor(t/DAY), m=Math.floor((t%DAY)/60); return `${DAYS[d]||('day '+d)} ${fmtMin(m)}`; };
const wd3 = d => (DAYS[d]||'').slice(0,3);
let _rowsCache = {};
function rowsFor(obj){ const k=S.seed+'|'+obj; if(!_rowsCache[k]) _rowsCache[k]=run().truth.filter(r=>r.object_id===obj).sort((a,b)=>a.t-b.t); return _rowsCache[k]; }
function rowAt(obj, t){ const rs=rowsFor(obj); let lo=0,hi=rs.length-1,ans=null; while(lo<=hi){const mid=(lo+hi)>>1; if(rs[mid].t<=t){ans=rs[mid];lo=mid+1;} else hi=mid-1;} return ans; }
function locAt(obj,t){ const r=rowAt(obj,t); return r?r.receptacle_id:null; }
function timeWeighted(obj, until){ const rs=rowsFor(obj), acc={}; for(let i=0;i<rs.length;i++){ const a=rs[i].t, b=Math.min(i+1<rs.length?rs[i+1].t:Infinity, until); if(b<=a) continue; acc[rs[i].receptacle_id]=(acc[rs[i].receptacle_id]||0)+(b-a);} return acc; }
function argmax(o){ let best=null,bv=-1; for(const k of Object.keys(o).sort()){ if(o[k]>bv){bv=o[k];best=k;} } return best; }
function causeKind(id){ return id.startsWith('low_energy:')||id.startsWith('running_late:')||id.startsWith('distracted:')?'internal':'event'; }
function causeWords(c){ if(c.kind==='event'){ const ev=EVENTS[c.event]||{}; const who=c.resident?resName(c.resident):'household'; return `<span class="id">${esc(c.id)}</span> <span class="small">(${who})</span> — ${esc(ev.description||'')} ${esc(ev.trace_words||'')}.`; } return `<span class="id">${esc(c.id)}</span> — ${esc(c.words)}.`; }
function recColor(rec){ if(rec==='ON_PERSON'||rec==='OUT_OF_HOUSE') return null; let h=0; for(const ch of rec) h=(h*31+ch.charCodeAt(0))>>>0; return `hsl(${h%360} 48% var(--seg-l))`; }
function linkIds(text){ // wrap object / receptacle ids
  const objs = Object.keys(hh().objects).sort((a,b)=>b.length-a.length), recs=Object.keys(hh().receptacles).concat(['ON_PERSON','OUT_OF_HOUSE']).sort((a,b)=>b.length-a.length);
  const re = new RegExp('\\b('+objs.concat(recs).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','g');
  return esc(text).replace(re, m => hh().objects[m] ? `<span class="id obj" data-obj="${m}">${m}</span>` : `<span class="id rec">${m}</span>`);
}
function tagsHtml(tags){ if(!S.reveal||!tags.length) return ''; return tags.map(t=>`<span class="tag ${causeKind(t)}">${esc(t)}</span>`).join(''); }
function save(){ try{ localStorage.setItem('ssi-state', JSON.stringify({view:S.view, seed:S.seed, day:S.day})); }catch(e){} }

// ---------- shell ----------
const seedSel = document.getElementById('seedSel');
for(const k of Object.keys(RUNS).sort((a,b)=>+a-+b)){ const st=RUNS[k].state.household; const o=document.createElement('option'); o.value=k; o.textContent=`${st.id} · ${st.household_type} · ${Object.values(st.residents).map(r=>cap(r.name)).join(', ')}`; seedSel.appendChild(o); }
seedSel.value=S.seed;
seedSel.addEventListener('change', ()=>{ S.seed=seedSel.value; S.obj=null; S.quiz.q=null; S.quiz.answered=false; _rowsCache={}; save(); render(); });
document.getElementById('reveal').addEventListener('change', e=>{ S.reveal=e.target.checked; render(); });
document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.view=b.dataset.view; save(); render(); });
document.addEventListener('click', e=>{ const el=e.target.closest('.id.obj'); if(el && !e.target.closest('.noclick')){ S.obj=el.dataset.obj; S.view='objects'; save(); render(); } });

function render(){
  for(const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', b.dataset.view===S.view);
  for(const v of ['household','days','objects','quiz']) document.getElementById('v-'+v).hidden = v!==S.view;
  document.getElementById('reveal').checked = S.reveal;
  ({household:renderHousehold, days:renderDays, objects:renderObjects, quiz:renderQuiz})[S.view]();
}

// ---------- household ----------
function renderHousehold(){
  const H=hh(), el=document.getElementById('v-household');
  const res = Object.values(H.residents).sort((a,b)=>a.id.localeCompare(b.id));
  const roleWords={worker_out:'works outside the home', worker_home:'works from home', retired:'retired'};
  const bar=(v,cls='')=>`<div class="bar ${cls}" title="${v}"><i style="width:${Math.round(v*100)}%"></i></div>`;
  let html = `<p class="sub">${esc(H.id)} · ${esc(H.household_type)} · ${H.rooms.length} rooms · ${Object.keys(H.objects).length} objects · seed ${H.seed}. Everything below is sampled from code; traits are hidden from any agent and only the generator sees them.</p>`;
  html += `<div class="stack"><div class="panel"><h2>Residents</h2><div class="tablewrap"><table><thead><tr><th>Resident</th><th>Role</th><th>Tidiness</th><th>Punctuality</th><th>Forgets pocket items</th><th>Mood sensitivity</th><th>Sleeps / works</th></tr></thead><tbody>`;
  for(const r of res){ html += `<tr><td><b>${cap(r.name)}</b><br><span class="small">${r.id}</span></td><td>${roleWords[r.role]}</td><td>${bar(r.tidiness)}<span class="small">${r.tidiness.toFixed(2)}</span></td><td><span class="small">jitter × ${r.jitter_scale.toFixed(2)}</span></td><td>${r.forget_level} <span class="small">(p ${r.forget_p})</span></td><td>${bar(r.mood_sensitivity,'rose')}<span class="small">${r.mood_sensitivity.toFixed(2)}</span></td><td><span class="id rec">${r.bedroom}</span> / <span class="id rec">${r.workspace}</span></td></tr>`; }
  html += `</tbody></table></div></div>`;
  html += `<div class="panel"><h2>Rooms and receptacles</h2><p class="small">Number in parentheses is the capacity; a full receptacle pushes a placement to the next home slot or a neighbour in the same room.</p><dl class="kv">`;
  for(const room of H.rooms){ const recs=Object.values(H.receptacles).filter(r=>r.room===room).sort((a,b)=>a.id.localeCompare(b.id)); html += `<dt>${room}</dt><dd class="chips">${recs.map(r=>`<span class="id rec" style="border-bottom:2px solid ${recColor(r.id)}">${r.id} <span class="small">(${r.capacity})</span></span>`).join('')}</dd>`; }
  html += `</dl></div>`;
  html += `<div class="panel"><h2>Objects and their usual places</h2><p class="small">Primary slot first. "Used → sink" marks dishes that go to the sink after use. Click any object id anywhere on this page to open its track.</p><div class="tablewrap"><table><thead><tr><th>Owner</th><th>Object</th><th>Home slots</th><th>Notes</th></tr></thead><tbody>`;
  for(const owner of res.map(r=>r.id).concat([null])){ const objs=Object.values(H.objects).filter(o=>o.owner===owner).sort((a,b)=>a.id.localeCompare(b.id)); objs.forEach((o,i)=>{ const notes=[]; if(o.pocket) notes.push('pocket item'); if(o.outdoor) notes.push('worn on trips'); if(o.group) notes.push('rides in '+H.groups[o.group].leader.replace(/_.*/,'')+' ('+o.group+')'); if(o.after_use) notes.push('used → '+o.after_use); html += `<tr><td>${i===0?(owner?cap(H.residents[owner].name):'Shared'):''}</td><td><span class="id obj" data-obj="${o.id}">${o.id}</span></td><td>${o.home.map(h=>`<span class="id rec">${h}</span>`).join(' ')}</td><td class="small">${notes.join('; ')}</td></tr>`; }); }
  html += `</tbody></table></div></div>`;
  const groups=Object.values(H.groups).sort((a,b)=>a.name.localeCompare(b.name));
  if(groups.length){ html += `<div class="panel"><h2>Object groups</h2><p class="small">Things that travel together. Members ride inside the leader on trips unless a cause separates them (a sick day keeps the laptop home; the next activity needing the laptop takes it out of the bag).</p><ul>`; for(const g of groups) html += `<li><span class="id obj" data-obj="${g.leader}">${g.leader}</span> carries ${g.members.length?g.members.map(m=>`<span class="id obj" data-obj="${m}">${m}</span>`).join(', '):'<span class="small">nothing in particular</span>'} on ${g.kind==='bag'?'work trips and errands':'gym trips'}</li>`; html += `</ul></div>`; }
  html += `</div>`;
  el.innerHTML = html;
}

// ---------- days ----------
function causesPanel(dayIdx, revealed){
  const d = run().state.days[dayIdx];
  const causes = d.causes.slice().sort((a,b)=>(a.kind+a.id).localeCompare(b.kind+b.id));
  let html = `<h3>Hidden causes · ${DAYS[dayIdx]}</h3>`;
  if(!revealed){ html += `<div class="hiddenbox">${causes.length} active cause${causes.length===1?'':'s'} today (${causes.filter(c=>c.kind==='event').length} external, ${causes.filter(c=>c.kind==='internal').length} internal).<br>Hidden so you can judge predictability from the visible trace alone.<br><button class="btn" data-act="reveal">Reveal</button></div>`; return html; }
  if(!causes.length) html += `<p class="small">No active cause today.</p>`;
  for(const c of causes) html += `<div class="cause ${c.kind}">${causeWords(c)}</div>`;
  html += `<h3 style="margin-top:14px">Internal states</h3>`;

// ---------- observations (sparse, generated from truth) ----------
let _obsCache={};
function buildObs(){ const key=S.seed+'|'+S.quiz.visits; if(_obsCache[key]) return _obsCache[key];
  const H=hh(), rooms=H.rooms.slice().sort(), nDays=run().state.days.length, V=S.quiz.visits, visits=[];
  const recsIn = room => Object.values(H.receptacles).filter(r=>r.room===room).map(r=>r.id).sort();
  const objs=Object.keys(H.objects).sort();
  const visit=(room,t,kind)=>{ const contents={}; for(const rec of recsIn(room)) contents[rec]=objs.filter(o=>locAt(o,t)===rec); return {t, room, contents, kind}; };
  const tourT=18*3600;                      // day-0 walkthrough at 18:00: every room once
  for(const room of rooms) visits.push(visit(room,tourT,'tour'));
  let k=0;
  for(let d=0; d<nDays; d++) for(let i=0;i<V;i++){ const t=d*DAY + 7*3600 + Math.round(i*(15*3600)/Math.max(1,V-1)) + (V===1?5*3600:0); const room=rooms[k%rooms.length]; k++; if(d===0 && t<=tourT) continue; visits.push(visit(room,t,'patrol')); }
  visits.sort((a,b)=>a.t-b.t);
  const sightings={}; for(const o of objs) sightings[o]=[];
  for(const v of visits) for(const rec of Object.keys(v.contents)) for(const o of v.contents[rec]) sightings[o].push({t:v.t, rec, room:v.room});
  return _obsCache[key]={visits, sightings};
}
function knowledge(obj, cut){ // what the observations say about obj up to cut
  const {visits, sightings}=buildObs(), H=hh();
  const seen=sightings[obj].filter(s=>s.t<=cut); const last=seen.length?seen[seen.length-1]:null;
  let gone=null; if(last){ const later=visits.filter(v=>v.t>last.t && v.t<=cut && v.room===H.receptacles[last.rec].room); if(later.length) gone=later[0].t; }
  return {seen, last, gone};
}
function baselinesObs(q, cut, k){ const H=hh(), o=H.objects[q.obj], kn=knowledge(q.obj,cut);
  const counts={}; for(const s of kn.seen) counts[s.rec]=(counts[s.rec]||0)+1;
  const byCount=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
  const same={}; for(const s of kn.seen){ const clock=(s.t%DAY)/60, dm=Math.abs(clock-q.minute); if(Math.floor(s.t/DAY)<q.day && dm<=90) same[s.rec]=(same[s.rec]||0)+1; }
  const bySame=Object.keys(same).sort((a,b)=>same[b]-same[a]||a.localeCompare(b));
  const fill=(first)=>{ const out=[]; for(const r of [...first, ...byCount, ...o.home]) if(r && !out.includes(r)) out.push(r); return out.slice(0,k); };
  return [
    {name:'Last seen', desc:'the last sighting, then the usual places', ranked: fill(kn.last?[kn.last.rec]:[])},
    {name:'Most frequent', desc:'places it was sighted, most often first', ranked: fill(byCount)},
    {name:'Same hour, earlier days', desc:'sightings within 90 min of this clock time on earlier days', ranked: fill(bySame)},
    {name:'Home slots', desc:'the object\'s home slots in order', ranked: fill(o.home)},
  ];
}

Object.assign(S.quiz, {visits: S.quiz.visits||6, looks: S.quiz.looks||3, tried: [], done:false, own:null});
function cutoffFor(q){ const dayStart=q.day*DAY; switch(S.quiz.cutoff){ case 'yesterday': return dayStart-1; case 'morning': return Math.min(q.t, dayStart+8*3600); case 'hour': return q.t-3600; default: return q.t; } }
function newQuestion(){

  const day = 1+Math.floor(Math.random()*(nDays-1)), minute = 7*60+Math.floor(Math.random()*(16.5*60));

  html += `<div class="stack"><div class="panel evid"><h3>What you know about <span class="id" style="text-transform:none;letter-spacing:0">${q.obj}</span></h3><p class="small">${esc(o.cls)}, ${o.owner?cap(H.residents[o.owner].name)+"'s":'shared'}; home slots ${o.home.map(h=>`<span class="id rec">${h}</span>`).join(' ')}${o.group?'; rides in '+esc(o.group):''}${o.pocket?'; a pocket item (goes out with its owner)':''}${o.outdoor?'; worn on trips out':''}. Sightings up to ${cut<0?'nothing yet':fmtT(cut)}.</p>`;
  if(S.reveal){ const dcs=run().state.days[q.day].causes; html += `<details open><summary>Today's hidden causes (revealed by the header switch)</summary>${dcs.length?dcs.map(c=>`<div class="cause ${c.kind}">${causeWords(c)}</div>`).join(''):'<p class="small">none</p>'}</details>`; }
  if(!kn.seen.length) html += `<p class="small">Never sighted before the cutoff.</p>`;
  else { html += `<div class="timeline">`; const roomVisits=visits.filter(v=>v.t<=cut);
    // merged chronology: sightings + "checked, not there" for the room of the previous sighting
    let lastRec=null; const evs=[];
    for(const v of roomVisits){ const here=Object.keys(v.contents).find(rec=>v.contents[rec].includes(q.obj)); if(here){ evs.push({t:v.t, kind:'seen', rec:here}); lastRec=here; } else if(lastRec && H.receptacles[lastRec] && H.receptacles[lastRec].room===v.room){ evs.push({t:v.t, kind:'gone', rec:lastRec}); lastRec=null; } }
    for(const e of evs){ const clock=(e.t%DAY)/60, similar=Math.abs(clock-q.minute)<=90 && Math.floor(e.t/DAY)<q.day; html += `<div class="tl ${similar?'hit':''}" style="grid-template-columns:82px 1fr"><span class="t">${wd3(Math.floor(e.t/DAY))} ${fmtMin(Math.floor((e.t%DAY)/60))}</span><span class="x" style="${similar?'':'padding:0'}">${e.kind==='seen'?`seen at <span class="id rec">${e.rec}</span>`:`<span class="small">${H.receptacles[e.rec].room} checked, no longer at <span class="id rec">${e.rec}</span></span>`}${similar?' <span class="small">· similar time of day</span>':''}</span></div>`; }
    html += `</div>`; }
  // board of all objects
  html += `</div><div class="panel"><h3>Last sighting of every object</h3><p class="small">Age is relative to the question time. "gone by" means its room was checked later and it was not there any more. Owners' pocket and outdoor items vanishing together usually means that person is out.</p><div class="tablewrap"><table><thead><tr><th>Object</th><th>Last seen at</th><th>When</th><th>Status</th></tr></thead><tbody>`;
  const owners=Object.values(H.residents).sort((a,b)=>a.id.localeCompare(b.id)).map(r=>r.id).concat([null]);
  for(const owner of owners){ const objs=Object.values(H.objects).filter(x=>x.owner===owner).sort((a,b)=>a.id.localeCompare(b.id)); objs.forEach((x,i)=>{ const k2=knowledge(x.id,cut); const mine=x.id===q.obj;
      html += `<tr style="${mine?'background:var(--accent-soft)':''}"><td>${i===0?`<span class="small">${owner?cap(H.residents[owner].name):'Shared'}</span><br>`:''}<span class="id ${mine?'':'obj'}">${x.id}</span></td><td>${k2.last?`<span class="id rec">${k2.last.rec}</span>`:'<span class="small">never</span>'}</td><td class="small" style="white-space:nowrap">${k2.last?wd3(Math.floor(k2.last.t/DAY))+' '+fmtMin(Math.floor((k2.last.t%DAY)/60))+'<br>'+ageWords(k2.last.t,q.t):''}</td><td class="small">${k2.last?(k2.gone?`<span class="mark bad">gone</span> by ${wd3(Math.floor(k2.gone/DAY))} ${fmtMin(Math.floor((k2.gone%DAY)/60))}`:'no later check of that room'):''}</td></tr>`; }); }
  html += `</tbody></table></div></div>`;
  // visit log
  html += `<div class="panel"><details><summary>Patrol log up to the cutoff (${visits.filter(v=>v.t<=cut).length} room visits)</summary><div class="timeline" style="margin-top:8px">`;
  let lastDay=-1; for(const v of visits.filter(v=>v.t<=cut)){ const d=Math.floor(v.t/DAY); if(d!==lastDay){ html += `<div class="small" style="margin:8px 0 2px;font-weight:600">${DAYS[d]}</div>`; lastDay=d; }
    const parts=Object.keys(v.contents).sort().filter(rec=>v.contents[rec].length).map(rec=>`<span class="id rec">${rec}</span> ${v.contents[rec].map(x=>`<span class="id ${x===q.obj?'':'obj'}" ${x===q.obj?'style="background:var(--accent-soft)"':''}>${x}</span>`).join(' ')}`);
    html += `<div class="tl" style="grid-template-columns:52px 1fr"><span class="t">${fmtMin(Math.floor((v.t%DAY)/60))}</span><span class="x"><b>${v.room}</b>${v.kind==='tour'?' <span class="small">(walkthrough)</span>':''}: ${parts.length?parts.join(' · '):'<span class="small">everything empty</span>'}</span></div>`; }
  html += `</div></details></div></div></div>`;
  el.innerHTML = html;
  el.querySelector('#cutSel').addEventListener('change', e=>{ S.quiz.cutoff=e.target.value; S.quiz.tried=[]; S.quiz.done=false; renderQuiz(); });
  el.querySelector('#looksSel').addEventListener('change', e=>{ S.quiz.looks=+e.target.value; S.quiz.tried=[]; S.quiz.done=false; renderQuiz(); });
  el.querySelector('#visitsSel').addEventListener('change', e=>{ S.quiz.visits=+e.target.value; S.quiz.tried=[]; S.quiz.done=false; renderQuiz(); });
  el.querySelector('#poolSel').addEventListener('change', e=>{ S.quiz.pool=e.target.value; newQuestion(); renderQuiz(); });
  el.querySelector('#submit').addEventListener('click', ()=>{ const rec=el.querySelector('#ansSel').value; if(!rec||S.quiz.done) return; const hit=rec===truth; const contents=(rec==='ON_PERSON'||rec==='OUT_OF_HOUSE')?[]:Object.keys(H.objects).sort().filter(x=>locAt(x,q.t)===rec); S.quiz.tried.push({rec, hit, contents}); if(hit) finishQuestion(true, S.quiz.tried.length); else if(S.quiz.tried.length>=K) finishQuestion(false, K); renderQuiz(); });
  el.querySelector('#giveup').addEventListener('click', ()=>{ if(!S.quiz.done){ finishQuestion(false, K); renderQuiz(); } });
  el.querySelector('#next').addEventListener('click', ()=>{ newQuestion(); renderQuiz(); });
  el.querySelector('#resetScore').addEventListener('click', ()=>{ S.quiz.score=null; S.quiz.hist=[]; renderQuiz(); });
  el.querySelector('#ownGo').addEventListener('click', ()=>{ const [h,m]=el.querySelector('#ownTime').value.split(':').map(Number); S.quiz.own={obj:el.querySelector('#ownObj').value, day:+el.querySelector('#ownDay').value, minute:h*60+m}; renderQuiz(); });
}
function ownAnswer(own){ const t=own.day*DAY+own.minute*60, r=rowAt(own.obj,t); if(!r) return ''; const dayRows=rowsFor(own.obj).filter(x=>Math.floor(x.t/DAY)===own.day);
  let html=`<div class="verdict none" style="margin-top:10px"><span class="id">${own.obj}</span> at ${fmtT(t)} is at <span class="id rec">${r.receptacle_id}</span>${r.carrier?' (carried by '+resName(r.carrier)+')':''}. <span class="small">Since ${fmtT(r.t)} · ${esc(r.cause.replace(':',' · '))}${r.reason?' · '+esc(r.reason):''}${r.whim?' <span class="tag whim">whim</span>':''}${S.reveal?(r.causes||[]).map(c=>`<span class="tag ${causeKind(c)}">${esc(c)}</span>`).join(''):''}</span></div>`;
  if(dayRows.length) html += `<div class="small" style="margin-top:6px">That day: ${dayRows.map(x=>`${fmtMin(Math.floor((x.t%DAY)/60))} → <span class="id rec">${x.receptacle_id}</span>`).join(' · ')}</div>`;
  return html; }

render();
})();
</script>
