<meta charset="utf-8">
<title>Situation Sim Inspector</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:wght@600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f5f7f4; --panel:#ffffff; --panel2:#eef2ee; --ink:#1b2321; --muted:#5f6d68; --line:#d6ddd8; --line2:#e7ece8;
  --accent:#137068; --accent-ink:#ffffff; --accent-soft:#d9eeea;
  --whim:#b6741a; --whim-soft:#f6e9d2;
  --event:#5f4bb0; --event-soft:#e6e1f5;
  --episode:#1f6fa8; --episode-soft:#dbe9f5;
  --internal:#a8475a; --internal-soft:#f3dfe3;
  --ok:#2c7a4b; --ok-soft:#d8eedf; --bad:#b3352b; --bad-soft:#f4dcd9;
  --seg-l:62%;
  --sans:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141917; --panel:#1b2220; --panel2:#222b28; --ink:#e4eae6; --muted:#98a69f; --line:#2c3733; --line2:#232d2a;
    --accent:#4dc0b0; --accent-ink:#0f1716; --accent-soft:#193a36;
    --whim:#e0a24a; --whim-soft:#3a2d16;
    --event:#a695e8; --event-soft:#2a2440;
    --episode:#7fb6e6; --episode-soft:#1c2c3a;
    --internal:#e08496; --internal-soft:#3d2228;
    --ok:#6fcf97; --ok-soft:#1d3527; --bad:#ef8a80; --bad-soft:#3d2320;
    --seg-l:46%;
  }
}
:root[data-theme="dark"]{
  --bg:#141917; --panel:#1b2220; --panel2:#222b28; --ink:#e4eae6; --muted:#98a69f; --line:#2c3733; --line2:#232d2a;
  --accent:#4dc0b0; --accent-ink:#0f1716; --accent-soft:#193a36;
  --whim:#e0a24a; --whim-soft:#3a2d16;
  --event:#a695e8; --event-soft:#2a2440;
  --episode:#7fb6e6; --episode-soft:#1c2c3a;
  --internal:#e08496; --internal-soft:#3d2228;
  --ok:#6fcf97; --ok-soft:#1d3527; --bad:#ef8a80; --bad-soft:#3d2320;
  --seg-l:46%;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;margin:0}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
h1{font-family:var(--serif);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 11px;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:600}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.seed{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.seed select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{accent-color:var(--accent);width:16px;height:16px;margin:0}
main{padding-block:18px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px)}
@media (max-width:860px){.sticky{position:static}}
.id{font-family:var(--mono);font-size:12.5px;padding:0 4px;border-radius:4px;background:var(--panel2);white-space:nowrap}
.id.obj{cursor:pointer;border-bottom:1px solid var(--accent)}
#v-quiz .id.rec{cursor:pointer}
.id.obj:hover{background:var(--accent-soft)}
.id.rec{color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;margin-left:4px;font-family:var(--mono);vertical-align:middle}
.tag.event{background:var(--event-soft);color:var(--event)}
.tag.episode{background:var(--episode-soft);color:var(--episode)}
.cause.episode{border-left-color:var(--episode);background:var(--episode-soft)}
.tag.internal{background:var(--internal-soft);color:var(--internal)}
.tag.whim{background:var(--whim-soft);color:var(--whim);font-family:var(--sans);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.bar{height:6px;border-radius:3px;background:var(--line2);position:relative;min-width:70px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.bar.rose>i{background:var(--internal)}
.bar.amber>i{background:var(--whim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.daytabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.daytabs button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
.daytabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.cause{padding:8px 10px;border-radius:8px;margin-bottom:6px;font-size:14px;border-left:3px solid var(--event);background:var(--event-soft)}
.cause.internal{border-left-color:var(--internal);background:var(--internal-soft)}
.cause .id{background:transparent;padding:0;font-weight:500}
.hiddenbox{border:1px dashed var(--line);border-radius:8px;padding:12px;color:var(--muted);font-size:14px;text-align:center}
.hiddenbox button{margin-top:8px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.controls input[type=text],.controls select,.field select,.field input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.timeline{font-size:14px}
.tl{display:grid;grid-template-columns:52px 1fr;gap:0 10px;padding:3px 0;border-bottom:1px solid var(--line2)}
.tl .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);padding-top:2px}
.tl.indent{grid-template-columns:52px 1fr;border-bottom:none;padding:1px 0}
.tl.indent .t{visibility:hidden}
.tl.indent .x{padding-left:18px;color:var(--ink)}
.tl.whim .x{background:var(--whim-soft);border-radius:4px;padding:2px 6px 2px 18px}
.tl.head .x{font-weight:600}
.tl.trip .x,.tl.back .x{font-weight:600;color:var(--accent)}
.tl.dim{opacity:.32}
.tl.hit .x{background:var(--accent-soft);border-radius:4px;padding:2px 6px}
.tl.indent.hit .x{padding-left:18px}
.tl.future{opacity:.25;filter:blur(1.5px)}
.strip{display:flex;flex-direction:column;gap:3px;margin:10px 0}
.strow{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.strow .segs{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--panel2)}
.seg{height:100%;min-width:1px}
.seg.person{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)}
.seg.out{background:var(--muted);opacity:.55}
.hours{display:grid;grid-template-columns:36px 1fr;gap:8px;font-size:11px;color:var(--muted)}
.hours .h{display:flex;justify-content:space-between;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--panel2);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
.q{font-size:20px;font-family:var(--serif);margin:6px 0 12px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.verdict{border-radius:8px;padding:10px 12px;margin-top:12px;font-size:14px}
.verdict.ok{background:var(--ok-soft);border-left:3px solid var(--ok)}
.verdict.bad{background:var(--bad-soft);border-left:3px solid var(--bad)}
.verdict.none{background:var(--panel2);border-left:3px solid var(--muted)}
.mark{font-weight:700}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}
.small{font-size:13px;color:var(--muted)}
.tl.visit{padding:6px 0}
.spots{display:grid;grid-template-columns:max-content 1fr;gap:3px 10px;margin-top:4px;align-items:baseline}
.spotobjs{display:flex;flex-wrap:wrap;gap:3px 4px}
.evid .tl{grid-template-columns:82px 1fr}
.evid .tl .t{visibility:visible}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.hist{font-size:13px;margin-top:8px}
.hist div{padding:3px 0;border-bottom:1px solid var(--line2)}
@media (prefers-reduced-motion:no-preference){.tl.hit .x{transition:background .2s}}
</style>

<header class="top"><div class="wrap">
  <h1>Situation Sim Inspector</h1>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-view="household">Household</button>
    <button role="tab" data-view="days">Days</button>
    <button role="tab" data-view="objects">Objects</button>
    <button role="tab" data-view="quiz">Quiz</button>
  </nav>
  <span class="spacer"></span>
  <label class="seed">household <select id="seedSel"></select></label>
  <label class="switch"><input type="checkbox" id="reveal"> reveal hidden causes</label>
</div></header>

<main class="wrap">
  <section id="v-household" hidden></section>
  <section id="v-days" hidden></section>
  <section id="v-objects" hidden></section>
  <section id="v-quiz" hidden></section>
</main>

<script type="application/json" id="data">/*__RUNS_JSON__*/</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const RUNS = DATA.runs, EVENTS = DATA.events, EPISODES = DATA.episodes || {};
const DAYS = ["Wednesday","Thursday","Friday","Saturday","Sunday"];
const DAY = 86400;
const S = {seed: (DATA.default_seed in RUNS) ? DATA.default_seed : Object.keys(RUNS).sort((a,b)=>+a-+b)[0], view:'days', day:0, reveal:false, filter:'', movesOnly:false,
           obj:null, quiz:{cutoff:'yesterday', pool:'moving', q:null, answered:false, score:null, hist:[]}};
try{ const saved = JSON.parse(localStorage.getItem('ssi-state')||'{}'); Object.assign(S, {view:saved.view||S.view, seed: RUNS[saved.seed]?saved.seed:S.seed, day: saved.day||0}); }catch(e){}

// ---------- data helpers ----------
const run = () => RUNS[S.seed];
const hh = () => run().state.household;
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const resName = id => hh().residents[id] ? cap(hh().residents[id].name) : (/^guests:(\d+)$/.test(id) ? id.slice(7)+' guests' : id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMin = m => `${String(Math.floor(Math.min(m,1439)/60)).padStart(2,'0')}:${String(Math.min(m,1439)%60).padStart(2,'0')}`;
const fmtT = t => { const d=Math.floor(t/DAY), m=Math.floor((t%DAY)/60); return `${DAYS[d]||('day '+d)} ${fmtMin(m)}`; };
const wd3 = d => (DAYS[d]||'').slice(0,3);
let _rowsCache = {};
function rowsFor(obj){ const k=S.seed+'|'+obj; if(!_rowsCache[k]) _rowsCache[k]=run().truth.filter(r=>r.object_id===obj).sort((a,b)=>a.t-b.t); return _rowsCache[k]; }
function rowAt(obj, t){ const rs=rowsFor(obj); let lo=0,hi=rs.length-1,ans=null; while(lo<=hi){const mid=(lo+hi)>>1; if(rs[mid].t<=t){ans=rs[mid];lo=mid+1;} else hi=mid-1;} return ans; }
function locAt(obj,t){ const r=rowAt(obj,t); return r?r.receptacle_id:null; }
function timeWeighted(obj, until){ const rs=rowsFor(obj), acc={}; for(let i=0;i<rs.length;i++){ const a=rs[i].t, b=Math.min(i+1<rs.length?rs[i+1].t:Infinity, until); if(b<=a) continue; acc[rs[i].receptacle_id]=(acc[rs[i].receptacle_id]||0)+(b-a);} return acc; }
function argmax(o){ let best=null,bv=-1; for(const k of Object.keys(o).sort()){ if(o[k]>bv){bv=o[k];best=k;} } return best; }
function causeKind(id){ if(id.startsWith('ep:')) return 'episode'; return id.startsWith('low_energy:')||id.startsWith('running_late:')||id.startsWith('distracted:')?'internal':'event'; }
function causeWords(c){ if(c.kind==='event'){ const ev=EVENTS[c.event]||{}; const who=c.resident?resName(c.resident):'household'; return `<span class="id">${esc(c.id)}</span> <span class="small">(${who})</span> — ${esc(ev.description||'')} ${esc(ev.trace_words||'')}.`; }
  if(c.kind==='episode'){ const m=/\((\d\d:\d\d)–(\d\d:\d\d)\)$/.exec(c.words||''); const words=m?c.words.slice(0,m.index).trim():c.words; return `<span class="id">${esc(c.event)}</span> <span class="small">(${resName(c.resident)}${m?' · '+m[1]+'–'+m[2]:''})</span> — ${esc(words)}.`; }
  return `<span class="id">${esc(c.id)}</span> — ${esc(c.words)}.`; }
function recColor(rec){ if(rec==='ON_PERSON'||rec==='OUT_OF_HOUSE') return null; let h=0; for(const ch of rec) h=(h*31+ch.charCodeAt(0))>>>0; return `hsl(${h%360} 48% var(--seg-l))`; }
function linkIds(text){ // wrap object / receptacle ids
  const objs = Object.keys(hh().objects).sort((a,b)=>b.length-a.length), recs=Object.keys(hh().receptacles).concat(['ON_PERSON','OUT_OF_HOUSE']).sort((a,b)=>b.length-a.length);
  const re = new RegExp('\\b('+objs.concat(recs).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','g');
  return esc(text).replace(re, m => hh().objects[m] ? `<span class="id obj" data-obj="${m}">${m}</span>` : `<span class="id rec">${m}</span>`);
}
function tagsHtml(tags){ if(!S.reveal||!tags.length) return ''; return tags.map(t=>`<span class="tag ${causeKind(t)}">${esc(t)}</span>`).join(''); }
function save(){ try{ localStorage.setItem('ssi-state', JSON.stringify({view:S.view, seed:S.seed, day:S.day})); }catch(e){} }

// ---------- shell ----------
const seedSel = document.getElementById('seedSel');
for(const k of Object.keys(RUNS).sort((a,b)=>+a-+b)){ const st=RUNS[k].state.household; const o=document.createElement('option'); o.value=k; o.textContent=`${st.id} · ${st.household_type} · ${Object.values(st.residents).map(r=>cap(r.name)).join(', ')}`; seedSel.appendChild(o); }
seedSel.value=S.seed;
seedSel.addEventListener('change', async ()=>{ S.seed=seedSel.value; S.obj=null; S.play={doc:null, loaded:false, done:false}; S.mem={tab:'object', obj:null, place:null}; _rowsCache={}; save(); render(); if(DB_READY){ await loadPersisted(); render(); } });
document.getElementById('reveal').addEventListener('change', e=>{ S.reveal=e.target.checked; render(); });
document.getElementById('tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; S.view=b.dataset.view; save(); render(); });
document.addEventListener('click', e=>{ if(e.target.closest('.noclick')) return; const el=e.target.closest('.id.obj'); const rc=e.target.closest('.id.rec');
  if(el){ const id=el.dataset.obj||el.textContent.trim(); if(S.view==='quiz'){ S.mem.tab='object'; S.mem.obj=id; renderQuiz(); } else { S.obj=id; S.view='objects'; save(); render(); } }
  else if(rc && S.view==='quiz'){ const id=rc.textContent.trim(); if(hh().receptacles[id]){ S.mem.tab='place'; S.mem.place=id; renderQuiz(); } } });

function render(){
  for(const b of document.querySelectorAll('#tabs button')) b.setAttribute('aria-selected', b.dataset.view===S.view);
  for(const v of ['household','days','objects','quiz']) document.getElementById('v-'+v).hidden = v!==S.view;
  document.getElementById('reveal').checked = S.reveal;
  ({household:renderHousehold, days:renderDays, objects:renderObjects, quiz:renderQuiz})[S.view]();
}

// ---------- household ----------
function renderHousehold(){
  const H=hh(), el=document.getElementById('v-household');
  const res = Object.values(H.residents).sort((a,b)=>a.id.localeCompare(b.id));
  const roleWords={worker_out:'works outside the home', worker_home:'works from home', retired:'retired', student:'student, classes out', shift_worker:'afternoon-to-night shift'};
  const bar=(v,cls='')=>`<div class="bar ${cls}" title="${v}"><i style="width:${Math.round(v*100)}%"></i></div>`;
  const nStatic=Object.values(H.objects).filter(o=>o.static).length;
  let html = `<p class="sub">${esc(H.id)} · ${esc(H.household_type)} · ${H.rooms.length} rooms · ${Object.keys(H.objects).length} objects (${nStatic} fixtures that never move)${H.pet?` · a ${H.pet}, looked after mainly by ${cap(H.residents[H.carer].name)}`:''} · seed ${H.seed}. Everything below is generator-side ground truth; an agent never sees traits, habits or home slots.</p>`;
  html += `<div class="stack"><div class="panel"><h2>Residents</h2><div class="tablewrap"><table><thead><tr><th>Resident</th><th>Role</th><th>Tidiness</th><th>Punctuality</th><th>Forgets pocket items</th><th>Mood sensitivity</th><th>Sleeps / works</th></tr></thead><tbody>`;
  for(const r of res){ html += `<tr><td><b>${cap(r.name)}</b><br><span class="small">${r.id}</span></td><td>${roleWords[r.role]||r.role}<br><span class="small">hobbies: ${(r.hobbies||[]).join(', ')||'none'}<br>chores: ${(r.chores||[]).join(', ')||'none'}</span></td><td>${bar(r.tidiness)}<span class="small">${r.tidiness.toFixed(2)}</span></td><td><span class="small">jitter × ${r.jitter_scale.toFixed(2)}</span></td><td>${r.forget_level} <span class="small">(p ${r.forget_p})</span></td><td>${bar(r.mood_sensitivity,'rose')}<span class="small">${r.mood_sensitivity.toFixed(2)}</span></td><td><span class="id rec">${r.bedroom}</span> / <span class="id rec">${r.workspace}</span></td></tr>`; }
  html += `</tbody></table></div></div>`;
  html += `<div class="panel"><h2>Rooms and spots</h2><p class="small">Number in parentheses is the capacity; a full spot pushes a placement to the next home slot or a neighbour in the same room.</p><dl class="kv">`;
  for(const room of H.rooms){ const recs=Object.values(H.receptacles).filter(r=>r.room===room).sort((a,b)=>a.id.localeCompare(b.id)); html += `<dt>${room}</dt><dd class="chips">${recs.map(r=>`<span class="id rec" style="border-bottom:2px solid ${recColor(r.id)}">${r.id} <span class="small">(${r.capacity})</span></span>`).join('')}</dd>`; }
  html += `</dl></div>`;
  html += `<div class="panel"><h2>Objects and their usual places</h2><p class="small">Primary slot first. "Used → sink" marks dishes that go to the sink after use. Click any object id anywhere on this page to open its track.</p><div class="tablewrap"><table><thead><tr><th>Owner</th><th>Object</th><th>Home slots</th><th>Notes</th></tr></thead><tbody>`;
  for(const owner of res.map(r=>r.id).concat([null])){ const objs=Object.values(H.objects).filter(o=>o.owner===owner).sort((a,b)=>a.id.localeCompare(b.id)); objs.forEach((o,i)=>{ const notes=[]; if(o.static) notes.push('fixture, never moves'); if(o.pocket) notes.push('pocket item'); if(o.outdoor) notes.push('worn on trips'); if(o.group) notes.push('rides in '+H.groups[o.group].leader.replace(/_.*/,'')+' ('+o.group+')'); if(o.after_use) notes.push('used → '+o.after_use); html += `<tr><td>${i===0?(owner?cap(H.residents[owner].name):'Shared'):''}</td><td><span class="id obj" data-obj="${o.id}">${o.id}</span></td><td>${o.home.map(h=>`<span class="id rec">${h}</span>`).join(' ')}</td><td class="small">${notes.join('; ')}</td></tr>`; }); }
  html += `</tbody></table></div></div>`;

}

function lineHtml(l, opts={}){

let DB=null, DB_READY=false, SYNC='connecting';

const thaw = x => x==null ? x : JSON.parse(JSON.stringify(x));   // db snapshots are frozen
async function loadDoc(path, lsKey){ if(DB){ try{ const snap=await DB.doc(path).get(); if(snap.exists) return snap.data(); return null; }catch(e){ SYNC='error'; } } return lsGet(lsKey, null); }

function refreshSyncBadge(){ for(const b of document.querySelectorAll('.syncBadge')) b.textContent = SYNC==='synced'?'saved to the artifact (Claude can read it)': SYNC==='local'?'not connected to the artifact store: kept in this browser for now': SYNC==='error'?'saving to the artifact failed; kept in this browser':'connecting…'; }
(async()=>{ await null; /* let the rest of the script initialise before touching docPath */ try{ if(window.claude && window.claude.use){ DB = await window.claude.use('db'); } }catch(e){ DB=null; } SYNC = DB?'synced':'local'; DB_READY=true; await loadPersisted(); if(S.view==='quiz') render(); else refreshSyncBadge(); })();
const docPath = kind => `${kind}/${GEN}s${S.seed}`;
const lsKey = kind => `ssi-${kind}-${GEN}-${S.seed}`;
async function loadPersisted(){ const notes=await loadDoc(docPath('notes'), lsKey('notes')); S.notes = thaw((notes&&notes.entries)||[]); const run_=await loadDoc(docPath('chrono'), lsKey('chrono')); S.play.doc = thaw(run_)||null; S.play.loaded=true; }
const saveRun = () => saveDoc(docPath('chrono'), lsKey('chrono'), runDoc());

// ---------- the task: what the agent (you) can see and do ----------
// Knowledge = the Wednesday 18:00 walkthrough (every room, contents and
// people) + the looks you made or scheduled. No free patrol. A look is at
// ROOM level: it reports every spot in the room and who is standing there.
// Cost: LOOK_COST per look + TRAVEL when the robot has to change room;
// each day has a budget. Verdicts are hidden until the day is over.
S.play = S.play || {doc:null, loaded:false, done:false};
S.notes = S.notes || [];
S.mem = S.mem || {tab:'object', obj:null, place:null};
const TOUR_T = 18*3600;
function runDoc(){ if(!S.play.doc) S.play.doc={perDay:6, budget:12, travel:3, lookCost:1, answers:[], looks:[], pending:[], robot:homeBase(), showVerdicts:false, started:new Date().toISOString()}; return S.play.doc; }
function homeBase(){ const H=hh(); const counts={}; for(const r of Object.values(H.receptacles)) counts[r.room]=(counts[r.room]||0)+1; return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b))[0]; }
function roomAt(res, t){ const rows=run().residents.filter(r=>r.resident_id===res).sort((a,b)=>a.t-b.t); let cur=null; for(const r of rows){ if(r.t<=t) cur=r.room; else break; } return cur; }
function peopleIn(room, t){ const out=Object.keys(hh().residents).sort().filter(r=>roomAt(r,t)===room);
  const d=Math.floor(t/DAY), m=Math.floor((t%DAY)/60);
  for(const v of (run().state.visitors||[])) if(v.day===d && v.room===room && v.start<=m && m<v.end) out.push('guests:'+v.n);
  return out; }
function roomVisit(room, t, kind, extra){ const H=hh(); const contents={}; for(const rec of Object.values(H.receptacles).filter(r=>r.room===room).map(r=>r.id).sort()) contents[rec]=Object.keys(H.objects).sort().filter(o=>locAt(o,t)===rec); return Object.assign({t, room, contents, people: peopleIn(room,t), kind}, extra||{}); }
function walkthrough(){ return hh().rooms.slice().sort().map(room=>roomVisit(room, TOUR_T, 'tour')); }
function knowledgeVisits(){ const doc=runDoc(); const v=walkthrough().concat(doc.looks.filter(l=>!l.failed).map(l=>Object.assign({}, l, {kind:'look'}))); v.sort((a,b)=>a.t-b.t); return v; }
function knowledge(obj, cut, visits){ const seen=[]; for(const v of visits){ if(v.t>cut) break; for(const rec of Object.keys(v.contents)) if(v.contents[rec].includes(obj)) seen.push({t:v.t, rec, room:v.room, kind:v.kind}); }
  const last=seen.length?seen[seen.length-1]:null; let gone=null;
  if(last){ for(const v of visits){ if(v.t<=last.t) continue; if(v.t>cut) break; if(last.rec in v.contents && !v.contents[last.rec].includes(obj)){ gone=v.t; break; } } }
  return {seen, last, gone}; }
// patrol baseline: its own fixed round-robin stream, 6 visits/day, never shown to you
let _patrolCache={};
function patrolVisits(){ const key=S.seed; if(_patrolCache[key]) return _patrolCache[key]; const rooms=hh().rooms.slice().sort(), nDays=run().state.days.length, out=walkthrough(); let k=0;
  for(let d=0; d<nDays; d++) for(let i=0;i<6;i++){ const t=d*DAY+7*3600+i*3*3600; if(d===0 && t<=TOUR_T) continue; out.push(roomVisit(rooms[k%rooms.length], t, 'patrol')); k++; }
  out.sort((a,b)=>a.t-b.t); return _patrolCache[key]=out; }
const BASE_NAMES=['Last seen','Most frequent','Same hour, earlier days','Walkthrough spot','Round-robin patrol (last seen)'];
function baselines(q, cut, k, visits){ const kn=knowledge(q.obj,cut,visits);
  const counts={}; for(const s of kn.seen) counts[s.rec]=(counts[s.rec]||0)+1;
  const byCount=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
  const same={}; for(const s of kn.seen){ const clock=(s.t%DAY)/60; if(Math.floor(s.t/DAY)<q.day && Math.abs(clock-q.minute)<=90) same[s.rec]=(same[s.rec]||0)+1; }
  const bySame=Object.keys(same).sort((a,b)=>same[b]-same[a]||a.localeCompare(b));
  const tour=kn.seen.find(s=>s.kind==='tour');
  const fill=(first)=>{ const out=[]; for(const r of [...first, ...byCount, ...(tour?[tour.rec]:[])]) if(r && !out.includes(r)) out.push(r); return out.slice(0,k); };
  const pk=knowledge(q.obj, cut, patrolVisits()); const pcounts={}; for(const s of pk.seen) pcounts[s.rec]=(pcounts[s.rec]||0)+1; const pby=Object.keys(pcounts).sort((a,b)=>pcounts[b]-pcounts[a]||a.localeCompare(b));
  const pfill=(first)=>{ const out=[]; for(const r of [...first, ...pby]) if(r && !out.includes(r)) out.push(r); return out.slice(0,k); };
  return [
    {name:BASE_NAMES[0], desc:'your sightings: the last one, then the most-seen spots', ranked: fill(kn.last?[kn.last.rec]:[])},
    {name:BASE_NAMES[1], desc:'your sightings: spots seen most often first', ranked: fill(byCount)},
    {name:BASE_NAMES[2], desc:'your sightings within 90 min of this clock time on earlier days', ranked: fill(bySame)},
    {name:BASE_NAMES[3], desc:'where the walkthrough saw it, then the most-seen spots', ranked: fill(tour?[tour.rec]:[])},
    {name:BASE_NAMES[4], desc:'a fixed tour of one room every 3 hours (6 a day) that you do NOT get; last sighting first', ranked: pfill(pk.last?[pk.last.rec]:[])},
  ]; }

// ---------- question sequence ----------
function rng32(seed){ let a=seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function activityWeight(o){ const acts=new Set(); for(const r of rowsFor(o)){ const m=/^(bring|pickup|trip|carry):(.+)$/.exec(r.cause||''); if(m) acts.add(m[2]); } return acts.size; }
function weightedPool(){ const H=hh(); const items=Object.keys(H.objects).sort().filter(o=>!H.objects[o].static).map(o=>[o, activityWeight(o)+(rowsFor(o).length>=4?1:0)]).filter(x=>x[1]>0); return items.length?items:Object.keys(H.objects).sort().map(o=>[o,1]); }
function pickWeighted(items, r){ const tot=items.reduce((a,x)=>a+x[1],0); let u=r()*tot; for(const [o,w] of items){ u-=w; if(u<=0) return o; } return items[items.length-1][0]; }
function questionSequence(perDay){ const r=rng32(7919*(+S.seed+1)+perDay), pool=weightedPool(), nDays=run().state.days.length, qs=[]; let prev=null;
  for(let d=1; d<nDays; d++){ const mins=[]; for(let i=0;i<perDay;i++) mins.push(7*60+Math.floor(r()*(16*60))); mins.sort((a,b)=>a-b);
    for(const minute of mins){ let obj=pickWeighted(pool, r); if(obj===prev && pool.length>1) obj=pickWeighted(pool, r); prev=obj; qs.push({obj, day:d, minute, t:d*DAY+minute*60}); } }
  return qs; }

// ---------- budget, looks, scheduling ----------
function spentOn(day){ return runDoc().looks.filter(l=>Math.floor(l.t/DAY)===day && !l.failed).reduce((a,l)=>a+l.cost,0); }
function budgetLeft(day){ return runDoc().budget - spentOn(day); }
function lookCost(room){ const doc=runDoc(); return doc.lookCost + (room===doc.robot?0:doc.travel); }
function doLook(room, t, src, qi){ const doc=runDoc(); const cost=lookCost(room); const day=Math.floor(t/DAY);
  if(cost>budgetLeft(day)){ doc.looks.push({t, room, cost, src, qi, failed:true, reason:'no budget left that day'}); return null; }
  const v=roomVisit(room, t, 'look', {cost, src, qi}); doc.looks.push(v); doc.robot=room; return v; }
function runPending(uptoT){ // execute scheduled looks whose time has come, in time order
  const doc=runDoc(); const due=doc.pending.filter(p=>p.t<=uptoT).sort((a,b)=>a.t-b.t); if(!due.length) return false;
  for(const p of due) doLook(p.room, p.t, 'scheduled', null);
  doc.pending=doc.pending.filter(p=>p.t>uptoT); return true; }
function roomDiff(v){ // what changed in this room since it was last seen (before v.t)
  const prev=knowledgeVisits().filter(x=>x.room===v.room && x.t<v.t).pop(); if(!prev) return null;
  const now=new Set(), before=new Set(); for(const rec of Object.keys(v.contents)) for(const o of v.contents[rec]) now.add(o+'@'+rec); for(const rec of Object.keys(prev.contents)) for(const o of prev.contents[rec]) before.add(o+'@'+rec);
  const added=[...now].filter(x=>!before.has(x)), gone=[...before].filter(x=>!now.has(x));
  return {prevT: prev.t, added, gone, samePeople: JSON.stringify(prev.people)===JSON.stringify(v.people)}; }
function visitHtml(v, focus, withDiff){ // one row per spot in the room, empties included; no delta
  const recs=Object.keys(v.contents).sort();
  const who=v.people&&v.people.length?`<b>${v.people.map(resName).join(' and ')} ${v.people.length>1?'are':'is'} here.</b>`:'<span class="small">nobody here.</span>';
  const kind=v.kind==='tour'?' <span class="small">(walkthrough)</span>':v.src==='scheduled'?' <span class="small">(scheduled look)</span>':'';
  const rows=recs.map(rec=>`<span class="id rec">${rec}</span><span class="spotobjs">${v.contents[rec].length?v.contents[rec].map(x=>`<span class="id obj" ${x===focus?'style="background:var(--accent-soft)"':''}>${x}</span>`).join(' '):'<span class="small">empty</span>'}</span>`).join('');
  return `<div class="tl visit" style="grid-template-columns:82px 1fr"><span class="t">${wd3(Math.floor(v.t/DAY))} ${fmtMin(Math.floor((v.t%DAY)/60))}</span><span class="x"><b>${v.room}</b>${kind} · ${who}<div class="spots">${rows}</div></span></div>`; }

// ---------- memory panels (the tools an agent would get too) ----------
function memoryHtml(cut, visits, focusObj){ const H=hh(); const tab=S.mem.tab;
  let html=`<div class="panel"><h3>Memory</h3><div class="daytabs" style="margin-bottom:8px"><button data-mem="object" aria-selected="${tab==='object'}">By object</button><button data-mem="place" aria-selected="${tab==='place'}">By place</button><button data-mem="person" aria-selected="${tab==='person'}">By person</button><button data-mem="all" aria-selected="${tab==='all'}">Every object</button></div>`;
  if(tab==='object'){ const obj=S.mem.obj||focusObj; html += `<div class="controls"><select id="memObj">${focusObj?`<option value="${focusObj}" ${obj===focusObj?'selected':''}>${focusObj} — this question</option>`:''}${Object.keys(H.objects).sort().filter(o=>o!==focusObj).map(o=>`<option ${o===obj?'selected':''}>${o}</option>`).join('')}</select>${obj!==focusObj&&focusObj?` <button class="btn" id="memBack" style="padding:2px 8px">back to ${focusObj}</button>`:''}</div>`;
    const kn=knowledge(obj,cut,visits); const counts={}; for(const s of kn.seen) counts[s.rec]=(counts[s.rec]||0)+1; const often=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b));
    html += `<p class="small">${kn.seen.length} sighting${kn.seen.length===1?'':'s'}.${often.length?' Most often at '+often.slice(0,4).map(r=>`<span class="id rec">${r}</span> <span class="small">×${counts[r]}</span>`).join(', ')+'.':''}${kn.last?' Last at <span class="id rec">'+kn.last.rec+'</span>'+(kn.gone?', <span class="mark bad">gone</span> by '+fmtT(kn.gone):'')+'.':''}</p>`;
    let lastRec=null; const evs=[]; for(const v of visits){ if(v.t>cut) break; const here=Object.keys(v.contents).find(rec=>v.contents[rec].includes(obj)); if(here){ evs.push({t:v.t, kind:'seen', rec:here, people:v.people}); lastRec=here; } else if(lastRec && (lastRec in v.contents)){ evs.push({t:v.t, kind:'gone', rec:lastRec, people:v.people}); lastRec=null; } }
    html += `<div class="timeline">${evs.map(e=>`<div class="tl" style="grid-template-columns:82px 1fr"><span class="t">${wd3(Math.floor(e.t/DAY))} ${fmtMin(Math.floor((e.t%DAY)/60))}</span><span class="x" style="padding:0">${e.kind==='seen'?`at <span class="id rec">${e.rec}</span>`:`<span class="small">no longer at <span class="id rec">${e.rec}</span></span>`}${e.people&&e.people.length?` <span class="small">· ${e.people.map(resName).join(', ')} there</span>`:''}</span></div>`).join('')||'<p class="small">never sighted</p>'}</div>`; }
  else if(tab==='place'){ const place=S.mem.place||Object.keys(H.receptacles).sort()[0]; html += `<div class="controls"><select id="memPlace">${H.rooms.map(room=>`<optgroup label="${room}">${Object.values(H.receptacles).filter(r=>r.room===room).sort((a,b)=>a.id.localeCompare(b.id)).map(r=>`<option ${r.id===place?'selected':''}>${r.id}</option>`).join('')}</optgroup>`).join('')}</select></div>`;
    const evs=visits.filter(v=>v.t<=cut && (place in v.contents)); const everSeen=new Set(); for(const v of evs) for(const o of v.contents[place]) everSeen.add(o);
    html += `<p class="small">${evs.length} check${evs.length===1?'':'s'} of this spot. Ever seen here: ${everSeen.size?[...everSeen].sort().map(o=>`<span class="id obj">${o}</span>`).join(' '):'nothing'}.</p>`;
    html += `<div class="timeline">${evs.map(v=>`<div class="tl" style="grid-template-columns:82px 1fr"><span class="t">${wd3(Math.floor(v.t/DAY))} ${fmtMin(Math.floor((v.t%DAY)/60))}</span><span class="x" style="padding:0">${v.contents[place].length?v.contents[place].map(o=>`<span class="id obj">${o}</span>`).join(' '):'<span class="small">empty</span>'}</span></div>`).join('')}</div>`; }
  else if(tab==='person'){ for(const rid of Object.keys(H.residents).sort()){ const sightings=visits.filter(v=>v.t<=cut && v.people.includes(rid)); const last=sightings[sightings.length-1];
      html += `<div style="margin-bottom:8px"><b>${resName(rid)}</b> <span class="small">${last?`last seen in the ${last.room} at ${fmtT(last.t)}`:'never seen'}</span><div class="small">${sightings.slice(-8).map(v=>`${wd3(Math.floor(v.t/DAY))} ${fmtMin(Math.floor((v.t%DAY)/60))} ${v.room}`).join(' · ')}</div></div>`; }
    html += `<p class="small">A look only tells you who is in that room. Someone not seen may be elsewhere in the house or out.</p>`; }
  else { html += `<p class="small">Last sighting of each object; age relative to now. "gone" = that spot was checked later and it was not there.</p><div class="tablewrap"><table><thead><tr><th>Object</th><th>Last seen at</th><th>When</th><th></th></tr></thead><tbody>`;
    const owners=Object.keys(H.residents).sort().concat([null]);
    for(const owner of owners){ const objs=Object.values(H.objects).filter(x=>x.owner===owner && !x.static).sort((a,b)=>a.id.localeCompare(b.id)); objs.forEach((x,i)=>{ const k2=knowledge(x.id,cut,visits); const mine=x.id===focusObj;
        html += `<tr style="${mine?'background:var(--accent-soft)':''}"><td>${i===0?`<span class="small">${owner?resName(owner):'Shared'}</span><br>`:''}<span class="id obj">${x.id}</span></td><td>${k2.last?`<span class="id rec">${k2.last.rec}</span>`:'<span class="small">never</span>'}</td><td class="small" style="white-space:nowrap">${k2.last?wd3(Math.floor(k2.last.t/DAY))+' '+fmtMin(Math.floor((k2.last.t%DAY)/60)):''}</td><td class="small">${k2.gone?`<span class="mark bad">gone</span> by ${wd3(Math.floor(k2.gone/DAY))} ${fmtMin(Math.floor((k2.gone%DAY)/60))}`:''}</td></tr>`; }); }
    html += `</tbody></table></div>`; }
  return html+`</div>`; }

// ---------- notes ----------
function notepadHtml(){ const ctx=S.play.q?`Q${S.play.index+1} ${S.play.q.obj} ${wd3(S.play.q.day)} ${fmtMin(S.play.q.minute)}`:'';
  return `<div class="panel"><h3>Household notes · ${hh().id}</h3><p class="small syncBadge"></p><textarea id="noteText" rows="3" placeholder="General observations about this home: its dynamics, what felt unrealistic or unfair, what the sim or the tools should change." style="width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;resize:vertical">${esc(S.noteDraft||'')}</textarea>
    <div class="row" style="margin-top:6px;justify-content:space-between"><span class="small">tagged with: ${esc(ctx||'no question')}</span><button class="btn primary" id="saveNote">Save note</button></div>
    ${S.notes.length?`<div class="hist">${S.notes.slice().reverse().map(n=>`<div><span class="small">${esc((n.ts||'').slice(0,16).replace('T',' '))} · ${esc(n.ctx||'')}</span><br>${esc(n.text)}</div>`).join('')}</div>`:'<p class="small">No notes yet on this household.</p>'}</div>`; }
function wireNotepad(el){ const btn=el.querySelector('#saveNote'); if(!btn) return; refreshSyncBadge(); const ta0=el.querySelector('#noteText'); ta0.addEventListener('input', ()=>{ S.noteDraft=ta0.value; }); btn.addEventListener('click', async ()=>{ const text=ta0.value.trim(); if(!text) return; S.noteDraft=''; const ctx=S.play.q?`Q${S.play.index+1} ${S.play.q.obj} ${wd3(S.play.q.day)} ${fmtMin(S.play.q.minute)}${S.play.done?' (answered)':''}`:''; S.notes.push({ts:new Date().toISOString(), ctx, text, household:hh().id}); btn.disabled=true; await saveDoc(docPath('notes'), lsKey('notes'), {household:hh().id, entries:S.notes}); renderQuiz(); }); }

// ---------- observation log: stays open across re-renders, filterable ----------
const LOG_DEFAULT = {open:true, room:'', obj:'', day:'', from:'', to:'', text:''};
S.log = S.log || Object.assign({}, LOG_DEFAULT);
const hm = s => { const [a,b]=String(s).split(':').map(Number); return a*60+(b||0); };
function logFilter(visits){ const f=S.log; return visits.filter(v=>{ const d=Math.floor(v.t/DAY), mins=Math.floor((v.t%DAY)/60);
  if(f.room && v.room!==f.room) return false;
  if(f.day!=='' && d!==+f.day) return false;
  if(f.from && mins<hm(f.from)) return false;
  if(f.to && mins>hm(f.to)) return false;
  if(f.obj && !Object.values(v.contents).some(a=>a.includes(f.obj))) return false;
  if(f.text){ const t=f.text.trim().toLowerCase(); if(t){ const hay=[v.room, ...Object.keys(v.contents), ...Object.values(v.contents).flat(), ...(v.people||[]).map(resName), fmtT(v.t)].join(' ').toLowerCase(); if(!hay.includes(t)) return false; } }
  return true; }); }
function logPanelHtml(visits){ const H=hh(), f=S.log, rooms=H.rooms.slice().sort(), nDays=run().state.days.length;
  return `<div class="panel" id="logPanel"><details id="logDetails" ${f.open?'open':''}><summary>Full observation log up to now (${visits.length} room visits)</summary>
    <div class="controls" style="margin-top:8px">
      <label class="field">room <select id="lfRoom"><option value="">any</option>${rooms.map(r=>`<option ${f.room===r?'selected':''}>${r}</option>`).join('')}</select></label>
      <label class="field">object <select id="lfObj"><option value="">any</option>${Object.keys(H.objects).sort().map(o=>`<option ${f.obj===o?'selected':''}>${o}</option>`).join('')}</select></label>
      <label class="field">day <select id="lfDay"><option value="">any</option>${DAYS.slice(0,nDays).map((d,k)=>`<option value="${k}" ${f.day===String(k)?'selected':''}>${d}</option>`).join('')}</select></label>
      <label class="field">from <input type="time" id="lfFrom" value="${f.from}"></label>
      <label class="field">to <input type="time" id="lfTo" value="${f.to}"></label>
      <label class="field">search <input type="text" id="lfText" value="${esc(f.text)}" placeholder="spot, object, person…"></label>
      <button class="btn" id="lfClear">clear</button>
    </div><div id="logBody"></div></details></div>`; }
function logBodyHtml(visits, focus){ const shown=logFilter(visits), hi=S.log.obj||focus;
  return `<p class="small" style="margin:6px 0">${shown.length===visits.length?`${visits.length} visits, oldest first`:`${shown.length} of ${visits.length} visits match`}</p><div class="timeline">${shown.map(v=>visitHtml(v, hi, false)).join('')||'<p class="small">nothing matches these filters</p>'}</div>`; }
function wireLog(el, visits, focus){ const det=el.querySelector('#logDetails'); if(!det) return; const body=el.querySelector('#logBody');
  const paint=()=>{ body.innerHTML=logBodyHtml(visits, focus); };
  det.addEventListener('toggle', ()=>{ S.log.open=det.open; });
  const bind=(id,key,ev)=>{ const n=el.querySelector(id); if(n) n.addEventListener(ev||'change', ()=>{ S.log[key]=n.value; paint(); }); };
  bind('#lfRoom','room'); bind('#lfObj','obj'); bind('#lfDay','day'); bind('#lfFrom','from','input'); bind('#lfTo','to','input'); bind('#lfText','text','input');
  const c=el.querySelector('#lfClear'); if(c) c.addEventListener('click', ()=>{ S.log=Object.assign({}, LOG_DEFAULT); el.querySelector('#logPanel').outerHTML=logPanelHtml(visits); wireLog(el, visits, focus); });
  paint(); }

// ---------- the chronological run ----------
// a spot id read as a phrase: "at sink_k1", "on Nora", "out of the house"
function placeWords(rec, carrier){ if(rec==='ON_PERSON') return carrier?`on ${resName(carrier)}`:'on someone'; if(rec==='OUT_OF_HOUSE') return 'out of the house'; return `at <span class="id rec">${rec}</span>`; }
function revealedDay(doc, seq, i){ // nothing is revealed while the run is in progress: a verdict would change later decisions
  return i>=seq.length ? 99 : -1; }
function scoreFrom(answers, upToDay){ const sc={n:0,you1:0,base:BASE_NAMES.map(()=>[0,0]), looks:0, cost:0, hidden:0}; for(const a of answers){ if(a.day>upToDay){ sc.hidden++; continue; } sc.n++; if(a.hit) sc.you1++; sc.looks+=a.looksUsed; sc.cost+=a.costUsed; a.base.forEach((b,i)=>{ if(sc.base[i]){ sc.base[i][0]+=b[0]?1:0; sc.base[i][1]+=b[1]?1:0; } }); } return sc; }
function scoreTable(sc, title){ return `<h3>${title}</h3><div class="tablewrap"><table><thead><tr><th>Answerer</th><th class="num">Right</th><th class="num">Right in top 3</th></tr></thead><tbody>
    <tr><td><b>You</b> <span class="small">(${sc.looks} looks, ${sc.cost} budget spent on these)</span></td><td class="num">${sc.you1} ${sc.n?'<span class="small">('+Math.round(100*sc.you1/sc.n)+'%)</span>':''}</td><td class="num small">—</td></tr>
    ${BASE_NAMES.map((n,i)=>`<tr><td>${n}</td><td class="num">${sc.base[i][0]} ${sc.n?'<span class="small">('+Math.round(100*sc.base[i][0]/sc.n)+'%)</span>':''}</td><td class="num">${sc.base[i][1]} ${sc.n?'<span class="small">('+Math.round(100*sc.base[i][1]/sc.n)+'%)</span>':''}</td></tr>`).join('')}</tbody></table></div>${sc.hidden?`<p class="small">${sc.hidden} answer${sc.hidden===1?'':'s'} from the current day still sealed.</p>`:''}`; }
function historyHtml(doc, upToDay){ return `<div class="hist">${doc.answers.slice().reverse().map(a=>{ const shown=a.day<=upToDay; return `<div>${shown?(a.hit?'<span class="mark ok">✓</span>':'<span class="mark bad">✗</span>'):'<span class="small">sealed</span>'} Q${a.i+1} <span class="id">${a.obj}</span> ${wd3(a.day)} ${fmtMin(a.minute)} → you said ${placeWords(a.guess)}${shown?`${a.hit?'':` · it was ${placeWords(a.truth,a.carrier)}`}${a.whim?' <span class="tag whim">whim</span>':''} · baselines right: ${a.base.map((b,k)=>b[0]?BASE_NAMES[k].split(' (')[0]:null).filter(Boolean).join(', ')||'none'}`:''} <span class="small">· ${a.looksUsed} look${a.looksUsed===1?'':'s'}</span>${a.note?`<br><span class="small" style="color:var(--ink)">“${esc(a.note)}”</span>`:''}</div>`; }).join('')}</div>`; }
function truthHtml(a, open){ const path=rowsFor(a.obj).filter(r=>r.t>a.cutFrom && r.t<=a.t); let html=`<details ${open?'open':''}><summary>What actually happened to ${a.obj} (ground truth)</summary>`;
  if(!path.length) html+=`<div class="small">It did not move in the window before the question.</div>`;
  for(const r of path) html += `<div class="tl indent" style="grid-template-columns:82px 1fr"><span class="t" style="visibility:visible">${wd3(Math.floor(r.t/DAY))} ${fmtMin(Math.floor((r.t%DAY)/60))}</span><span class="x" style="padding-left:0">→ <span class="id rec">${r.receptacle_id}</span>${r.carrier?' ('+resName(r.carrier)+')':''} <span class="small">${esc(r.cause.replace(':',' · '))}${r.reason?' · '+esc(r.reason):''}</span>${r.whim?'<span class="tag whim">whim</span>':''}${(r.causes||[]).length?(S.reveal?r.causes.map(c=>`<span class="tag ${causeKind(c)}">${esc(c)}</span>`).join(''):' <span class="small">[hidden cause]</span>'):''}</span></div>`;
  return html+`</details>`; }

function renderQuiz(){ const el=document.getElementById('v-quiz'); const H=hh();
  if(!S.play.loaded){ el.innerHTML=`<p class="sub">Loading your progress…</p>`; return; }
  const doc=runDoc(), seq=questionSequence(doc.perDay);
  // current question index: the answered one stays on screen until Next
  const i = (S.play.done) ? doc.answers.length-1 : doc.answers.length; S.play.index=i;
  const upTo=revealedDay(doc, seq, S.play.done?i+1:i);
  let html='';
  if(i>=seq.length){ const sc=scoreFrom(doc.answers, 99); html += `<p class="sub">Segment finished: ${seq.length} questions on ${H.id}.</p><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="stack"><div class="panel">${scoreTable(sc,'Final score')}<div class="row" style="margin-top:10px"><button class="btn" id="resetRun">Restart this household</button></div></div><div class="panel"><h3>Hidden causes</h3><p class="small">${S.reveal?'The events and internal states that were driving each day. Turn off “reveal hidden causes” in the header to hide them again.':'Each day had events (rain, guests, a sick day…) and internal states (running late, low energy…) you could not see. Now that the run is over you can reveal them here or with the switch in the header.'}</p><div class="daytabs" style="margin-bottom:8px">${run().state.days.map((d,k)=>`<button data-fday="${k}" aria-selected="${(S.finDay??1)===k}">${DAYS[k]}</button>`).join('')}</div>${causesPanel(S.finDay??1, S.reveal)}</div>${notepadHtml()}</div><div class="stack"><div class="panel"><h3>Every answer</h3>${historyHtml(doc, 99)}</div><div class="panel"><h3>What actually happened</h3><p class="small">${S.reveal?'Cause tags on a move show which hidden cause produced it; the chips after each question are the causes active that day.':'Moves driven by a hidden cause show <span class="small">[hidden cause]</span>; flip “reveal hidden causes” to name them.'}</p>${doc.answers.map(a=>{ const dc=run().state.days[a.day].causes; return `<div style="margin-bottom:10px"><span class="small">Q${a.i+1}</span> <span class="id">${a.obj}</span> ${wd3(a.day)} ${fmtMin(a.minute)} · ${placeWords(a.truth,a.carrier)} ${a.hit?'<span class="mark ok">✓</span>':'<span class="mark bad">✗ you said '+placeWords(a.guess)+'</span>'}${S.reveal&&dc.length?`<div class="chips" style="margin-top:3px">${dc.map(c=>`<span class="tag ${c.kind}" title="${esc(c.words)}">${esc(c.id)}</span>`).join('')}</div>`:''}${truthHtml(a, true)}</div>`; }).join('')}</div></div></div>`; el.innerHTML=html; wireNotepad(el); wireRun(el, null); for(const b of el.querySelectorAll('[data-fday]')) b.addEventListener('click', ()=>{ S.finDay=+b.dataset.fday; renderQuiz(); }); const rv=el.querySelector('[data-act="reveal"]'); if(rv) rv.addEventListener('click', ()=>{ S.reveal=true; document.getElementById('reveal').checked=true; render(); }); return; }
  const q=seq[i]; S.play.q=q;
  if(S.mem.forQ!==i){ S.mem.forQ=i; S.mem.obj=null; S.mem.tab='object'; }   // a new question: memory opens on its object
  let changed=false; if(!S.play.done) changed=runPending(q.t);
  const visits=knowledgeVisits(); const cut=q.t; const day=q.day;
  const prevT = i>0 ? seq[i-1].t : -1;
  const fresh=visits.filter(v=>v.t>prevT && v.t<=cut && v.kind!=='tour' && !(v.src==='question' && v.qi===i));
  const failed=doc.looks.filter(l=>l.failed && l.t>prevT && l.t<=cut);
  const myLooks=doc.looks.filter(l=>l.src==='question' && l.qi===i && !l.failed);
  const left=budgetLeft(day);
  html += `<p class="sub">One household, Thursday to Sunday, questions in the order they happen. You start with a walkthrough of every room on Wednesday at 18:00 and nothing else. A look is a room: you see every spot in it and who is standing there. Each day has a budget of ${doc.budget}; a look costs ${doc.lookCost}, plus ${doc.travel} when the robot has to move rooms. You can also schedule looks for later. Every verdict stays sealed until the whole run is finished; the only way to learn where something is, is to look.</p>`;
  html += `<div class="grid2" style="grid-template-columns:1fr 1fr"><div class="stack">`;
  // ---- question card
  const pct=Math.round(100*i/seq.length);
  html += `<div class="panel"><div class="controls" style="justify-content:space-between"><span>Question ${i+1} of ${seq.length}</span><span>${DAYS[q.day]} ${fmtMin(q.minute)} · robot in the <b>${doc.robot}</b> · budget left today <b>${left}</b> of ${doc.budget}</span></div><div class="bar" style="margin-bottom:10px"><i style="width:${pct}%"></i></div>`;
  html += `<div class="q noclick">Where is <span class="id" style="font-size:17px">${q.obj}</span> right now, ${DAYS[q.day]} at ${fmtMin(q.minute)}?</div>`;
  const rooms=H.rooms.slice().sort();
  const roomCost = r => lookCost(r);
  html += `<div class="row"><label class="field">look in a room <select id="lookRoom" ${S.play.done?'disabled':''}>${rooms.map(r=>`<option value="${r}" ${r===doc.robot?'selected':''}>${r} (cost ${roomCost(r)})</option>`).join('')}</select></label><button class="btn primary" id="lookNow" ${S.play.done?'disabled':''}>Look now</button><span class="small">reports every spot in the room and who is there</span></div>`;
  html += `<div class="row" style="margin-top:8px"><label class="field">your answer: a spot <select id="guessSpot" ${S.play.done?'disabled':''}><option value="">— choose a spot —</option>${rooms.map(room=>`<optgroup label="${room}">${Object.values(H.receptacles).filter(r=>r.room===room).sort((a,b)=>a.id.localeCompare(b.id)).map(r=>`<option value="${r.id}">${r.id}</option>`).join('')}</optgroup>`).join('')}</select></label><button class="btn" id="guessSpotBtn" ${S.play.done?'disabled':''}>Guess it is here</button><button class="btn" id="guessOut" ${S.play.done?'disabled':''}>Guess: out of the house</button><button class="btn" id="guessOn" ${S.play.done?'disabled':''}>Guess: on someone</button>${S.play.done?'<button class="btn primary" id="nextQ">Next question</button>':''}</div>`;
  if(myLooks.length){ html += `<div style="margin-top:10px"><h3>Your looks for this question</h3><div class="timeline">${myLooks.map(v=>visitHtml(v, q.obj, true)).join('')}</div></div>`; }
  html += `<div style="margin-top:12px"><h3>Your thinking on this question</h3><textarea id="qNote" rows="3" placeholder="What are you using to decide? Update it after each look. Saved with the answer." style="width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;font:inherit;resize:vertical">${esc(S.play.draft||'')}</textarea>${S.play.done?`<div class="row" style="margin-top:6px;justify-content:space-between"><span class="small" id="qNoteState">${S.play.noteDirty?'edited, not saved':'saved with the answer'}</span><button class="btn" id="qNoteSave">Save note</button></div>`:'<p class="small" style="margin:4px 0 0">Kept while you look; stored when you answer.</p>'}</div>`;
  if(S.play.done){ const a=doc.answers[i];
    html += `<div class="verdict none" style="margin-top:10px"><b>Answer recorded.</b> You said ${placeWords(a.guess)}. Right or wrong is revealed when the run is finished.</div>`; }
  html += `</div>`;
  // ---- schedule looks
  const pend=doc.pending.slice().sort((a,b)=>a.t-b.t);
  html += `<div class="panel"><h3>Schedule a look</h3><p class="small">Spend budget without a question: the robot goes to a room at a time of your choosing and reports what it sees. Useful when you want to catch a routine (who is home at 18:00? what is on the counter before dinner?). Costs are charged on that day; if that day's budget is gone, the look is skipped.</p>
    <div class="row"><label class="field">room <select id="schedRoom">${rooms.map(r=>`<option>${r}</option>`).join('')}</select></label><label class="field">day <select id="schedDay">${DAYS.slice(q.day, run().state.days.length).map((d,k)=>`<option value="${q.day+k}">${d}</option>`).join('')}</select></label><label class="field">time <input type="time" id="schedTime" value="${fmtMin(Math.min(q.minute+60,1439))}"></label><button class="btn" id="schedBtn">Schedule</button></div>
    ${pend.length?`<div class="hist">${pend.map((p,k)=>`<div>${fmtT(p.t)} · ${p.room} <button class="btn" data-cancel="${k}" style="padding:1px 8px;margin-left:8px">cancel</button></div>`).join('')}</div>`:'<p class="small">Nothing scheduled.</p>'}</div>`;
  // ---- new since last question
  html += `<div class="panel"><h3>New since your last question</h3>`;
  if(i===0) html += `<p class="small">Only the Wednesday walkthrough so far; it is in the memory panel and the observation log on the right; filter the log by room, object, day or time.</p>`;
  html += fresh.length?`<div class="timeline">${fresh.map(v=>visitHtml(v, q.obj, true)).join('')}</div>`:(i>0?`<p class="small">No scheduled looks ran since the last question.</p>`:'');
  if(failed.length) html += `<p class="small mark bad">${failed.length} scheduled look${failed.length===1?'':'s'} skipped: ${failed.map(f=>fmtT(f.t)+' '+f.room+' ('+f.reason+')').join('; ')}</p>`;
  html += `</div>`;
  // ---- score + settings
  html += `<div class="panel"><h3>Progress</h3><p class="small">${doc.answers.length} of ${seq.length} answered · ${doc.looks.filter(l=>!l.failed).length} looks so far. Scores for you and the baselines appear when the run is finished.</p>${doc.answers.length?`<details><summary>Your answers so far (sealed)</summary>${historyHtml(doc, upTo)}</details>`:''}
    <div class="row" style="margin-top:8px"><button class="btn" id="resetRun">Restart this household</button><span class="small">budget/day</span><select id="cfgBudget">${[6,9,12,16,24].map(v=>`<option ${doc.budget===v?'selected':''}>${v}</option>`).join('')}</select><span class="small">travel cost</span><select id="cfgTravel">${[1,2,3,5].map(v=>`<option ${doc.travel===v?'selected':''}>${v}</option>`).join('')}</select><span class="small">changing these restarts the segment</span></div></div>`;
  html += notepadHtml();
  html += `</div><div class="stack">`;
  // ---- right column: memory + full log
  html += memoryHtml(cut, visits, q.obj);
  const seenSoFar=visits.filter(v=>v.t<=cut);
  html += logPanelHtml(seenSoFar);
  html += `</div></div>`;
  el.innerHTML = html;
  wireNotepad(el); wireRun(el, q); wireLog(el, seenSoFar, q.obj);
  if(changed) saveRun();
}
function recordAnswer(guess){ const doc=runDoc(), q=S.play.q, i=S.play.index, visits=knowledgeVisits(), tr=rowAt(q.obj,q.t), truth=tr.receptacle_id;
  const base=baselines(q,q.t,3,visits).map(b=>[b.ranked[0]===truth, b.ranked.includes(truth)]);
  const mine=doc.looks.filter(l=>l.src==='question' && l.qi===i && !l.failed);
  const prevT = i>0 ? questionSequence(doc.perDay)[i-1].t : 0;
  doc.answers.push({i, obj:q.obj, day:q.day, minute:q.minute, t:q.t, cutFrom:prevT, truth, guess, hit:guess===truth, carrier: truth==='ON_PERSON'?tr.carrier:undefined, looksUsed:mine.length, costUsed:mine.reduce((a,l)=>a+l.cost,0), base, whim:!!tr.whim, note:(S.play.draft||'').trim(), ts:new Date().toISOString()});
  doc.household=hh().id; doc.updated=new Date().toISOString(); S.play.done=true; S.play.noteDirty=false; renderQuiz(); saveRun(); }
function wireRun(el, q){ const doc=runDoc();
  const rs=el.querySelector('#resetRun'); if(rs) rs.addEventListener('click', async ()=>{ if(!confirm('Restart this household? Your answers and looks on it are cleared (notes are kept).')) return; S.play.doc={perDay:doc.perDay, budget:doc.budget, travel:doc.travel, lookCost:doc.lookCost, answers:[], looks:[], pending:[], robot:homeBase(), showVerdicts:doc.showVerdicts, started:new Date().toISOString()}; S.play.done=false; S.play.draft=''; renderQuiz(); await saveRun(); });
  const restartWith=async (patch)=>{ if(doc.answers.length && !confirm('Changing this restarts the segment for this household. Continue?')){ renderQuiz(); return; } S.play.doc=Object.assign({perDay:doc.perDay, budget:doc.budget, travel:doc.travel, lookCost:doc.lookCost, showVerdicts:doc.showVerdicts}, patch, {answers:[], looks:[], pending:[], robot:homeBase(), started:new Date().toISOString()}); S.play.done=false; S.play.draft=''; renderQuiz(); await saveRun(); };
  const cb=el.querySelector('#cfgBudget'); if(cb) cb.addEventListener('change', e=>restartWith({budget:+e.target.value}));
  const ct=el.querySelector('#cfgTravel'); if(ct) ct.addEventListener('change', e=>restartWith({travel:+e.target.value}));
    for(const b of el.querySelectorAll('[data-mem]')) b.addEventListener('click', ()=>{ S.mem.tab=b.dataset.mem; renderQuiz(); });
  const mo=el.querySelector('#memObj'); if(mo) mo.addEventListener('change', e=>{ S.mem.obj=e.target.value; renderQuiz(); });
  const mb=el.querySelector('#memBack'); if(mb) mb.addEventListener('click', ()=>{ S.mem.obj=null; renderQuiz(); });
  const mp=el.querySelector('#memPlace'); if(mp) mp.addEventListener('change', e=>{ S.mem.place=e.target.value; renderQuiz(); });
  if(!q) return;
  const ln=el.querySelector('#lookNow'); if(ln) ln.addEventListener('click', async ()=>{ if(S.play.done) return; const room=el.querySelector('#lookRoom').value; const v=doLook(room, q.t, 'question', S.play.index); if(!v){ alert('Not enough budget left today for that look ('+lookCost(room)+' needed, '+budgetLeft(q.day)+' left).'); doc.looks.pop(); return; } renderQuiz(); await saveRun(); });
  const gs=el.querySelector('#guessSpotBtn'); if(gs) gs.addEventListener('click', ()=>{ const rec=el.querySelector('#guessSpot').value; if(!rec||S.play.done) return; recordAnswer(rec); });
  const go=el.querySelector('#guessOut'); if(go) go.addEventListener('click', ()=>{ if(!S.play.done) recordAnswer('OUT_OF_HOUSE'); });
  const gp=el.querySelector('#guessOn'); if(gp) gp.addEventListener('click', ()=>{ if(!S.play.done) recordAnswer('ON_PERSON'); });
  const nx=el.querySelector('#nextQ'); if(nx) nx.addEventListener('click', ()=>{ S.play.done=false; S.play.draft=''; S.play.noteDirty=false; renderQuiz(); });
  const sb=el.querySelector('#schedBtn'); if(sb) sb.addEventListener('click', async ()=>{ const room=el.querySelector('#schedRoom').value, d=+el.querySelector('#schedDay').value, [h,m]=el.querySelector('#schedTime').value.split(':').map(Number); const t=d*DAY+(h*60+m)*60; if(t<=q.t){ alert('Schedule a time after the current question ('+fmtT(q.t)+').'); return; } doc.pending.push({t, room}); renderQuiz(); await saveRun(); });
  for(const b of el.querySelectorAll('[data-cancel]')) b.addEventListener('click', async ()=>{ const pend=doc.pending.slice().sort((a,b)=>a.t-b.t); const p=pend[+b.dataset.cancel]; doc.pending=doc.pending.filter(x=>x!==p); renderQuiz(); await saveRun(); });
  const qn=el.querySelector('#qNote'); if(qn) qn.addEventListener('input', ()=>{ S.play.draft=qn.value; if(S.play.done){ S.play.noteDirty=true; const st=el.querySelector('#qNoteState'); if(st) st.textContent='edited, not saved'; } });
  const qs=el.querySelector('#qNoteSave'); if(qs) qs.addEventListener('click', async ()=>{ const last=doc.answers[doc.answers.length-1]; if(!last) return; last.note=(S.play.draft||'').trim(); S.play.noteDirty=false; qs.disabled=true; await saveRun(); renderQuiz(); });
}

render();
})();
</script>
