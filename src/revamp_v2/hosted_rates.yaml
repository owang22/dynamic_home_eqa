# Hosted-generation pilot rate table (Task 1.5), read by
# dynamic_home_eqa.generation.hosted_spend.SpendGuard.
#
# Source: https://developers.openai.com/api/docs/pricing (the URL
# https://platform.openai.com/docs/pricing 301-redirects there),
# retrieved 2026-08-23. Values are the STANDARD tier, SHORT-context
# rates in $ per 1M tokens; both models also list a long-context tier
# (luna 0.40/0.04/1.80, terra 4.00/0.40/18.00) that no pilot prompt
# comes near, so it is deliberately not modeled. Reasoning tokens are
# billed inside completion_tokens (output rate) — see hosted_spend.py.
#
# Keys are the model ALIASES; the guard prefix-matches response `model`
# snapshot ids (e.g. gpt-5.6-luna-2026-XX-XX) against them.
gpt-5.6-luna:
  input_per_1m: 0.20
  cached_input_per_1m: 0.02
  output_per_1m: 1.20
gpt-5.6-terra:
  input_per_1m: 2.00
  cached_input_per_1m: 0.20
  output_per_1m: 12.00
