# Full grid on the 28-day hh_001 bank (displacement-persistence world,
# uniform repeat-capped questions, 10 sightings/day, budget 16/day).
bank: banks/baselines/hh_001_28d_uniform.jsonl
seed: 0
out_dir: smoke_results/baselines_hh001_28d
agents:
  beliefs:
    - {name: last_observation}
    - {name: most_frequent}
    - {name: timetable, bin_hours: 1, day_scheme: all}
  policies:
    - {name: never_sense}
    - {name: sequential_search}
    - {name: fixed_schedule, every_hours: 6,
       rotation: [counter_k1, couch_l1, coffee_table_l1, entry_table_e1]}
