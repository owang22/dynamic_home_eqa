# Full grid on the hh1 21-day bank (dated-activity world: persona ->
# detailed_activities -> object_motions; uniform repeat-capped questions
# drawn from the household's own awake time; 10 sightings/day, budget 24).
bank: banks/baselines/hh1_21d_uniform.jsonl
seed: 0
out_dir: smoke_results/baselines_hh1_21d
agents:
  beliefs:
    - {name: last_observation}
    - {name: most_frequent, half_life_h: 24}
    - {name: timetable, bin_hours: 1, day_scheme: all, half_life_h: 24}
  policies:
    - {name: never_sense}
    - {name: sequential_search}
    - {name: fixed_schedule, every_hours: 6,
       rotation: [counter_k1, couch_l1, coffee_table_l1, entry_table_e1]}
