# Smoke run: the full 3x3 grid on the synthetic fixture bank.
bank: synthetic          # or a path to a bank .jsonl
seed: 0
out_dir: smoke_results/baselines_smoke
agents:
  beliefs:
    - {name: last_observation}
    - {name: most_frequent}
    - {name: timetable, bin_hours: 1, day_scheme: all}
  policies:
    - {name: never_sense}
    - {name: always_sense}
    - {name: fixed_schedule, every_hours: 6,
       rotation: [counter_k, desk_o, entry_e, shelf_l]}
