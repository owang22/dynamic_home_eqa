# The ONE shared fleet configuration: every household bank is exported and
# diagnosed with exactly these settings; per-bank tuning stays prohibited.
#
# Observation model: room visits (round-robin patrol, 6 visits/day) — a
# visit reveals every receptacle in one room at once. Replaces the random
# per-object glimpse stream, which starved 30-50-object inventories to
# under one sighting per object per day and made every belief model answer
# alike. 6 visits/day yields roughly 0.7-1.2 sightings per object per day
# across the storyfirst set.
export:
  seed: 0
  sightings_per_day: 10          # used only by the glimpse model
  observation_model: room_visit
  patrol: round_robin_patrol
  visits_per_day: 6
  questions_per_day: 90
  first_question_day: 3
  budget_per_day: 24
  query_mode: uniform
  initial_tour: true
healthcheck: {}
