# Realization-layer (L3) parameters for revamp_v2 — the single home for
# every numeric knob the simulator extensions and the L2 schema bounds use.
# Each value cites its calibration source. Authored per-household numbers
# (each block's skip_p, each activity's mean_bouts, each resident's
# jitter_scale) are LLM judgment bounded by these ranges; nothing here is
# tuned per household.

jitter_classes:
  # Day-to-day sigma (minutes) of block starts, by class. MUST equal
  # profiles/revamp_v1/simulate_activities.py JITTER_CLASSES — simulate.py
  # asserts this at load; the values are calibrated, not free.
  # Source: casas/README.md "Jitter calibration" (CASAS aruba/cairo/milan/
  # tulum2 anchor-start sigmas; `external` remains a domain prior — no
  # employed-outside-the-home resident exists in those datasets).
  external: 10
  routine: 30
  flexible: 75
  loose: 110

jitter_scale:
  # Per-resident punctuality multiplier bounds. Source: revamp_v1 README
  # ("hard-bounded to [0.5, 2.0] so households stay inside the spread
  # observed across real homes").
  min: 0.5
  max: 2.0
  # A realized block keeps at least this share of its authored length
  # (v3 programs only). Jitter is drawn per block; with sigma 30 min on
  # 10-15 min blocks, neighbouring draws collapsed 1 block in 4 to a
  # minute or two (hh1: 108 of 475). The floor makes a shifted block
  # push the next one instead — order and every draw unchanged. 0.6 is
  # a judgment default: a 15-min snack keeps at least 9 minutes.
  keep_block_share: 0.6

skip:
  # Per-realization block drop, applied BEFORE jitter, counted per activity
  # in meta.json. Upper bound: casas/README.md "What the real grounding
  # changes" — real Wash_Dishes runs every ~2 days and Housekeeping bouts
  # have ~2-day gaps, i.e. even the flakiest real recurring chore still
  # happens roughly half the time it plausibly could; contractual anchors
  # (sleep, shifts) are effectively never skipped and the prompt pins them
  # to skip_p 0.
  # Raised 0.6 -> 0.9 for the Recurring/Occasional split: the 0.6 bound
  # was calibrated on RECURRING chores (real Wash_Dishes still runs every
  # ~2 days), but an Occasional activity (a hobby night, a deep clean) is
  # scheduled as a standing possibility and skipped most weeks — its
  # realistic rate is the INVERSE of a chore's. The prompt keeps
  # recurring blocks at <= 0.4 and reserves 0.5-0.9 for occasionals.
  max_skip_p: 0.9

fragmentation:
  # Bout fragmentation: N ~ max(1, Poisson(mean_bouts)) non-overlapping
  # sub-bouts within the realized block window. Calibration anchor:
  # casas/README.md fragmentation caveat — merged real sessions run ~16/day
  # vs ~11 authored blocks, and Meal_Preparation is 4.1 kitchen
  # sessions/day where authored specs run 1; sub-30-min splits are
  # annotator noise, so bounds stay at session scale.
  min_mean_bouts: 1.0
  max_mean_bouts: 6.0
  # A sub-bout shorter than this collapses into its neighbour (matches the
  # <30 min session-merge rule used for the CASAS calibration).
  min_bout_minutes: 10

carry_on_departure:
  # Every block that starts at ELSEWHERE picks up the departing resident's
  # person-homed items (a phone, keys, a wallet). Authored rules can only
  # name the going-out activities the author thought of, and a household
  # has several: measured on the grad-student home, her phone was on her
  # for 1 of 8 trips out with rules alone. Forgetting is still modelled —
  # `p_misplace` can leave an item on a table before the trip and it stays
  # there. Disabled for the revamp_v1 regression fixture, whose timeline
  # predates this mechanism (same treatment as skip and fragmentation).
  enabled: true
  # ...but not every item on every kind of trip: each (item, trip-type)
  # pair is a stable hash-derived choice, so with 0.85 roughly one pairing
  # in seven is a standing omission (she never takes her wallet on the
  # morning walk). A judgment default — no free-living dataset observes
  # pocket contents — chosen so most trips look fully equipped while
  # every household still has a few signature gaps. Per-day forgetting
  # comes from p_misplace, not from this.
  carry_p: 0.85
  # Per-departure forgetting of a POCKET item (phone, keys, wallet) on
  # top of the standing omissions above: each pickup of one happens with
  # probability 1 - forget_p, and a forgotten item stays where it was
  # (its homecoming rule reaches only what came home on the person).
  # Non-pocket travellers do not use this: their "not taken this time"
  # chance is the authored NO_OP mass of their rule on the trip.
  # The rate is PER PERSON: the persona pass rates each resident's
  # forgetfulness (rarely / sometimes / often, with a cites line) and
  # `forget_levels` maps that to a probability, stored on the program's
  # resident as `forget_p`. `forget_p` here is only the fallback for a
  # resident with no rating. Judgment defaults — no dataset observes who
  # walks out without their keys; 0 disables the draw.
  forget_p: 0.03
  forget_levels:
    rarely: 0.01
    sometimes: 0.03
    often: 0.08
  # Two ELSEWHERE bouts of one resident closer together than this (minutes
  # at home between trips) do NOT re-fire pickup/putdown for items that
  # never moved in between: the person plausibly kept the bag packed.
  # Without it, departure carries fire per fragmented bout and daily event
  # counts scale with bout_count x carried_items (measured on
  # rule_based/qwen3.8-27b hh9: 12-bout days emitted ~98 events vs 1-3 on
  # 0-bout days, daily Fano 19 vs the real reference's 5). 90 min is the
  # errand-chain scale: CASAS session-merge treats sub-30-min gaps as one
  # session, and a >1.5 h stay at home is long enough that unpacking and
  # re-packing pocket items is the realistic reading. Suppressed pairs are
  # counted in meta.json (carry_rehome_suppressed), never silent.
  carry_rehome_min: 90

misplace:
  # Chance drift under v3 (`misplace_model: at_putdown`) is a FAILED
  # PUTDOWN: when an activity ends and the object's after-rule would
  # return it to one of its designated slots, with probability
  # `p_misplace` (authored per object, now read per putdown rather than
  # per day) it is left on a random other surface instead — in the room
  # the person was in for the activity, or `next_room_share` of the time
  # in the room they go to next (the book carried absent-mindedly from
  # the sofa to the kitchen; only when that next block is at home,
  # awake, and within the hour). Objects nobody is putting down do not
  # drift, and bulky classes (expand_calendar.BULKY_CLASSES) never do.
  # The v1 model drew a random awake minute per day into a fixed
  # six-surface set: every drift in hh1 landed in the kitchen, 8 of 126
  # while nobody was home. 0.5 is a judgment default.
  next_room_share: 0.5
  # Bulky classes (expand_calendar.BULKY_CLASSES: a suitcase, a laundry
  # basket, a yoga mat) are only misplaced by a person whose forgetting
  # rate is at least this — the "often" level above: a scattered adult,
  # a small child. Everyone else's putdowns of them always land.
  bulky_needs_forget_p: 0.08
  # The authored per-object `p_misplace` is scaled by its OWNER's
  # persona forgetfulness rating (the program resident's `forget_level`;
  # a shared object takes the mean over the residents). Added 2026-09-16:
  # the object-rule author writes 0.1-0.4 for every carried item with no
  # sight of the person, so hh_001's "methodical, rarely forgetful"
  # resident was misplacing 4.3 things a day, her wallet every third day.
  # Judgment defaults; a missing rating scales by `sometimes`.
  by_forgetfulness:
    rarely: 0.3
    sometimes: 1.0
    often: 1.6
