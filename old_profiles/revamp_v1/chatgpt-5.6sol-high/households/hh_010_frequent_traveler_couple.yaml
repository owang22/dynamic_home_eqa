household_id: hh_010
household_type: frequent_traveler_couple
residents:
  - id: resident_1
    name: Leila Park
    age: 36
    occupation: management consultant
    personality: efficient, travel-adapted, compartmentalized
    habits:
      - keeps keys, wallet, headphones, and charger grouped near her travel backpack
        between trips
      - moves clothing and small electronics into staging piles before travel
      - returns shared chargers to resident_2 when she is home but sometimes packs
        them accidentally
      - carries mugs between the kitchen and bedroom while unpacking
      - leaves her jacket and umbrella near her travel bag rather than the main
        coat area
      - hands resident_2 loose items from her backpack to be put away when she returns
  - id: resident_2
    name: Theo Park
    age: 38
    occupation: museum exhibit designer
    personality: home-oriented, creative, moderately tidy
    habits:
      - uses the dining table for sketches and laptop work while resident_1 is away
      - moves Leila's abandoned travel items from shared surfaces into a staging
        corner
      - keeps the shared remote and blanket in stable living-room locations when
        alone
      - borrows Leila's spare charger while she is away and sometimes forgets to
        return it
      - collects mugs and plates from around the apartment before Leila returns
      - unpacks shared items that Leila hands him and returns them to household
        storage
relationships: >-
  Leila and Theo are married, but Leila travels for work frequently enough that
  the home alternates between solo and shared occupancy. Theo develops stable arrangements
  while she is away, then those arrangements are disrupted when luggage-associated
  objects spread through the apartment. Their main friction is over chargers and
  travel items that Leila unintentionally removes from shared circulation.
home_layout_notes: >-
  Their two-bedroom apartment has a primary bedroom, a small office, and an open
  living and dining area. One corner near the entrance functions as Leila's travel
  staging zone. When she is away, Theo spreads his work into shared space; when
  she returns, the same surfaces become unpacking and reorganization zones.
object_inventory:
  - id: phone_leila
    class: phone
    owner: resident_1
    role: personal phone; moves between travel bag, bedside surface, and charging
      spots
  - id: phone_theo
    class: phone
    owner: resident_2
    role: personal phone; mostly remains within the home when he is not working
      elsewhere
  - id: keys_leila
    class: keys
    owner: resident_1
    role: personal keys; grouped with travel essentials
  - id: keys_theo
    class: keys
    owner: resident_2
    role: personal keys; kept in a stable entry location
  - id: wallet_leila
    class: wallet
    owner: resident_1
    role: personal wallet; moves between travel backpack and home staging area
  - id: wallet_theo
    class: wallet
    owner: resident_2
    role: personal wallet; consistently stored near his keys
  - id: backpack_leila
    class: backpack
    owner: resident_1
    role: work travel backpack; periodically absorbs chargers, notebooks, headphones,
      and personal essentials
  - id: laptop_leila
    class: laptop
    owner: resident_1
    role: work laptop; usually remains associated with her travel bag
  - id: laptop_theo
    class: laptop
    owner: resident_2
    role: design laptop; moves between office and dining table
  - id: charger_leila
    class: charger
    owner: resident_1
    role: travel charger; alternates between home outlets and packed bag
  - id: charger_shared
    class: charger
    owner: shared
    role: shared spare charger; Theo uses it while Leila is away, but Leila sometimes
      packs it
  - id: headphones_leila
    class: headphones
    owner: resident_1
    role: travel headphones; tightly coupled to her backpack
  - id: notebook_leila
    class: notebook
    owner: resident_1
    role: work notebook; cycles between travel bag and home desk
  - id: mug_1
    class: mug
    owner: shared
    role: shared mug; Theo keeps it mostly in kitchen circulation, Leila carries
      it into other rooms when home
  - id: plate_1
    class: plate
    owner: shared
    role: shared plate; low movement in solo mode and more varied movement when
      both are home
  - id: remote_1
    class: remote
    owner: shared
    role: shared remote; stable under Theo's solo routine and more variable when
      Leila returns
  - id: blanket_1
    class: blanket
    owner: shared
    role: shared sofa blanket; usually stable except during periods when both residents
      use the living room
  - id: jacket_leila
    class: jacket
    owner: resident_1
    role: travel jacket; stored near luggage rather than with Theo's clothing
  - id: umbrella_leila
    class: umbrella
    owner: resident_1
    role: travel umbrella; alternates between backpack and entrance staging area
daily_life_summary: >-
  The apartment alternates between two distinct states. While Leila is traveling,
  Theo establishes stable object locations and spreads some of his work into shared
  areas. When Leila returns, her backpack, chargers, clothing, and work items temporarily
  fan outward through the entrance, bedroom, and dining area before being consolidated
  again. The largest changes therefore occur around transitions between one-resident
  and two-resident occupancy.
quirks: >-
  The same object can have very different mobility depending on whether Leila is
  home. Travel preparation also removes objects from the apartment entirely, creating
  periodic disappearance and reappearance rather than simple relocation.
