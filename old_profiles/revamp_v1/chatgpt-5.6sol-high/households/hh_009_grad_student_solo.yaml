daily_life_summary: >-
  Ravi's home lacks a strong separation between work, eating, and resting. The same
  laptop, notebooks, dishes, and charger migrate repeatedly as he changes where
  he works. Some days involve little movement because he remains absorbed in one
  spot; others produce broad redistribution across the apartment. Cleanup happens
  in bursts rather than as a steady restoring process.
quirks: >-
  His apartment can remain in one messy configuration for an extended period and
  then change dramatically during a single cleanup. Object movement is driven more
  by task switching and accumulated clutter than by a stable domestic routine.
