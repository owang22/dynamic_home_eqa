household_id: hh_009
household_type: grad_student_solo
residents:
  - id: resident_1
    name: Ravi Shah
    age: 27
    occupation: graduate student
    personality: intense, absent-minded, clutter-blind
    habits:
      - moves his laptop constantly between desk, bed, sofa, and dining table
      - leaves mugs beside whichever surface became a temporary workspace
      - packs and unpacks his backpack without fully putting contents away
      - uses multiple notebooks concurrently and stacks them wherever he stops working
      - loses his phone charger under papers or blankets
      - eats from a bowl or plate while working and postpones returning it to the
        kitchen
      - drops keys and wallet into whichever bag or jacket he expects to use next
relationships: >-
  Ravi lives alone, so there is no second resident imposing order or moving his
  belongings. His main source of object change is repeated switching between work
  locations. Clutter persists until he performs occasional large cleanup bursts.
home_layout_notes: >-
  His studio-like one-bedroom apartment contains a small desk, dining table, sofa,
  and bed, all of which can become work surfaces. The kitchen is nearby but poorly
  separated from work areas, so dishes and electronics frequently intermingle. There
  are few stable object homes beyond large furniture.
