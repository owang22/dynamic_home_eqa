household_id: hh_007
household_type: multigenerational
residents:
  - id: resident_1
    name: Grace Okafor
    age: 74
    occupation: retired nurse
    personality: steady, observant, traditional
    habits:
      - keeps her glasses, book, and medication bottle in consistent locations
      - moves resident_4 and resident_5's toys off the sofa before sitting
      - collects mugs left by resident_2 and places them in the kitchen
      - folds the shared blanket and returns it to the same chair
      - keeps her phone near her reading chair rather than carrying it around
      - reminds resident_3 where children's backpacks were left
  - id: resident_2
    name: Samuel Okafor
    age: 43
    occupation: transit planner
    personality: efficient, distracted, pragmatic
    habits:
      - drops keys and wallet at the entrance but leaves his phone throughout the
        house
      - packs resident_4's lunchbox and places it beside the child's backpack
      - moves children's toys into rough piles when clearing the floor
      - leaves mugs beside his laptop
      - borrows resident_3's charger when working away from his desk
      - moves Grace's book carefully if he needs her side table
  - id: resident_3
    name: Adanna Okafor
    age: 40
    occupation: physical therapist
    personality: organized, nurturing, fast-moving
    habits:
      - collects resident_4 and resident_5's jackets and hangs them near the entrance
      - returns Grace's medication bottle to its designated spot if it is displaced
      - clears everyone's dishes from the dining area
      - keeps children's school items grouped by owner
      - moves Samuel's laptop charger back toward his workspace when tidying
      - rotates toys between the living room and children's bedroom
  - id: resident_4
    name: Zoe Okafor
    age: 9
    occupation: student
    personality: responsible, imaginative, talkative
    habits:
      - carries books between her room and Grace's reading chair so they can read
        together
      - packs her own backpack but leaves notebooks on the dining table
      - moves resident_5's toys when organizing shared play space
      - uses the shared blanket while reading with Grace
      - leaves her water bottle near whichever adult last helped with homework
      - returns the remote more reliably than resident_5
  - id: resident_5
    name: Micah Okafor
    age: 5
    occupation: student
    personality: energetic, affectionate, impulsive
    habits:
      - carries toys into Grace's room to show her
      - takes Zoe's books and leaves them among his toys
      - hides the shared remote under cushions while playing
      - abandons his jacket wherever an adult helps remove it
      - moves bowls and cups short distances around the dining area
      - follows Zoe between rooms while carrying loose toys
relationships: >-
  Grace lives with her son Samuel, his spouse Adanna, and their children Zoe and
  Micah. Grace maintains stable personal routines, Adanna does most systematic household
  resetting, and Samuel handles practical transitions such as packing and departures.
  The children create most object spread, while tension comes from adults consolidating
  their belongings into locations the children do not remember.
home_layout_notes: >-
  Grace has a downstairs bedroom near the main living area, while the parents and
  children use bedrooms upstairs. The kitchen, dining room, and living room are
  heavily shared, and the children's objects regularly cross between floors. Grace's
  reading chair forms an unusually stable object cluster within an otherwise active
  home.
