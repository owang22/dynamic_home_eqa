daily_life_summary: >-
  This house combines two very different mobility regimes: Grace's belongings are
  highly stable while the children's belongings spread across rooms and floors.
  Samuel and Adanna regularly cross through shared spaces and reset objects for
  both generations. Zoe often bridges the grandparent and children's zones by carrying
  books and blankets between them. Micah produces the most unpredictable movement,
  especially with toys and the remote.
quirks: >-
  The most stable object cluster belongs to Grace even though her room opens directly
  onto busy shared space. Zoe creates recurring cross-generational object paths
  that would not appear in a simpler parent-child household.
