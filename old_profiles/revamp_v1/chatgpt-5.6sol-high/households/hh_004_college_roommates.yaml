daily_life_summary: >-
  The roommates use the apartment as three overlapping but weakly coordinated personal
  zones. Shared-space objects accumulate and disperse unpredictably because each
  resident treats cleanup differently. Their paths cross most often around the kitchen,
  dining table, and sofa, where chargers, dishes, and electronics change hands.
  Objects owned by one resident are often temporarily located in another resident's
  space.
quirks: >-
  The apartment is not uniformly messy: Priya's zones are highly organized while
  Marcus's are chaotic and Elena's are stable but cluttered. Ownership predicts
  object behavior poorly because borrowing is common.
