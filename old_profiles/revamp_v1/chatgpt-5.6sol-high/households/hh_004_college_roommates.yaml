household_id: hh_004
household_type: college_roommates
residents:
  - id: resident_1
    name: Priya Nair
    age: 21
    occupation: student
    personality: conscientious, busy, mildly possessive
    habits:
      - keeps her laptop and notebook together but carries them between bedroom
        and dining table
      - labels her charger because resident_2 has borrowed it repeatedly
      - moves abandoned mugs from the living room into the kitchen
      - borrows resident_3's umbrella and returns it only after being reminded
      - stores her backpack beside her bedroom door
      - moves the shared remote onto a shelf when cleaning
  - id: resident_2
    name: Marcus Reed
    age: 20
    occupation: student
    personality: social, careless, improvisational
    habits:
      - borrows whichever charger is closest, including resident_1's
      - leaves gaming controllers on the sofa, floor, or dining table
      - carries shared mugs into his bedroom and forgets them there
      - takes resident_3's headphones without asking when his are missing
      - drops keys on any flat surface near the entrance
      - leaves his backpack partly unpacked in shared spaces
  - id: resident_3
    name: Elena Ruiz
    age: 22
    occupation: student
    personality: independent, observant, clutter-tolerant
    habits:
      - works with headphones and leaves them beside whichever laptop setup she
        last used
      - keeps her keys clipped to her backpack more consistently than the others
      - moves Marcus's dishes out of the way rather than washing them
      - lets Priya borrow her umbrella but complains when it is not returned
      - keeps books stacked around her bed and occasionally carries one to the sofa
      - moves the shared remote only when she watches television
relationships: >-
  The three roommates are friends but largely run independent lives. Priya does
  the most common-space cleanup, Marcus creates most of the misplaced shared items,
  and Elena avoids conflict by shifting other people's clutter aside. Chargers,
  mugs, headphones, and the remote are recurring sources of low-level friction.
home_layout_notes: >-
  Each roommate has a separate bedroom, while the kitchen, living room, and dining
  table are shared. The dining table frequently becomes overflow workspace, and
  the sofa area accumulates electronics and dishes. Bedroom boundaries are nominally
  private, but borrowed objects routinely cross them.
