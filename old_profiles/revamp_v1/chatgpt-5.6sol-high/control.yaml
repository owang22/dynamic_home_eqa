# Control file for the revamped household set (revamp_v1), ChatGPT variant.
# Stage 1 of the revamp: narrative profiles — WHO lives in each home and WHAT
# objects they own. No clock times at this stage; schedules with times of day
# are authored in a later step and will be driven by these profiles.

version: revamp_v1
created: 2026-08-07
stage: narrative_profiles           # next stage: schedule authoring (clock times)
generator: chatgpt-5.6sol (high reasoning), pasted in by hand
prompt_file: ../generation_prompt.md  # same verbatim instructions as claude-fable-5

object_vocabulary:
  [mug, bowl, plate, laptop, phone, keys, book, water_bottle, remote,
   charger, backpack, jacket, headphones, glasses, notebook, pen,
   medication_bottle, toy, blanket, towel, gaming_controller, dog_leash,
   lunchbox, umbrella, wallet]

rules:
  - household_type and headcount are fixed as specified below
  - 5-8 concrete object habits per resident; in multi-person homes at least
    2 habits per resident involve another resident (waived for 1-person homes)
  - no clock times or hour-by-hour routines anywhere in the profiles
  - object counts scale with household size; phones/keys/wallets exist
    per resident (adults and teens; not small children)
  - an object's meaning must come from its "role" (how it is used and moved),
    not from its class
  - each household must be clearly different from every other household in
    personalities, ages, living situations, and habits — not just names

households:
  - household_id: hh_001
    household_type: night_shift_worker_solo
    residents_spec: "1"
    residents: 1
    constraints: one-bedroom apartment
    file: households/hh_001_night_shift_worker_solo.yaml
    status: GENERATED

  - household_id: hh_002
