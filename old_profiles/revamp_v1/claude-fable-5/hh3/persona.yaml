daily_life_summary: >-
  They wake early and eat breakfast together at the kitchen table, where Mei-Lin
  sets out the crossword and Gordon's pill bottle. Gordon disappears to the shed
  or yard for the morning while Mei-Lin holds the kitchen; he surfaces to deliver
  her tea and they reconvene for lunch. Afternoons are parallel — his nap under
  the couch blanket, her errands or a video call with the grandchildren — and evenings
  are shared television, ending with her nightly repatriation of the remote to the
  drawer. Days differ from each other mainly in which pair of Gordon's glasses is
  missing.
quirks: >-
  They are not slowing down so much as optimizing — the household runs on systems
  (hook boards, drawer homes, the pill-bottle relay) that they built deliberately
  and enforce on each other with relish. The competitive streak is real: the crossword,
  the jigsaw in the spare room, and even remote-placement are all quietly kept score.
