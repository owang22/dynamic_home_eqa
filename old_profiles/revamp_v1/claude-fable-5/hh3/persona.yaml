household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Gordon Chu
    age: 74
    occupation: retired (machinist)
    personality: creature of exact habit, mildly stubborn, misplaces small personal
      items while keeping shared spaces immaculate
    habits:
      - owns three pairs of reading glasses so one can always be found; they rotate
        between his armchair, the kitchen table, and the shed
      - keeps the TV remote on the arm of his chair all evening; resident_2 returns
        it to the drawer under the TV every night, and he takes it back out every
        afternoon
      - brings resident_2 her tea in her own mug mid-morning without being asked,
        a ritual older than their retirement
      - takes his blood-pressure pill when resident_2 slides the bottle next to
        his breakfast bowl — he forgets otherwise
      - hangs his keys on the hook board he built by the door, same peg for forty
        years
      - does the washing-up after every meal, immediately, and gets antsy if a plate
        sits out
  - id: resident_2
    name: Mei-Lin Chu
    age: 70
    occupation: retired (primary school teacher)
    personality: precise, quietly competitive, believes every object has one correct
      home
    habits:
      - does the crossword at the kitchen table with the same pen every morning
        and guards that pen ferociously
      - returns the remote from resident_1's chair arm to the TV drawer every night
        as the last act before bed
      - slides resident_1's pill bottle next to his bowl at breakfast, then puts
        it back in the bathroom cabinet herself
      - reads in bed and files the book back onto her nightstand shelf — never face-down,
        never on the floor
      - carries the laptop to the kitchen table for video calls with the grandchildren,
        then returns it to the sideboard the moment the call ends
      - waters the windowsill and re-folds the couch blanket into thirds on her
        way past, multiple times a day
relationships: >-
  Married forty-six years. Chores are divided by treaty: Gordon washes up and handles
  the shed and yard, Mei-Lin owns the kitchen table, laundry, and the medicine cabinet.
  The one persistent border dispute is the TV remote — Gordon insists it lives on
  his chair arm, Mei-Lin insists it lives in the drawer, and it commutes between
  the two daily. She also manages his pills; he pretends this is unnecessary.
home_layout_notes: >-
  Small two-bedroom bungalow. The kitchen table is Mei-Lin's headquarters (crossword,
  pen, video calls); the living-room armchair and the backyard shed are Gordon's.
  The bathroom cabinet, TV drawer, and door-side hook board are strict fixed homes
  for shared objects; the spare bedroom holds a half-finished jigsaw neither will
  admit to being stuck on.
