# Stage-2a ACTIVITY CALENDAR for hh3 — Gordon & Mei-Lin Chu, 21 days.
# Two-resident calendar: each item carries r: resident_1 (Gordon, default)
# or resident_2 (Mei-Lin). Shared moments are one block per participant,
# owned by whoever's objects move (the persona's chore treaty decides:
# Mei-Lin sets the table, pills, laptop, remote-repatriation; Gordon does
# every washing-up, the shed, the tea delivery). Day 0 = Monday.
#
# Design intent (charter-faithful):
#   - The HOUSEHOLD SYSTEMS are invariant: pill relay at breakfast, Gordon's
#     immediate washing-up after every meal, tea delivery mid-morning, the
#     remote's daily commute (his chair arm by day, her drawer by night).
#   - Variation lives in which pair of Gordon's glasses is missing, her
#     errand/call days, and three weekly arcs.

household: hh_003
days: 21
day0: Monday

narrative_arcs:
  - "W1 baseline: walks, shed mornings, Tue/Fri errands, Wed video call, Thu library run, Sunday roast."
  - "W2 disruption: Gordon's cold (days 9-11: no shed, extra naps, Mei-Lin fetches the tea and washes up — treaty suspended); day 10 doctor visit together; shed pair of glasses goes missing all week."
  - "W3 the grandchildren: spring clean day 16, visit day 17 (Sat, house upended), recovery + long call day 18, anniversary dinner out day 19, quiet Sunday 20."

# Weekday template (varied per day below):
#  06:45 r2 wake_breakfast (crossword out, pill bottle to the table)
