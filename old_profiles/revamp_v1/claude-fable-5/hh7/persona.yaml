daily_life_summary: >-
  Halima's pre-dawn tea opens the house alone; the morning rush follows in a wave
  — Yusuf's hall-shelf ritual and commute, Amina and the kids' staggered school
  runs on her alternating work days. Midday belongs to Halima, who resets the house
  to her own system; the kids return to her after school and undo it convoy by convoy.
  Evenings stack everyone into the kitchen and living room at once — two cooks,
  one laptop changing shifts from desk to armchair, bedtime stories from Yusuf —
  before his kitchen shutdown closes the day well after Halima has already retired.
quirks: >-
  The stereotype puts the grandmother at the household's periphery; here her armchair
  corner is functionally the capital — the remote lives there, the laptop spends
  its evenings there, and the children orbit it. The house also runs two complete,
  contradictory tidying systems (Halima's corner-basket regime and Amina's rooms-of-origin
  regime) that have coexisted unresolved for years, so most objects have two 'correct'
  homes depending on who tidied last.
