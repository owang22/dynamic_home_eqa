household_id: hh_007
household_type: multigenerational
residents:
  - id: resident_1
    name: Halima Osman
    age: 68
    occupation: retired (seamstress); minds the children after school
    personality: earliest riser, exact about her own things, quietly re-organizes
      everyone else's
    habits:
      - makes tea before anyone wakes, in her own mug that no one else may use,
        washed and shelved by her own hand
      - keeps her glasses and medication together on the front windowsill; both
        objects are considered untouchable by the whole house
      - runs her own toy-return system, ferrying the kids' toys to a basket in HER
        corner — which conflicts with resident_3's system of returning them to the
        kids' room
      - claims the laptop most evenings for video calls with relatives abroad, carrying
        it to her armchair; resident_2 retrieves it for work the next morning
      - folds any blanket she finds unfolded, including the one resident_5 is actively
        using
      - keeps a hand-sewing kit in a repurposed lunchbox beside her chair and mends
        the whole family's clothes unprompted
  - id: resident_2
    name: Yusuf Osman
    age: 39
    occupation: civil engineer (office, commutes)
    personality: punctual, ritual-bound at the edges of the day, absent in the middle
    habits:
      - 'runs an exact departure ritual: wallet, keys, phone from the hall shelf
        in the same order every workday'
      - retrieves the laptop from his mother's armchair each morning and docks it
        in the alcove desk
      - empties his pockets onto the hall shelf on arriving home — the shelf is
        sacred and everyone respects it
      - reads resident_5 a bedtime story, then shelves the book; he is the only
        person who returns the kids' books
      - does the late-evening kitchen shutdown, stacking the day's mugs and bowls
        after everyone else is done
  - id: resident_3
    name: Amina Osman
    age: 37
    occupation: pharmacist (part-time, alternating days)
    personality: diplomatic, systematic, referees two competing tidying regimes
    habits:
      - returns toys to the kids' room, discovering daily that Halima has re-routed
        them to the basket in her corner
      - packs both kids' backpacks and lunchboxes on the counter each school night
      - keeps her pharmacy lanyard and keys in her handbag, never the hall shelf
        — the one departure-system holdout
      - cooks alongside Halima most evenings, negotiating the kitchen's two-cook
        problem with practiced choreography
      - confiscates the tablet-like gaming controller situation by putting the controller
        on top of the fridge on school nights
      - leaves her reading glasses on whatever shelf she last stood near, and borrows
        Halima's windowsill pair in emergencies, which is forbidden
  - id: resident_4
    name: Layla Osman
    age: 9
    occupation: student (year 4)
    personality: reads everywhere, leaves bookmarks of objects behind her
    habits:
      - reads in every room; her books stratify on the couch, the stairs, and the
        kitchen table
      - does homework at the alcove desk and leaves her pens mixed into resident_2's
        work things
      - helps grandmother carry the tea things as an honored duty
      - hides from her brother by reading inside the blanket on Halima's armchair,
        with permission no one else has
      - loses her school jacket about weekly; it is usually at the bottom of the
        stairs
  - id: resident_5
    name: Omar Osman
    age: 5
    occupation: preschooler
    personality: fast-moving, deposits objects mid-flight, devoted to his grandmother
    habits:
      - carries toys in convoy from the kids' room to wherever grandmother is, then
        abandons them at her feet
      - drags the couch blanket to the floor for fort construction daily, to be
        re-folded by Halima
      - insists on carrying his own lunchbox to the door each morning and must be
        chased to retrieve it
      - hides the gaming controller under the couch to 'save his game' from his
        sister, then forgets where
      - delivers objects on request as the household's smallest courier — phones,
        pens, the remote — with about 60% accuracy
relationships: >-
  Yusuf and Amina, their children Layla and Omar, and Yusuf's mother Halima share
  the house; Halima moved in after her husband died and minds the kids after school.
  Chores split along generational lines — Halima and Amina share the cooking in
  a carefully choreographed two-cook kitchen, Yusuf owns the evening shutdown and
  the hall shelf, the kids ferry and scatter. The central friction is two competing
  tidying systems: toys flow to Halima's corner basket under her regime and back
  to the kids' room under Amina's, passing each other daily.
home_layout_notes: >-
  Four-bedroom house. Halima's corner of the living room — armchair, toy basket,
  sewing lunchbox, and the front windowsill with her glasses and medication — is
  a sovereign zone with its own rules. The hall shelf is Yusuf's ritual center;
  the alcove desk is shared between his laptop and Layla's homework; the kitchen
  belongs to Halima and Amina jointly. The kids' room is where toys officially live,
  per one of the two competing regimes.
