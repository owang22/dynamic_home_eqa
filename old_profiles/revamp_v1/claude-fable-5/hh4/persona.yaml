daily_life_summary: >-
  The house never fully sleeps and never fully wakes: Sofia leaves for placements
  while it is dark and Jonah is often still up from the night before, handing off
  the quiet kitchen like a shift change. Malik and TJ surface later and scatter
  to campus at irregular hours, with Malik's gym shifts bringing him back mid-afternoon
  to hold the couch. Evenings collect everyone but Jonah in the living room; he
  emerges after the others wind down, and his overnight snacking leaves the traces
  the morning house wakes up to. The whole unit genuinely convenes about once a
  week, when Malik batch-cooks and even Jonah appears with returned mugs.
quirks: >-
  For a supposedly chaotic student house they have unusually formal institutions
  — the house notebook works as a real governance system, and Jonah's worn headphones
  are a respected do-not-disturb protocol. The chaos is material, not social: nobody
  fights, they just quietly buy third and fourth copies of whatever keeps migrating.
