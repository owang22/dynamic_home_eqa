household_id: hh_004
household_type: college_roommates
residents:
  - id: resident_1
    name: Malik Johnson
    age: 21
    occupation: student (kinesiology, works part-time at the campus gym)
    personality: energetic, communal to a fault, treats ownership as a suggestion
    habits:
      - borrows whichever charger is nearest when his phone is low — usually resident_4's
        from the desk — and rarely returns it
      - leaves his gym water bottle to 'air out' on the kitchen counter, permanently
      - cooks big batches and leaves the pots, but always makes enough for resident_3
        after her clinical shifts
      - drops his backpack just inside the front door where everyone trips on it
      - commandeers the living-room TV and both gaming controllers when his friends
        come over, then leaves the controllers on the floor
      - hangs his jacket on the back of whichever chair is closest, claiming chairs
        one by one
  - id: resident_2
    name: Jonah Fielding
    age: 22
    occupation: student (music production), nocturnal
    personality: nocturnal, hoarder of dishes, gentle but oblivious
    habits:
      - collects mugs in his room during overnight editing sessions until the kitchen
        runs out and someone stages an extraction
      - wears his studio headphones in the common room as a do-not-disturb sign;
        the others read it fluently
      - eats cereal at odd hours and leaves the bowl on the coffee table for morning-Malik
        to find
      - borrows the shared umbrella for pre-dawn walks and leaves it drying in his
        room
      - returns resident_3's labeled mug to her shelf when he's caught with it —
        the one dish rule he respects
      - leaves sticky-note apologies in the house notebook after every mug extraction
  - id: resident_3
    name: Sofia Reyes-Muller
    age: 20
    occupation: student (nursing, early clinical placements)
    personality: organized under pressure, territorial about her things, house's
      reluctant adult
    habits:
      - labels her mug, her towel, and her shelf of food, and audits them
      - preps her clinical bag (backpack, lunchbox, water bottle) by the door the
        night before placements
      - sweeps the common room of everyone's mugs and bowls when she studies there,
        stacking them by the sink as a hint
      - goes to bed before everyone and leaves her noise-cancelling headphones charging
        in the same outlet nightly
      - confiscates the gaming controllers to the shelf when exams are close, with
        house-notebook notice
      - writes the chore rotation in the house notebook and is the only one who
        follows it
  - id: resident_4
    name: TJ Tran
    age: 21
    occupation: student (computer science)
    personality: lives at his desk, hates confrontation, quietly re-buys things
      instead of asking for them back
    habits:
      - owns the desk charger everyone (mostly resident_1) steals; has bought three,
        all now communal
      - leaves his laptop open and running on the kitchen table when he migrates
        there for a change of scene
      - marathon gaming sessions with resident_1; the controllers travel between
        his room and the living room
      - wears the same hoodie-jacket for days; it lives on his desk chair when not
        on him
      - orders takeout and leaves the plates in his room next to Jonah's mug collection
      - keeps his keys and wallet in a bowl on his desk because he lost them both
        in the couch once
relationships: >-
  Four students sharing a rented four-bedroom unit; Malik and TJ found the others
  through a housing board. The house runs on a chore rotation only Sofia follows,
  a shared notebook that functions as parliament, and an unspoken economy of borrowed
  chargers and mugs. The standing frictions are Jonah's mug hoard, Malik's charger
  piracy against TJ, and Sofia's labeled property versus everyone's communal instincts.
home_layout_notes: >-
  Four small bedrooms off a shared living room and kitchen. Each bedroom reflects
  its owner — Jonah's is a dish graveyard with studio gear, TJ's is desk-centric,
  Sofia's is locked-down tidy, Malik's is barely used because he lives in the common
  room. The living room couch, coffee table, and TV are the collision zone; the
  kitchen counter is contested territory with one labeled shelf.
