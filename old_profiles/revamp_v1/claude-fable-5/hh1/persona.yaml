household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Marisol Reyes
    age: 34
    occupation: hospital lab technician (permanent night shift)
    personality: methodical about anything that protects her sleep, careless about
      everything else; hates being startled awake; unwinds slowly
    habits:
      - exiles her phone to the kitchen charger before sleeping so nothing can buzz
        near the bed; retrieves it when she wakes
      - drops keys and wallet into the same bowl by the front door the moment she
        gets home from a shift
      - eats her post-shift meal on the couch and leaves the plate on the coffee
        table until she wakes up
      - carries one water bottle from room to room and abandons it wherever she
        last sat, then fills a fresh glass instead of looking for it
      - takes melatonin from the bottle on the nightstand as the last step of her
        wind-down, then reads until the book slides off the bed
      - wears headphones around her neck through the whole apartment and sets them
        down wherever her audiobook chapter happens to end
      - leaves her work jacket over the back of a kitchen chair instead of the closet
        hook she bought for it
relationships: >-
  Lives alone. She coordinates with no one, so the apartment splits into two zones
  she polices very differently — the sleep pipeline (bedroom, nightstand, blackout
  curtains, the kitchen charger) is kept strict and identical every single day,
  while the living room and kitchen are allowed to silt up with plates, mugs, and
  laundry between days off.
home_layout_notes: >-
  One-bedroom apartment. The bedroom is blacked out and nearly empty of loose objects
  by design; the couch and coffee table in the living room absorb almost everything
  she carries. The kitchen counter hosts the phone charger and a growing queue of
  unwashed mugs; the bowl by the door is the only tidy spot outside the bedroom.
