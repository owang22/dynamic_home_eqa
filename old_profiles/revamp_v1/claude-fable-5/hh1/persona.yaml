daily_life_summary: >-
  Marisol wakes in the late afternoon while her building is coming home from work,
  and her 'morning' routine — coffee, cereal, audiobook — happens as her neighbors
  eat dinner. She leaves for the lab when the street is going quiet and works through
  the night. She comes home around the time commuters are leaving, eats a slow meal
  on the couch, and then runs her strict wind-down: plate abandoned, phone exiled
  to the kitchen, melatonin, book, blackout. On her nights off the pattern smears
  — she stays on night hours anyway, cleaning or streaming while the rest of the
  world sleeps.
quirks: >-
  For a supposedly chaotic night-shifter she runs the most rigid bedtime ritual
  imaginable — it is the daytime living spaces, not the sleep schedule, that fall
  apart. Once a week, on her first night off, she resets the whole apartment in
  one manic sweep, so the home oscillates between spotless and cluttered instead
  of staying steadily messy.
