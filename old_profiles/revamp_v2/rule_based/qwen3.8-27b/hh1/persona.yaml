household_id: hh_001
household_type: working_professional_solo
residents:
  - id: resident_1
    name: Elias Thorne
    age: 34
    occupation: Architect
    personality: Meticulous, routine-oriented, solitary
    habits:
      - Places his laptop and charger in the exact same spot on the desk every morning
        before leaving
      - Leaves his work jacket on the hook by the door, never bringing it inside
      - Uses a single specific mug for coffee in the morning and discards it immediately
        after
      - Wipes down the kitchen counter and sanitizes the sink after every meal,
        even if it's just a sandwich
      - Keeps his notebook and pen in his breast pocket, rarely setting them down
      - Changes into lounge wear immediately upon returning home, leaving work clothes
        in the laundry basket
      - Uses the yoga mat for stretching in the living room, rolling it up and storing
        it vertically by the bookshelf
      - Charges his phone on the nightstand while reading in bed
relationships: >-
  Elias lives alone and manages all household tasks himself. There is no friction
  with other residents, but there is a tension between his desire for a pristine,
  quiet home and the intrusion of work materials that sometimes spill over into
  personal spaces. He is highly independent and does not rely on others for chores
  or social interaction within the home.
home_layout_notes: >-
  The apartment is a compact studio with a designated work zone at a desk near the
  window, a small kitchen, and a sleeping area separated by a low partition. Elias
  uses the desk exclusively for work, the kitchen for quick meals, and the living
  area for relaxation and stretching. The space is kept minimal to reduce cleaning
  time.
