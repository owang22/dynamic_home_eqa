daily_life_summary: >-
  Elias leaves the apartment early, ensuring all work items are packed and the home
  is spotless. He is absent for the majority of the day, returning only for dinner
  and relaxation. His evening is solitary, involving a quick meal, stretching, and
  reading in bed. There is no overlap with other residents, as he is the sole occupant.
quirks: >-
  He owns a high-end espresso machine but only uses it on weekends, relying on a
  portable coffee maker on weekdays. He keeps a small collection of architectural
  models on a shelf that he polishes weekly, treating them as decorative objects
  rather than work tools.
