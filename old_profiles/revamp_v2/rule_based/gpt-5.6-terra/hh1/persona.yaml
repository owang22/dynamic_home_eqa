household_id: hh_001
household_type: working_professional_solo
residents:
  - id: resident_1
    name: Leah Moreno
    age: 34
    occupation: municipal transit planner
    personality: methodical, lightly sentimental, and prone to setting items down
      in designated places
    habits:
      - places her phone, keys, and wallet together in a tray by the entry whenever
        she returns home
      - carries her work laptop and notebook in the same backpack and unpacks them
        onto the dining table to review plans
      - makes tea in one favorite mug and rinses it before leaving it upside down
        on the drying rack
      - packs leftovers into a lunchbox and takes a filled water bottle with her
        when she leaves for the office
      - hangs her jacket on the hallway hook rather than over a chair
      - reads library books on the sofa and returns them to the coffee table or
        bedroom nightstand
      - does a small load of laundry when the basket is full and folds clean towels
        immediately
      - uses her yoga mat in the living room, then rolls it and slides it beside
        the media console
relationships: >-
  Leah is the sole resident and makes decisions about all shared surfaces and chores
  herself. Her main point of friction is between her orderly entryway system and
  the occasional pile of work materials she leaves on the dining table after bringing
  projects home; she clears it before hosting anyone.
home_layout_notes: >-
  The apartment has a combined living and dining room, a compact galley kitchen,
  one bedroom, and a small entry hall. Leah uses the entry tray and wall hooks as
  her departure-and-return station, while the dining table doubles briefly as a
  project-review surface rather than a permanent workspace. The sofa, coffee table,
  and bedroom nightstand collect her reading items, and the kitchen counter is kept
  mostly open for meal preparation.
