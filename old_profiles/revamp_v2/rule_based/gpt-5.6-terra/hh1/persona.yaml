daily_life_summary: >-
  Leah leaves the apartment for her workplace on weekdays with her phone, keys,
  wallet, backpack, lunchbox, and water bottle. When she returns, she resets those
  portable items at the entry or kitchen, then prepares a simple meal and cleans
  the dishes before relaxing. She sometimes opens planning materials at the dining
  table, but most work remains in her backpack and travels back out with her. Her
  home is quiet and unused while she is away, with only the occasional laundry,
  exercise, and evening reading moving objects between rooms.
quirks: >-
  Leah has no dedicated home office despite her professional job; she deliberately
  keeps work portable and out of the bedroom. She labels reusable food containers
  and treats the entry tray as strictly as an office reception desk.
