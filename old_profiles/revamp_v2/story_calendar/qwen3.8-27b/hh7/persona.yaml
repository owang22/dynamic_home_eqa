  - id: yoga_mat_elara
    class: yoga_mat
    owner: resident_1
    role: For stretching and light exercise; unrolled on the living room floor during
      breaks. Rolled up and leaned against the wall or couch when not in use.
  - id: glasses_elara
    class: glasses
    owner: resident_1
    role: For reading and screen focus; worn while working. Left on the dining table,
      nightstand, or in the kitchen when not in use.
  - id: hairbrush_elara
    class: hairbrush
    owner: resident_1
    role: For grooming; kept in the bathroom. Occasionally left on the bathroom
