household_id: hh_007
household_type: single_adult_wfh
residents:
  - id: resident_1
    name: Elara
    age: 34
    occupation: freelance illustrator
    personality: disorganized, creative, homebody
    habits:
      - leaves sketchbooks and pencils scattered across the dining table and kitchen
        counter
      - works in long, uninterrupted bursts, often forgetting to hydrate or eat
        until very hungry
      - drags the laundry basket from the bedroom to the living room when it fills
        up, leaving it there for days
      - leaves the laptop charger plugged into the wall outlet even when the laptop
        is stored in the closet
      - uses the couch as a secondary desk, leaving coffee mugs and snacks on the
        cushions
      - rarely uses the oven, preferring microwave meals to keep the kitchen clean
      - keeps a specific 'thinking' spot on the balcony where she sits with a notebook
        for hours
relationships: >-
  Elara lives alone and has no one to share chores or spaces with, so the household
  dynamics are entirely internal. She manages her own environment, which leads to
  a cycle of creative clutter followed by occasional, frantic tidying sessions.
  The main friction is between her desire for a clean, inspiring workspace and her
  tendency to let creative tools sprawl into living areas.
home_layout_notes: >-
  Elara primarily uses the living room for work and relaxation, converting the sofa
  into a desk. The dining table is her main sketching surface. The bedroom is used
  strictly for sleep, though the laundry basket often migrates there. The kitchen
  is used minimally for microwave meals and coffee, keeping it relatively clear
  of clutter.
object_inventory:
  - id: laptop_elara
    class: laptop
    owner: resident_1
    role: Primary work tool for digital illustration; moves between dining table,
      couch, and sometimes the floor. Left plugged in on the dining table or in
      the closet when not in use.
  - id: phone_elara
    class: phone
    owner: resident_1
    role: Communication and reference; travels with Elara throughout the house,
      often left on the couch, dining table, or in her pocket. Taken out for occasional
      errands.
  - id: keys_elara
    class: keys
    owner: resident_1
    role: For apartment and car; kept in a small bowl on the entryway shelf. Taken
      when leaving for errands or walks.
  - id: wallet_elara
    class: wallet
    owner: resident_1
    role: Carries cash and cards; travels with Elara in her bag or pocket when she
      leaves the house. Left in the entryway drawer when home.
  - id: mug_elara
    class: mug
    owner: resident_1
    role: For coffee and tea; used constantly. Tends to be left on the dining table,
      couch arm, or in the sink. Rarely washed immediately.
  - id: bowl_1
    class: bowl
    owner: resident_1
    role: For snacks and microwave meals; used in the kitchen and often left on
