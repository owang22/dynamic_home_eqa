daily_life_summary: >-
  Elara’s day revolves around her creative workflow, starting with a slow morning
  where she might sit on the balcony thinking before moving to the dining table
  to sketch. She works in intense blocks, often moving to the couch for digital
  painting sessions on her laptop. Meals are quick and often eaten while working,
  leading to crumbs and mugs accumulating in the living room. Her evenings are spent
  winding down on the sofa, sometimes leaving her work setup untouched until the
  next morning.
quirks: >-
  Elara has a 'creative mess' philosophy where she believes clutter fuels inspiration,
  so she deliberately leaves some items out. She owns a high-end ergonomic chair
  but rarely uses it, preferring to sit on the floor or couch to feel more relaxed
  and less corporate.
