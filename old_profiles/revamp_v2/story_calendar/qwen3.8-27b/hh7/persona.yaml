  - id: water_bottle_elara
    class: water_bottle
    owner: resident_1
    role: Hydration; kept near the work area (dining table or couch). Refilled in
      the kitchen. Left where she last stopped working.
  - id: charger_elara
    class: charger
    owner: resident_1
    role: For laptop and phone; kept on the dining table or in the closet. The laptop
      charger is often left plugged into the wall. The phone charger is in her bag
      or on the nightstand.
  - id: blanket_elara
    class: blanket
    owner: resident_1
    role: For comfort on the couch; used during work breaks and evenings. Often
      draped over the couch or left on the floor.
  - id: laundry_basket_elara
    class: laundry_basket
    owner: resident_1
    role: For dirty clothes; moves from bedroom to living room. Left in the living
