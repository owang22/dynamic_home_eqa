daily_life_summary: >-
  Arthur starts his day in the study, working on puzzles and reading, while Martha
  tends to the balcony plants and prepares breakfast. They often have separate morning
  routines, meeting in the kitchen for coffee. Afternoons are spent in the living
  room, with Arthur reading and Martha watching TV or making calls. Evenings are
  quiet, with both retiring to the bedroom or study early. Their days overlap significantly
  in the shared spaces, but they respect each other's need for quiet time.
quirks: >-
  Arthur has a strict system for organizing his books, which Martha finds rigid.
  Martha keeps a 'memory box' in the living room that she adds to frequently, which
  Arthur occasionally moves to make space for the vacuum cleaner.
