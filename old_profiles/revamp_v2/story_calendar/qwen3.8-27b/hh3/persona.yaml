household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Arthur
    age: 72
    occupation: Retired Civil Engineer
    personality: meticulous, solitary, practical
    habits:
      - keeps his reading glasses and notebook on the armchair specifically for
        crossword puzzles
      - uses the watering can for the balcony plants and leaves it in the hallway
        closet
      - takes his keys and wallet only when going to the community center, otherwise
        they stay in the kitchen drawer
      - leaves his water bottle on the desk in the study when he goes to the kitchen
      - organizes his bookshelf by height and color, moving books frequently
      - keeps his phone in his pocket at all times, rarely charging it overnight
  - id: resident_2
    name: Martha
    age: 70
    occupation: Retired Elementary School Teacher
    personality: social, nostalgic, disorganized
    habits:
      - keeps her phone on the dining table to stay connected with grandchildren
      - leaves her reading glasses on the sofa cushion after watching TV
      - uses the shared laptop for video calls with family, leaving it on the dining
        table
      - moves her water bottle between the kitchen counter and the living room
      - keeps her wallet in the front pocket of her jacket, which hangs on the hook
        by the door
      - often leaves her notebook with sketches or lists on the kitchen island
relationships: >-
  Arthur and Martha have been married for 45 years and share a quiet, comfortable
  routine. Arthur handles the technical and structural aspects of the home (gardening,
  repairs), while Martha manages the social and domestic flow (guests, meals). A
  minor point of friction is Martha's tendency to leave her personal items (glasses,
  notebook) in common areas, which Arthur finds cluttering, though he rarely complains
  out loud. They share the kitchen and living room but have separate 'zones' in
  the bedroom for reading.
home_layout_notes: >-
  The home is a single-story house with a large open-plan kitchen/living area. The
  study is Arthur's domain, containing his desk and bookshelf. The living room is
  the social hub, with the sofa and TV. The bedroom is shared, with two nightstands.
  The balcony is used for gardening and morning coffee.
