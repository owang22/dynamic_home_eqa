household_id: hh_010
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Elara
    age: 34
    occupation: Emergency Room Nurse
    personality: exhausted, methodical, socially withdrawn during daylight
    habits:
      - draws blackout curtains completely shut immediately upon returning home
        from shift
      - eats standing at the kitchen counter while scrolling through news on a tablet
      - keeps a dedicated 'night shift' bag by the door that is packed the moment
        the shift ends
      - leaves the living room lamp on a low, warm setting to simulate sunset when
        waking up
      - uses a weighted blanket to help sleep through daylight noise
      - stores work shoes and scrubs in a specific corner of the bedroom to keep
        them separate from personal clothes
      - charges phone and tablet on the nightstand while sleeping
      - takes a short walk in the late evening to see the sun before the next shift
        begins
relationships: >-
  Elara lives alone, resulting in a household dynamic defined by solitude and routine.
  There is no shared burden of chores; everything is maintained strictly by her
  own methodical schedule to ensure a functional environment for her inverted sleep
  cycle. The primary friction is internal, balancing the need for rest during the
  day with the urge to maintain a sense of normalcy through evening walks and meal
  preparation.
home_layout_notes: >-
  The one-bedroom apartment is divided into a sleep zone (bedroom) and a living/work
  zone (studio area). The bedroom is treated as a sanctuary, kept dark and quiet,
  while the studio area serves as both living room and dining space. The kitchen
  is compact, used primarily for quick meals during the night hours. Elara tends
  to keep personal items in the bedroom and work-related items in the studio area
  to maintain a mental separation between home and work.
