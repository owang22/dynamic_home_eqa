daily_life_summary: >-
  Elara's day begins in the late afternoon when she wakes up, opens the curtains
  slightly to check the weather, and prepares for her evening shift. She spends
  the night hours at work, returning home in the early morning to immediately change,
  eat, and go back to sleep. Her active hours are concentrated in the evening and
  late night, where she relaxes, cooks, and prepares for the next shift. The household
  is quiet and still during the day, with Elara sleeping, and becomes active and
  lit during the night, creating a rhythm opposite to that of most neighbors.
quirks: >-
  Elara maintains a 'daylight journal' where she writes down things she wants to
  do during the day but can't, serving as a mental release. She has a specific playlist
  that she only listens to during her commute home, which helps signal the transition
  from work mode to rest mode.
