arc_events:
- note: R3 wakes up with a high fever; R4 drops work to stay home, R1 skips gym to help.
  day: 2
  patch:
    drop:
    - study
    - gym
    add:
    - cites: resident_4
      resident: resident_4
      activity: phone_time
      start: '10:00'
      end: '10:15'
      at: ELSEWHERE
      jitter: flexible
- note: R3 is still sick; R4 stays home again, R1 is wrecked and skips gym.
  day: 3
  patch:
    drop:
    - study
    - gym
- note: R3 feels better; family orders takeout instead of cooking.
  day: 4
  patch:
    drop:
    - meal_prep
- note: R1 stays out late studying for a deadline, wrecked the next morning.
  day: 11
  patch:
    drop:
    - tidy_up
    add:
    - cites: resident_1
      resident: resident_1
      activity: study
      start: '22:30'
      end: 02:00
      at: desk_b1
      jitter: flexible
