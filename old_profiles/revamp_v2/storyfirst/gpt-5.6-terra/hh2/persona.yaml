household_id: hh_002
household_type: working_couple_no_children
residents:
  - id: resident_1
    name: Maya Chen
    age: 34
    occupation: museum collections coordinator
    personality: methodical, sentimental, tidy
    habits:
      - Packs her phone, keys, wallet, water bottle, and lunchbox into her backpack
        before leaving for work.
      - Drinks tea from the same mug and rinses it immediately after use, leaving
        it on the drying rack.
      - Keeps a paperback book on her bedside table and returns it there after reading.
      - Writes household errands in a notebook kept on the kitchen counter.
      - Brings dirty clothes to the laundry basket rather than leaving them on the
        bedroom chair.
      - Waters the apartment plants with the watering can and returns it beneath
        the kitchen sink.
      - Places her jacket on its hook by the entry rather than over furniture.
  - id: resident_2
    name: Elliot Brooks
    age: 36
    occupation: civil engineer
    personality: practical, distractible, good-natured
    habits:
      - Carries his phone, keys, wallet, and laptop backpack with him for his commute.
      - Leaves his coffee mug near the sofa or on the desk until Maya gathers it
        with the dishes.
      - Uses headphones at the dining table while reviewing plans and leaves them
        coiled beside his laptop.
      - Drops his jacket over the back of a dining chair before eventually moving
        it to the entry hook.
      - Makes simple one-pan dinners and leaves the pan soaking in the sink for
        later washing.
      - Uses the shared remote from the sofa and often misplaces it under the blanket
        cushions.
      - Packs leftovers in his lunchbox and leaves it drying beside the sink after
        work.
relationships: >-
  Maya and Elliot have lived together for five years and coordinate around two weekday
  commutes, meals, and a modest apartment. Maya handles plant care, lists, and most
  immediate dishwashing, while Elliot usually cooks and takes responsibility for
  vacuuming and laundry loads. Their recurring friction is Elliot's tendency to
  leave mugs, headphones, and outerwear in shared spaces, though he reliably looks
  for Maya's misplaced notebook when she needs it.
home_layout_notes: >-
  Their one-bedroom apartment has a combined kitchen and living room, with a small
  dining table that doubles as Elliot's occasional paperwork surface. Maya uses
  the bedroom nightstand and a narrow entry shelf as orderly personal zones, while
  Elliot's laptop and headphones frequently occupy the dining table or sofa arm.
  The kitchen counter, sink, entry hooks, and shared sofa are the main object-transfer
  areas.
