daily_life_summary: >-
  On weekdays, both residents leave the apartment for separate workplaces carrying
  their personal essentials, and the home is largely quiet while they are away.
  Maya usually returns with her backpack and lunchbox organized, while Elliot tends
  to set down his work things wherever he first stops. They cross paths in the kitchen
  while preparing or cleaning up meals and settle in the living room with the remote,
  books, or headphones. On days off, Elliot tackles a larger cleaning task while
  Maya tends the plants and resets the kitchen surfaces.
quirks: >-
  They deliberately keep most decor and possessions minimal because Maya works around
  fragile collections, but Elliot has a surprisingly enthusiastic one-pan cooking
  habit. Neither works from home regularly, so the dining table is cleared for meals
  rather than maintained as a permanent office.
