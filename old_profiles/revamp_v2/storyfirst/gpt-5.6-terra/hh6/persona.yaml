daily_life_summary: >-
  Dana's work and the teenagers' school days create a household that starts and
  ends around the kitchen counter, even when they do not spend much uninterrupted
  time together. Maya often occupies the dining table with schoolwork while Eli
  moves between the front door, kitchen, and living room after activities. Dana
  restores shared surfaces and dishware when she is home, then the three overlap
  for meals or brief check-ins before returning to separate rooms. On busier days,
  messages, packed lunches, and the shared charger coordinate them more than long
  conversations.
quirks: >-
  Dana does not ban clutter; she keeps designated "landing zones" and expects everyone
  to clear them before meals. Maya is the teenager most likely to organize a sibling's
  school materials, while Eli is surprisingly reliable about taking out rubbish.
