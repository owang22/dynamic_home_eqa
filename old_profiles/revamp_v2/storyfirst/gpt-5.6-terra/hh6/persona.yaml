household_id: hh_006
household_type: single_parent_teens
residents:
  - id: resident_1
    name: Dana Morales
    age: 43
    occupation: city bus dispatcher
    personality: practical, orderly, quietly protective
    habits:
      - sets her phone, keys, and wallet together in a bowl by the entry after returning
        home
      - packs leftovers into a lunchbox and leaves it on the middle refrigerator
        shelf
      - clears plates from the living room and washes the most urgent dishes before
        relaxing
      - keeps a running grocery list in a notebook on the kitchen counter
      - folds clean towels but leaves each teenager to carry theirs back to their
        room
      - uses the living-room blanket while reading and folds it over the sofa arm
        afterward
      - checks that the shared charger is back near the kitchen outlet when someone
        has borrowed it
  - id: resident_2
    name: Maya Morales
    age: 17
    occupation: student
    personality: creative, sociable, somewhat scattered
    habits:
      - drops her backpack beside the dining chair after school and sorts it only
        when she needs an assignment
      - carries her phone and keys whenever she goes out, but often leaves her wallet
        in a jacket pocket
      - does homework on her laptop at the dining table and leaves pens and notebooks
        spread there
      - makes tea in her own mug and leaves it on the windowsill until Dana asks
        for dishes
      - borrows the shared charger and takes it to her bedroom during long calls
        with friends
      - uses headphones in her room and coils them around the bedpost afterward
      - puts damp hairbrushes and makeup items on the bathroom counter rather than
        in a drawer
  - id: resident_3
    name: Eli Morales
    age: 14
    occupation: student
    personality: energetic, absent-minded, competitive
    habits:
      - leaves his backpack and water bottle near the front door after sports practice
      - takes his phone and keys whenever he leaves, though he sometimes forgets
        the phone charging in the kitchen
      - eats cereal from whichever bowl is clean and leaves it in the sink with
        the spoon inside
      - plays games in the living room and leaves the controller between sofa cushions
      - hangs his jacket over the banister instead of using the entry hooks
      - uses the shared laundry basket only after Dana reminds him to collect clothes
        from his floor
      - packs his lunchbox the night before school, then leaves it on the kitchen
        counter for Dana to notice
relationships: >-
  Dana is Maya and Eli's mother, and she runs the household with a mix of reminders
  and clearly assigned responsibilities. Maya handles most bathroom-counter cleanup
  and helps Eli with schoolwork, while Eli takes out rubbish and brings in groceries
  when asked. The recurring friction is the dining table: Maya's homework materials
  compete with Eli's snack dishes and Dana's planning notebook, so Dana regularly
  resets it for meals.
home_layout_notes: >-
  The home has three bedrooms, with Dana using the smaller back bedroom and each
  teenager having a separate room. The kitchen-dining area is the main shared command
  center, collecting school bags, lunch items, paperwork, and dishes; the living
  room is Eli's gaming space and Dana's reading space. Maya uses the bathroom counter
  and her bedroom desk most, while the entryway becomes a temporary landing zone
  for jackets, shoes, keys, and sports gear.
