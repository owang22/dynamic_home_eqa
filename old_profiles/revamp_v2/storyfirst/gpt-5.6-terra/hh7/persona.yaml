household_id: hh_007
household_type: single_adult_wfh
residents:
  - id: resident_1
    name: Leena Park
    age: 34
    occupation: freelance ceramic illustrator
    personality: methodical, mildly clutter-prone during projects, protective of
      quiet
    habits:
      - Carries her laptop between the desk and kitchen table depending on whether
        she is sketching or handling client messages.
      - Keeps a filled water bottle beside her workstation and brings it to the
        kitchen to refill rather than using disposable cups.
      - Makes tea in the same mug and leaves it on a cork coaster beside the laptop
        until she finishes a work block.
      - Uses a notebook for packing lists and design notes, leaving it open on the
        desk or kitchen table.
      - Takes her phone, keys, wallet, and backpack whenever she walks to the post
        office, supply shop, or a nearby café.
      - Leaves used bowls and plates stacked neatly at one side of the sink until
        she pauses work to wash them together.
      - Spreads a yoga mat in the living room for short stretches, then rolls it
        beside the bookcase.
      - Waters her windowsill plants with a watering can and returns it to the kitchen
        cabinet after wiping up drips.
relationships: >-
  Leena lives alone and makes all decisions about the home, but she informally shares
  deliveries and occasional borrowed tools with a neighbor outside the household.
  She keeps the kitchen and bathroom orderly for client video calls, while her desk
  area becomes crowded with notebooks, headphones, chargers, and half-finished reading.
  Her main friction is self-imposed: she postpones washing dishes when absorbed
  in a project, then resets the space before beginning another task.
home_layout_notes: >-
  The main room has a desk facing a window, with Leena's laptop, notebook, headphones,
  and water bottle concentrated there; the nearby sofa is used for reading and stretching.
  The kitchen table doubles as an overflow work surface and eating spot, so mugs,
  dishes, and her tablet circulate between it and the sink. Her bedroom is comparatively
  spare, with a blanket, book, glasses, and phone usually confined to the nightstand
  and bed.
