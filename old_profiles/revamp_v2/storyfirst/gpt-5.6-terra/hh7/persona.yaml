daily_life_summary: >-
  Leena spends most workdays at home, moving primarily between her desk, the kitchen,
  and the living-room stretch space. She leaves the apartment for errands, mailing
  artwork, groceries, or an occasional café change of scenery, taking her essentials
  in a backpack. Because she lives alone, objects tend to remain where she last
  used them until she deliberately performs a reset, usually gathering dishes, cables,
  and work notes at once. Evenings are quieter and center on reading, a streamed
  program, or preparing a simple meal.
quirks: >-
  Although she works from home, Leena treats the kitchen table as a temporary second
  studio and clears it completely after each project. She owns few decorative or
  entertainment items, preferring a small rotation of practical objects she can
  keep track of.
