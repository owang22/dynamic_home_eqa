daily_life_summary: >-
  Both residents are home for much of the day, working separately but crossing paths
  repeatedly in the kitchen for drinks and meals. Nadia generally remains at her
  bedroom desk, while Eli shifts between the dining table and living-room sofa depending
  on the task. When either leaves for an errand or recording, they take their personal
  phone and keys with them, and the remaining partner gets a quieter apartment.
  Shared evening downtime tends to collect dishes, blankets, remotes, and Eli's
  controller in the living room until Nadia begins resetting the space.
quirks: >-
  They avoid working side by side despite both being remote workers; separate zones
  help them feel less like coworkers. Eli's audio-editing gear is limited to ordinary
  laptop and headphones, so the home feels more like a lived-in apartment than a
  formal studio.
