household_id: hh_008
household_type: remote_worker_couple
residents:
  - id: resident_1
    name: Nadia Ortiz
    age: 34
    occupation: remote payroll specialist
    personality: methodical, tidy, quietly territorial about her workspace
    habits:
      - Starts work with her laptop, notebook, and water bottle arranged in the
        same order on the bedroom desk.
      - Carries her phone and keys in her jacket pocket whenever she leaves the
        apartment for errands.
      - Uses the same ceramic mug for tea and rinses it immediately, leaving it
        upside down on the drying rack.
      - Keeps her charger plugged beside the desk and coils its cable after using
        it away from the desk.
      - Moves completed laundry from the shared basket promptly but leaves folded
        clothes on the armchair until she puts them away.
      - Uses a yoga mat in the living room and rolls it behind the sofa afterward.
      - Collects stray plates and bowls from shared surfaces before starting the
        dishwasher.
      - Places her glasses on the nightstand before bed and searches for them there
        first.
  - id: resident_2
    name: Eli Mercer
    age: 36
    occupation: remote podcast editor
    personality: creative, distractible, comfort-oriented
    habits:
      - Edits audio with headphones and his laptop at the dining table, then often
        leaves both there between sessions.
      - Carries his phone, wallet, and keys in his backpack whenever he goes out
        to record or shop.
      - Moves his water bottle from the kitchen counter to the sofa and forgets
        it there.
      - Uses a notebook for episode ideas, leaving it open beside the remote or
        under his laptop.
      - Makes coffee in whichever mug is clean and leaves the mug near the sink
        until Nadia gathers it.
      - Takes the shared blanket to the sofa while reviewing recordings and leaves
        it rumpled there.
      - Borrows Nadia's charger when his is buried in his backpack, then needs reminding
        to return it.
      - Uses the gaming controller after work and leaves it on the coffee table
        rather than in the media drawer.
relationships: >-
  Nadia and Eli are long-term partners who both work from home but need different
  levels of order to concentrate. Nadia manages most dishwashing and resets the
  kitchen, while Eli handles vacuuming and carries the laundry basket between rooms.
  Their main friction is Eli's expanding dining-table setup and borrowed charger,
  though they coordinate by treating the bedroom desk as Nadia's uninterrupted work
  zone and the dining table as Eli's flexible one.
home_layout_notes: >-
  The apartment has one bedroom, a living room, a combined kitchen-dining area,
  and a small entry hall. Nadia uses a compact desk in the bedroom, while Eli's
  laptop, headphones, notebook, and water bottle spread across the dining table
  and sometimes the sofa. The kitchen counter, sink, drying rack, coffee table,
  and entry console are the main shared object-drop surfaces.
