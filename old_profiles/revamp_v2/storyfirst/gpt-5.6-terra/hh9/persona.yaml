daily_life_summary: >-
  The roommates often leave for classes, campus jobs, practices, and library work
  independently, carrying their personal essentials with them. Maya and Priya are
  most likely to cross paths over kitchen cleanup or work at the dining table, while
  Jordan and Eli draw people into the living room when they are back. Meals sometimes
  become informal shared cooking, though everyone also eats separately around coursework
  and activities. By the end of a typical day, dishes and misplaced electronics
  collect in common areas until Maya or Priya resets them.
quirks: >-
  They treat the dining table as a reservable quiet-study zone despite living in
  a generally social apartment. Priya's careful kitchen routine means the most reliable
  cook is also the roommate least interested in hosting.
