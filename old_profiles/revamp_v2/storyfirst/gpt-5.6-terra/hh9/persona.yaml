household_id: hh_009
household_type: college_roommates
residents:
  - id: resident_1
    name: Maya Ortiz
    age: 20
    occupation: student
    personality: organized, conscientious, mildly territorial about her study materials
    habits:
      - Carries her phone, keys, wallet, and backpack to campus whenever she leaves
        the apartment.
      - Studies at the dining table and stacks her laptop, notebook, pens, and water
        bottle neatly at one end afterward.
      - Makes tea in her own mug and rinses it immediately, leaving it upside down
        on the drying rack.
      - Labels leftovers mentally by using the same bowl and tends to return it
        to the cupboard after washing.
      - Keeps her charger beside her bed and retrieves it from the dining table
        when someone has borrowed it.
      - Uses the shared vacuum cleaner after friends visit, then returns it to the
        hall closet.
      - Brings abandoned shared plates from the living room to the sink when she
        notices them.
  - id: resident_2
    name: Jordan Lee
    age: 21
    occupation: student
    personality: sociable, distractible, optimistic
    habits:
      - Takes their phone, keys, wallet, jacket, and backpack out for classes or
        club meetings, often dropping the keys into the entry bowl on return.
      - Uses the living-room remote and gaming controller with visitors, leaving
        both on the couch cushions or coffee table.
      - Eats quick meals from a bowl while watching shows and may leave the bowl
        in the sink until the next cleanup.
      - Keeps headphones and a charger in their backpack, though the charger sometimes
        migrates to the couch outlet.
      - Lends their laptop for group projects but asks that it be returned to their
        bedroom desk.
      - Leaves a water bottle by the front door before heading out for practice
        or meetings.
      - Moves the shared blanket between the couch and their bedroom after movie
        nights.
  - id: resident_3
    name: Priya Nanduri
    age: 19
    occupation: student
    personality: quiet, meticulous, resourceful
    habits:
      - Carries her phone, keys, wallet, glasses, and backpack whenever she goes
        to class or the library.
      - Works at a small desk in her bedroom, keeping her laptop, notebook, pens,
        and charger aligned there.
      - Prepares simple meals in the shared pot and pan, washes them promptly, and
        puts them on the drying rack.
      - Uses her lunchbox for campus food and leaves it open on the kitchen counter
        to dry after washing it.
      - Fills her water bottle before leaving and sets it beside her desk when she
        returns.
      - Keeps a paperback book on her nightstand and reads before sleeping.
      - Folds clean towels from the shared laundry basket and places each roommate's
        towel outside their bedroom door.
  - id: resident_4
    name: Eli Brooks
    age: 22
    occupation: student
    personality: easygoing, athletic, forgetful
    habits:
      - Takes his phone, keys, wallet, backpack, and water bottle whenever he leaves
        for class, work shifts, or the gym.
      - Frequently leaves his jacket over a dining chair and his headphones on the
        kitchen counter.
      - Uses the shared laundry basket but delays folding his clothes, so his clean
        towel sometimes stays in his room on a chair.
      - Makes large one-pan meals in the shared pan and leaves the pan soaking in
        the sink until a roommate reminds him.
      - Uses a yoga mat for stretching in the living room, then rolls it loosely
        beside the couch.
      - Keeps a medication bottle in his bathroom caddy area and returns it there
        after use.
      - Looks for the remote under couch cushions after he has hosted a game or
        sports stream.
relationships: >-
  Maya, Jordan, Priya, and Eli are friends from the same university who signed a
  four-bedroom apartment lease after meeting through campus housing. Maya coordinates
  the shared shopping list and Priya handles most prompt washing-up, while Jordan
  usually manages social clutter and Eli takes out trash when reminded. Their main
  friction is Eli's soaking cookware and Jordan's couch clutter; Maya's insistence
  on a clear dining table keeps group study sessions workable.
home_layout_notes: >-
  Each resident has a small separate bedroom: Maya and Priya use theirs as quiet
  study spaces, Jordan's is more often used for friends and borrowed equipment,
  and Eli's holds his laundry and sports gear. The dining table is Maya's preferred
  work surface but becomes a shared project table, while the living room is Jordan
  and Eli's social space. The compact kitchen has a crowded drying rack and a hall
  closet where the shared vacuum cleaner and laundry basket are kept.
