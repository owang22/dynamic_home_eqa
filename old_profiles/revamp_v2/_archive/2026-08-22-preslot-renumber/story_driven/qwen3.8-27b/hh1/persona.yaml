household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Silas Vane
    age: 34
    occupation: ICU Nurse
    personality: hyper-vigilant, socially isolated, ritualistic
    habits:
      - Leaves the hallway light on all night to avoid turning on overhead lights,
        which disrupts his sleep cycle
      - Keeps a dedicated 'night zone' on the kitchen counter where he places his
        keys and wallet immediately upon entering
      - Wears headphones in the living room even when alone to block out ambient
        noise
      - Places his work badge and pen in a specific shallow drawer before bed to
        mentally 'close' the shift
      - Avoids using the bathroom mirror in the early morning hours, preferring
        to rely on touch for grooming
relationships: >-
  Silas lives alone and has no household to coordinate with, so all friction is
  internal, stemming from the clash between his nocturnal work rhythm and the diurnal
  design of his apartment. He divides his space into a 'work' sector (kitchen, entryway)
  and a 'rest' sector (bedroom), strictly maintaining the boundary to prevent his
  sleep from being disturbed by the anticipation of work. The primary point of tension
  is the accumulation of visual clutter in the 'work' sector during his waking hours,
  which he must aggressively clear before entering the 'rest' sector to ensure he
  can sleep.
home_layout_notes: >-
  The apartment is a one-bedroom unit where the living room is rarely used for leisure
  and serves mostly as a transit space. The kitchen is the primary hub of activity,
  featuring a large counter space where Silas stages his items. The bedroom is kept
  strictly for sleep, with minimal objects to reduce cognitive load. The entryway
  is critical for the ritual of arriving home.
object_inventory:
  - id: keys_1
    class: keys
    owner: resident_1
    role: Silas’s apartment keys, which he places on the kitchen counter immediately
      upon entering to signal the end of his shift.
  - id: wallet_1
    class: wallet
    owner: resident_1
    role: Contains his ID and transit card, kept in the same 'night zone' as his
      keys to avoid searching for it in the dark.
  - id: headphones_1
    class: headphones
    owner: resident_1
    role: Used to create a sound barrier in the living room and kitchen, allowing
      Silas to ignore the ambient sounds of the building and focus on his mental
      transition.
  - id: pen_1
    class: pen
    owner: resident_1
    role: A specific pen used for signing off on work charts, which Silas keeps
      in a drawer to symbolically 'leave work at work' and not carry the stress
      home.
  - id: mug_1
    class: mug
    owner: resident_1
    role: Used for drinking water or decaf tea during his waking hours; it stays
      on the kitchen counter as a constant presence in his 'work zone'.
  - id: water_bottle_1
    class: water_bottle
    owner: resident_1
    role: A large bottle he refills before bed and keeps on the nightstand to avoid
      having to get up and navigate the dark apartment at night.
  - id: jacket_1
    class: jacket
    owner: resident_1
    role: His work coat, which he hangs on a specific hook in the entryway; he avoids
      touching it again until his next shift to maintain the separation between
      work and home.
  - id: phone_1
    class: phone
    owner: resident_1
    role: Silas’s personal phone, which is set to 'Do Not Disturb' for most of the
      day and kept on the kitchen counter, only picked up during his short waking
      windows.
daily_life_summary: >-
  Silas’s day is inverted; he arrives home after the rest of the city has gone to
  sleep, performs a strict de-escalation routine in the kitchen, and then retreats
  to the bedroom for a long sleep block. His waking hours coincide with the quietest
  parts of the day, meaning he rarely interacts with neighbors or services. He crosses
  paths with the outside world only during his commute, which happens in the early
  morning and late evening. The rest of his time is spent in a low-stimulation state,
  moving slowly through the apartment to conserve energy.
quirks: >-
  Silas treats his apartment like a sterile environment, refusing to let any personal
  'warmth' objects (like family photos or decorative knick-knacks) enter his living
  space, viewing them as clutter that distracts from his need for rest. He also
  maintains a strict 'no electronics in the bedroom' rule, which means he has no
  way to check the time or communicate with the outside world once he is in bed,
  leading to a profound sense of isolation.
