household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Arthur
    age: 72
    occupation: retired
    personality: meticulous, stubborn, nostalgic
    habits:
      - Keeps a dedicated 'lost and found' drawer in the kitchen for any stray button
        or paperclip found during the week.
      - Leaves his reading glasses on the arm of the recliner chair even when he
        moves to the kitchen for tea.
      - Wipes down the hardwood floors with a microfiber cloth every single morning
        before breakfast.
      - Borrows Eleanor's garden trowel for potting plants but always leaves it
        in the mud pot on the porch instead of returning it to the shed.
      - Stores his hearing aid batteries in a specific small tin box that he keeps
        on the nightstand.
      - Leaves his reading glasses on the arm of the recliner chair even when he
        moves to the kitchen for tea.
  - id: resident_2
    name: Eleanor
    age: 70
    occupation: retired
    personality: spontaneous, organized, social
    habits:
      - Sets out two mugs for coffee every morning, even if Arthur is still in the
        shower.
      - Leaves her gardening gloves on the back of the porch chair after working
        in the yard.
      - Keeps a stack of puzzle pieces in the living room coffee table, often scattering
        them across the rug.
      - Borrows Arthur's step ladder to reach the top shelves of the pantry and
        usually forgets to put it back.
      - Stores her medication bottles in a clear organizer on the bathroom counter
        that she reorganizes every Sunday.
      - Leaves her gardening gloves on the back of the porch chair after working
        in the yard.
relationships: >-
  Arthur and Eleanor have been married for 45 years and share a deep routine built
  on mutual reliance. Arthur handles the interior maintenance and cleaning, while
  Eleanor manages the garden and social engagements. The main point of friction
  is the placement of the step ladder and garden tools, as Arthur insists on a tidy
  entryway while Eleanor prioritizes ease of access for her daily gardening.
home_layout_notes: >-
  The living room is the central shared space, featuring Arthur's recliner and the
  coffee table where Eleanor works on puzzles. The kitchen is Arthur's domain for
  cleaning, while the porch and garden shed are Eleanor's primary outdoor workspaces.
  The bedroom is quiet and strictly for rest, with minimal clutter.
