household_id: hh_008
household_type: working_couple_no_children
residents:
  - id: resident_1
    name: Julian
    age: 34
    occupation: Data Analyst
    personality: obsessive organizer, forgetful about small items, detail-oriented
    habits:
      - keeps his laptop on the dining table for 30 minutes after work before moving
        it to the office
      - loses his house keys in the hallway shoe rack daily, forcing resident_2
        to retrieve them
      - leaves his reading glasses on the kitchen counter after breakfast, where
        resident_2 usually finds them
      - stores his water bottle in the fridge door, but forgets it there for days
        until resident_1 notices the condensation
      - borrows resident_2's notebook for quick calculations and rarely returns
        it to the bookshelf
      - clears the coffee maker drip tray every morning without fail
      - leaves his work jacket on the back of the dining chair until resident_2
        hangs it up
  - id: resident_2
    name: Elena
    age: 32
    occupation: Graphic Designer
    personality: spontaneous, clutter-averse, creative
    habits:
      - leaves her sketchbook open on the coffee table with a pen resting on top
      - hangs her coat on the doorknob instead of the hook, creating a visual trip
        hazard
      - moves her phone from the kitchen island to the living room couch while waiting
        for coffee
      - keeps her headphones around her neck all day, often forgetting to put them
        in the charging dock
      - uses resident_1's mug for tea, causing a recurring dispute over 'my mug'
        vs 'your mug'
      - leaves her keys in the front pocket of her jeans until she sits down, then
        loses them in the couch cushions
      - puts her notebook in her bag without checking if she has the pen inside
relationships: >-
  Julian and Elena are married and share a routine of early mornings and late evenings,
  often missing each other for dinner. Julian handles the mechanical chores like
  dishes and laundry, while Elena manages the aesthetic aspects like tidying and
  decorating, though they frequently clash over where items are 'supposed' to go.
  The main friction point is Julian's tendency to leave technical items in the kitchen
  while Elena is trying to keep that space clear for her creative work.
home_layout_notes: >-
  The kitchen is the primary shared space, with the island serving as a drop zone
  for both their work items and personal belongings. The living room is Elena's
  domain for sketching, while the dining table is Julian's temporary office extension.
  The hallway is a bottleneck for keys and jackets, leading to daily minor conflicts.
