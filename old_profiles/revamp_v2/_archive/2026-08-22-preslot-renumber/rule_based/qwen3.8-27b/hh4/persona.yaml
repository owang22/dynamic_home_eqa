daily_life_summary: >-
  The day starts with a rush to the bathroom, where Sam often lingers while Leo
  hurries. During the day, they are mostly at different lectures, but they converge
  in the apartment in the evenings. Maya and Leo often study together at the shared
  table, while Sam relaxes on the sofa and Eli works in his room. They often miss
  each other for meals, leading to a chaotic dinner schedule where they eat whenever
  they are all home.
quirks: >-
  Despite being college roommates, they have a strict 'no sharing food' rule to
  avoid arguments, but they constantly share drinks and mugs. Eli has a hidden talent
  for organizing the shared spaces, which the others reluctantly rely on.
