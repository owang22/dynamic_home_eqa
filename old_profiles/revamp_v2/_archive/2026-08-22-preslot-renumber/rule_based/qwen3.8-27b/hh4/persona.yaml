household_id: hh_004
household_type: college_roommates
residents:
  - id: resident_1
    name: Leo
    age: 20
    occupation: student
    personality: anxious, detail-oriented, chaotic
    habits:
      - leaves highlighters scattered across the desk after late-night study sessions
      - borrows resident_2's hoodie when he feels cold and forgets to return it
        for days
      - keeps his laptop charger coiled tightly on the desk to avoid tripping
      - moves his water bottle from the desk to the nightstand when he starts reading
      - loses his keys in the bottom of his backpack constantly
      - clears his own plate but leaves resident_3's empty mug on the counter out
        of politeness
  - id: resident_2
    name: Maya
    age: 19
    occupation: student
    personality: social, energetic, messy
    habits:
      - drinks from resident_1's mug when she is too lazy to wash her own
      - leaves her phone charging on the shared living room table overnight
      - hangs her jacket on the back of her chair rather than in the closet
      - uses the shared notebook for class notes and then forgets to put it back
        on the shelf
      - moves the remote to the sofa cushion when watching movies with others
      - leaves her water bottle in the fridge and drinks from it throughout the
        day
  - id: resident_3
    name: Sam
    age: 21
    occupation: student
    personality: lazy, humorous, disorganized
    habits:
      - sleeps in his clothes and leaves his backpack on the floor by the door
      - borrows resident_4's headphones for music and returns them with the volume
        maxed out
      - eats snacks from the shared bowl and leaves crumbs on the table
      - puts his keys in his pocket and forgets where he put them
      - moves his laptop to the bed when he is tired and leaves it there for hours
      - uses the shared towel to dry his hands and leaves it on the sink edge
  - id: resident_4
    name: Eli
    age: 20
    occupation: student
    personality: calm, tidy, introverted
    habits:
      - washes his own dishes immediately after eating
      - organizes the shared bookshelf every weekend
      - keeps his phone in his pocket and never leaves it on the table
      - moves his water bottle to his desk only when he is working
      - returns borrowed items like resident_2's hoodie promptly
      - clears the shared table after group study sessions
relationships: >-
  Leo and Maya are close friends who often study together, while Sam and Eli are
  newer to the group and still figuring out the social dynamics. Leo and Sam constantly
  clash over cleanliness, with Leo complaining about Sam's mess and Sam mocking
  Leo's rigidity. Eli acts as a mediator, often cleaning up after others without
  complaint, while Maya tries to keep the mood light and often ignores the tension.
home_layout_notes: >-
  The apartment has a shared living room with a sofa and a large table used for
  eating and studying. Each resident has a small bedroom with a desk and bed. The
  kitchen is small and shared, with a limited number of mugs and plates. The bathroom
  is also shared and often gets crowded in the mornings.
