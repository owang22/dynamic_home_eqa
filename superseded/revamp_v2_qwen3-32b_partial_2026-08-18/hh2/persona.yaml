daily_life_summary: >-
  Mara and Leo start the day by getting the kids up, dressed, and fed. Nina often
  eats breakfast in the bathtub while Tomas spills juice on the floor. Leo leaves
  for work while Mara gets the kids ready for preschool. At midday, Leo returns
  briefly to pick up the kids and take them to the park or a nearby playground.
  In the evenings, the family gathers for dinner and storytime, with resident_3
  and resident_4 often falling asleep mid-story. On weekends, Leo spends time in
  the garage, while Mara organizes the house and prepares for the week ahead.
quirks: >-
  The family uses the same plate for all meals, which is unusual for a household
  with young children. They also keep a small chalkboard in the hallway for the
  kids to write messages to each other, like 'Tomas, take your shoes off!' or 'Nina,
  share your rocks.'
