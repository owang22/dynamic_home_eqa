household_id: hh_002
household_type: family_young_children
residents:
  - id: resident_1
    name: Mara
    age: 34
    occupation: part-time preschool teacher
    personality: patient, organized, easily distracted
    habits:
      - keeps a color-coded schedule posted on the fridge
      - reads bedtime stories in the same armchair every night
      - leaves her phone on the kitchen counter to charge overnight
      - often grabs resident_2's lunchbox when in a rush
      - organizes the kids' toys by color, but they always end up mixed again
      - encourages the kids to use the potty but still keeps a stash of wipes in
        the hallway closet
  - id: resident_2
    name: Leo
    age: 36
    occupation: delivery driver
    personality: hands-on, forgetful, cheerful
    habits:
      - always leaves his keys on the back porch
      - brings home a different snack for the kids each day from his routes
      - works on his car in the garage on weekends
      - uses the same plate for breakfast, lunch, and dinner
      - tends to forget to return library books
      - helps the kids build blanket forts with resident_3 and resident_4 in the
        living room
  - id: resident_3
    name: Nina
    age: 5
    occupation: student
    personality: curious, energetic, messy
    habits:
      - draws on the walls with crayons and expects resident_1 to clean them
      - keeps a collection of rocks in the sink
      - refuses to share her blanket with anyone
      - eats snacks in the bathtub
      - dresses in layers even in summer
      - puts her shoes on backwards and expects resident_2 to fix them
  - id: resident_4
    name: Tomas
    age: 2
    occupation: student
    personality: chatty, fearless, affectionate
    habits:
      - wears resident_1's glasses for fun
      - spills juice on the floor at least once a day
      - refuses to sit still during mealtime
      - sleeps in resident_2's bed on weekend mornings
      - carries a stuffed animal everywhere
      - has a habit of throwing socks into the air and laughing
relationships: >-
  Mara and Leo are the parents, raising their two young children together. Mara
  is often in charge of bedtime routines and school coordination, while Leo handles
  most of the household maintenance and transportation. They sometimes clash over
  how much screen time the kids should have, and who is responsible for cleaning
  up after meals. Nina and Tomas often share a room but have distinct preferences:
  Nina keeps her side of the room tidy with labeled bins, while Tomas's side is
  a chaotic mix of toys and drawings. They sometimes fight over the TV remote or
  whose turn it is to use the toy kitchen, but mostly play together.
home_layout_notes: >-
  The living room is the main hub where both kids and parents spend time, especially
  during mealtime and playtime. The kitchen is used most by Mara and Leo for meal
  prep, while the garage is Leo’s domain for car maintenance. Nina’s side of her
  shared bedroom is color-coded and organized, while Tomas’s side is a jumble. The
  hallway has a changing table and a wipe station for quick cleanups.
