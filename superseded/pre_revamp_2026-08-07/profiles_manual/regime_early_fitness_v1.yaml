# regime_early_fitness_v1 -- INFERABLE-REGIME atypical (H2 redesign)
#
# Design goal (H2 rerun): a SINGULARLY-CONDITIONED, human-guessable persona whose
# routine a reader can infer from a FEW semantically-loaded sightings, then use to
# predict many OTHER objects. Contrast with the first authored bank, whose
# reassignments (keys-in-bowl) were idiosyncratic and unguessable.
#
# Persona: an early-bird fitness enthusiast with a 9-5 desk job. Up at 05:00 to
# work out in the living room, then a normal commute day.
#
# DIAGNOSTIC objects (persona-EXCLUSIVE; a sighting reveals the regime): yoga_mat,
# dumbbells, foam_roller, running_shoes -- these say "early-morning fitness" and
# disambiguate this household from a night-shift nurse (regime_night_nurse_v1),
# who ALSO has 05:00-06:00 activity but whose diagnostic objects are scrubs/badge.
#
# DEPENDENT objects (shared, common; the regime sets WHEN/WHERE they are):
# water_bottle, phone, protein_shaker -- e.g. water_bottle is in the LIVING ROOM
# at 05:30 (workout), not the kitchen/nightstand a typical prior assumes. These
# are the held-out query targets in the regime-transfer eval.
#
# Provenance: [ATUS] [BEHAV] [HOMER] [HKEEP] [DESIGN]; regime-specific timing and
# the diagnostic set are [DESIGN].

household: regime_early_fitness_v1
status: VERIFIED  # regime-inference redesign (Oliver, 2026-07-21)
derived_from: null
transformation: null

receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: gym_rack_l1,   room: living,   aliases: [fitness_rack]}   # where the workout gear lives
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: desk_o1,       room: office,   aliases: [desk]}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: shoe_rack_e1,  room: entryway, aliases: []}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}

residents:
  - id: R1
    description: early-rising fitness enthusiast with a weekday desk job
    schedule:
      - {activity: sleep,       days: [Su,Mo,Tu,We,Th], start: "21:30", end: "05:00"}  # [DESIGN] early bed (Sun night on weekday pattern -> Mon 05:00 workout)
      - {activity: workout,     days: [Mo,Tu,We,Th,Fr], start: "05:00", end: "06:30"}  # [DESIGN] 05:00 workout
      - {activity: breakfast,   days: [Mo,Tu,We,Th,Fr], start: "06:50", end: "07:20"}  # [ATUS]
      - {activity: leave_work,  days: [Mo,Tu,We,Th,Fr], start: "07:30", end: "08:00"}  # [ATUS]
      - {activity: away_work,   days: [Mo,Tu,We,Th,Fr], start: "08:00", end: "17:00"}  # [ATUS] no-op
      - {activity: return_home, days: [Mo,Tu,We,Th,Fr], start: "17:00", end: "17:30"}  # [ATUS]
      - {activity: dinner,      days: [Mo,Tu,We,Th,Fr], start: "18:00", end: "18:45"}  # [ATUS]
      - {activity: tv_evening,  days: [Su,Mo,Tu,We,Th], start: "19:30", end: "21:00"}  # [ATUS] early-bed nights
      - {activity: sleep,       days: [Fr,Sa],          start: "22:00", end: "06:30"}  # [ATUS] weekend (Fri/Sat nights)
      - {activity: long_run,    days: [Sa,Su],          start: "07:00", end: "08:30"}  # [DESIGN]
      - {activity: brunch,      days: [Sa,Su],          start: "09:30", end: "10:15"}  # [ATUS]
      - {activity: errand,      days: [Sa,Su],          start: "11:00", end: "12:00"}  # [DESIGN]
      - {activity: dinner,      days: [Sa,Su],          start: "18:00", end: "18:45"}  # [ATUS]
      - {activity: tv_evening,  days: [Fr,Sa],          start: "19:30", end: "22:00"}  # [ATUS] late nights

activities:
  workout:
    jitter_min: 15                                   # [DESIGN]
    objects: [yoga_mat, dumbbells, foam_roller, water_bottle, phone]
    during: {yoga_mat: coffee_table_l1, dumbbells: coffee_table_l1, foam_roller: coffee_table_l1,
             water_bottle: coffee_table_l1, phone: coffee_table_l1}   # [DESIGN] gear + bottle in the LIVING ROOM at 05:00
    after:
      yoga_mat:     {dest: gym_rack_l1, p: 0.8, else: coffee_table_l1}
      dumbbells:    {dest: gym_rack_l1, p: 0.9, else: coffee_table_l1}
      foam_roller:  {dest: gym_rack_l1, p: 0.8, else: coffee_table_l1}
      water_bottle: {dest: sink_k1, p: 0.5, else: coffee_table_l1}    # [DESIGN] refilled after
      phone:        {dest: counter_k1, p: 0.6, else: coffee_table_l1}
  breakfast:
    jitter_min: 10                                   # [HOMER]
    objects: [protein_shaker, mug, bowl]
    during: {protein_shaker: counter_k1, mug: counter_k1, bowl: table_d1}
    after:
      protein_shaker: {dest: sink_k1, p: 0.7, else: counter_k1}
      mug:            {dest: sink_k1, p: 0.7, else: counter_k1}
      bowl:           {dest: sink_k1, p: 0.8, else: table_d1}
  leave_work:
    jitter_min: 5                                    # [ATUS]
    objects: [keys, laptop, backpack, phone]
    after:
      keys:     {dest: null, p: 1.0}
      laptop:   {dest: null, p: 1.0}
      backpack: {dest: null, p: 1.0}
      phone:    {dest: null, p: 1.0}
  return_home:
    jitter_min: 20                                   # [ATUS]
    objects: [keys, laptop, backpack, phone]
    after:
      keys:     {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      laptop:   {dest: desk_o1, p: 0.8, else: sofa_l1}
      backpack: {dest: entry_hook_e1, p: 0.6, else: sofa_l1}
      phone:    {dest: sofa_l1, p: 0.5, else: counter_k1}
  dinner:
    jitter_min: 10
    objects: [plate, fork, water_bottle]
    during: {plate: table_d1, fork: table_d1, water_bottle: table_d1}
    after:
      plate:        {dest: sink_k1, p: 0.85, else: table_d1}
      fork:         {dest: sink_k1, p: 0.85, else: table_d1}
      water_bottle: {dest: nightstand_r1, p: 0.5, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.9, else: sofa_l1}
  long_run:
    jitter_min: 20                                   # [DESIGN]
    objects: [running_shoes, water_bottle, phone]
    during: {running_shoes: shoe_rack_e1, water_bottle: coffee_table_l1, phone: coffee_table_l1}
    after:
      running_shoes: {dest: null, p: 1.0}            # worn out for the run
      water_bottle:  {dest: null, p: 1.0}
      phone:         {dest: null, p: 1.0}
  brunch:
    jitter_min: 20
    objects: [protein_shaker, plate, mug]
    during: {protein_shaker: counter_k1, plate: table_d1, mug: counter_k1}
    after:
      protein_shaker: {dest: sink_k1, p: 0.7, else: counter_k1}
      plate:          {dest: sink_k1, p: 0.8, else: table_d1}
      mug:            {dest: sink_k1, p: 0.7, else: counter_k1}
  errand:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, phone]
    after:
      keys:  {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone: {dest: sofa_l1, p: 0.5, else: counter_k1}

placements:
  # DIAGNOSTIC (persona-exclusive; these reveal the early-fitness regime)
  yoga_mat:       {home: gym_rack_l1, volatility_class_hint: high}     # [DESIGN]
  dumbbells:      {home: gym_rack_l1}                                   # [DESIGN]
  foam_roller:    {home: gym_rack_l1}                                   # [DESIGN]
  running_shoes:  {home: shoe_rack_e1}                                  # [DESIGN]
  # DEPENDENT (shared; regime sets their morning location -> query targets)
  water_bottle:   {home: nightstand_r1, volatility_class_hint: high}    # [DESIGN] bedside overnight, living room at workout
  protein_shaker: {home: cupboard_k1, volatility_class_hint: high}      # [DESIGN] fitness-diet tell, but a common object
  phone:          {home: nightstand_r1, volatility_class_hint: high}
  # ordinary objects
  keys:           {home: entry_hook_e1, p_misplace: 0.10, misplace_set: [counter_k1, sofa_l1]}  # [HKEEP]
  laptop:         {home: desk_o1}                                       # [HKEEP]
  backpack:       {home: entry_hook_e1, p_misplace: 0.08, misplace_set: [sofa_l1, desk_o1]}
  mug:            {home: cupboard_k1}
  bowl:           {home: cupboard_k1}
  plate:          {home: cupboard_k1}
  fork:           {home: cupboard_k1}
  remote:         {home: coffee_table_l1}
  # static tercile
  blender:        {home: counter_k1,  volatility_class_hint: static}
  toaster:        {home: counter_k1,  volatility_class_hint: static}
  router:         {home: tv_stand_l1, volatility_class_hint: static}
  first_aid_kit:  {home: bathroom_c1, volatility_class_hint: static}

# Dish-cycle rule (all profiles): objects on sink_k1 at 21:30 return home at 21:45
# with p=0.9. [DESIGN]
