# regime_frequent_traveler_v1 -- CONFIRMATORY pair (unseen during design)
# Persona: travels for work Tue-Thu (gone multi-day), home Mon/Fri + weekend.
# Confusable with regime_shift_rotator_v1 (both: absent at irregular times).
# DIAGNOSTIC (STRUCTURE-sufficient): suitcase, passport, packing_cubes,
# travel_adapter. The travel regime is readable from the STRUCTURE alone -- a
# packing burst then a multi-DAY gap with no sightings -- so we PRE-REGISTER
# named ~= anon here (structure-sufficient, WFH-like): the anon model can infer
# "away for days -> objects gone" without knowing what a passport is.
# DEPENDENT (shared): laptop, phone -> AWAY (elsewhere) during Tue-Thu travel.
household: regime_frequent_traveler_v1
status: VERIFIED  # confirmatory (Oliver, 2026-07-21)
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: closet_r1,     room: bedroom,  aliases: [wardrobe]}
  - {id: desk_o1,       room: office,   aliases: [desk]}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: frequent business traveler; away Tue-Thu, home Mon/Fri + weekend
    schedule:
      - {activity: sleep,        days: [Th,Fr,Sa,Su], start: "23:00", end: "07:00"}  # [ATUS] home nights (Thu return -> Sun)
      - {activity: sleep,        days: [Mo],          start: "22:00", end: "05:30"}  # [DESIGN] pre-departure early night
      - {activity: morning_prep, days: [Fr,Sa,Su,Mo], start: "07:00", end: "07:30"}  # [ATUS]
      - {activity: breakfast,    days: [Fr,Sa,Su,Mo], start: "07:30", end: "08:00"}  # [ATUS]
      - {activity: home_desk,    days: [Fr,Mo],       start: "09:00", end: "16:30"}  # [DESIGN] no-op (works at home desk)
      - {activity: pack_trip,    days: [Mo],          start: "20:00", end: "20:45"}  # [DESIGN] suitcase out (Mon eve)
      - {activity: depart,       days: [Tu],          start: "06:00", end: "06:30"}  # [DESIGN] leaves for multi-day trip
      # Tue 06:30 - Thu 20:00: AWAY (no home blocks; objects stay elsewhere)
      - {activity: return_trip,  days: [Th],          start: "20:00", end: "20:45"}  # [DESIGN] home from the trip
      - {activity: unpack,       days: [Fr],          start: "08:00", end: "08:30"}  # [DESIGN] after breakfast
      - {activity: dinner,       days: [Fr,Sa,Su],    start: "18:30", end: "19:15"}  # [ATUS] (Mon eve = packing)
      - {activity: tv_evening,   days: [Fr,Sa,Su],    start: "20:00", end: "22:30"}  # [ATUS]
      - {activity: errand,       days: [Sa,Su],       start: "11:00", end: "12:00"}  # [DESIGN]
activities:
  morning_prep:
    jitter_min: 10
    objects: [phone]
    during: {phone: nightstand_r1}
    after:
      phone: {dest: counter_k1, p: 0.6, else: nightstand_r1}
  breakfast:
    jitter_min: 10
    objects: [coffee_mug, bowl]
    during: {coffee_mug: counter_k1, bowl: table_d1}
    after:
      coffee_mug: {dest: sink_k1, p: 0.6, else: counter_k1}
      bowl:       {dest: sink_k1, p: 0.8, else: table_d1}
  home_desk:
    jitter_min: 20                                   # [DESIGN] at the home desk on home days
    objects: [laptop, phone, coffee_mug]
    during: {laptop: desk_o1, phone: desk_o1, coffee_mug: desk_o1}
    after:
      laptop:     {dest: desk_o1, p: 0.9, else: sofa_l1}
      phone:      {dest: desk_o1, p: 0.5, else: sofa_l1}
      coffee_mug: {dest: sink_k1, p: 0.6, else: desk_o1}
  pack_trip:
    jitter_min: 15                                   # [DESIGN] the travel kit comes out
    objects: [suitcase, passport, packing_cubes, travel_adapter, toiletry_bag]
    during: {suitcase: bed_r1, passport: bed_r1, packing_cubes: bed_r1,
             travel_adapter: bed_r1, toiletry_bag: bed_r1}
    after:
      suitcase:       {dest: entry_hook_e1, p: 0.85, else: bed_r1}   # [DESIGN] by the door, ready
      passport:       {dest: entry_hook_e1, p: 0.7, else: bed_r1}
      packing_cubes:  {dest: entry_hook_e1, p: 0.7, else: bed_r1}
      travel_adapter: {dest: entry_hook_e1, p: 0.7, else: bed_r1}
      toiletry_bag:   {dest: entry_hook_e1, p: 0.7, else: bathroom_c1}
  depart:
    jitter_min: 10                                   # [DESIGN] everything leaves for the trip
    objects: [keys, laptop, phone, suitcase, passport, packing_cubes, travel_adapter, toiletry_bag]
    after:
      keys:           {dest: null, p: 1.0}
      laptop:         {dest: null, p: 1.0}           # [DESIGN] AWAY Tue-Thu
      phone:          {dest: null, p: 1.0}
      suitcase:       {dest: null, p: 1.0}
      passport:       {dest: null, p: 1.0}
      packing_cubes:  {dest: null, p: 1.0}
      travel_adapter: {dest: null, p: 1.0}
      toiletry_bag:   {dest: null, p: 1.0}
  return_trip:
    jitter_min: 20                                   # [DESIGN] home from the trip
    objects: [keys, laptop, phone, suitcase, passport, toiletry_bag]
    after:
      keys:         {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      laptop:       {dest: desk_o1, p: 0.8, else: sofa_l1}
      phone:        {dest: sofa_l1, p: 0.6, else: nightstand_r1}
      suitcase:     {dest: closet_r1, p: 0.6, else: bed_r1}
      passport:     {dest: closet_r1, p: 0.6, else: entry_hook_e1}
      toiletry_bag: {dest: bathroom_c1, p: 0.7, else: closet_r1}
  unpack:
    jitter_min: 15                                   # [DESIGN]
    objects: [packing_cubes, travel_adapter]
    during: {packing_cubes: bed_r1, travel_adapter: bed_r1}
    after:
      packing_cubes:  {dest: closet_r1, p: 0.8, else: bed_r1}
      travel_adapter: {dest: desk_o1, p: 0.6, else: closet_r1}
  dinner:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.85, else: sofa_l1}
  errand:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, phone]
    after:
      keys:  {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone: {dest: sofa_l1, p: 0.5, else: counter_k1}
placements:
  # DIAGNOSTIC (STRUCTURE-sufficient travel kit)
  suitcase:       {home: closet_r1, volatility_class_hint: high}   # [DESIGN]
  passport:       {home: closet_r1, volatility_class_hint: high}   # [DESIGN]
  packing_cubes:  {home: closet_r1}                                # [DESIGN]
  travel_adapter: {home: desk_o1}                                  # [DESIGN]
  toiletry_bag:   {home: bathroom_c1, volatility_class_hint: high} # [DESIGN]
  # DEPENDENT (shared; regime -> away during travel)
  laptop: {home: desk_o1, volatility_class_hint: high}             # [DESIGN]
  phone:  {home: nightstand_r1, volatility_class_hint: high}
  keys:   {home: entry_hook_e1, p_misplace: 0.08, misplace_set: [counter_k1, sofa_l1]}
  # ordinary
  coffee_mug: {home: cupboard_k1}
  bowl:   {home: cupboard_k1}
  plate:  {home: cupboard_k1}
  fork:   {home: cupboard_k1}
  remote: {home: coffee_table_l1}
  # static
  toaster:       {home: counter_k1,  volatility_class_hint: static}
  router:        {home: tv_stand_l1, volatility_class_hint: static}
  first_aid_kit: {home: bathroom_c1, volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9. [DESIGN]
