# v22_shift_rotator -- VERSION22b confusable pair I (with v22_frequent_traveler).
# Both LEAVE with a work kit; they DIFFER IN DEPARTURE REGULARITY: here a rotating
# shift worker departs and RETURNS THE SAME DAY at variable hours, and is HOME
# every evening -- so the shared laptop lives on the HOME DESK (evening admin) and
# keys hang on the hook overnight. Regime-legible: work_badge + hi_vis_vest +
# thermos cycling daily => "shift worker, home nightly" => laptop at the desk.
# DIAGNOSTIC: work_badge, hi_vis_vest, thermos, shift_calendar.
# DEPENDENT targets (shared class): laptop -> desk_o1 (evenings), phone -> desk/
#   nightstand, keys -> entry_hook_e1 overnight.
# STATIC DISTRACTORS: dining_chair, bed_pillow, wall_clock, floor_lamp, doormat,
#   waste_bin, picture_frame, bath_mat.
household: v22_shift_rotator
status: DRAFT  # version22b authoring 2026-07-22 — needs human anchor verification
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,          room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1,   room: bedroom,  aliases: []}
  - {id: sofa_l1,         room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living,   aliases: []}
  - {id: desk_o1,         room: office,   aliases: [home_desk]}
  - {id: shelf_o1,        room: office,   aliases: [office_shelf]}
  - {id: counter_k1,      room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,     room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,         room: kitchen,  aliases: []}
  - {id: table_d1,        room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1,   room: entryway, aliases: [key_hook]}
  - {id: locker_shelf_e1, room: entryway, aliases: [gear_shelf]}
  - {id: bathroom_c1,     room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: rotating-shift worker; variable departure, home every evening
    schedule:
      - {activity: sleep,              days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "23:00", end: "04:30"}
      - {activity: early_shift_leave,  days: [Mo,We,Fr], start: "05:00", end: "05:15"}
      - {activity: away_early,         days: [Mo,We,Fr], start: "05:15", end: "14:30"}
      - {activity: early_shift_return, days: [Mo,We,Fr], start: "14:30", end: "14:50"}
      - {activity: late_shift_prep,    days: [Tu,Th],    start: "11:30", end: "12:00"}
      - {activity: late_shift_leave,   days: [Tu,Th],    start: "13:00", end: "13:15"}
      - {activity: away_late,          days: [Tu,Th],    start: "13:15", end: "22:30"}
      - {activity: late_shift_return,  days: [Tu,Th],    start: "22:30", end: "22:50"}
      - {activity: dinner,             days: [Mo,We,Fr,Sa,Su], start: "18:15", end: "19:00"}
      - {activity: evening_admin,      days: [Mo,We,Fr,Sa,Su], start: "19:30", end: "21:00"}
      - {activity: weekend_errand,     days: [Sa],       start: "11:00", end: "12:30"}
activities:
  early_shift_leave:
    jitter_min: 15
    objects: [work_badge, hi_vis_vest, thermos, keys, phone]
    during: {work_badge: entry_hook_e1, hi_vis_vest: locker_shelf_e1,
             thermos: counter_k1, keys: entry_hook_e1, phone: entry_hook_e1}
    after:
      work_badge:  {dest: null, p: 1.0}
      hi_vis_vest: {dest: null, p: 1.0}
      thermos:     {dest: null, p: 1.0}
      keys:        {dest: null, p: 1.0}
      phone:       {dest: null, p: 1.0}
  early_shift_return:
    jitter_min: 20
    objects: [work_badge, hi_vis_vest, thermos, keys, phone]
    after:
      work_badge:  {dest: locker_shelf_e1, p: 0.85, else: entry_hook_e1}
      hi_vis_vest: {dest: locker_shelf_e1, p: 0.9}
      thermos:     {dest: sink_k1, p: 0.7, else: counter_k1}
      keys:        {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone:       {dest: sofa_l1, p: 0.5, else: coffee_table_l1}
  late_shift_prep:
    jitter_min: 15
    objects: [thermos, work_badge]
    during: {thermos: counter_k1, work_badge: entry_hook_e1}
    after:
      thermos:    {dest: counter_k1, p: 0.9}
      work_badge: {dest: entry_hook_e1, p: 0.9}
  late_shift_leave:
    jitter_min: 15
    objects: [work_badge, hi_vis_vest, thermos, keys, phone]
    after:
      work_badge:  {dest: null, p: 1.0}
      hi_vis_vest: {dest: null, p: 1.0}
      thermos:     {dest: null, p: 1.0}
      keys:        {dest: null, p: 1.0}
      phone:       {dest: null, p: 1.0}
  late_shift_return:
    jitter_min: 20
    objects: [work_badge, hi_vis_vest, thermos, keys, phone]
    after:
      work_badge:  {dest: locker_shelf_e1, p: 0.85, else: entry_hook_e1}
      hi_vis_vest: {dest: locker_shelf_e1, p: 0.9}
      thermos:     {dest: sink_k1, p: 0.7, else: counter_k1}
      keys:        {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone:       {dest: nightstand_r1, p: 0.7, else: coffee_table_l1}
  evening_admin:
    jitter_min: 20
    objects: [laptop, phone, coffee_mug]
    during: {laptop: desk_o1, phone: desk_o1, coffee_mug: desk_o1}
    after:
      laptop:     {dest: desk_o1, p: 0.9}                 # laptop lives at the home desk
      phone:      {dest: nightstand_r1, p: 0.7, else: desk_o1}
      coffee_mug: {dest: sink_k1, p: 0.7, else: desk_o1}
  dinner:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  weekend_errand:
    jitter_min: 20
    objects: [keys, phone]
    after:
      keys:  {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone: {dest: sofa_l1, p: 0.5, else: coffee_table_l1}
placements:
  # DIAGNOSTIC (persona-exclusive)
  work_badge:     {home: entry_hook_e1, volatility_class_hint: high}
  hi_vis_vest:    {home: locker_shelf_e1, volatility_class_hint: high}
  thermos:        {home: counter_k1, volatility_class_hint: high}
  shift_calendar: {home: shelf_o1, volatility_class_hint: static}
  # DEPENDENT targets (shared class; regime -> home desk / hook overnight)
  laptop: {home: desk_o1, volatility_class_hint: high}
  phone:  {home: nightstand_r1, volatility_class_hint: high}
  keys:   {home: entry_hook_e1, volatility_class_hint: high}
  # ordinary
  bowl:       {home: cupboard_k1}
  plate:      {home: cupboard_k1}
  fork:       {home: cupboard_k1}
  coffee_mug: {home: cupboard_k1}
  remote:     {home: coffee_table_l1}
  # STATIC DISTRACTORS
  dining_chair:  {home: table_d1,        volatility_class_hint: static}
  bed_pillow:    {home: bed_r1,          volatility_class_hint: static}
  wall_clock:    {home: counter_k1,      volatility_class_hint: static}
  floor_lamp:    {home: sofa_l1,         volatility_class_hint: static}
  doormat:       {home: entry_hook_e1,   volatility_class_hint: static}
  waste_bin:     {home: counter_k1,      volatility_class_hint: static}
  picture_frame: {home: coffee_table_l1, volatility_class_hint: static}
  bath_mat:      {home: bathroom_c1,     volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9.
