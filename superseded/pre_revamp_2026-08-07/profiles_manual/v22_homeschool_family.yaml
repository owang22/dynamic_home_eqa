# v22_homeschool_family -- VERSION22 confirmatory household (pair A with
# v22_artist_kid_family: both "home-with-kid daytime", different room/timing).
# Persona: parent homeschools a 10-year-old at the DINING TABLE morning+afternoon.
# IDIOSYNCRATIC-BUT-REALISTIC: coffee_mug lives on the dining table as the PENCIL
#   CUP for lessons; scissors + tablet are lesson supplies parked at the dining
#   table during school hours; a kitchen timer paces lessons.
# DIAGNOSTIC: globe, math_workbook, flashcards, kitchen_timer (at table mid-day).
# DEPENDENT targets: coffee_mug (pencil cup, table_d1), scissors -> table_d1 at
#   10:00, tablet -> table_d1 at 10:00 (lesson videos).
# STATIC DISTRACTORS: dining_chair, bed_pillow, wall_clock, floor_lamp, doormat,
#   waste_bin, picture_frame, bath_mat.
