# Regime search R3b "sick_owner": routine-group questions asked DURING activities, 28 days from a Monday, no random events,
# calendar: 14 weekdays lead, resident_1 off sick days 14-18, 9 weekdays return; questions only about resident_1's own objects. Seeds 0-9.
name: sick_owner
sim_dir: ../../data/situation_sim/regime_search/sick_owner
day0: Monday
days: 28
events: {rain: {weekday: 0.0, weekend: 0.0}, guest_visit: {weekday: 0.0, weekend: 0.0}, late_work: {weekday: 0.0, weekend: 0.0},
         grocery_delivery: {weekday: 0.0, weekend: 0.0}, laundry_day: {weekday: 0.0, weekend: 0.0}, sick_day: {weekday: 0.0, weekend: 0.0}}
calendar:
  - {name: lead,   days: [0, 13],  day_kind: weekday, suppress_random_events: true}
  - {name: sick,   days: [14, 18], day_kind: weekday, force_events: [{event: sick_day, resident: resident_1}], suppress_random_events: true}
  - {name: return, days: [19, 27], day_kind: weekday, suppress_random_events: true}
patrol_hours: 0
patrol_times: "03:00"
questions: activity
question_moment: during
question_owners: [resident_1]
classes: [mug, bowl, plate, glass, water_bottle, pan, pot, spatula, kitchen_knife, serving_dish, recipe_book, snack_bowl, tablet, charger, remote, glasses, razor, book, shopping_bag, dog_food_bag]
per_day: 32
oversample: 1024
timetable_bin_hours: 2
negative_evidence: off
feedback_delay_min: 10
extra_beliefs: [{name: timetable, half_life_h: 72}, {name: most_frequent, half_life_h: 72}]
