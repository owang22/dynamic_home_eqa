# Regime "sick2x_owner" (2026-09-22, second perturbation for the memory story): the one-person sick spell happens TWICE.
# Same design as sick10_owner (questions about resident_1's everyday things, during activities, weekdays throughout)
# but 42 days: lead 0-13, sick 14-20, back 21-27, sick again 28-34, back 35-41. The question: does a memory REUSE what
# it learned in the first spell — is the second break smaller and the second re-learning faster? Forgetting counters
# cannot (they forgot); the never-forgets one has bins mixing both routines; a retrieval / long-context / message-cued
# language memory could recall the earlier episode.
name: sick2x_owner
sim_dir: ../../data/situation_sim/regime_search/sick2x_owner
day0: Monday
days: 42
events: {rain: {weekday: 0.0, weekend: 0.0}, guest_visit: {weekday: 0.0, weekend: 0.0}, late_work: {weekday: 0.0, weekend: 0.0},
         grocery_delivery: {weekday: 0.0, weekend: 0.0}, laundry_day: {weekday: 0.0, weekend: 0.0}, sick_day: {weekday: 0.0, weekend: 0.0}}
calendar:
  - {name: lead,    days: [0, 13],  day_kind: weekday, suppress_random_events: true}
  - {name: sick,    days: [14, 20], day_kind: weekday, force_events: [{event: sick_day, resident: resident_1}], suppress_random_events: true}
  - {name: return,  days: [21, 27], day_kind: weekday, suppress_random_events: true}
  - {name: sick2,   days: [28, 34], day_kind: weekday, force_events: [{event: sick_day, resident: resident_1}], suppress_random_events: true}
  - {name: return2, days: [35, 41], day_kind: weekday, suppress_random_events: true}
patrol_hours: 0
patrol_times: "03:00"
questions: activity
question_moment: during
question_owners: [resident_1]
classes: [book, water_bottle, tablet, mug, charger, glasses, glass, razor]
question_min_gap_min: 30
per_day: 16
oversample: 1024
timetable_bin_hours: 2
negative_evidence: off
feedback_delay_min: 10
extra_beliefs: [{name: timetable, half_life_h: 72}, {name: most_frequent, half_life_h: 72}, {name: timetable, half_life_h: 24}, {name: most_frequent, half_life_h: 24}]
