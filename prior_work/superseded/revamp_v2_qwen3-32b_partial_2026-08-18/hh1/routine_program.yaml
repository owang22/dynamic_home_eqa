  patch:
    drop:
    - morning_departure
    - arrival_home
    - post_work_routine
    - rest_break
    - daytime_rest
    add:
    - resident: resident_1
      activity: new_schedule_prep
      start: 06:00
      end: 07:00
      at: counter_k1
      jitter: external
      sleep: false
    - resident: resident_1
      activity: new_schedule_rest
      start: '20:00'
      end: '21:00'
      at: bed_b1
      jitter: routine
      sleep: false
