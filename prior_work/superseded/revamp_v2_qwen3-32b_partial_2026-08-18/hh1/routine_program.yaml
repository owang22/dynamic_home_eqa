arc_events:
- day: 5
  note: Maya skips her video call and naps instead due to exhaustion after a difficult shift
  patch:
    drop:
    - video_call
    - daytime_rest
    add:
    - resident: resident_1
      activity: overnight_sleep
      start: '16:00'
      end: '19:00'
      at: bed_b1
      jitter: routine
      sleep: true
- day: 11
  note: Maya has an unexpected appointment with her doctor at 15:30, conflicting with her usual rest period
  patch:
    drop:
    - rest_break
    - daytime_rest
    add:
    - resident: resident_1
      activity: doctor_visit
      start: '15:30'
      end: '16:30'
      at: ELSEWHERE
      jitter: external
      sleep: false
- day: 16
  note: Maya suffers from a virus and is too weak to leave the bed for two consecutive days
  patch:
    drop:
    - morning_departure
    - arrival_home
    - post_work_routine
    - rest_break
    - daytime_rest
    add:
    - resident: resident_1
      activity: bed_rest
      start: 00:00
      end: 23:59+1
      at: bed_b1
      jitter: routine
      sleep: false
    - resident: resident_1
      activity: bed_rest
      start: 23:59+1
      end: 23:59+1
      at: bed_b1
      jitter: routine
      sleep: false
- day: 20
