household_id: hh_001
household_type: night_shift_worker_solo
residents:
  - id: resident_1
    name: Maya Chen
    age: 32
    occupation: nurse
    personality: methodical, high energy, empathetic
    habits:
      - prepares meals in the early morning before leaving
      - uses a white noise app every night to fall asleep after shifts
      - keeps a stash of snacks in the living room for midnight cravings
      - washes and organizes work scrubs immediately upon returning home
      - listens to podcasts on headphones while doing chores
      - never remembers to charge the phone until it dies at the worst time
relationships: >-
  Maya lives alone and manages everything independently. She rarely has guests over
  due to her erratic hours, but she occasionally video calls her sister during the
  day when she’s awake. The biggest challenge is maintaining a consistent self-care
  routine when her body clock is flipped.
home_layout_notes: >-
  The living room is Maya’s main space during the day, as she rests and prepares
  for the next shift. At night, the kitchen and bathroom become high-traffic zones
  as she moves quickly between cleaning up, eating, and getting ready for work.
  The bedroom is used only for short bursts of sleep.
