daily_life_summary: >-
  Maya’s day begins in the early morning when she cooks a quick meal and packs her
  bag for work. She leaves the apartment just as most people are waking up, working
  through the night. When she returns, she’s exhausted and focuses on washing up,
  recharging, and eating. She tries to get a few hours of sleep during the day,
  often dozing on the couch or in bed in short intervals. Her routine is full of
  small comforts to stay grounded in the middle of her unusual schedule.
quirks: >-
  Maya has a routine of taking a short walk during her shift break at 3 AM, not
  because she needs the exercise, but because it gives her a moment of peace away
  from the hospital. She keeps a small photo of a sunrise in her phone as a reminder
  of the world outside her flipped schedule.
