household_id: hh_003
household_type: retired_couple
residents:
  - id: resident_1
    name: Harold
    age: 72
    occupation: retired
    personality: meticulous, nostalgic
    habits:
      - keeps all his old books neatly on the top shelf of the bookcase
      - always drinks his tea from the same chipped mug every morning
      - folds the newspaper into a precise square before putting it in the recycling
      - uses the same pair of reading glasses for every activity involving close-up
        vision
      - checks the door locks twice before bed, even when his wife insists they’re
        fine
  - id: resident_2
    name: Eleanor
    age: 70
    occupation: retired
    personality: socially active, spontaneous
    habits:
      - often hosts coffee hours with friends in the living room, leaving the coffee
        table cluttered with mugs and cookies
      - wears her gardening gloves all day even when she’s not outside
      - keeps a stack of scrapbooking supplies and photos on the kitchen table for
        ongoing projects
      - borrows Harold’s reading glasses when hers are misplaced (which is often)
      - uses the same towel every morning, forgetting to switch to the clean one
relationships: >-
  Harold and Eleanor are married and have lived together for over 40 years. They
  share chores mostly by tradition — Harold manages the bills and locks up, while
  Eleanor handles the garden and social events. Their biggest source of tension
  is Eleanor’s habit of reorganizing the house while Harold is out, which sometimes
  results in misplaced objects he can’t find. They often share the living room at
  different times of day, but it's common for one to find the other reading in the
  same chair.
home_layout_notes: >-
  The living room is Eleanor’s domain, where she hosts guests and works on crafts,
  while Harold prefers the quiet of the study to read and listen to classical music.
  The kitchen is a shared space, but Eleanor claims the table as her personal workspace.
  The bedroom is used mostly for sleeping, though Harold naps in the recliner in
  the evenings.
object_inventory:
  - id: mug_1
    class: mug
    owner: resident_1
    role: Harold’s morning tea mug; never moves from the kitchen counter
  - id: mug_2
    class: mug
    owner: resident_2
    role: Eleanor’s guest mug; left on the coffee table during her coffee hours
      and often forgotten
  - id: book_1
    class: book
    owner: resident_1
    role: a well-worn biography; moved from the bookshelf to the study chair and
      back
  - id: book_2
    class: book
    owner: resident_2
    role: a mystery novel Eleanor borrowed from the library; often left on the kitchen
      table or the living room floor
  - id: remote_1
    class: remote
    owner: shared
    role: used by both for the TV; often misplaced after Eleanor’s movie nights
  - id: glasses_1
    class: glasses
    owner: resident_1
    role: Harold’s primary reading glasses; occasionally borrowed by Eleanor
  - id: glasses_2
    class: glasses
    owner: resident_2
    role: Eleanor’s glasses; often left on the windowsill or in the garden
  - id: towel_1
    class: towel
    owner: resident_2
    role: Eleanor’s morning bath towel; never replaced
  - id: notebook_1
    class: notebook
    owner: resident_2
    role: used for scrapbooking; left open on the kitchen table for weeks at a time
  - id: pen_1
    class: pen
    owner: shared
    role: used by both for writing notes; often disappears and turns up in the wrong
      room
daily_life_summary: >-
  Harold and Eleanor spend most of their time at home, though their schedules don’t
  always align. Harold often reads in the study or takes walks in the early mornings,
  while Eleanor is usually up later, preparing for the day’s social or gardening
  activities. Eleanor’s friends often visit in the afternoon, bringing the house
  to life with conversation and laughter. They rarely go out together unless Eleanor
  insists, and when they do, it’s usually for quiet dinners or senior center events.
  In the evenings, Harold watches the news or a documentary while Eleanor listens
  to music and works on crafts.
quirks: >-
  Despite being retired, Harold never wears slippers at home and insists on walking
  barefoot, while Eleanor wears gardening gloves even while watching TV. They also
  have a decades-old habit of leaving the front door unlocked — a point of frequent
  concern for their children.
