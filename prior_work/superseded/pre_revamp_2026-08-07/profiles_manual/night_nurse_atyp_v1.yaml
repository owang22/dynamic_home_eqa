# night_nurse_atyp_v1 -- ATYPICAL base (inverted circadian: 3x12 night shifts)
#
# METHODOLOGY DEPARTURE (see studio_convert_atyp_v1 header for the full note):
# hand-authored atypical (model DRAFT by Claude, outside the evaluated set),
# status DRAFT until human-verified. Unlike the other three atypical bases,
# this one's PRIMARY manipulation is TIMING -- an inverted sleep/wake cycle --
# which the registered transforms CAN approximate (transforms.night_shift_
# reversion / workday_pattern "three_twelves"). It is hand-authored anyway
# because a timing-only transform of a typical OFFICE base cannot produce the
# things that actually make a night nurse's home dynamics distinctive:
#   * DAY-SLEEP on workdays (08:30-15:30) with the house otherwise still, and
#     the whole active window shoved into the afternoon/overnight;
#   * INVERTED MEALS -- her "dinner" (main_meal) is at ~16:30, and the only
#     thing resembling breakfast on a workday is a post-shift snack at ~08:00;
#   * the SHIFT OBJECT CYCLE -- scrubs donned then worn out of the house, a
#     hospital badge that lives on the nightstand and leaves every shift, a
#     packed meal_container + thermos that ride to work and come back to the
#     sink, work clogs on a shoe rack, a stethoscope brought home. None of
#     these exist in an office profile for a transform to retime.
#
# Story: Priya, a single ICU nurse, works three 12-hour night shifts a week
# (Tue/Wed/Thu nights, 19:00-07:30 incl. handoff). She clocks in Tue/Wed/Thu
# evening and sleeps through the following day; Friday is a hard "recovery
# crash," and Sat-Mon she lives partly re-normalized before flipping back.
#
# Provenance key: [ATUS] [BEHAV] [HOMER] [HKEEP] [DESIGN]. The night-shift
# structure, inverted meals, and shift-specific object homes are [DESIGN]
# (the nursing 3x12 pattern would carry a [DESIGN]/literature tag pending the
# same anchor verification the transform's own "three_twelves" spec needs).

household: night_nurse_atyp_v1
status: VERIFIED  # verified by researcher (Oliver, 2026-07-21)
derived_from: null
transformation: null

receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: closet_r1,     room: bedroom,  aliases: [wardrobe]}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: stove_k1,      room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: shoe_rack_e1,  room: entryway, aliases: []}
  - {id: shelf_e1,      room: entryway, aliases: []}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}

residents:
  - id: R1
    description: single ICU nurse, three 12h night shifts/week (Tue/Wed/Thu nights)
    schedule:
      # ── normal-ish nights she sleeps at night (off-run + pre-run) ──
      - {activity: sleep,          days: [Fr,Sa,Su,Mo], start: "23:30", end: "07:30"}  # [DESIGN] night sleep on non-shift nights
      # ── mornings she is home and rested (Mon/Tue/Sat/Sun) ──
      - {activity: morning_prep,   days: [Mo,Tu,Sa,Su], start: "07:30", end: "08:00"}  # [ATUS]
      - {activity: breakfast,      days: [Mo,Tu,Sa,Su], start: "08:00", end: "08:30"}  # [ATUS]
      # ── Monday off: light errands ──
      - {activity: errand_out,     days: [Mo,Sa],       start: "10:00", end: "11:30"}  # [DESIGN]
      - {activity: return_errand,  days: [Mo,Sa],       start: "11:30", end: "11:50"}  # [DESIGN]
      # ── Tuesday: first night -> pre-shift nap, then in to work ──
      - {activity: preshift_nap,   days: [Tu],          start: "14:00", end: "17:00"}  # [DESIGN] naps before the first night
      # ── shift-day evening ramp (Tue/Wed/Thu): pack food, dress, leave ──
      - {activity: meal_prep,      days: [Tu,We,Th],    start: "17:15", end: "17:45"}  # [DESIGN] packs dinner+thermos for the shift
      - {activity: work_prep,      days: [Tu,We,Th],    start: "17:45", end: "18:15"}  # [DESIGN] into scrubs, badge, clogs
      - {activity: leave_work,     days: [Tu,We,Th],    start: "18:15", end: "18:45"}  # [DESIGN]
      - {activity: away_shift,     days: [Tu,We,Th],    start: "19:00", end: "07:30"}  # [DESIGN] 12h night shift (wraps), no-op
      # ── shift-morning return + day-sleep (Wed/Thu after Tue/Wed nights) ──
      - {activity: return_home,    days: [We,Th,Fr],    start: "07:30", end: "08:00"}  # [DESIGN] home from the night shift
      - {activity: post_shift,     days: [We,Th,Fr],    start: "08:00", end: "08:30"}  # [DESIGN] shower/snack/hydrate
      - {activity: day_sleep,      days: [We,Th],       start: "08:30", end: "15:30"}  # [DESIGN] sleeps through the day, no-op
      - {activity: wake_coffee,    days: [We,Th],       start: "15:30", end: "16:00"}  # [DESIGN]
      - {activity: main_meal,      days: [We,Th],       start: "16:30", end: "17:00"}  # [DESIGN] her "dinner" mid-afternoon
      # ── Friday: home from the last night, then a recovery crash ──
      - {activity: recovery_sleep, days: [Fr],          start: "08:30", end: "16:30"}  # [DESIGN] long post-run crash, no-op
      # ── off-day evenings she cooks a normal dinner + winds down ──
      - {activity: cook_dinner,    days: [Fr,Sa,Su],    start: "18:30", end: "19:15"}  # [ATUS]
      - {activity: dinner,         days: [Fr,Sa,Su],    start: "19:15", end: "19:45"}  # [ATUS]
      - {activity: tv_evening,     days: [Mo,Fr,Sa,Su], start: "20:00", end: "23:00"}  # [ATUS]

activities:
  morning_prep:
    jitter_min: 10                                   # [HOMER]
    objects: [phone, glasses]
    during: {phone: nightstand_r1, glasses: nightstand_r1}
    after:
      phone:   {dest: counter_k1, p: 0.85, else: nightstand_r1}
      glasses: {dest: null, p: 1.0}
  breakfast:
    jitter_min: 10                                   # [HOMER]
    objects: [mug, bowl]
    during: {mug: counter_k1, bowl: table_d1}        # [BEHAV]
    after:
      mug:  {dest: sink_k1, p: 0.7, else: counter_k1}            # [HKEEP]
      bowl: {dest: sink_k1, p: 0.8, else: table_d1}              # [HKEEP]
  errand_out:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, wallet, phone, tote]
    after:
      keys:   {dest: null, p: 1.0}
      wallet: {dest: null, p: 1.0}
      phone:  {dest: null, p: 1.0}
      tote:   {dest: null, p: 1.0}
  return_errand:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, wallet, phone, tote]
    after:
      keys:   {dest: entry_hook_e1, p: 0.85, else: counter_k1}   # [HKEEP]
      wallet: {dest: entry_hook_e1, p: 0.6, else: nightstand_r1}
      phone:  {dest: sofa_l1, p: 0.5, else: counter_k1}
      tote:   {dest: shelf_e1, p: 0.7, else: sofa_l1}
  meal_prep:
    jitter_min: 15                                   # [DESIGN] packs a shift meal + coffee
    objects: [meal_container, thermos]
    during: {meal_container: counter_k1, thermos: counter_k1}
    after:
      meal_container: {dest: counter_k1, p: 1.0}                 # packed, waits on the counter until she leaves
      thermos:        {dest: counter_k1, p: 1.0}
  work_prep:
    jitter_min: 10                                   # [DESIGN] dons scrubs / badge / clogs
    objects: [scrubs, badge, work_shoes]
    during: {scrubs: bed_r1, badge: nightstand_r1, work_shoes: shoe_rack_e1}
    after:
      scrubs:     {dest: null, p: 1.0}               # worn out of the house
      badge:      {dest: null, p: 1.0}
      work_shoes: {dest: null, p: 1.0}
  leave_work:
    jitter_min: 8                                    # [DESIGN]
    objects: [keys, wallet, phone, work_bag, meal_container, thermos, stethoscope]
    after:
      keys:           {dest: null, p: 1.0}
      wallet:         {dest: null, p: 1.0}
      phone:          {dest: null, p: 1.0}
      work_bag:       {dest: null, p: 1.0}
      meal_container: {dest: null, p: 1.0}
      thermos:        {dest: null, p: 1.0}
      stethoscope:    {dest: null, p: 1.0}
  return_home:
    jitter_min: 20                                   # [DESIGN] home from a 12h night, heading to sleep
    objects: [keys, wallet, phone, work_bag, meal_container, thermos, stethoscope, badge, scrubs, work_shoes]
    after:
      keys:           {dest: entry_hook_e1, p: 0.85, else: counter_k1}  # [HKEEP]
      wallet:         {dest: entry_hook_e1, p: 0.6, else: nightstand_r1}
      phone:          {dest: nightstand_r1, p: 0.8, else: sofa_l1}      # goes to bed with her
      work_bag:       {dest: shelf_e1, p: 0.7, else: sofa_l1}
      meal_container: {dest: sink_k1, p: 0.8, else: counter_k1}         # empty container to wash
      thermos:        {dest: sink_k1, p: 0.7, else: counter_k1}
      stethoscope:    {dest: shelf_e1, p: 0.6, else: nightstand_r1}
      badge:          {dest: nightstand_r1, p: 0.7, else: entry_hook_e1}  # [DESIGN] badge lives on the nightstand
      scrubs:         {dest: closet_r1, p: 0.5, else: sofa_l1}          # (or straight to laundry)
      work_shoes:     {dest: shoe_rack_e1, p: 0.9, else: entry_hook_e1}
  post_shift:
    jitter_min: 15                                   # [DESIGN] hydrate, wind down, to bed
    objects: [water_bottle, phone]
    during: {water_bottle: nightstand_r1, phone: nightstand_r1}
    after:
      water_bottle: {dest: nightstand_r1, p: 0.8, else: counter_k1}    # [DESIGN] bedside for the day-sleeper
      phone:        {dest: nightstand_r1, p: 0.9, else: sofa_l1}
  wake_coffee:
    jitter_min: 20                                   # [DESIGN]
    objects: [mug, phone]
    during: {mug: counter_k1, phone: counter_k1}
    after:
      mug:   {dest: sink_k1, p: 0.6, else: counter_k1}
      phone: {dest: counter_k1, p: 0.5, else: sofa_l1}
  main_meal:
    jitter_min: 15                                   # [DESIGN] the day-sleeper's "dinner" at ~16:30
    objects: [plate, fork, water_glass]
    during: {plate: table_d1, fork: table_d1, water_glass: table_d1}
    after:
      plate:       {dest: sink_k1, p: 0.85, else: table_d1}
      fork:        {dest: sink_k1, p: 0.85, else: table_d1}
      water_glass: {dest: sink_k1, p: 0.5,  else: table_d1}
  cook_dinner:
    jitter_min: 25                                   # [HOMER]
    objects: [pan, cutting_board, knife]
    during:
      pan:           stove_k1     # [BEHAV]
      cutting_board: counter_k1   # [DESIGN] BEHAVIOR-1K models 'countertop', not a distinct board synset
      knife:         counter_k1   # [BEHAV]
    after:
      pan:           {dest: sink_k1, p: 0.6, else: stove_k1}     # [HKEEP]
      cutting_board: {dest: sink_k1, p: 0.7, else: counter_k1}
      knife:         {dest: sink_k1, p: 0.9, else: counter_k1}
  dinner:
    jitter_min: 10
    objects: [plate, fork, water_glass]
    during: {plate: table_d1, fork: table_d1, water_glass: table_d1}
    after:
      plate:       {dest: sink_k1, p: 0.85, else: table_d1}
      fork:        {dest: sink_k1, p: 0.85, else: table_d1}
      water_glass: {dest: sink_k1, p: 0.5,  else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote_control, phone]
    during: {remote_control: sofa_l1, phone: sofa_l1}
    after:
      remote_control: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:          {dest: nightstand_r1, p: 0.9, else: sofa_l1}

placements:
  phone:          {home: nightstand_r1, volatility_class_hint: high}
  glasses:        {home: nightstand_r1}
  water_bottle:   {home: nightstand_r1, volatility_class_hint: high}   # [DESIGN] bedside hydration for the day-sleeper
  # shift kit -- leaves the house every work night, comes back the next morning
  badge:          {home: nightstand_r1, volatility_class_hint: high}   # [DESIGN] hospital ID lives on the nightstand
  meal_container: {home: cupboard_k1,   volatility_class_hint: high}   # [DESIGN] packed to work daily
  thermos:        {home: cupboard_k1}
  scrubs:         {home: closet_r1}                                    # [DESIGN]
  work_shoes:     {home: shoe_rack_e1}                                 # [DESIGN] clogs by the door
  work_bag:       {home: shelf_e1}
  stethoscope:    {home: shelf_e1}                                     # [DESIGN] brought home, on the entry shelf
  keys:           {home: entry_hook_e1, p_misplace: 0.10, misplace_set: [counter_k1, nightstand_r1]}  # [HKEEP]
  wallet:         {home: entry_hook_e1, p_misplace: 0.08, misplace_set: [nightstand_r1, counter_k1]}
  tote:           {home: shelf_e1, p_misplace: 0.10, misplace_set: [sofa_l1, entry_hook_e1]}
  mug:            {home: cupboard_k1}
  bowl:           {home: cupboard_k1}
  plate:          {home: cupboard_k1}
  fork:           {home: cupboard_k1}
  water_glass:    {home: cupboard_k1}
  pan:            {home: cupboard_k1}
  cutting_board:  {home: counter_k1}
  knife:          {home: cupboard_k1}
  remote_control: {home: tv_stand_l1}
  # static low-volatility tercile (never activity-bound)
  toaster:        {home: counter_k1,      volatility_class_hint: static}
  coffee_maker:   {home: counter_k1,      volatility_class_hint: static}
  router:         {home: tv_stand_l1,     volatility_class_hint: static}
  plant:          {home: coffee_table_l1, volatility_class_hint: static}
  first_aid_kit:  {home: bathroom_c1,     volatility_class_hint: static}

# Dish-cycle rule (generator-level, all profiles): objects on sink_k1 at 21:30
# return home at 21:45 with p=0.9. On work nights she is AT the hospital at
# 21:30, so the shift-day dish returns (meal dishes, washed container/thermos)
# fire while the house is empty -- an intentionally realistic quirk. [DESIGN]
