# regime_wfh_senior_v1 -- CONFIRMATORY pair (unseen during design)
# Persona: an older full-time remote worker, home all day AT A DESK.
# Confusable with regime_retiree_gardener_v1 (both home all day on weekdays).
# DIAGNOSTIC (STRUCTURE-sufficient): laptop, headset, webcam -- three objects
#   that simply PERSIST at the desk all day; the regime is readable from the
#   spatial pattern (stuff stays at the desk) even anonymized, so we PRE-REGISTER
#   named ~= anon here (structure-sufficient, WFH-like).
# DEPENDENT (shared): coffee_mug, phone, reading_glasses -> at the DESK midday.
household: regime_wfh_senior_v1
status: VERIFIED  # confirmatory (Oliver, 2026-07-21)
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: desk_o1,       room: office,   aliases: [desk]}
  - {id: bookshelf_o1,  room: office,   aliases: []}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: older full-time remote worker, home all day at the desk
    schedule:
      - {activity: sleep,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "22:30", end: "06:45"}  # [ATUS]
      - {activity: morning_meds,days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "06:45", end: "07:10"}  # [DESIGN]
      - {activity: breakfast,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:10", end: "07:45"}  # [ATUS]
      - {activity: desk_setup,  days: [Mo,Tu,We,Th,Fr],       start: "08:30", end: "09:00"}  # [DESIGN] rig at the desk
      - {activity: desk_work_am,days: [Mo,Tu,We,Th,Fr],       start: "09:00", end: "12:30"}  # [DESIGN] no-op (at desk)
      - {activity: desk_lunch,  days: [Mo,Tu,We,Th,Fr],       start: "12:30", end: "13:15"}  # [DESIGN]
      - {activity: desk_work_pm,days: [Mo,Tu,We,Th,Fr],       start: "13:15", end: "17:00"}  # [DESIGN] no-op
      - {activity: tv_afternoon,days: [Sa,Su],                start: "14:00", end: "16:00"}  # [ATUS] weekend
      - {activity: dinner,      days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "18:00", end: "18:45"}  # [ATUS]
      - {activity: tv_evening,  days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:30", end: "22:00"}  # [ATUS]
activities:
  morning_meds:
    jitter_min: 10
    objects: [pill_organizer, reading_glasses]
    during: {pill_organizer: counter_k1, reading_glasses: counter_k1}
    after:
      pill_organizer:  {dest: cupboard_k1, p: 0.8, else: counter_k1}
      reading_glasses: {dest: desk_o1, p: 0.6, else: counter_k1}
  breakfast:
    jitter_min: 10
    objects: [coffee_mug, bowl]
    during: {coffee_mug: counter_k1, bowl: table_d1}
    after:
      coffee_mug: {dest: counter_k1, p: 0.5, else: sink_k1}
      bowl:       {dest: sink_k1, p: 0.8, else: table_d1}
  desk_setup:
    jitter_min: 15                                   # [DESIGN] the home-office rig + mug come to the desk
    objects: [laptop, headset, webcam, coffee_mug, phone, reading_glasses]
    during: {laptop: desk_o1, headset: desk_o1, webcam: desk_o1, coffee_mug: desk_o1,
             phone: desk_o1, reading_glasses: desk_o1}
    after:
      laptop:          {dest: desk_o1, p: 0.95}
      headset:         {dest: desk_o1, p: 0.95}
      webcam:          {dest: desk_o1, p: 0.98}
      coffee_mug:      {dest: desk_o1, p: 0.6, else: sink_k1}   # [DESIGN] mug lives at the desk on work days
      phone:           {dest: desk_o1, p: 0.6, else: sofa_l1}
      reading_glasses: {dest: desk_o1, p: 0.8, else: coffee_table_l1}
  desk_lunch:
    jitter_min: 15
    objects: [plate, fork, coffee_mug]
    during: {plate: table_d1, fork: table_d1, coffee_mug: counter_k1}
    after:
      plate:      {dest: sink_k1, p: 0.85, else: table_d1}
      fork:       {dest: sink_k1, p: 0.85, else: table_d1}
      coffee_mug: {dest: desk_o1, p: 0.6, else: counter_k1}     # back to the desk
  tv_afternoon:
    jitter_min: 20
    objects: [remote, reading_glasses]
    during: {remote: sofa_l1, reading_glasses: coffee_table_l1}
    after:
      remote:          {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
      reading_glasses: {dest: coffee_table_l1, p: 0.6, else: sofa_l1}
  dinner:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.85, else: sofa_l1}
placements:
  # DIAGNOSTIC (STRUCTURE-sufficient home-office rig)
  laptop:  {home: desk_o1, volatility_class_hint: high}          # [DESIGN]
  headset: {home: desk_o1, volatility_class_hint: high}          # [DESIGN]
  webcam:  {home: desk_o1, volatility_class_hint: static}        # [DESIGN]
  # DEPENDENT (shared; regime -> desk midday)
  coffee_mug:      {home: cupboard_k1, volatility_class_hint: high}   # [DESIGN]
  phone:           {home: nightstand_r1, volatility_class_hint: high}
  reading_glasses: {home: coffee_table_l1, volatility_class_hint: high}
  # ordinary
  pill_organizer: {home: cupboard_k1}
  bowl:   {home: cupboard_k1}
  plate:  {home: cupboard_k1}
  fork:   {home: cupboard_k1}
  remote: {home: coffee_table_l1}
  keys:   {home: entry_hook_e1, p_misplace: 0.08, misplace_set: [counter_k1, desk_o1]}
  # static
  toaster:       {home: counter_k1,   volatility_class_hint: static}
  router:        {home: bookshelf_o1, volatility_class_hint: static}
  first_aid_kit: {home: bathroom_c1,  volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9. [DESIGN]
