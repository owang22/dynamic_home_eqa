# coparent_altcustody_atyp_v1 -- ATYPICAL base (object-role reassignment +
#                                periodic object presence)
#
# METHODOLOGY DEPARTURE (see studio_convert_atyp_v1 header for the full note):
# hand-authored atypical (model DRAFT by Claude, outside the evaluated set),
# NOT a transforms.py output, status DRAFT until human-verified. Two attacks
# the timing-only registered transforms cannot express:
#
#   1. OBJECT-ROLE REASSIGNMENT (attacks class-level placement priors head-on):
#      * the keys live in a decorative BOWL by the front door, not on a hook
#        (receptacle entry_bowl_e1);
#      * the toys live in a laundry BASKET in the living room -- the basket IS
#        the toy bin (receptacle toy_basket_l1);
#      * the pens live in a MUG on the desk (receptacle desk_mug_o1).
#      Each is cheap to state in language yet impossible to guess from the
#      object's class: the model knows what bowls/baskets/mugs are "for" and
#      here it is wrong. Good for the held-out-object attribution test.
#
#   2. PERIODIC OBJECT PRESENCE: Sam co-parents; his child Theo is here only
#      part of the week (custody handoff Thursday evening -> Sunday). Theo's
#      objects (cup_t, plate_t, dino_t, book_t, backpack_t, booster_seat) cycle
#      Thu-Sun and sit MOTIONLESS Mon-Wed -- an appear/disappear dynamic on a
#      weekly cycle. NOTE: true ALTERNATING-WEEK (14-day) custody cannot be
#      encoded in a one-week profile; that variant belongs to the 2-week,
#      non-reportable bank path (cf. transforms.rotating_shift). This profile
#      captures the within-week custody split, which is single-week-expressible.
#
# Two residents; every child object is a distinct per-resident instance
# (suffix _t) so no object is ever required in two receptacles at once (V1).
#
# Provenance key: [ATUS] [BEHAV] [HOMER] [HKEEP] [DESIGN]. The reassigned homes
# and the custody structure are [DESIGN].

household: coparent_altcustody_atyp_v1
status: VERIFIED  # verified by researcher (Oliver, 2026-07-21)
derived_from: null
transformation: null

receptacles:
  # Sam's room
  - {id: bed_a1,          room: bedroom_a, aliases: [bed]}
  - {id: nightstand_a1,   room: bedroom_a, aliases: []}
  - {id: closet_a1,       room: bedroom_a, aliases: [wardrobe]}
  # Theo's room
  - {id: bed_b1,          room: bedroom_b, aliases: []}
  - {id: nightstand_b1,   room: bedroom_b, aliases: []}
  - {id: toy_shelf_b1,    room: bedroom_b, aliases: []}
  - {id: counter_k1,      room: kitchen,   aliases: [kitchen_counter]}
  - {id: cupboard_k1,     room: kitchen,   aliases: [cabinet_k1]}
  - {id: sink_k1,         room: kitchen,   aliases: []}
  - {id: stove_k1,        room: kitchen,   aliases: []}
  - {id: fridge_k1,       room: kitchen,   aliases: []}
  - {id: table_d1,        room: dining,    aliases: [dining_table]}
  - {id: sofa_l1,         room: living,    aliases: [couch]}
  - {id: coffee_table_l1, room: living,    aliases: []}
  - {id: tv_stand_l1,     room: living,    aliases: []}
  # object-role-reassignment receptacle: a laundry basket that is the toy bin
  - {id: toy_basket_l1,   room: living,    aliases: [laundry_basket]}   # [DESIGN] basket == toy bin
  - {id: desk_o1,         room: office,    aliases: [desk]}
  # object-role-reassignment receptacle: a mug on the desk that holds the pens
  - {id: desk_mug_o1,     room: office,    aliases: [pen_mug]}          # [DESIGN] mug == pen cup
  # object-role-reassignment receptacle: a bowl by the door that holds the keys
  - {id: entry_bowl_e1,   room: entryway,  aliases: [key_bowl]}         # [DESIGN] bowl == key dish
  - {id: shelf_e1,        room: entryway,  aliases: []}
  - {id: bathroom_c1,     room: bathroom,  aliases: [bathroom_cabinet]}

residents:
  - id: R1
    description: co-parenting single father, in-office weekday job
    schedule:
      - {activity: sleep,        days: [Mo,Tu,We,Th,Fr], start: "22:30", end: "06:30"}  # [ATUS]
      - {activity: morning_prep, days: [Mo,Tu,We,Th,Fr], start: "06:30", end: "07:00"}  # [ATUS]
      - {activity: breakfast,    days: [Mo,Tu,We,Th,Fr], start: "07:00", end: "07:30"}  # [ATUS]
      - {activity: leave_work,   days: [Mo,Tu,We,Th,Fr], start: "07:30", end: "07:50"}  # [ATUS]
      - {activity: away_at_work, days: [Mo,Tu,We,Th,Fr], start: "08:00", end: "17:00"}  # [ATUS] no-op
      - {activity: return_home,  days: [Mo,Tu,We,Th,Fr], start: "17:00", end: "17:30"}  # [ATUS]
      - {activity: cook_dinner,  days: [Mo,Tu,We,Th,Fr], start: "18:00", end: "18:45"}  # [ATUS]
      - {activity: dinner,       days: [Mo,Tu,We,Th,Fr], start: "18:45", end: "19:15"}  # [ATUS]
      - {activity: tv_evening,   days: [Mo,Tu,We,Th,Fr], start: "20:30", end: "22:00"}  # [ATUS]
      - {activity: sleep,        days: [Sa,Su],          start: "00:30", end: "08:00"}  # [ATUS] weekend (non-wrapping: avoids Sun-night bleed into Mon morning)
      - {activity: breakfast,    days: [Sa,Su],          start: "08:30", end: "09:00"}  # [ATUS]
      - {activity: park_outing,  days: [Sa,Su],          start: "10:00", end: "12:00"}  # [DESIGN] with Theo
      - {activity: return_park,  days: [Sa,Su],          start: "12:00", end: "12:20"}  # [DESIGN]
      - {activity: home_admin,   days: [Su],             start: "15:00", end: "16:00"}  # [DESIGN] pays bills at the desk
      - {activity: cook_dinner,  days: [Sa,Su],          start: "18:00", end: "18:45"}  # [ATUS]
      - {activity: dinner,       days: [Sa,Su],          start: "18:45", end: "19:15"}  # [ATUS]
      - {activity: tv_evening,   days: [Sa,Su],          start: "20:00", end: "22:00"}  # [ATUS]
  - id: R2
    description: child (age 6), present under custody Thursday evening to Sunday
    schedule:
      - {activity: arrive_home,    days: [Th],          start: "17:30", end: "17:45"}  # [DESIGN] custody handoff
      - {activity: dinner_kid,     days: [Th,Fr,Sa,Su], start: "18:45", end: "19:15"}  # [DESIGN]
      - {activity: playtime,       days: [Th],          start: "19:15", end: "20:00"}  # [DESIGN]
      - {activity: bedtime_story,  days: [Th,Fr,Sa,Su], start: "20:00", end: "20:30"}  # [DESIGN]
      - {activity: sleep_kid,      days: [Th,Fr,Sa,Su], start: "20:30", end: "06:45"}  # [DESIGN]
      - {activity: morning_kid,    days: [Fr,Sa,Su],    start: "06:45", end: "07:15"}  # [DESIGN]
      - {activity: breakfast_kid,  days: [Fr,Sa,Su],    start: "07:15", end: "07:45"}  # [DESIGN]
      - {activity: leave_school,   days: [Fr],          start: "07:45", end: "08:00"}  # [DESIGN]
      - {activity: at_school,      days: [Fr],          start: "08:00", end: "15:00"}  # [DESIGN] no-op
      - {activity: return_school,  days: [Fr],          start: "15:00", end: "15:15"}  # [DESIGN]
      - {activity: playtime,       days: [Fr],          start: "15:30", end: "17:30"}  # [DESIGN]
      - {activity: park_outing_kid,days: [Sa,Su],       start: "10:00", end: "12:00"}  # [DESIGN]
      - {activity: return_park_kid,days: [Sa,Su],       start: "12:00", end: "12:15"}  # [DESIGN]
      - {activity: playtime,       days: [Sa,Su],       start: "14:00", end: "16:00"}  # [DESIGN]

activities:
  # ── Sam (R1) ────────────────────────────────────────────────────────────────
  morning_prep:
    jitter_min: 10                                   # [HOMER]
    objects: [phone, glasses]
    during: {phone: nightstand_a1, glasses: nightstand_a1}
    after:
      phone:   {dest: counter_k1, p: 0.85, else: nightstand_a1}
      glasses: {dest: null, p: 1.0}
  breakfast:
    jitter_min: 10                                   # [HOMER]
    objects: [mug, bowl]
    during: {mug: counter_k1, bowl: table_d1}        # [BEHAV]
    after:
      mug:  {dest: sink_k1, p: 0.7, else: counter_k1}            # [HKEEP]
      bowl: {dest: sink_k1, p: 0.8, else: table_d1}              # [HKEEP]
  leave_work:
    jitter_min: 5                                    # [DESIGN]
    objects: [keys, wallet, phone, laptop]
    after:
      keys:   {dest: null, p: 1.0}
      wallet: {dest: null, p: 1.0}
      phone:  {dest: null, p: 1.0}
      laptop: {dest: null, p: 0.9, else: desk_o1}
  return_home:
    jitter_min: 20                                   # [DESIGN]
    objects: [keys, wallet, phone, laptop, glasses]
    after:
      keys:   {dest: entry_bowl_e1, p: 0.85, else: counter_k1}   # [DESIGN] keys go in the door BOWL, not a hook
      wallet: {dest: entry_bowl_e1, p: 0.6, else: desk_o1}       # [DESIGN] wallet shares the bowl
      phone:  {dest: sofa_l1, p: 0.5, else: counter_k1}
      laptop: {dest: desk_o1, p: 0.8, else: sofa_l1}             # [HKEEP]
      glasses: {dest: null, p: 1.0}
  cook_dinner:
    jitter_min: 25                                   # [HOMER]
    objects: [pan, cutting_board, knife]
    during:
      pan:           stove_k1     # [BEHAV]
      cutting_board: counter_k1   # [DESIGN] BEHAVIOR-1K models 'countertop', not a distinct board synset
      knife:         counter_k1   # [BEHAV]
    after:
      pan:           {dest: sink_k1, p: 0.6, else: stove_k1}     # [HKEEP]
      cutting_board: {dest: sink_k1, p: 0.7, else: counter_k1}
      knife:         {dest: sink_k1, p: 0.9, else: counter_k1}
  dinner:
    jitter_min: 10
    objects: [plate, fork, water_glass]
    during: {plate: table_d1, fork: table_d1, water_glass: table_d1}
    after:
      plate:       {dest: sink_k1, p: 0.85, else: table_d1}
      fork:        {dest: sink_k1, p: 0.85, else: table_d1}
      water_glass: {dest: sink_k1, p: 0.5,  else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote_control, phone]
    during: {remote_control: sofa_l1, phone: sofa_l1}
    after:
      remote_control: {dest: tv_stand_l1, p: 0.4, else: sofa_l1}
      phone:          {dest: nightstand_a1, p: 0.9, else: sofa_l1}
  park_outing:
    jitter_min: 25                                   # [DESIGN]
    objects: [keys, tote, phone]
    after:
      keys:  {dest: null, p: 1.0}
      tote:  {dest: null, p: 1.0}
      phone: {dest: null, p: 1.0}
  return_park:
    jitter_min: 15                                   # [DESIGN]
    objects: [keys, tote, phone]
    after:
      keys:  {dest: entry_bowl_e1, p: 0.85, else: counter_k1}    # [DESIGN] back in the bowl
      tote:  {dest: shelf_e1, p: 0.7, else: sofa_l1}
      phone: {dest: sofa_l1, p: 0.5, else: counter_k1}
  home_admin:
    jitter_min: 20                                   # [DESIGN]
    objects: [laptop, pens]
    during: {laptop: desk_o1, pens: desk_o1}
    after:
      laptop: {dest: desk_o1, p: 0.9, else: sofa_l1}
      pens:   {dest: desk_mug_o1, p: 0.9, else: desk_o1}         # [DESIGN] pens live in the desk MUG
  # ── Theo (R2) ───────────────────────────────────────────────────────────────
  arrive_home:
    jitter_min: 15                                   # [DESIGN]
    objects: [backpack_t, dino_t]
    after:
      backpack_t: {dest: toy_shelf_b1, p: 0.6, else: sofa_l1}
      dino_t:     {dest: toy_basket_l1, p: 0.7, else: sofa_l1}   # [DESIGN] toys go in the laundry BASKET
  morning_kid:
    jitter_min: 12                                   # [DESIGN]
    objects: [cup_t]
    during: {cup_t: table_d1}
    after:
      cup_t: {dest: sink_k1, p: 0.7, else: table_d1}
  breakfast_kid:
    jitter_min: 12                                   # [DESIGN]
    objects: [cup_t, bowl_t]
    during: {cup_t: table_d1, bowl_t: table_d1}
    after:
      cup_t:  {dest: sink_k1, p: 0.7, else: table_d1}
      bowl_t: {dest: sink_k1, p: 0.8, else: table_d1}
  leave_school:
    jitter_min: 5                                    # [DESIGN]
    objects: [backpack_t]
    after:
      backpack_t: {dest: null, p: 1.0}
  return_school:
    jitter_min: 15                                   # [DESIGN]
    objects: [backpack_t]
    after:
      backpack_t: {dest: toy_shelf_b1, p: 0.7, else: sofa_l1}
  playtime:
    jitter_min: 25                                   # [DESIGN]
    objects: [dino_t, book_t]
    during: {dino_t: sofa_l1, book_t: sofa_l1}
    after:
      dino_t: {dest: toy_basket_l1, p: 0.6, else: sofa_l1}       # [DESIGN]
      book_t: {dest: toy_basket_l1, p: 0.5, else: sofa_l1}       # [DESIGN]
  dinner_kid:
    jitter_min: 10
    objects: [plate_t, fork_t, cup_t, booster_seat]
    during: {plate_t: table_d1, fork_t: table_d1, cup_t: table_d1, booster_seat: table_d1}
    after:
      plate_t:      {dest: sink_k1, p: 0.8, else: table_d1}
      fork_t:       {dest: sink_k1, p: 0.8, else: table_d1}
      cup_t:        {dest: sink_k1, p: 0.6, else: table_d1}
      booster_seat: {dest: table_d1, p: 1.0}                     # stays at the table
  bedtime_story:
    jitter_min: 15                                   # [DESIGN]
    objects: [book_t]
    during: {book_t: bed_b1}
    after:
      book_t: {dest: toy_basket_l1, p: 0.6, else: nightstand_b1} # [DESIGN]
  park_outing_kid:
    jitter_min: 25                                   # [DESIGN]
    objects: [dino_t]
    after:
      dino_t: {dest: null, p: 1.0}
  return_park_kid:
    jitter_min: 15                                   # [DESIGN]
    objects: [dino_t]
    after:
      dino_t: {dest: toy_basket_l1, p: 0.8, else: sofa_l1}       # [DESIGN]

placements:
  # ── Sam's objects ───────────────────────────────────────────────────────────
  phone:          {home: nightstand_a1, volatility_class_hint: high}
  glasses:        {home: nightstand_a1}
  keys:           {home: entry_bowl_e1, p_misplace: 0.10, misplace_set: [counter_k1, desk_o1]}   # [DESIGN] home is the door bowl
  wallet:         {home: entry_bowl_e1, p_misplace: 0.08, misplace_set: [desk_o1, sofa_l1]}      # [DESIGN]
  laptop:         {home: desk_o1}                                                                # [HKEEP]
  tote:           {home: shelf_e1, p_misplace: 0.10, misplace_set: [sofa_l1, entry_bowl_e1]}
  pens:           {home: desk_mug_o1}                                                            # [DESIGN] pens live in the desk mug
  mug:            {home: cupboard_k1}
  bowl:           {home: cupboard_k1}
  plate:          {home: cupboard_k1}
  fork:           {home: cupboard_k1}
  water_glass:    {home: cupboard_k1}
  pan:            {home: cupboard_k1}
  cutting_board:  {home: counter_k1}
  knife:          {home: cupboard_k1}
  remote_control: {home: tv_stand_l1}
  # ── Theo's objects (present/cycling Thu-Sun; motionless Mon-Wed) ─────────────
  cup_t:          {home: cupboard_k1, volatility_class_hint: high}
  bowl_t:         {home: cupboard_k1}
  plate_t:        {home: cupboard_k1}
  fork_t:         {home: cupboard_k1}
  dino_t:         {home: toy_basket_l1, volatility_class_hint: high}   # [DESIGN] toy's home is the laundry basket
  book_t:         {home: toy_basket_l1}                                # [DESIGN]
  backpack_t:     {home: toy_shelf_b1, volatility_class_hint: high}
  booster_seat:   {home: table_d1}                                     # [DESIGN] lives at the dining table
  # ── static low-volatility tercile (never activity-bound) ────────────────────
  router:         {home: tv_stand_l1, volatility_class_hint: static}
  vase:           {home: table_d1,    volatility_class_hint: static}
  family_photo:   {home: shelf_e1,    volatility_class_hint: static}
  first_aid_kit:  {home: bathroom_c1, volatility_class_hint: static}

# Dish-cycle rule (generator-level, all profiles): objects on sink_k1 at 21:30
# return home at 21:45 with p=0.9. [DESIGN]
