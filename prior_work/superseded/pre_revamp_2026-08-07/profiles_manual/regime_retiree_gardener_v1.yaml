# regime_retiree_gardener_v1 -- CONFIRMATORY pair (unseen during design)
# Persona: a retiree who gardens every morning and is home all day.
# DIAGNOSTIC (persona-exclusive, SEMANTICS-necessary): gardening_gloves,
#   watering_can, pill_organizer, newspaper -- you must KNOW these mean "retiree
#   gardener" to predict the shared objects; the anonymized pattern (objects on a
#   patio at 09:00) is ambiguous with any home-all-day persona.
# DEPENDENT (shared): coffee_mug, phone, reading_glasses -> on the PATIO in the
#   morning (gardening), not at a desk. Query targets.
# CONFUSABLE PARTNER: regime_wfh_senior_v1 (also home all day, but at a desk).
household: regime_retiree_gardener_v1
status: VERIFIED  # confirmatory (Oliver, 2026-07-21)
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,        room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1, room: bedroom,  aliases: []}
  - {id: sofa_l1,       room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living, aliases: []}
  - {id: tv_stand_l1,   room: living,   aliases: []}
  - {id: patio_table_p1, room: patio,   aliases: [garden_table]}
  - {id: potting_bench_p1, room: patio, aliases: [garden_bench]}
  - {id: counter_k1,    room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,   room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,       room: kitchen,  aliases: []}
  - {id: fridge_k1,     room: kitchen,  aliases: []}
  - {id: table_d1,      room: dining,   aliases: [dining_table]}
  - {id: entry_hook_e1, room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,   room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: retiree, gardens every morning, home all day
    schedule:
      - {activity: sleep,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "22:30", end: "06:30"}  # [ATUS]
      - {activity: morning_meds,days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "06:30", end: "07:00"}  # [DESIGN] pill_organizer
      - {activity: breakfast,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "07:00", end: "07:40"}  # [ATUS] newspaper
      - {activity: gardening,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "08:30", end: "11:00"}  # [DESIGN] on the patio
      - {activity: lunch,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "12:00", end: "12:45"}  # [ATUS]
      - {activity: tv_afternoon,days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "14:00", end: "16:00"}  # [ATUS]
      - {activity: dinner,      days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "18:00", end: "18:45"}  # [ATUS]
      - {activity: tv_evening,  days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:30", end: "22:00"}  # [ATUS]
activities:
  morning_meds:
    jitter_min: 10
    objects: [pill_organizer, reading_glasses]
    during: {pill_organizer: counter_k1, reading_glasses: counter_k1}
    after:
      pill_organizer:  {dest: cupboard_k1, p: 0.8, else: counter_k1}
      reading_glasses: {dest: table_d1, p: 0.6, else: counter_k1}
  breakfast:
    jitter_min: 10
    objects: [newspaper, coffee_mug, bowl, reading_glasses]
    during: {newspaper: table_d1, coffee_mug: table_d1, bowl: table_d1, reading_glasses: table_d1}
    after:
      newspaper:       {dest: coffee_table_l1, p: 0.6, else: table_d1}
      coffee_mug:      {dest: patio_table_p1, p: 0.7, else: table_d1}   # [DESIGN] carried out to the garden
      bowl:            {dest: sink_k1, p: 0.8, else: table_d1}
      reading_glasses: {dest: coffee_table_l1, p: 0.5, else: table_d1}
  gardening:
    jitter_min: 20                                   # [DESIGN] on the patio all morning
    objects: [gardening_gloves, watering_can, coffee_mug, phone]
    during: {gardening_gloves: potting_bench_p1, watering_can: potting_bench_p1,
             coffee_mug: patio_table_p1, phone: patio_table_p1}
    after:
      gardening_gloves: {dest: potting_bench_p1, p: 0.9}
      watering_can:     {dest: potting_bench_p1, p: 0.9}
      coffee_mug:       {dest: sink_k1, p: 0.6, else: patio_table_p1}
      phone:            {dest: coffee_table_l1, p: 0.5, else: patio_table_p1}
  lunch:
    jitter_min: 15
    objects: [plate, fork, coffee_mug]
    during: {plate: table_d1, fork: table_d1, coffee_mug: counter_k1}
    after:
      plate:      {dest: sink_k1, p: 0.85, else: table_d1}
      fork:       {dest: sink_k1, p: 0.85, else: table_d1}
      coffee_mug: {dest: sink_k1, p: 0.6, else: counter_k1}
  tv_afternoon:
    jitter_min: 20
    objects: [remote, reading_glasses, phone]
    during: {remote: sofa_l1, reading_glasses: coffee_table_l1, phone: sofa_l1}
    after:
      remote:          {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
      reading_glasses: {dest: coffee_table_l1, p: 0.6, else: sofa_l1}
      phone:           {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
  dinner:
    jitter_min: 10
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  tv_evening:
    jitter_min: 20
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.4, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.85, else: sofa_l1}
placements:
  # DIAGNOSTIC (persona-exclusive; SEMANTICS-necessary)
  gardening_gloves: {home: potting_bench_p1, volatility_class_hint: high}   # [DESIGN]
  watering_can:     {home: potting_bench_p1}                                # [DESIGN]
  pill_organizer:   {home: cupboard_k1, volatility_class_hint: high}        # [DESIGN]
  newspaper:        {home: table_d1, volatility_class_hint: high}           # [DESIGN]
  # DEPENDENT (shared; regime -> patio in the morning)
  coffee_mug:       {home: cupboard_k1, volatility_class_hint: high}        # [DESIGN]
  phone:            {home: nightstand_r1, volatility_class_hint: high}
  reading_glasses:  {home: coffee_table_l1, volatility_class_hint: high}    # [DESIGN]
  # ordinary
  bowl:    {home: cupboard_k1}
  plate:   {home: cupboard_k1}
  fork:    {home: cupboard_k1}
  remote:  {home: coffee_table_l1}
  keys:    {home: entry_hook_e1, p_misplace: 0.08, misplace_set: [counter_k1, coffee_table_l1]}
  # static
  toaster:       {home: counter_k1,  volatility_class_hint: static}
  router:        {home: tv_stand_l1, volatility_class_hint: static}
  first_aid_kit: {home: bathroom_c1, volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9. [DESIGN]
