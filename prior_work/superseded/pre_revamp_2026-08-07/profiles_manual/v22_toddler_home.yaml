# v22_toddler_home -- VERSION22b confusable pair H (with v22_pet_heavy).
# Both are home-centered households that churn floor objects all day; they DIFFER
# IN WHICH OBJECTS CHURN AND WHERE: here a TODDLER's play drags cushion/blanket/
# ball onto the PLAY MAT and toy corner. Regime-legible: sippy_cup + board_book +
# stacking_rings => "home with a toddler" => the soft shared objects live in the
# play area, not a dog bed.
# DIAGNOSTIC: sippy_cup, board_book, stacking_rings, high_chair_tray.
# DEPENDENT targets (shared class): cushion, blanket, ball -> play_mat_n1 /
#   toy_corner_l1 during the day.
# STATIC DISTRACTORS: dining_chair, bed_pillow, wall_clock, floor_lamp, doormat,
#   waste_bin, picture_frame, bath_mat.
household: v22_toddler_home
status: DRAFT  # version22b authoring 2026-07-22 — needs human anchor verification
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,          room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1,   room: bedroom,  aliases: []}
  - {id: crib_n1,         room: nursery,  aliases: []}
  - {id: play_mat_n1,     room: nursery,  aliases: [playmat]}
  - {id: sofa_l1,         room: living,   aliases: [couch]}
  - {id: coffee_table_l1, room: living,   aliases: []}
  - {id: toy_corner_l1,   room: living,   aliases: [toy_bin]}
  - {id: counter_k1,      room: kitchen,  aliases: [kitchen_counter]}
  - {id: cupboard_k1,     room: kitchen,  aliases: [cabinet_k1]}
  - {id: sink_k1,         room: kitchen,  aliases: []}
  - {id: table_d1,        room: dining,   aliases: [dining_table]}
  - {id: high_chair_d1,   room: dining,   aliases: [highchair]}
  - {id: entry_hook_e1,   room: entryway, aliases: [key_hook]}
  - {id: bathroom_c1,     room: bathroom, aliases: [bathroom_cabinet]}
residents:
  - id: R1
    description: parent home with a toddler; floor play all day, naps at midday
    schedule:
      - {activity: sleep,        days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "21:45", end: "06:15"}
      - {activity: breakfast,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "06:45", end: "07:30"}
      - {activity: morning_play, days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "09:00", end: "11:30"}
      - {activity: lunch,        days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "11:45", end: "12:30"}
      - {activity: nap,          days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "13:00", end: "15:00"}
      - {activity: afternoon_play, days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "15:30", end: "17:00"}
      - {activity: dinner,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "17:45", end: "18:30"}
      - {activity: bedtime,      days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:00", end: "19:45"}
      - {activity: parent_tv,    days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "20:15", end: "21:30"}
activities:
  breakfast:
    jitter_min: 10
    objects: [sippy_cup, bowl, high_chair_tray]
    during: {sippy_cup: high_chair_d1, bowl: high_chair_d1, high_chair_tray: high_chair_d1}
    after:
      sippy_cup:       {dest: sink_k1, p: 0.8, else: high_chair_d1}
      bowl:            {dest: sink_k1, p: 0.85, else: high_chair_d1}
      high_chair_tray: {dest: high_chair_d1, p: 0.9}
  morning_play:
    jitter_min: 20
    objects: [board_book, stacking_rings, ball, cushion, blanket, sippy_cup]
    during: {board_book: play_mat_n1, stacking_rings: play_mat_n1, ball: play_mat_n1,
             cushion: play_mat_n1, blanket: play_mat_n1, sippy_cup: play_mat_n1}
    after:
      board_book:     {dest: toy_corner_l1, p: 0.6, else: play_mat_n1}
      stacking_rings: {dest: toy_corner_l1, p: 0.7, else: play_mat_n1}
      ball:           {dest: toy_corner_l1, p: 0.5, else: play_mat_n1}   # shared: toy area
      cushion:        {dest: play_mat_n1, p: 0.55, else: sofa_l1}        # shared: fort on the mat
      blanket:        {dest: play_mat_n1, p: 0.55, else: crib_n1}        # shared: nap blanket
      sippy_cup:      {dest: sink_k1, p: 0.6, else: play_mat_n1}
  lunch:
    jitter_min: 10
    objects: [sippy_cup, plate, high_chair_tray]
    during: {sippy_cup: high_chair_d1, plate: high_chair_d1, high_chair_tray: high_chair_d1}
    after:
      sippy_cup:       {dest: sink_k1, p: 0.8, else: high_chair_d1}
      plate:           {dest: sink_k1, p: 0.85, else: high_chair_d1}
      high_chair_tray: {dest: high_chair_d1, p: 0.9}
  nap:
    jitter_min: 15
    objects: [blanket, cushion]
    during: {blanket: crib_n1, cushion: sofa_l1}
    after:
      blanket: {dest: crib_n1, p: 0.7, else: play_mat_n1}
      cushion: {dest: sofa_l1, p: 0.7, else: play_mat_n1}
  afternoon_play:
    jitter_min: 20
    objects: [ball, stacking_rings, cushion, board_book]
    during: {ball: play_mat_n1, stacking_rings: play_mat_n1, cushion: play_mat_n1,
             board_book: play_mat_n1}
    after:
      ball:           {dest: toy_corner_l1, p: 0.55, else: play_mat_n1}
      stacking_rings: {dest: toy_corner_l1, p: 0.7, else: play_mat_n1}
      cushion:        {dest: play_mat_n1, p: 0.5, else: sofa_l1}
      board_book:     {dest: toy_corner_l1, p: 0.6, else: play_mat_n1}
  dinner:
    jitter_min: 10
    objects: [sippy_cup, plate, fork]
    during: {sippy_cup: high_chair_d1, plate: high_chair_d1, fork: high_chair_d1}
    after:
      sippy_cup: {dest: sink_k1, p: 0.8, else: high_chair_d1}
      plate:     {dest: sink_k1, p: 0.85, else: high_chair_d1}
      fork:      {dest: sink_k1, p: 0.85, else: high_chair_d1}
  bedtime:
    jitter_min: 15
    objects: [board_book, blanket, sippy_cup]
    during: {board_book: crib_n1, blanket: crib_n1, sippy_cup: crib_n1}
    after:
      board_book: {dest: toy_corner_l1, p: 0.5, else: crib_n1}
      blanket:    {dest: crib_n1, p: 0.8, else: play_mat_n1}
      sippy_cup:  {dest: sink_k1, p: 0.7, else: crib_n1}
  parent_tv:
    jitter_min: 15
    objects: [remote, phone, cushion]
    during: {remote: sofa_l1, phone: sofa_l1, cushion: sofa_l1}
    after:
      remote:  {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
      phone:   {dest: nightstand_r1, p: 0.85, else: sofa_l1}
      cushion: {dest: sofa_l1, p: 0.7, else: play_mat_n1}
placements:
  # DIAGNOSTIC (persona-exclusive)
  sippy_cup:        {home: cupboard_k1, volatility_class_hint: high}
  board_book:       {home: toy_corner_l1, volatility_class_hint: high}
  stacking_rings:   {home: toy_corner_l1}
  high_chair_tray:  {home: high_chair_d1}
  # DEPENDENT targets (shared class; regime -> play area during the day)
  cushion: {home: sofa_l1, volatility_class_hint: high}
  blanket: {home: crib_n1, volatility_class_hint: high}
  ball:    {home: toy_corner_l1, volatility_class_hint: high}
  # ordinary
  bowl:  {home: cupboard_k1}
  plate: {home: cupboard_k1}
  fork:  {home: cupboard_k1}
  remote: {home: coffee_table_l1}
  phone: {home: nightstand_r1, volatility_class_hint: high}
  keys:  {home: entry_hook_e1, p_misplace: 0.06, misplace_set: [counter_k1, coffee_table_l1]}
  # STATIC DISTRACTORS
  dining_chair:  {home: table_d1,        volatility_class_hint: static}
  bed_pillow:    {home: bed_r1,          volatility_class_hint: static}
  wall_clock:    {home: counter_k1,      volatility_class_hint: static}
  floor_lamp:    {home: sofa_l1,         volatility_class_hint: static}
  doormat:       {home: entry_hook_e1,   volatility_class_hint: static}
  waste_bin:     {home: counter_k1,      volatility_class_hint: static}
  picture_frame: {home: coffee_table_l1, volatility_class_hint: static}
  bath_mat:      {home: bathroom_c1,     volatility_class_hint: static}
# Dish-cycle: sink_k1 at 21:30 -> home at 21:45, p=0.9.
