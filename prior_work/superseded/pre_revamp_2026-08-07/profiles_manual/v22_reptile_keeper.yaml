      - {activity: herp_meetup,  days: [Sa],                   start: "13:00", end: "16:00"}
      - {activity: dinner,       days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "19:00", end: "19:40"}
      - {activity: lamp_check,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "20:00", end: "20:40"}
      - {activity: tv_evening,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "20:50", end: "22:45"}
activities:
