    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
      phone:  {dest: sofa_l1, p: 0.6, else: coffee_table_l1}
  leave_shift:
    jitter_min: 5
    objects: [keys, phone, lunch_box]
    after:
      keys:      {dest: null, p: 1.0}
      phone:     {dest: null, p: 1.0}
      lunch_box: {dest: null, p: 1.0}
  return_shift:
    jitter_min: 15
    objects: [keys, phone, lunch_box]
    after:
      keys:      {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone:     {dest: sofa_l1, p: 0.5, else: counter_k1}
      lunch_box: {dest: sink_k1, p: 0.7, else: counter_k1}
  herp_meetup:
    jitter_min: 20
    objects: [keys, phone]
    after:
      keys:  {dest: entry_hook_e1, p: 0.85, else: counter_k1}
      phone: {dest: sofa_l1, p: 0.5, else: counter_k1}
  dinner:
    jitter_min: 15
    objects: [plate, fork]
    during: {plate: table_d1, fork: table_d1}
    after:
      plate: {dest: sink_k1, p: 0.85, else: table_d1}
      fork:  {dest: sink_k1, p: 0.85, else: table_d1}
  lamp_check:
    jitter_min: 10
    objects: [notebook, spray_bottle, phone]
    during: {notebook: terrarium_stand_s1, spray_bottle: terrarium_stand_s1,
             phone: terrarium_stand_s1}
    after:
      notebook:     {dest: terrarium_stand_s1, p: 0.9}
      spray_bottle: {dest: terrarium_stand_s1, p: 0.9}
      phone:        {dest: sofa_l1, p: 0.7, else: terrarium_stand_s1}
  tv_evening:
    jitter_min: 15
    objects: [remote, phone]
    during: {remote: sofa_l1, phone: sofa_l1}
    after:
      remote: {dest: coffee_table_l1, p: 0.5, else: sofa_l1}
      phone:  {dest: nightstand_r1, p: 0.85, else: sofa_l1}
