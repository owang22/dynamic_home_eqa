      - {activity: care_round,   days: [Mo,Tu,We,Th,Fr,Sa,Su], start: "08:00", end: "08:50"}
      - {activity: leave_shift,  days: [Mo,Tu,We,Th,Fr],       start: "12:00", end: "12:15"}
      - {activity: away_shift,   days: [Mo,Tu,We,Th,Fr],       start: "12:15", end: "18:15"}
      - {activity: return_shift, days: [Mo,Tu,We,Th,Fr],       start: "18:15", end: "18:35"}
