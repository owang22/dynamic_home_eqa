# v22_reptile_keeper -- VERSION22 confirmatory household (pair D with
# v22_plant_collector: both do 08:00 care rounds with water/spray gear, but the
#   gear clusters at a TERRARIUM STAND in the study, not a plant windowsill).
# Persona: keeps two geckos and a snake; 08:00 misting/feeding round + 20:00
#   heat-lamp check nightly; warehouse job Mo-Fr afternoons.
# IDIOSYNCRATIC-BUT-REALISTIC: the WATERING_CAN (dechlorinated water) lives on
#   the terrarium stand in the study; SCISSORS live taped to the cricket bin
#   (cutting feeder bags); the NOTEBOOK is the feeding log on the terrarium stand.
# DIAGNOSTIC: cricket_tub, heat_lamp_timer, terrarium_tongs, calcium_powder.
# DEPENDENT targets: watering_can (terrarium_stand_s1 at 08:30), scissors
#   (cricket_shelf_s1), notebook (terrarium_stand_s1 at 20:30).
# STATIC DISTRACTORS: dining_chair, bed_pillow, wall_clock, floor_lamp, doormat,
#   waste_bin, picture_frame, bath_mat.
household: v22_reptile_keeper
status: DRAFT  # version22 authoring 2026-07-22 — needs human anchor verification
derived_from: null
transformation: null
receptacles:
  - {id: bed_r1,            room: bedroom,  aliases: [bed]}
  - {id: nightstand_r1,     room: bedroom,  aliases: []}
  - {id: sofa_l1,           room: living,   aliases: [couch]}
