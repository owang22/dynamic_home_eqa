    jitter_min: 10
    objects: [bowl, coffee_mug]
    during: {bowl: table_d1, coffee_mug: table_d1}
    after:
      bowl:       {dest: sink_k1, p: 0.85, else: table_d1}
      coffee_mug: {dest: sink_k1, p: 0.6, else: table_d1}
  care_round:
    jitter_min: 10
    objects: [cricket_tub, terrarium_tongs, calcium_powder, watering_can,
              scissors, notebook, spray_bottle]
    during: {cricket_tub: terrarium_stand_s1, terrarium_tongs: terrarium_stand_s1,
