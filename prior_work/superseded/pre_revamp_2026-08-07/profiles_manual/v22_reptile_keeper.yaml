             spray_bottle: terrarium_stand_s1}
    after:
      cricket_tub:     {dest: cricket_shelf_s1, p: 0.9, else: terrarium_stand_s1}
      terrarium_tongs: {dest: terrarium_stand_s1, p: 0.85}
      calcium_powder:  {dest: cricket_shelf_s1, p: 0.8, else: terrarium_stand_s1}
      watering_can:    {dest: terrarium_stand_s1, p: 0.8, else: sink_k1}  # stays by the tanks
      scissors:        {dest: cricket_shelf_s1, p: 0.85, else: terrarium_stand_s1}
