# guest_v4: guest_v3 with cause A spread over three places and the disruption measured from
# the day it starts. See make_the_guest_v4.py for both faults and how each was diagnosed.
#
# guest_v3 was: guest_v2 with cause A made to last. guest_v2 is kept beside this unchanged, as
# the record of the first try: its cause B worked (switching on day 9 in 16 of 18 cases, with
# agreement across the two causes 0.192 against 0.684 inside one cause) but cause A produced
# only 0.6 movers per household and none at all in seven of the ten homes, because its rules
# fired only after a meal and lost the rest of the day to `after_use: sink`. v3 makes them
# `after: [any]` and removes `wash_dishes`, `snack`, `gaming` and `board_game_night`: the
# washing up does not get done and the living room belongs to the guest.
#
# guest_v3: a guest stays in the spare room. TWO causes, on two sets of objects, in two
# rooms, starting five days apart.
#
# The design and its rationale are in results/self_improve/varied_homes/make_the_guest.py,
# written before anything was generated. In short: the illness gives 2.4 to 3.4 independent
# movers because one event starts on one day for one person; widening the object list did
# not change the mean pairwise agreement at all (0.286 -> 0.286). Measured on varied_v3's
# 547 mover pairs, agreement falls with the gap between two switch days (0.408 same day,
# 0.248 at two to three days, 0.243 at four to seven), so a second cause has to start on a
# different DAY, not merely move different things.
#
#   cause B  days 9-23   the office becomes the guest's bedroom, so the desk work moves to
#                        the bedroom desk. Five days before the guest arrives, because a
#                        spare room is made up in advance. Objects: laptop, pen.
#   cause A  days 14-23  the guest is fed and entertained in the living room, so lunch and
#                        supper move from the dining table to the coffee table. Objects:
#                        plate, glass, serving_dish - every resident's, and the serving dish
#                        belongs to nobody at all.
#
# The bouts are at 09:00, 12:40, 13:30 and 19:20. Measured over varied_v3's 7,440 questions,
# NO question is asked between 23:00 and 06:59, and the peaks are 08-09 (16.8%) and 19-20
# (18.1%). guest_v1's strongest bouts were at 21:25 and 21:50 and its change showed best at
# midnight, which is why it was invisible to this study.
#
# THE CLASS LIST IS varied_v3's, UNCHANGED AND UNTUNED. guest_v1's own config admits its
# list "was chosen by trying about a dozen mixes against check 7 and keeping the best". This
# one is the 21 kinds varied_v3 already uses, copied without looking at any gate output, so
# the gate is an independent test of this scenario and the two scenarios are comparable on
# the same objects and the same ten households.
name: guest_v4
sim_dir: ../all_generated_guest_v4/sims
events_file: events_guest_v4.yaml
activities_file: activities_guest_v4.yaml

day0: Monday
days: 32
calendar:
  - {name: lead,    days: [0, 8],   day_kind: weekday, suppress_random_events: true}
  # BOTH of these are named 'guest', on purpose. The guest episode is ONE fifteen-day
  # disruption with two phases: the spare room is made up on days 9-13 and the guest is in
  # the house on days 14-23. `stage_for` resolves force_events by day range, so each phase
  # still gets its own event, but the bank header records one disrupted window of days 9-23
  # and the gate measures the break where the disruption actually starts. In guest_v3 the
  # first phase was called 'prepare', the gate read it as ordinary life, and the break was
  # measured at day 14 when the three-day memory had already had five days to learn cause B.
  - {name: guest,   days: [9, 13],  day_kind: weekday, suppress_random_events: true,
     force_events: [{event: making_up_the_spare_room}]}
  - {name: guest,   days: [14, 23], day_kind: weekday, suppress_random_events: true,
     force_events: [{event: guest_in_the_house}]}
  - {name: return,  days: [24, 31], day_kind: weekday, suppress_random_events: true}

# no background events: the only thing that changes is the guest
events:
  rain:              {weekday: 0.0, weekend: 0.0}
  guest_visit:       {weekday: 0.0, weekend: 0.0}
  late_work:         {weekday: 0.0, weekend: 0.0}
  grocery_delivery:  {weekday: 0.0, weekend: 0.0}
  laundry_day:       {weekday: 0.0, weekend: 0.0}
  sick_day:          {weekday: 0.0, weekend: 0.0}
  unwell_spell:      {weekday: 0.0, weekend: 0.0}
  making_up_the_spare_room: {weekday: 0.0, weekend: 0.0}
  guest_in_the_house:       {weekday: 0.0, weekend: 0.0}

question_owners: null
questions: activity
question_moment: during
question_min_gap_min: 30
per_day: 24
oversample: 1024
classes: [book, water_bottle, tablet, mug, charger, glasses, glass, razor, medication, towel, notebook,
          plate, bowl, remote, blanket, laptop, headphones, pen, pan, pot, snack_bowl]

patrol_hours: 0
patrol_times: "03:00"
feedback_delay_min: 10
shift_focus: 0.0
