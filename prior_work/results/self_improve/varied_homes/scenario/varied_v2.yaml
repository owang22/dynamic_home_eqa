# varied_v2: varied_v1 with the illness made a STEP rather than a slope. Same households,
# same calendar, same asked-about class list, same protocol; the ill resident is now
# confined (no table, no cooking, no washing up, no evening television, no reading in
# bed) and every class the illness moves is used on exactly one surface while it lasts.
# varied_v1's own outputs are kept beside it, unchanged, as the record of the first try.
# varied_v1 was: the same illness, the same calendar, the same asked-about class list and
# the same question protocol as illness_v1. Two things differ and only two: the
# activities file (results/self_improve/varied_homes/scenario/activities_varied.yaml)
# and the events file (events_varied.yaml). The households themselves are the
# generator's own, unchanged - which ones are used is decided by
# pick_the_seeds.py on floor-plan and resident facts alone.
name: varied_v2
sim_dir: ../../../../data/situation_sim/self_improve/varied_v2
events_file: events_varied.yaml
activities_file: activities_varied.yaml

day0: Monday
days: 32
calendar:
  - {name: lead,   days: [0, 13],  day_kind: weekday, suppress_random_events: true}
  - {name: sick,   days: [14, 23], day_kind: weekday, suppress_random_events: true,
     force_events: [{event: unwell_spell, resident: resident_1}]}
  - {name: return, days: [24, 31], day_kind: weekday, suppress_random_events: true}

# no background events: the only thing that changes is the illness
events:
  rain:              {weekday: 0.0, weekend: 0.0}
  guest_visit:       {weekday: 0.0, weekend: 0.0}
  late_work:         {weekday: 0.0, weekend: 0.0}
  grocery_delivery:  {weekday: 0.0, weekend: 0.0}
  laundry_day:       {weekday: 0.0, weekend: 0.0}
  sick_day:          {weekday: 0.0, weekend: 0.0}
  unwell_spell:      {weekday: 0.0, weekend: 0.0}

# questions: everyone's things, so the well residents' objects are controls
question_owners: null
questions: activity
question_moment: during
question_min_gap_min: 30
per_day: 24
oversample: 1024
classes: [book, water_bottle, tablet, mug, charger, glasses, glass, razor, medication, towel, notebook]

patrol_hours: 0
patrol_times: "03:00"
feedback_delay_min: 10
shift_focus: 0.0
