# Spatial config: map hh_001's symbolic rooms/receptacles into HSSD scene
# 102343992's ground-floor one-bedroom suite (east wing).
#
# Room-level fidelity only, per the current stage: each symbolic room maps to
# a real scene region; receptacle anchor points are hand-placed FRACTIONS of
# the region's bbox ((0,0)=min corner, (1,1)=max corner in (x,z)), nudged into
# the region polygon at runtime — they are NOT matched to actual scene
# furniture yet. `relation` carries the ON-vs-floor semantics (on_surface /
# floor / hook) that the old SLOT_ANCHORS vocabulary distinguished, so the
# later furniture-matching stage can snap on_surface anchors to real supports.
#
# Swapping to a different scene later = new file like this + re-run
# spatialize.py; nothing else changes.

# Paths are relative to this config file's directory.
household: hh_001
# The receptacle->room map now comes from the household's object_motions
# file (the retired one-file schedule spec used to carry it).
schedule_spec: ../../profiles/revamp_v1/claude-fable-5/hh1/object_motions.yaml
scene_assets: ../assets/102343992

room_map:                 # symbolic room -> scene region name
  bedroom: bedroom.004
  living: tv              # the "tv" region is the suite's living room
  kitchen: kitchen
  bathroom: bathroom.001
  entry: hallway.003      # hallway connecting the suite to the rest of the house

receptacles:              # anchor = [frac_x, frac_z] of the mapped region bbox
  bed_b1:             {anchor: [0.32, 0.68], relation: on_surface}
  nightstand_b1:      {anchor: [0.15, 0.20], relation: on_surface}
  bedroom_floor_b1:   {anchor: [0.55, 0.80], relation: floor}
  couch_l1:           {anchor: [0.38, 0.60], relation: on_surface}
  coffee_table_l1:    {anchor: [0.62, 0.42], relation: on_surface}
  counter_k1:         {anchor: [0.22, 0.42], relation: on_surface}
  sink_k1:            {anchor: [0.42, 0.16], relation: on_surface}
  cupboard_k1:        {anchor: [0.62, 0.16], relation: on_surface}
  dish_rack_k1:       {anchor: [0.52, 0.16], relation: on_surface}   # between sink and cupboard: the dishes' drying stage
  chair_k1:           {anchor: [0.45, 0.58], relation: on_surface}
  bathroom_shelf_ba1: {anchor: [0.25, 0.68], relation: on_surface}
  entry_table_e1:     {anchor: [0.42, 0.30], relation: on_surface}
  entry_hook_e1:      {anchor: [0.28, 0.18], relation: hook}
  entry_floor_e1:     {anchor: [0.52, 0.66], relation: floor}

# Where carried-away objects sit while out of the house: a blank spot past
# the entry hallway, outside the suite (in this scene, the garage apron).
elsewhere:
  pos: [6.5, -12.5]
  label: "AWAY (outside)"

view_margin_m: 2.0        # viewer crop = suite bbox + elsewhere + this margin
